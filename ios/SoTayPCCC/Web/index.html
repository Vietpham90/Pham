/* ---------- markdown → blocks ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\s][^*]*)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => { const id = FILE2ID[h]; return id ? `<a href="#${id}" data-go="${id}">${t}</a>` : t; });
  s = s.replace(/⚑/g, '<span class="flag" title="Cần đối chiếu nguyên văn">⚑ đối chiếu</span>');
  s = s.replace(/✱/g, '<span class="amend" title="Liên quan Sửa đổi 1:2023">✱ SĐ1</span>');
  return s;
}
function mdToHtml(lines, secId) {
  let out = "", i = 0, ci = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^### /.test(l)) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      const wide = head.length > 3;
      out += `<div class="tbl${wide ? " wide" : ""}"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      if (wide) out += `<p class="hint">← Vuốt ngang để xem hết bảng →</p>`;
      continue;
    }
    if (/^> /.test(l)) {
      let b = [];
      while (i < lines.length && /^>/.test(lines[i])) { b.push(lines[i].replace(/^>\s?/, "")); i++; }
      out += `<blockquote><p>${inline(b.join(" "))}</p></blockquote>`; continue;
    }
    if (/^- \[[ x]\] /.test(l)) {
      out += `<ul class="check">`;
      while (i < lines.length && /^- \[[ x]\] /.test(lines[i])) {
        const key = secId + ":" + (ci++);
        out += `<li><label><input type="checkbox" data-ck="${key}"${checks[key] ? " checked" : ""}><span>${inline(lines[i].slice(6))}</span></label></li>`; i++;
      }
      out += `</ul>`; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += `<li>${inline(lines[i].slice(2))}</li>`; i++; }
      out += "</ul>"; continue;
    }
    if (/^\d+(–\d+)?\. /.test(l)) {
      out += "<ol>";
      while (i < lines.length && /^\d+(–\d+)?\. /.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\d+(–\d+)?\. /, ""))}</li>`; i++; }
      out += "</ol>"; continue;
    }
    let p = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||> |- |\d+\. )/.test(lines[i])) { p.push(lines[i]); i++; }
    if (p.length) out += `<p>${inline(p.join(" "))}</p>`; else i++;
  }
  return out;
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

const SECTIONS = {};
for (const [file, md] of Object.entries(DATA)) {
  const id = FILE2ID[file]; const lines = md.split("\n");
  let title = META[id].t, lead = [], blocks = [], cur = null;
  for (const l of lines) {
    if (/^# /.test(l)) { continue; }
    if (/^## /.test(l)) { cur = { title: l.slice(3).trim(), lines: [] }; blocks.push(cur); continue; }
    (cur ? cur.lines : lead).push(l);
  }
  blocks.forEach((b, k) => { b.id = id + "--" + k; b.text = norm(b.title + " " + b.lines.join(" ").replace(/[|*`>#]/g, " ")); b.raw = b.lines.join(" ").replace(/[|*`>#]/g, " ").replace(/\s+/g, " "); });
  SECTIONS[id] = { id, title, lead, blocks, leadText: norm(lead.join(" ")) };
}

function renderSection(id, openBlock) {
  const s = SECTIONS[id]; if (!s) return renderHome();
  setHeader(META[id].t); setNav(id === "checklist" ? "checklist" : "");
  let html = `<article class="doc">`;
  const leadHtml = mdToHtml(s.lead, id);
  if (leadHtml) html += `<div class="lead">${leadHtml}</div>`;
  if (id === "checklist") html += `<div class="progress"><div class="bar"><i id="pbar"></i></div><span id="ptext"></span><button class="reset" id="resetCk">Làm lại</button></div>`;
  s.blocks.forEach((b, k) => {
    const open = openBlock ? b.id === openBlock : (s.blocks.length <= 2 || id === "checklist" || k === 0);
    const isSaved = saved.includes(b.id);
    html += `<details id="${b.id}"${open ? " open" : ""}><summary>${inline(b.title)}<button class="star" data-star="${b.id}" aria-pressed="${isSaved}" aria-label="${isSaved ? "Bỏ lưu" : "Lưu mục này"}">${starSvg}</button></summary><div class="body">${mdToHtml(b.lines, b.id)}</div></details>`;
  });
  const idx = ORDER.indexOf(id), prev = ORDER[idx - 1], next = ORDER[idx + 1];
  html += `<div class="pager">${prev ? `<button data-go="${prev}"><small>← Trước</small>${META[prev].t}</button>` : ""}${next ? `<button class="next" data-go="${next}"><small>Tiếp →</small>${META[next].t}</button>` : ""}</div></article>`;
  view.innerHTML = html;
  if (id === "checklist") updateProgress();
  if (openBlock) { const el = document.getElementById(openBlock); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); }
  else window.scrollTo(0, 0);
}

function updateProgress() {
  const boxes = view.querySelectorAll("input[data-ck]"); const done = [...boxes].filter(b => b.checked).length;
  const bar = document.getElementById("pbar"), t = document.getElementById("ptext");
  if (bar) { bar.style.width = (boxes.length ? done / boxes.length * 100 : 0) + "%"; t.textContent = `${done}/${boxes.length}`; }
}

function renderSaved() {
  setHeader("Đã lưu"); setNav("da-luu");
  const items = saved.map(bid => { const sid = bid.split("--")[0]; const s = SECTIONS[sid]; const b = s && s.blocks.find(x => x.id === bid); return b ? { s, b } : null; }).filter(Boolean);
  if (!items.length) { view.innerHTML = `<div class="empty">Chưa lưu mục nào.<br>Bấm biểu tượng dấu trang trên tiêu đề một mục để lưu lại tra cứu nhanh.</div>`; return; }
  view.innerHTML = `<ul class="results">${items.map(({ s, b }) => `<li><button data-open="${b.id}"><span class="sec">${META[s.id].t}</span><span class="ttl">${inline(b.title)}</span><span class="snip">${esc(b.raw.slice(0, 120))}…</span></button></li>`).join("")}</ul>`;
}

const NC = {
  "Tường ngăn cháy loại 1":"REI 150","Tường ngăn cháy loại 2":"REI 45","Vách ngăn cháy loại 1":"EI 45","Vách ngăn cháy loại 2":"EI 15",
  "Vách kính > 25 % loại 1 / 2":"EIW 45 / 15",
  "Sàn ngăn cháy loại 1":"REI 150","Sàn ngăn cháy loại 2":"REI 60","Sàn ngăn cháy loại 3":"REI 45","Sàn ngăn cháy loại 4":"REI 15",
  "Cửa, van, màn loại 1":"EI 60","Cửa, van, màn loại 2":"EI 30","Cửa, van, màn loại 3":"EI 15",
  "Cửa kính > 25 % loại 1/2/3":"EIW 60/30/15","Cửa giếng thang máy":"E 30",
  "Cửa sổ loại 1":"E 60","Cửa sổ loại 2":"E 30","Cửa sổ loại 3":"E 15",
  "Khoang đệm loại 1":"vách 1 · sàn 3 · cửa 2","Khoang đệm loại 2":"vách 2 · sàn 4 · cửa 3"
};
const HEIGHT = [
  { k: "< 12 m", road: "≤ 5 m", stair: "L1, thang loại 3 (L2 khi ≤ 9 m)", lift: "Không (trừ hầm sâu > 9 m)", park: "Không yêu cầu khi ≤ 15 m" },
  { k: "12–28 m", road: "≤ 8 m", stair: "L1, thang loại 3", lift: "Không (trừ hầm sâu > 9 m)", park: "> 15 m: rộng ≥ 6 m" },
  { k: "> 28 m", road: "≤ 10 m", stair: "Không nhiễm khói, phải có N1", lift: "≥ 1 / khoang cháy (F1.3: khi > 50 m)", park: "Rộng ≥ 6 m, dài theo Bảng 14–16" }
];
let qBac = store.get("pccc-bac", "I"), qH = store.get("pccc-h", 2);

  setHeader("Tra nhanh"); setNav("tra-nhanh");
  const h = HEIGHT[qH];
  view.innerHTML = `
  <div style="display:grid;gap:14px">

      <h2>GHCL tối thiểu theo bậc chịu lửa (Bảng 4)</h2>

      <p class="note">Bậc V: không quy định. Nhà &gt; 50 m dùng Bảng A.1 (chịu lực R 150 / R 180). Đọc kèm chú thích Bảng 4. <a href="#phan-loai" data-open="phan-loai--2" style="color:var(--fire);font-weight:600">Xem mục đầy đủ</a></p>
    </section>
    <section class="quick">
      <h2>Theo chiều cao PCCC</h2>
      <div class="seg" role="group" aria-label="Chiều cao PCCC">${HEIGHT.map((x, i) => `<button data-h="${i}" aria-pressed="${i === qH}" style="font-family:var(--sans)">${x.k}</button>`).join("")}</div>
      <dl class="kv">
        <dt>Mép đường xe chữa cháy → tường nhà</dt><dd>${h.road}</dd>
        <dt>Loại buồng thang bộ</dt><dd style="white-space:normal">${h.stair}</dd>
        <dt>Thang máy chữa cháy</dt><dd style="white-space:normal">${h.lift}</dd>
        <dt>Bãi đỗ xe chữa cháy</dt><dd style="white-space:normal">${h.park}</dd>
        <dt>Đường xe: rộng × cao thông thủy</dt><dd>3,5 × 4,5 m</dd>
        <dt>Đường cụt phải có bãi quay xe</dt><dd>&gt; 46 m</dd>
      </dl>
      <p class="note">Điều 3.4.11 – 3.4.13, 6.2, 6.13. Xem đủ điều kiện trong mục Chữa cháy &amp; cứu nạn.</p>
    </section>
    <section class="quick">
      <h2>Bộ phận ngăn cháy</h2>
      <dl class="kv">${Object.entries(NC).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    </section>
    <section class="quick">
      <h2>Kích thước thoát nạn hay dùng</h2>
      <dl class="kv">
        <dt>Cao thông thủy lối ra thoát nạn</dt><dd>≥ 1,9 m</dd>
        <dt>Rộng lối ra (chung / &gt; 50 người, F1.1 &gt; 15)</dt><dd>0,8 / 1,2 m</dd>
        <dt>Cao thông thủy đường thoát nạn</dt><dd>≥ 2,0 m</dd>
        <dt>Rộng hành lang (chung / đông người)</dt><dd>1,0 / 1,2 m</dd>
        <dt>Bản thang F1.1 (&gt; 15 / ≤ 15 người)</dt><dd>1,2 / 1,0 m</dd>
        <dt>Bản thang, tầng &gt; 200 người</dt><dd>≥ 1,2 m</dd>
        <dt>Bản thang, nhà ≤ 15 m, ≤ 15 người</dt><dd>≥ 0,7 m</dd>
        <dt>Bản thang, trường hợp khác</dt><dd>≥ 0,9 m</dd>
        <dt>Độ dốc thang</dt><dd>≤ 1:1</dd>
        <dt>Mặt bậc / cao bậc</dt><dd>≥ 25 / 5–22 cm</dd>

        <dt>Khoang đệm N3 (+ sảnh TMCC)</dt><dd>3 / 6 m²</dd>
        <dt>Hành lang cụt F1.3, bậc I–II S0</dt><dd>25 m</dd>

  window.scrollTo(0, 0);

function renderSearch(term) {
  setNav("");
  const terms = norm(term).split(/\s+/).filter(Boolean);
  const res = [];
  for (const id of ORDER) for (const b of SECTIONS[id].blocks) {
    if (terms.every(t => b.text.includes(t))) res.push({ id, b, score: terms.filter(t => norm(b.title).includes(t)).length });
  }
  res.sort((a, b) => b.score - a.score);
  setHeader(null);
  if (!res.length) {
    view.innerHTML = `<div class="empty">Không thấy kết quả cho “${esc(term)}”.<br>Thử từ khóa ngắn hơn hoặc gợi ý:<div class="chips">${["buồng thang","REI","hành lang cụt","khoang cháy","F1.3","xe chữa cháy","khoang đệm"].map(c => `<button data-chip="${c}">${c}</button>`).join("")}</div></div>`;
    return;
  }
  const mk = s => { let h = esc(s); for (const t of terms) { if (t.length < 2) continue; const re = buildRe(t); h = h.replace(re, m => `<mark>${m}</mark>`); } return h; };
  view.innerHTML = `<p class="label">${res.length} kết quả</p><ul class="results">${res.slice(0, 60).map(({ id, b }) => {
    const nraw = norm(b.raw); const pos = Math.max(0, nraw.indexOf(terms[0]) - 40);
    const snip = (pos ? "…" : "") + b.raw.slice(pos, pos + 150) + "…";
    return `<li><button data-open="${b.id}"><span class="sec">${META[id].t}</span><span class="ttl">${mk(b.title.replace(/[⚑✱]/g, ""))}</span><span class="snip">${mk(snip.replace(/[⚑✱]/g, ""))}</span></button></li>`;
  }).join("")}</ul>`;
}
// accent-insensitive regex for highlighting
const MAP = { a:"aàáảãạăằắẳẵặâầấẩẫậ", e:"eèéẻẽẹêềếểễệ", i:"iìíỉĩị", o:"oòóỏõọôồốổỗộơờớởỡợ", u:"uùúủũụưừứửữự", y:"yỳýỷỹỵ", d:"dđ" };
function buildRe(t) {
  const src = [...t].map(ch => { const k = ch.toLowerCase(); if (MAP[k]) return "[" + MAP[k] + MAP[k].toUpperCase() + "]"; return ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("");
  return new RegExp(src, "gi");
}

/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.value.trim()) return renderSearch(q.value.trim());
  if (!h || h === "home") return renderHome();
  if (h === "tra-nhanh") return renderQuick();
  if (h === "da-luu") return renderSaved();
  if (SECTIONS[h]) return renderSection(h);
  renderHome();
}
function go(hash, block) {
  q.value = ""; clearQ.hidden = true;
  if (block) { const sid = block.split("--")[0]; if (location.hash.slice(1) !== sid) history.replaceState(null, "", "#" + sid); renderSection(sid, block); return; }
  if (location.hash.slice(1) === hash) route(); else location.hash = hash;
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) { e.preventDefault(); e.stopPropagation(); const id = star.dataset.star;
    saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]; store.set("pccc-saved", saved);
    const on = saved.includes(id); star.setAttribute("aria-pressed", on); star.setAttribute("aria-label", on ? "Bỏ lưu" : "Lưu mục này"); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.preventDefault(); go(null, op.dataset.open); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest("[data-nav]"); if (n) { go(n.dataset.nav === "home" ? "home" : n.dataset.nav); return; }
  const bac = e.target.closest("[data-bac]"); if (bac) { qBac = bac.dataset.bac; store.set("pccc-bac", qBac); renderQuick(); return; }
  const hh = e.target.closest("[data-h]"); if (hh) { qH = +hh.dataset.h; store.set("pccc-h", qH); renderQuick(); return; }
  const chip = e.target.closest("[data-chip]"); if (chip) { q.value = chip.dataset.chip; clearQ.hidden = false; renderSearch(q.value); return; }
  if (e.target.id === "resetCk") { view.querySelectorAll("input[data-ck]").forEach(b => { b.checked = false; delete checks[b.dataset.ck]; }); store.set("pccc-checks", checks); updateProgress(); }
});
document.addEventListener("change", e => {
  const ck = e.target.closest("input[data-ck]"); if (!ck) return;
  if (ck.checked) checks[ck.dataset.ck] = 1; else delete checks[ck.dataset.ck];
  store.set("pccc-checks", checks); updateProgress();
});
backBtn.addEventListener("click", () => go("home"));
let tmr;
q.addEventListener("input", () => { clearQ.hidden = !q.value; clearTimeout(tmr); tmr = setTimeout(() => q.value.trim() ? renderSearch(q.value.trim()) : route(), 120); });
clearQ.addEventListener("click", () => { q.value = ""; clearQ.hidden = true; route(); q.focus(); });

route();
</script>
