<script>
const DATA = {"README.md": "# Sổ tay QCVN 06:2022\n\nTra cứu nhanh các yêu cầu **kiến trúc – kết cấu** về an toàn cháy theo **QCVN 06:2022/BXD** (Thông tư 06/2022/TT-BXD) và **Sửa đổi 1:2023** (Thông tư 09/2023/TT-BXD ngày 16/10/2023).\n\n> **Nguồn đối chiếu**: bản hợp nhất \"QCVN 06:2022/BXD – Sửa đổi 01-2023\" (214 trang). Mọi giá trị trong sổ tay kèm số điều, số bảng để tra lại nguyên văn. Sổ tay là bản **tóm tắt**, không thay thế quy chuẩn: các chú thích, ngoại lệ dài chỉ được nêu ý chính.\n\n## Cách dùng sổ tay — trình tự 7 bước\n\nMọi hồ sơ thiết kế PCCC phần kiến trúc đi theo cùng một chuỗi quyết định. Bước sau phụ thuộc kết quả bước trước:\n\n| Bước | Câu hỏi cần trả lời | Mục tra cứu |\n| --- | --- | --- |\n| 1 | Công trình có thuộc phạm vi áp dụng? Thuộc **nhóm F** nào (Bảng 6)? Có phần nào khác nhóm không? | [Phân loại](01-phan-loai.md) |\n| 2 | **Chiều cao PCCC**, số tầng, số tầng hầm? | [Thuật ngữ](08-thuat-ngu.md) |\n| 3 | Chọn **bậc chịu lửa** (I – V) và **cấp S** (S0 – S3) → GHCL từng cấu kiện (Bảng 4, 5; > 50 m: Bảng A.1) | [Phân loại](01-phan-loai.md) |\n| 4 | **Diện tích khoang cháy** cho phép (Phụ lục H)? Cần tường, sàn ngăn cháy ở đâu? | [Ngăn cháy](02-ngan-chay.md) |\n| 5 | **Thoát nạn**: số lối ra, khoảng cách (Phụ lục G), chiều rộng, loại buồng thang | [Thoát nạn](03-thoat-nan.md) |\n| 6 | **Ngăn cháy lan** mặt ngoài và giữa các nhà (4.32 – 4.35, Phụ lục E) | [Cháy lan](04-chay-lan.md) |\n| 7 | **Tiếp cận chữa cháy**: đường xe, bãi đỗ, lối vào từ trên cao, lối ra mái, thang máy chữa cháy (Phần 6) | [Chữa cháy & cứu nạn](05-chua-chay-cuu-nan.md) |\n\nSau đó rà các điểm [Sửa đổi 1:2023](06-sua-doi-1-2023.md) và chạy [Checklist hồ sơ](07-checklist.md).\n\n## Giọng văn của sổ tay\n\n- **Một dòng – một yêu cầu – một con số – một điều khoản.** Ví dụ: *Bản thang ≥ 1,2 m khi nhà có tầng (trừ tầng 1) > 200 người (3.4.1).*\n- Dùng đúng thuật ngữ của quy chuẩn: *lối ra thoát nạn*, *đường thoát nạn*, *chiều cao PCCC*, *khoang cháy*, *buồng thang bộ không nhiễm khói N1/N2/N3*, *lối vào từ trên cao*.\n- Đơn vị viết theo TCVN: dấu phẩy thập phân (1,2 m); GHCL viết \"REI 150\".\n- Không suy diễn: điều gì quy chuẩn không quy định thì ghi \"không quy định\".\n\n## Nền tảng thị giác\n\nMàu trong sổ tay mang nghĩa, không trang trí:\n\n| Token | Nghĩa | Dùng cho |\n| --- | --- | --- |\n| `fire-600` | Ngăn cháy, chịu lửa | Tiêu đề bảng GHCL, nét tường ngăn cháy trên sơ đồ |\n| `exit-600` | Thoát nạn | Lối ra, đường thoát nạn, buồng thang (theo màu xanh của biển EXIT) |\n| `amber-500` / `amber-ink` | Lưu ý, sửa đổi | Nhãn ✱ SĐ1 và ghi chú cần đọc nguyên văn |\n| `ink`, `muted` | Văn bản | Chữ chính / chú thích |\n| `surface-100`, `surface-200`, `line` | Nền giấy | Nền trang, ô bảng xen kẽ, kẻ bảng |\n\nPhân biệt \"ngăn cháy\" (đỏ) và \"thoát nạn\" (xanh) bằng **độ sáng** chứ không chỉ sắc độ, và luôn kèm chữ — người mù màu đỏ – lục không phân biệt được hai màu này.\n\nChữ: **Be Vietnam Pro** (đầy đủ dấu tiếng Việt) cho nội dung; **JetBrains Mono** cho số hiệu điều khoản, ký hiệu GHCL và số liệu.\n\n## Ký hiệu\n\n| Ký hiệu | Nghĩa |\n| --- | --- |\n| **R** | Khả năng chịu lực |\n| **E** | Tính toàn vẹn |\n| **I** | Khả năng cách nhiệt |\n| **W** | Khả năng hạn chế bức xạ nhiệt (phần kính: EW, EIW) |\n| **REI 120** | GHCL 120 phút theo cả R, E và I |\n| **K0 … K3** | Cấp nguy hiểm cháy của cấu kiện |\n| **S0 … S3** | Cấp nguy hiểm cháy kết cấu của nhà |\n| **F1.1 … F5.3** | Nhóm nguy hiểm cháy theo công năng |\n| **A, B, C1 – C4, D, E** | Hạng nguy hiểm cháy và cháy nổ (sản xuất, kho) |\n| **CV0 … CV5** | Cấp nguy hiểm cháy của vật liệu |\n| ✱ | Nội dung được sửa đổi, bổ sung tại Sửa đổi 1:2023 |\n\n## Cấu trúc QCVN 06:2022/BXD\n\n| Phần | Nội dung |\n| --- | --- |\n| 1 | Quy định chung — phạm vi, đối tượng, giải thích từ ngữ, quy định chung |\n| 2 | Phân loại kỹ thuật về cháy — vật liệu, cấu kiện, bộ phận ngăn cháy, cầu thang và buồng thang, nhà |\n| 3 | Bảo đảm an toàn cho người — lối ra, đường thoát nạn, cầu thang, vật liệu |\n| 4 | Ngăn chặn cháy lan |\n| 5 | Cấp nước chữa cháy (ngoài phạm vi sổ tay) |\n| 6 | Chữa cháy và cứu nạn |\n| 7 | Tổ chức thực hiện |\n| PL A | Quy định bổ sung cho một số nhóm nhà cụ thể (nhà sản xuất, kho; nhà 50 – 150 m; chung cư 75 – 150 m) |\n| PL B | Phân loại vật liệu theo đặc tính cháy; vật liệu hoàn thiện (Bảng B.8, B.9) |\n| PL C | Hạng nguy hiểm cháy và cháy nổ |\n| PL D | Bảo vệ chống khói |\n| PL E | Khoảng cách phòng cháy chống cháy |\n| PL F | Giới hạn chịu lửa danh định của một số cấu kiện |\n| PL G | Khoảng cách đến lối ra thoát nạn và chiều rộng lối ra |\n| PL H | Bậc chịu lửa và yêu cầu an toàn cháy cho nhà, khoang cháy |\n| PL I | Hình minh họa (tham khảo) |\n\n## Phạm vi sổ tay\n\nChỉ gồm nội dung **kiến trúc – kết cấu**: phân loại, GHCL, ngăn cháy, thoát nạn, cháy lan, tiếp cận chữa cháy. Không gồm: cấp nước chữa cháy (Phần 5), hệ thống báo cháy, chữa cháy tự động, chi tiết bảo vệ chống khói (Phụ lục D) — chỉ nêu khi ảnh hưởng tới giải pháp kiến trúc.\n", "01-phan-loai.md": "# 1. Phân loại kỹ thuật về cháy\n\nPhần 2 của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023). Đây là đầu vào cho mọi yêu cầu còn lại.\n\n## 1.1 Vật liệu xây dựng (2.1, Phụ lục B)\n\n| Đặc tính | Phân nhóm | Điều |\n| --- | --- | --- |\n| Tính cháy | **Không cháy**; cháy được: **Ch1** cháy yếu, **Ch2** cháy vừa phải, **Ch3** cháy mạnh vừa, **Ch4** cháy mạnh | 2.1.3 |\n| Tính bắt cháy | **BC1** khó bắt cháy, **BC2** bắt cháy vừa phải, **BC3** dễ bắt cháy | 2.1.4 |\n| Lan truyền lửa trên bề mặt (chỉ cho lớp mặt mái và sàn, kể cả thảm) | **LT1** không lan truyền → **LT4** lan truyền mạnh | 2.1.5 |\n| Khả năng sinh khói | **SK1** thấp, **SK2** vừa phải, **SK3** cao | 2.1.6 |\n| Độc tính sản phẩm cháy | **ĐT1** thấp → **ĐT4** đặc biệt cao | 2.1.7 |\n| Cấp nguy hiểm cháy của vật liệu (chỉ tiêu tổng hợp) | **CV0 → CV5** (tăng dần) | 2.1.8, B.1.7 |\n\n**Vật liệu hoàn thiện** (3.3.4, 3.5):\n\n- Trên **đường thoát nạn**: theo **Bảng B.8**; trong **phòng sử dụng chung**: theo **Bảng B.9**.\n- Gian phòng chung có **chữa cháy tự động** (trừ phòng > 20 m² điều trị nội trú, dưỡng lão, chăm sóc người khuyết tật): **không yêu cầu** cấp nguy hiểm cháy của vật liệu; các trường hợp khác có chữa cháy tự động được **giảm một cấp** (3.5.10).\n- Không yêu cầu với lớp mặt dày **≤ 1 mm** trên nền không cháy; hoặc lớp trang trí chiếm **≤ 20 %** diện tích tường/trần (cao su, nhựa: ≤ 10 %) và phân bố rời rạc (3.5.10).\n- Kho sách, hồ sơ: chỉ dùng **CV0, CV1** (3.5.6). Gian thương mại F3.1: tường/trần ≤ **CV2**, sàn ≤ **CV3** (3.5.8). Phòng chờ F3.3: **CV0** (3.5.9).\n\n## 1.2 Cấu kiện xây dựng (2.2)\n\n**Giới hạn chịu lửa (GHCL)** — thời gian (phút) đến khi xuất hiện trạng thái giới hạn (2.2.2.2):\n\n- **R** – mất khả năng chịu lực\n- **E** – mất tính toàn vẹn\n- **I** – mất khả năng cách nhiệt\n- **W** – mất khả năng hạn chế bức xạ nhiệt (dùng cho phần kính: EW, EIW)\n\nThang giá trị: không quy định, 15, 30, 45, 60, 90, 120, 150, 180, 240 phút (2.2.2.1).\n\nCấu kiện được coi là đạt GHCL khi thỏa **một** trong ba điều kiện (2.2.2.2, CHÚ THÍCH 3): (a) có mẫu thử nghiệm cùng cấu tạo đạt GHCL; (b) tính toán theo tiêu chuẩn thiết kế chịu lửa; (c) cấu tạo phù hợp **Phụ lục F** (GHCL danh định của tường, dầm, cột, sàn BTCT, kết cấu thép bọc bảo vệ).\n\n**Cấp nguy hiểm cháy của cấu kiện** K0 (không nguy hiểm) → K1 (ít) → K2 (vừa phải) → K3 (nguy hiểm cháy). Xếp cấp không cần thử nghiệm (2.2.3.2):\n\n| Cấp | Điều kiện |\n| --- | --- |\n| K0 | Chỉ làm từ vật liệu **không cháy** |\n| K1 | Bề mặt ngoài từ vật liệu không nguy hiểm hơn **Ch1, BC1, SK1** |\n| K2 | Bề mặt ngoài không nguy hiểm hơn **Ch2, BC2, SK2** |\n| K3 | Bề mặt ngoài có một trong các chỉ tiêu **Ch3, BC3, SK3** |\n\nTường kính bao che (facade) được coi là **K0** nếu mọi bộ phận, kể cả liên kết, bằng vật liệu không cháy (bỏ qua mạch chèn và lớp phủ < 0,3 mm).\n\n## 1.3 Bậc chịu lửa của nhà — Bảng 4 ✱\n\nGHCL **tối thiểu** của cấu kiện theo bậc chịu lửa (nhà có chiều cao PCCC ≤ 50 m; nhà cao hơn xem Bảng A.1 bên dưới):\n\n| Bậc | Tường chịu lực, cột và bộ phận chịu lực khác | Tường ngoài không chịu lực | Sàn tầng (kể cả sàn áp mái, sàn trên tầng hầm) | Mái không có tầng áp mái: tấm lợp | Mái: giàn, dầm, xà gồ | Buồng thang bộ: tường trong | Bản thang, chiếu thang |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| **I** | R 120 | E 30 | REI 60 | RE 30 | R 30 | REI 120 | R 60 |\n| **II** | R 90 | E 15 | REI 45 | RE 15 | R 15 | REI 90 | R 60 |\n| **III** | R 45 | E 15 | REI 45 | RE 15 | R 15 | REI 60 | R 45 |\n| **IV** | R 15 | E 15 | REI 15 | RE 15 | R 15 | REI 45 | R 15 |\n| **V** | không quy định | | | | | | |\n\n**Chú thích quan trọng của Bảng 4:**\n\n- **CT1** – Nhà bậc I, II, III: sàn và trần **tầng hầm, nửa hầm** bằng vật liệu không cháy, **≥ REI 90**. Sàn tầng 1 và tầng trên cùng: vật liệu không thấp hơn Ch1. Nhà bậc IV, V: sàn tầng hầm ≥ REI 45, vật liệu ≥ Ch1.\n- **CT2** ✱ – Không quy định GHCL tấm lợp nếu bằng vật liệu không cháy hoặc Ch1 + LT2 (trừ F5 hạng A, B). Không quy định GHCL **xà gồ** (trừ F3.1, F3.2, F5.1, F5.2 hạng A, B…) khi đồng thời: mặt dưới xà gồ cách sàn **≥ 10 m** (nhà hạng C) hoặc **≥ 6,1 m** (nhà khác); xà gồ không cháy (hạng C) hoặc ≥ Ch1; riêng hạng C phải có chữa cháy tự động và phụ tải treo thêm ≤ 10 kg/m².\n- **CT3** – Nhà F1.3 và nhà hỗn hợp có **2–3 tầng hầm**: kết cấu chịu lực ở tầng hầm **≥ R 120**.\n- **CT5, CT6** ✱ – Một phần tường ngoài không chịu lực được không bảo vệ theo E.3. GHCL tường ngoài không chịu lực trong Bảng 4 **chỉ áp dụng cho mảng tường làm đai/dải ngăn cháy** theo 4.32, 4.33.\n- **CT7** ✱ – Cho phép xác định GHCL theo nhiệt độ từ **mô phỏng cháy** dựa trên tải trọng cháy thực tế.\n- **CT8** ✱ – Không quy định GHCL bản thang, chiếu thang trong buồng thang có tường trong đạt Bảng 4; khi đó chúng và vật liệu hoàn thiện buồng thang phải không cháy hoặc Ch1, BC1.\n\n**Quy định đi kèm (2.5.3.3):**\n\n- Bộ phận chịu lực gồm tường, cột, hệ giằng, vách cứng, giàn, dầm, sàn, tấm lợp **tham gia bảo đảm ổn định tổng thể** khi cháy. Kết cấu mái không tham gia ổn định tổng thể lấy theo cột \"giàn, dầm, xà gồ\". Thiết kế phải chỉ rõ trong hồ sơ.\n- Không quy định GHCL kết cấu mái **có tầng áp mái**; cửa, cửa sổ, cửa trời (trừ chèn bịt trong bộ phận ngăn cháy).\n- Khi yêu cầu **R 15** (RE 15, REI 15): được dùng **thép không bọc bảo vệ** nếu GHCL thử nghiệm/tính toán **≥ R 8** hoặc hệ số tiết diện **Am/V ≤ 250 m⁻¹**.\n- Buồng thang **N1**: bản thang, chiếu thang được dùng **R 15, K0**.\n- Khoang cháy ngăn bằng **tường/sàn ngăn cháy loại 1**; được ngăn theo phương đứng bằng **tầng kỹ thuật** có sàn ngăn cháy loại 2. Nhà bậc IV, V được ngăn bằng tường ngăn cháy loại 2.\n\n**Nhà cao trên 50 m — Bảng A.1 (Phụ lục A):**\n\n| Cấu kiện | 50 – 100 m | 100 – 150 m |\n| --- | --- | --- |\n| Cột, tường chịu lực, giằng, vách cứng, dầm, sàn | R 150 | R 180 |\n| Tường ngoài không chịu lực | E 60 | E 60 |\n| Sàn giữa các tầng | REI 120 | REI 120 |\n| Tường trong buồng thang bộ | REI 150 | REI 180 |\n| Bản thang, chiếu thang | R 60 | R 60 |\n| Tường ngăn cháy, sàn ngăn cháy | REI 150 | REI 180 |\n| Giếng thang máy, giếng kỹ thuật không cắt qua biên khoang cháy | REI 120 | REI 120 |\n| Giếng cắt qua biên khoang cháy; giếng thang máy chữa cháy | REI 150 | REI 180 |\n| Mái dùng cho thoát nạn, cứu nạn: tấm lợp / dầm, giàn | RE 120 / R 150 | RE 120 / R 180 |\n\n## 1.4 Cấp nguy hiểm cháy kết cấu của nhà — Bảng 5\n\n| Cấp | Bộ phận chịu lực dạng thanh (cột, xà, giàn) | Tường ngoài từ phía ngoài | Tường, vách ngăn, sàn, mái không có tầng áp mái | Tường buồng thang bộ; bộ phận ngăn cháy | Bản thang, chiếu thang trong buồng thang |\n| --- | --- | --- | --- | --- | --- |\n| **S0** | K0 | K0 | K0 | K0 | K0 |\n| **S1** | K1 | K2 | K1 | K0 | K0 |\n| **S2** | K3 | K3 | K2 | K1 | K1 |\n| **S3** | không quy định | không quy định | không quy định | K1 | K3 |\n\nBộ phận ngăn cháy loại 1 phải **K0**; loại 2–4 được K1 trong trường hợp riêng (2.3.3.4).\n\n## 1.5 Nhóm nguy hiểm cháy theo công năng — Bảng 6 ✱\n\n| Nhóm | Công trình điển hình |\n| --- | --- |\n| **F1.1** | Nhà trẻ, mẫu giáo, mầm non; **bệnh viện** (trừ dã chiến), khối điều trị nội trú; phòng khám đa khoa, chuyên khoa, nhà hộ sinh; nhà cho người cao tuổi, khuyết tật (không phải căn hộ), dưỡng lão; khối nhà ngủ trường nội trú |\n| **F1.2** | Khách sạn, nhà khách, nhà nghỉ, nhà trọ; ký túc xá, nhà ở tập thể; khối ngủ cơ sở điều dưỡng, phục hồi chức năng |\n| **F1.3** | Nhà chung cư |\n| **F1.4** | Nhà ở riêng lẻ |\n| **F2.1** | Nhà hát, rạp chiếu phim, rạp xiếc, hòa nhạc; câu lạc bộ, hộp đêm, **vũ trường, quán bar, phòng hát, karaoke**; công trình thể thao có khán đài, nhà thi đấu trong nhà; **thư viện**; trung tâm hội nghị, sự kiện **không** có dịch vụ ăn uống |\n| **F2.2** | Bảo tàng, triển lãm; phòng nhảy; khối công trình vui chơi giải trí, thủy cung |\n| **F2.3 / F2.4** | Như F2.1 / F2.2 nhưng hở ra ngoài trời; công viên giải trí |\n| **F3.1** | Cửa hàng, siêu thị, TTTM, điện máy, bách hóa, cửa hàng tiện ích; nhà sách; cửa hàng mô-tô, xe máy; hội chợ, trưng bày hàng hóa |\n| **F3.2** | Nhà hàng, ăn uống, giải khát, trạm dừng nghỉ; trung tâm hội nghị, sự kiện **có** dịch vụ ăn uống |\n| **F3.3** | Ga đường sắt, ga hàng không, nhà chờ cáp treo, bến phà, bến xe khách |\n| **F3.4** | Phòng khám **ngoại trú**, cấp cứu; trạm y tế, thẩm mỹ viện, phục hồi chức năng; **xoa bóp** |\n| **F3.5** | Bưu điện, quỹ tiết kiệm, phòng vé, văn phòng luật, công chứng, giặt là, may, cắt tóc; cơ sở phục vụ lễ tang |\n| **F3.6** | Khu tập luyện, thi đấu thể thao không có khán đài; sân vận động, trường đua, trường bắn |\n| **F4.1** | Trường tiểu học, THCS, THPT, trung học chuyên nghiệp, trường dạy nghề (không gồm mầm non) |\n| **F4.2** | Đại học, cao đẳng, học viện, trường bồi dưỡng nghiệp vụ |\n| **F4.3** | Trụ sở cơ quan, **văn phòng**, ngân hàng; tổ chức nghiên cứu, thiết kế; cơ sở phát thanh, truyền hình, viễn thông; nhà xuất bản |\n| **F4.4** | Trạm (đội) chữa cháy và cứu nạn, cứu hộ |\n| **F5.1** | Nhà sản xuất, phòng thí nghiệm, xưởng; **sửa chữa, bảo dưỡng ô-tô, mô-tô** |\n| **F5.2** | Kho; **gara không có dịch vụ kỹ thuật, sửa chữa**; kho sách, lưu trữ; **trung tâm dữ liệu chuyên ngành**; kho hàng cảng cạn |\n| **F5.3** | Nhà phục vụ nông nghiệp, phát triển nông thôn |\n\nGian sản xuất, kho, phòng thí nghiệm, xưởng **> 50 m²** và bếp có thiết bị đun nấu **> 10 kW** trong nhà F1–F4 được xếp vào **F5** (2.5.5.2).\n\n**Phạm vi áp dụng (1.1.2) ✱:**\n\n| Loại nhà | Giới hạn áp dụng |\n| --- | --- |\n| Chung cư, nhà ở tập thể | Chiều cao PCCC ≤ 150 m, ≤ 3 tầng hầm |\n| Nhà ở riêng lẻ (kể cả kết hợp, chuyển đổi công năng) | Từ **7 tầng** (hoặc chiều cao PCCC ≥ 25 m), **hoặc** khối tích ≥ 5 000 m³, **hoặc** 2–3 tầng hầm |\n| Nhà công cộng | ≤ 150 m, ≤ 3 tầng hầm |\n| Nhà sản xuất, kho; hạ tầng kỹ thuật | ≤ 50 m, ≤ 1 tầng hầm |\n| Nhà phục vụ giao thông | ≤ 50 m, ≤ 3 tầng hầm |\n\nNhà F1.2, F1.3, F4.2, F4.3, hỗn hợp **> 150 m** hoặc **≥ 4 tầng hầm**: bổ sung yêu cầu theo tài liệu chuẩn (1.1.3). Tầng hầm 4, 5 để xe: áp dụng thêm quy chuẩn gara ngầm.\n\n## 1.6 Hạng nguy hiểm cháy và cháy nổ (Phụ lục C)\n\n| Hạng gian phòng | Đặc trưng (Bảng C.1) |\n| --- | --- |\n| **A** – nguy hiểm cháy nổ cao | Khí cháy; chất lỏng dễ bắt cháy có nhiệt độ bùng cháy **≤ 28 °C**; chất nổ khi gặp nước, ôxy — áp suất nổ dư tính toán **> 5 kPa** |\n| **B** – nguy hiểm cháy nổ | Bụi, sợi cháy; chất lỏng bùng cháy **> 28 °C** — áp suất nổ dư **> 5 kPa** |\n| **C1** | Tải trọng cháy riêng **> 2 200 MJ/m²** |\n| **C2** | 1 401 – 2 200 MJ/m² |\n| **C3** | 181 – 1 400 MJ/m² |\n| **C4** | 1 – 180 MJ/m² |\n| **D** – nguy hiểm cháy vừa phải | Chất không cháy ở trạng thái nóng, nóng chảy; nhiên liệu đốt |\n| **E** – nguy hiểm cháy thấp | Chất không cháy ở trạng thái nguội |\n\n**Hạng của nhà (C.2):**\n\n- **Hạng A**: tổng diện tích gian hạng A **> 5 %** tổng diện tích các gian phòng **hoặc > 200 m²**. Không xếp hạng A nếu ≤ 25 % (≤ 1 000 m²) và các gian đó có chữa cháy tự động.\n- **Hạng B**: không thuộc A; tổng A + B > 5 % hoặc > 200 m² (ngoại lệ tương tự, ≤ 1 000 m²).\n- **Hạng C**: không thuộc A, B; tổng A + B + C1–C3 > 5 % (10 % nếu không có A, B). Ngoại lệ ≤ 25 % (≤ 3 500 m²) có chữa cháy tự động.\n", "02-ngan-chay.md": "# 2. Bộ phận ngăn cháy và khoang cháy\n\nMục 2.3, Phần 4 và Phụ lục H của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023).\n\n## 2.1 Bộ phận ngăn cháy — Bảng 1\n\n| Bộ phận ngăn cháy | Loại | GHCL | Chèn bịt lỗ mở loại | Khoang đệm loại |\n| --- | --- | --- | --- | --- |\n| Tường ngăn cháy | 1 | REI 150 | 1 | 1 |\n|  | 2 | REI 45 | 2 | 2 |\n| Vách ngăn cháy | 1 | EI 45 | 2 | 1 |\n|  | 2 | EI 15 | 3 | 2 |\n| Vách ngăn cháy có kính > 25 % diện tích | 1 | EIW 45 | 2 | 1 |\n|  | 2 | EIW 15 | 3 | 2 |\n| Sàn ngăn cháy | 1 | REI 150 | 1 | 1 |\n|  | 2 | REI 60 | 2 | 1 |\n|  | 3 | REI 45 | 2 | 1 |\n|  | 4 | REI 15 | 3 | 2 |\n\nVách có kính: phần đặc theo EI, phần kính theo EW. Vách đã thử đạt EI cả phần kính được coi là đạt EW.\n\nNhà cao **> 50 m**: tường và sàn ngăn cháy **REI 150** (50–100 m) hoặc **REI 180** (100–150 m) theo Bảng A.1.\n\n## 2.2 Bộ phận chèn bịt lỗ mở — Bảng 2\n\n| Bộ phận chèn bịt | Loại | GHCL |\n| --- | --- | --- |\n| Cửa đi (kính ≤ 25 %), cửa nắp, van ngăn cháy, màn ngăn cháy | 1 | EI 60 |\n|  | 2 | EI 30 |\n|  | 3 | EI 15 |\n| Cửa đi có kính > 25 % diện tích cửa | 1 | EIW 60 |\n|  | 2 | EIW 30 |\n|  | 3 | EIW 15 |\n| Cửa giếng thang máy (khi có yêu cầu GHCL) | 2 | **E 30** |\n| Cửa sổ | 1 | E 60 |\n|  | 2 | E 30 |\n|  | 3 | E 15 |\n\nVan ngăn cháy được chỉ lấy theo **E** nếu lắp trong kênh, giếng, ống đã bảo đảm cả E và I.\n\n## 2.3 Khoang đệm ngăn cháy — Bảng 3\n\n| Khoang đệm | Vách ngăn cháy | Sàn ngăn cháy | Chèn bịt lỗ mở (cửa) |\n| --- | --- | --- | --- |\n| Loại 1 | Loại 1 (EI 45) | Loại 3 (REI 45) | Loại 2 (EI 30) |\n| Loại 2 | Loại 2 (EI 15) | Loại 4 (REI 15) | Loại 3 (EI 15) |\n\n## 2.4 Yêu cầu cấu tạo bộ phận ngăn cháy (Phần 4)\n\n- **Tường ngăn cháy chia khoang cháy**: xây **suốt chiều cao nhà** hoặc tới sàn ngăn cháy loại 1; không để cháy lan khi kết cấu phía có cháy sụp đổ (4.17).\n- **Lỗ mở**: phải đóng kín khi cháy; cửa sổ trong bộ phận ngăn cháy **không mở được**; cửa đi, cửa nắp, van có **cơ cấu tự đóng**, khe chèn kín; cửa cần để mở khi sử dụng phải tự đóng khi cháy (4.18).\n- **Tổng diện tích lỗ cửa** trong bộ phận ngăn cháy (trừ bao che giếng thang máy) **≤ 25 %** diện tích bộ phận đó. Không giới hạn nếu chèn bịt có GHCL danh định ≥ GHCL bộ phận ngăn cháy (trừ tường ngăn cháy loại 1) (4.19).\n- Cửa ngăn gian hạng **A, B** với không gian khác: khoang đệm **luôn có áp suất dương**; không dùng chung khoang đệm cho hai gian A/B (4.19).\n- Cửa, van ngăn cháy: vật liệu **không cháy**; được dùng vật liệu ≥ Ch3 bọc vật liệu không cháy dày **≥ 4 mm**; hoặc gỗ Ch3 đặc dày **≥ 40 mm** ở phía gian không có chất cháy (4.21).\n- Không cho ống, kênh dẫn khí cháy, chất lỏng cháy **xuyên tường/sàn ngăn cháy loại 1**; các ống khác phải có thiết bị tự động ngăn sản phẩm cháy tại chỗ giao cắt (4.22).\n- Ống thông gió, ống khói trong tường ngăn cháy nhà dân dụng: tường còn lại dày **≥ 25 cm**, vách giữa ống khói và ống thông hơi **≥ 12 cm** (4.22, CT1).\n- Đường ống, cáp xuyên kết cấu: chèn bịt không làm giảm chỉ tiêu cháy của kết cấu (4.12). Chi tiết liên kết có GHCL không thấp hơn cấu kiện (4.10).\n- **Trần treo**: vách ngăn cháy phải ngăn cả không gian trên trần; không bố trí trần treo trong gian hạng A, B (4.15).\n- Không dùng lớp bảo vệ chống cháy ở vị trí không thể kiểm tra, thay thế định kỳ (4.13).\n\n## 2.5 Ngăn cách công năng khác nhau (4.5)\n\n- Các phần nhà khác nhóm F: ngăn bằng bộ phận ngăn cháy **≥ EI 45** (bậc I–III) hoặc **≥ EI 15** (bậc IV), hoặc giải pháp tương đương.\n- Tầng có công năng chính chiếm **≥ 90 %** diện tích, phần còn lại là phụ trợ: không bắt buộc ngăn cháy, toàn tầng theo yêu cầu của công năng chính (trừ khi phụ trợ có hạng nguy hiểm cao hơn).\n- Trong nhà F1–F4 **không yêu cầu** ngăn cháy cho: gian F5 hạng C4, E; phòng kỹ thuật nước; phòng ẩm ướt; **kho ≤ 10 m²** không chứa khí/lỏng dễ cháy; khu chỉ phục vụ ăn uống (không bếp, không kho thực phẩm); phòng họp nội bộ…\n- Không ngăn cách thì lấy yêu cầu **cao nhất** giữa các công năng. Luôn phải ngăn khu vực hạng A, B, C với khu ở/công cộng.\n\n**Riêng nhà F1.3 (4.5, CHÚ THÍCH):**\n\n| Bộ phận | Yêu cầu |\n| --- | --- |\n| Tường, vách giữa các đơn nguyên; giữa hành lang chung và các phòng khác | ≥ **EI 30** |\n| Tường, vách không chịu lực giữa các căn hộ | ≥ **EI 30**, **K0** |\n| Phòng công cộng với phòng ở | **Vách ngăn cháy loại 1** + **sàn ngăn cháy loại 3**; nhà bậc I: **sàn ngăn cháy loại 2** |\n| Lan can lô gia, ban công từ tầng 3 trở lên | Vật liệu **không cháy** (4.9) |\n\n## 2.6 Giếng thang máy, trục kỹ thuật, rác\n\n- **Bao che giếng thang máy**, phòng máy (trừ phòng trên mái), kênh, giếng, hộp kỹ thuật: như **vách ngăn cháy loại 1 + sàn ngăn cháy loại 3** (4.23). Không quy định GHCL giữa giếng và phòng máy; cửa giếng mở ra hành lang bên không yêu cầu GHCL.\n- Không lắp được cửa ngăn cháy cho giếng thang: bố trí khoang đệm/sảnh với vách ngăn cháy loại 1 (hoặc màn ngăn cháy, màn nước drencher) và sàn loại 3, hoặc màn chắn tự đóng **≥ E 30** (4.23).\n- Nhà có buồng thang không nhiễm khói: giếng thang máy không có khoang đệm áp suất dương phải được **bảo vệ chống khói tự động** (4.23).\n- **Tầng hầm, nửa hầm**: trước lối vào thang máy phải có **khoang đệm ngăn cháy loại 1 có áp suất dương khi cháy** (4.28).\n- Trong buồng thang bộ (trừ buồng không nhiễm khói) được đặt **≤ 2 thang máy** chở người chỉ xuống tầng 1, bao che không cháy (3.4.6).\n- **Ống đổ rác, buồng rác** (4.24): ngăn cách bằng bộ phận ngăn cháy; cửa thu rác tự đóng; ống bằng vật liệu không cháy; không đặt trong buồng thang, sảnh, khoang đệm thoát nạn; lối vào qua không gian thoáng hoặc khoang đệm thông gió thường xuyên.\n- Thang bộ riêng nối tầng hầm với tầng 1 (vì công nghệ): bao che vách ngăn cháy loại 1 + khoang đệm áp suất dương; **không tính** vào thoát nạn (4.25).\n\n## 2.7 Khoang cháy — Phụ lục H ✱\n\nDiện tích khoang cháy tính theo **diện tích một tầng nhà trong phạm vi một khoang cháy**. Chọn bảng theo nhóm F → hàng theo bậc chịu lửa và cấp S → đọc chiều cao PCCC tối đa và diện tích tầng tối đa.\n\n**Bảng H.1 — Nhà ở và ký túc xá kiểu căn hộ**\n\n| Bậc | Cấp S | Chiều cao PCCC tối đa | Diện tích 1 tầng / khoang cháy |\n| --- | --- | --- | --- |\n| I | S0 | 75 m | 2 500 m² |\n| II | S0 | 50 m | 2 500 m² |\n| II | S1 | 28 m | 2 200 m² |\n| III | S0 | 28 m | 1 800 m² |\n| III | S1 | 15 m | 1 800 m² |\n| IV | S0 | 5 m / 3 m | 1 000 / 1 400 m² |\n| IV | S1 | 5 m / 3 m | 800 / 1 200 m² |\n| IV | S2 | 5 m / 3 m | 500 / 900 m² |\n| V | — | 5 m / 3 m | 500 / 800 m² |\n\nF1.3 cao 75–150 m: theo **Phụ lục A** (A.3). Nhà hai tầng bậc IV: bộ phận chịu lực ≥ R 30.\n\n**Bảng H.2 — Nhà công cộng** (kể cả khách sạn, căn hộ cho thuê) — diện tích 1 tầng/khoang cháy (m²) theo số tầng trên mặt đất\n\n| Bậc | Cấp S | Cao tối đa | 1 tầng | 2 | 3 | 4–5 | 6–9 | 10–16 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| I | S0 | 50 m | 6 000 | 5 000 | 5 000 | 5 000 | 5 000 | 2 500 |\n| II | S0 | 50 m | 6 000 | 4 000 | 4 000 | 4 000 | 4 000 | 2 200 |\n| II | S1 | 28 m | 5 000 | 3 000 | 3 000 | 2 000 | 1 200 | — |\n| III | S0 | 15 m | 3 000 | 2 000 | 2 000 | 1 200 | — | — |\n| III | S1 | 12 m | 2 000 | 1 400 | 1 200 | 800 | — | — |\n| IV | S0 | 9 m | 2 000 | 1 400 | — | — | — | — |\n| IV | S1 | 6 m | 2 000 | 1 400 | — | — | — | — |\n| IV | S2, S3 | 6 m | 1 200 | 800 | — | — | — | — |\n| V | S1–S3 | 6 m | 1 200 | 800 | — | — | — | — |\n\nNhà công cộng 50–150 m: theo **Phụ lục A** (A.2). Nhà 2 tầng bậc IV: kết cấu chịu lực ≥ R 45.\n\n**Bảng H.4 — Thương mại F3.1**\n\n| Bậc | Cấp S | Cao tối đa | 1 tầng | 2 tầng | 3–5 tầng |\n| --- | --- | --- | --- | --- | --- |\n| I, II | S0 | 28 m | 3 500 | 3 000 | 2 500 |\n| III | S0, S1 | 8 m | 2 000 | 1 000 | — |\n| IV | S0 | 3 m | 1 000 | — | — |\n| IV, V | S1–S3 | 3 m | 500 | — | — |\n\n**Tăng diện tích và quy định chung (H.2.12):**\n\n- Nhà **bậc I, II, cấp S0** có **chữa cháy tự động toàn nhà**: diện tích khoang cháy theo H.2 – H.4 được tăng **không quá 2 lần**.\n- Nhà 1 tầng có phần 2 tầng **≤ 15 %** diện tích xây dựng vẫn coi là nhà 1 tầng.\n- Mái hiên, sân trời, hành lang ngoài được thấp hơn **1 bậc** chịu lửa so với nhà chính (cấp S không thấp hơn).\n- Tiền sảnh, phòng chờ lớn hơn diện tích cho phép: được thay tường ngăn cháy bằng **vách ngăn cháy xuyên sáng loại 2**.\n- Nhà ga, TTTM, sảnh thông tầng không bố trí được tường ngăn cháy: thay bằng **màn nước drencher 2 dải cách 0,5 m**, **≥ 1 L/s** cho mỗi mét dài, duy trì **≥ 1 giờ**, kèm giải pháp ngăn khói.\n- Thư viện không cao quá **28 m**.\n\n**Nhà cao trên 50 m (Phụ lục A):**\n\n- Bậc chịu lửa tối thiểu **I**; chia khoang cháy theo chiều cao **≤ 50 m** mỗi khoang (A.2.2); F1.3 cao 75–150 m: khoang dưới cùng ≤ 75 m, các khoang tiếp theo ≤ 50 m (A.3.1.2). Ngăn bằng sàn ngăn cháy hoặc tầng kỹ thuật có sàn **≥ REI 90**.\n- Diện tích 1 tầng/khoang cháy (A.2.3): khối đế **≤ 3 000 m²**; F1.2 **≤ 1 500 m²**; F1.3 **≤ 2 000 m²**; còn lại **≤ 2 500 m²**.\n- Nhà **> 100 m** (> 120 m nếu có báo cháy và chữa cháy tự động): bố trí **khu vực lánh nạn tạm thời** (tầng/gian lánh nạn hoặc vùng an toàn) theo A.3.2.\n\n## 2.8 Gian phòng đông người — Bảng H.8\n\nChiều cao PCCC tối đa (tính tới cao độ hàng ghế đầu) để bố trí giảng đường, khán phòng, hội nghị, phòng tập thể thao:\n\n| Bậc | Cấp S | Sức chứa | Cao tối đa |\n| --- | --- | --- | --- |\n| I, II | S0 | ≤ 300 chỗ | 50 m |\n| I, II | S0, S1 | ≤ 600 chỗ | 12 m |\n| I, II | S0, S1 | > 600 chỗ | 9 m |\n| III | S0 | ≤ 300 chỗ | 9 m |\n| III | S0, S1 | ≤ 600 chỗ | 3 m |\n| IV | S0–S3 | ≤ 100 chỗ | 3 m |\n\nNhà F1.1: không đặt các gian này cao hơn **tầng 2**; trường F4.1: không cao hơn **tầng 3** — trừ khi có báo cháy/chữa cháy tự động hoặc ≥ 2 cầu thang thoát nạn.\n", "03-thoat-nan.md": "# 3. Thoát nạn\n\nPhần 3 (Bảo đảm an toàn cho người) và Phụ lục G của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023).\n\n## 3.1 Nguyên tắc chung (3.1)\n\n- Không tính các biện pháp **cứu nạn** và các lối ra không đạt 3.2.1 vào thoát nạn (3.1.5).\n- **Không bố trí** gian F1.1, F1.2, F1.3 trong tầng hầm, nửa hầm. Gian F5 hạng A, B không đặt dưới gian > 50 người và không đặt trong tầng hầm (3.1.6).\n- Nhà có **2–3 tầng hầm**: được đặt siêu thị, TTTM, ăn uống, công cộng sâu hơn hầm 1 khi thiết kế theo tài liệu chuẩn hoặc có luận chứng kỹ thuật. Bệnh viện, trường phổ thông: chỉ khám ngoại trú, văn phòng, phụ trợ từ tầng bán hầm/hầm 1 trở lên (3.1.7).\n- **Mỗi sàn tầng hầm**: ít nhất một lối vào buồng thang thoát nạn qua **sảnh ngăn khói** ngăn bằng vách ngăn cháy loại 1, cửa tự đóng (3.1.7).\n- Thiết bị điện của hệ thống PCCC: cấp điện từ **hai nguồn độc lập** (điện lưới + máy phát) (3.1.10).\n\n## 3.2 Lối ra thoát nạn là gì (3.2.1 – 3.2.3)\n\nĐược coi là lối ra thoát nạn khi dẫn:\n\n- **Từ tầng 1** ra ngoài: trực tiếp; qua hành lang; qua tiền sảnh; qua buồng thang bộ; hoặc kết hợp.\n- **Từ tầng khác**: trực tiếp vào buồng thang bộ hoặc thang bộ loại 3; vào hành lang dẫn trực tiếp tới đó; vào phòng chung có lối ra trực tiếp vào buồng thang; vào **hành lang bên** (nhà < 28 m) dẫn trực tiếp vào thang loại 2; ra **mái có khai thác sử dụng** dẫn tới thang loại 3.\n- **Vào gian phòng liền kề** cùng tầng có lối ra như trên (trừ gian F5 hạng A, B).\n- **Từ tầng hầm, nửa hầm**: ra ngoài trực tiếp, **tách biệt** với buồng thang chung. Được đi qua buồng thang chung nếu có lối đi riêng ra ngoài, ngăn với phần còn lại bằng **vách đặc ngăn cháy loại 1**. ✱ Nhà F1.2, F1.3, F2, F3, F4 cao < 28 m không bố trí được lối riêng: lối vào buồng thang từ hầm qua **khoang đệm** (bao che như khoang đệm ngăn cháy loại 1) và vách ngăn cháy loại 1 ngăn với phần còn lại.\n\n**Cửa trên lối ra thoát nạn (3.2.3) ✱:**\n\n- **Không** là lối ra thoát nạn nếu đặt **cửa cuốn** hoặc **cửa quay**.\n- **Được dùng cửa trượt, cửa xếp**, trừ khi cửa có yêu cầu GHCL, phải tự đóng, hoặc trong nhà F1.3, mầm non, tiểu học. Khi đó không áp dụng chiều mở cửa và phải có biển ghi loại cửa, chiều mở.\n\n## 3.3 Số lượng lối ra thoát nạn\n\n**Gian phòng phải có ≥ 2 lối ra (3.2.5):**\n\n| Trường hợp | Ngưỡng |\n| --- | --- |\n| Gian F1.1 | > 15 người |\n| Gian trong tầng hầm, nửa hầm | > 15 người |\n| Mọi gian phòng | ≥ 50 người |\n| Gian < 50 người (trừ F5) | Đường đi từ chỗ xa nhất tới lối ra > **25 m** |\n| Gian + các gian liền kề chỉ thoát qua gian đó | Tổng ≥ 50 người |\n| F5 hạng A, B | > 5 người ca đông nhất |\n| F5 hạng C | > 25 người hoặc diện tích > 1 000 m² |\n| Sàn công tác hở trong F5 | > 100 m² (A, B) hoặc > 400 m² (hạng khác) |\n\nGian cần ≥ 2 lối ra: được cho **≤ 50 %** số lối ra đi qua gian liền kề (gian đó cũng phải đủ lối ra).\n\n**Tầng nhà phải có ≥ 2 lối ra (3.2.6.1):**\n\n- Tầng của nhà **F1.1, F1.2, F2.1, F2.2, F3, F4**;\n- Tầng có **≥ 50 người**;\n- Tầng nhà **F1.3** có tổng diện tích căn hộ **> 500 m²** (tính theo đơn nguyên; gồm cả ban công, lô gia). Nếu ≤ 500 m² và chỉ 1 lối ra: căn hộ ở độ cao **> 15 m** phải có thêm **lối ra khẩn cấp**;\n- Tầng F5 hạng A, B > 5 người; hạng C > 25 người;\n- **Tầng hầm, nửa hầm > 300 m²** hoặc **> 15 người**.\n\nTầng có một gian cần ≥ 2 lối ra thì tầng phải ≥ 2 lối ra. Số lối ra của nhà không ít hơn của bất kỳ tầng nào (3.2.7).\n\n**Cho phép 1 lối ra (3.2.6.2) ✱** — trừ nhà bậc V:\n\n| Trường hợp | Điều kiện chính |\n| --- | --- |\n| F1.2, F2, F3, F4.2, F4.3, F4.4 — cao ≤ 15 m | Tầng ≤ **300 m²**, ≤ **20 người**; không để xe, không kho A, B, C ở tầng có lối ra ngoài. Nhà ≤ 3 tầng hoặc ≤ 9 m: được dùng **thang loại 2** khi người có thể ra ban công, lô gia thoáng, cửa sổ hoặc sân thượng thoáng; thang loại 2 ngăn với hầm bằng vách ngăn cháy loại 2 |\n| Cùng nhóm — cao 15 – 21 m | Tầng ≤ **200 m²**, ≤ 20 người; **chữa cháy tự động** (không được thì báo cháy tự động toàn nhà, ưu tiên đầu báo khói); có lối thoát khẩn cấp kèm thiết bị hỗ trợ (thang P1, P2, thang dây, ống tụt…) hoặc lên sân thượng thoáng |\n| Cùng nhóm — cao 21 – 25 m | Tầng ≤ **150 m²**, ≤ **15 người**; **báo cháy và chữa cháy tự động**; lối thoát khẩn cấp kèm thiết bị hỗ trợ |\n| Tầng kỹ thuật, khu thiết bị | ≤ 300 m²; mỗi 2 000 m² diện tích còn lại thêm ≥ 1 lối ra |\n| F1.3 tổng căn hộ 500 – 550 m²/tầng | Tầng trên cùng ≤ 28 m: buồng thang thông thường + **đầu báo cháy địa chỉ** mỗi căn hộ. > 28 m: buồng thang **N1** + báo cháy địa chỉ hoặc chữa cháy tự động mọi phòng |\n| F1.3 cao 28 – 50 m, ≤ 500 m²/tầng | Được thay **N1 bằng N2** khi: lối vào từ mọi tầng qua **khoang đệm ngăn cháy áp suất dương**; có thang máy cho lực lượng chữa cháy; báo cháy địa chỉ hoặc chữa cháy tự động mọi phòng; có hệ thống âm thanh cảnh báo |\n| F4.1 | Theo dòng đầu; hoặc tiểu học cao ≤ 9 m, tầng ≤ 300 m²; F4.1 khác cao ≤ 15 m, tầng ≤ 500 m² |\n\n**Bố trí phân tán (3.2.8):** hai lối ra cách nhau **≥ 1/2 đường chéo lớn nhất** của mặt bằng gian/tầng (đo giữa hai cạnh **xa nhất** của hai lối ra, và phải ≥ 7 m; nếu < 7 m thì đo giữa hai cạnh **gần nhất**). Nhà có **sprinkler toàn bộ**: giảm còn **1/3**. Hai buồng thang nối bằng hành lang: đo dọc đường đi theo hành lang. Khi tính, giả thiết đám cháy chặn một lối ra.\n\n## 3.4 Kích thước lối ra và đường thoát nạn\n\n| Hạng mục | Yêu cầu | Điều |\n| --- | --- | --- |\n| Chiều cao thông thủy lối ra thoát nạn | **≥ 1,9 m** (tầng kỹ thuật ≥ 1,8 m) | 3.2.9, 3.2.14 |\n| Chiều rộng lối ra | **≥ 1,2 m**: gian F1.1 > 15 người; gian, nhà nhóm khác > 50 người (trừ F1.3). **≥ 0,8 m**: các trường hợp còn lại | 3.2.9 |\n| Cửa ra ngoài và cửa vào sảnh của buồng thang | ≥ chiều rộng tính toán hoặc ≥ chiều rộng bản thang | 3.2.9 |\n| Cửa hai cánh | Chỉ tính chiều rộng bên **cánh mở**; cửa có GHCL lắp cơ cấu đóng lần lượt | 3.2.9 |\n| Chiều cao thông thủy đoạn ngang đường thoát nạn | **≥ 2,0 m** | 3.3.6 |\n| Chiều rộng hành lang, đường dốc | **≥ 1,2 m**: hành lang chung > 15 người (F1) hoặc > 50 người (nhóm khác). **≥ 0,7 m**: lối tới chỗ làm việc đơn lẻ. **≥ 1,0 m**: còn lại | 3.3.6 |\n| Giật cấp trên sàn | Không có giật cấp < 45 cm (trừ ngưỡng cửa). Chỗ giật cấp: **≥ 3 bậc** hoặc dốc **≤ 1:6** (≤ 9,5°). Chênh > 45 cm có bậc: phải có lan can tay vịn | 3.3.7 |\n| Cửa phòng học > 15 học sinh | ≥ 0,9 m | G.2.1.3 |\n| Lối ra từ gian không có ghế khán giả > 50 người | ≥ 1,2 m | G.2.1.4 |\n| Sai số thi công kích thước lối ra, hành lang, thang | **± 5 %** ✱ | 1.5.5 |\n\nCửa mở ra hành lang làm hẹp chiều rộng: trừ **1/2** phần nhô (cửa một bên) hoặc **toàn bộ** phần nhô (cửa hai bên); không áp dụng cho sảnh tầng giữa căn hộ và buồng thang nhà F1.3 (3.3.5).\n\n**Chiều rộng tính toán theo số người:**\n\n- Nhà công cộng — định mức người/1 m chiều rộng cửa vào buồng thang và bản thang: bậc I, II **165**; bậc III, IV **115**; bậc V **80** (G.2.1.1).\n- Gian không có ghế khán giả: theo **Bảng G.5**; nhà sản xuất: **Bảng G.7, G.8** (lối ra ≥ 0,9 m).\n- Lối đi chính trong gian thương mại: **1,4 m** (≤ 100 m²); **1,6 m** (≤ 150 m²); **2,0 m** (≤ 400 m²); **2,5 m** (> 400 m²) (G.2.1.5).\n\n**Số người tính toán — Bảng G.9 (m²/người):**\n\n| Không gian | m²/người |\n| --- | --- |\n| Khu vui chơi có mái, hội trường, câu lạc bộ, sàn nhảy, bar, karaoke | 1,0 |\n| Phòng họp, hội thảo, phòng ăn, đọc, học, căng-tin; triển lãm, trường quay | 1,5 |\n| Sảnh lớn, sảnh thông tầng, khu chờ; chợ, TTTM, siêu thị; cửa hàng dịch vụ | 3,0 |\n| Phòng trưng bày, bảo tàng | 5,0 |\n| Văn phòng | 6,0 |\n| Cửa hàng nội thất lớn; nhà bếp, thư viện | 7,0 |\n| Phòng ngủ | 8,0 |\n| Phòng khách, phòng giải trí | 10,0 |\n| Kho | 30,0 |\n| Nhà để xe ô tô | 2 người/chỗ đỗ |\n\nDiện tích sàn không kể thang bộ, thang máy, vệ sinh, phụ trợ.\n\n## 3.5 Cửa trên đường thoát nạn (3.2.9 – 3.2.11)\n\n- Mở **theo chiều thoát ra ngoài**. Không quy định chiều mở cho: gian F1.3, F1.4; gian ≤ 15 người (trừ hạng A, B); kho ≤ 200 m² không có người thường xuyên; buồng vệ sinh; lối ra chiếu thang loại 3.\n- Cửa từ hành lang tầng, phòng chung, sảnh, buồng thang: **mở tự do từ bên trong, không cần chìa**.\n- Cửa có yêu cầu GHCL: có **cơ cấu tự đóng**.\n- Cửa buồng thang bộ: tự đóng, khe chèn kín (trừ cửa buồng thang mở trực tiếp ra ngoài). Là cửa ngăn cháy **loại 1** (nhà bậc I, II), **loại 2** (bậc III, IV), **loại 3** (bậc V), trừ trường hợp quy định riêng.\n- Buồng thang phục vụ **từ 4 tầng trở lên**: khóa điện **tự mở** khi báo cháy kích hoạt hoặc mất điện; người trong buồng thang luôn quay lại được vào nhà, hoặc có điểm quay lại cách nhau **≤ 4 tầng** (ít nhất 2 tầng), tại tầng trên cùng hoặc tầng kề dưới. Cửa quay lại được ghi **\"CỬA CÓ THỂ ĐI VÀO TRONG NHÀ\"**, chữ cao ≥ 50 mm, đặt cao 1,2 – 1,8 m.\n\n## 3.6 Khoảng cách thoát nạn — Phụ lục G\n\nĐo **dọc theo tâm đường thoát nạn**, từ tâm cửa gian phòng (hoặc từ chỗ xa nhất trong phòng nếu gian và hành lang không được ngăn cháy) tới tâm lối ra thoát nạn gần nhất. Chiều dài theo thang loại 2 lấy bằng **3 lần chiều cao** thang (3.3.2). Hành lang/gian không được bao che đúng 3.3.5 hoặc vật liệu không đạt 3.3.4: tính từ **điểm xa nhất** trong phòng.\n\n**Bảng G.1 — Nhà ở F1.3 (từ cửa căn hộ) và F1.2 (từ cửa phòng ở)**\n\n| Bậc | Cấp S | Giữa hai buồng thang / lối ra | Hành lang cụt |\n| --- | --- | --- | --- |\n| I, II | S0 | **40 m** | **25 m** |\n| II | S1 | 30 m | 20 m |\n| III | S0 | 30 m | 20 m |\n| III | S1 | 25 m | 15 m |\n| IV | S0 | 25 m | 15 m |\n| IV | S1, S2 | 20 m | 10 m |\n| V | — | 20 m | 10 m |\n\n**Bảng G.2a — Nhà công cộng (từ cửa gian phòng xa nhất)**, theo mật độ dòng người trên đường thoát nạn (người/m²)\n\n| Vị trí cửa | Bậc | ≤ 2 | 2–3 | 3–4 | 4–5 | > 5 |\n| --- | --- | --- | --- | --- | --- | --- |\n| Giữa hai thang bộ / lối ra | I, II, III | 60 | 50 | 40 | 35 | 20 |\n|  | IV | 40 | 35 | 30 | 25 | 15 |\n|  | V | 30 | 25 | 20 | 15 | 10 |\n| Hành lang cụt hoặc sảnh chung | I, II, III | 30 | 25 | 20 | 15 | 10 |\n|  | IV | 20 | 15 | 15 | 10 | 7 |\n|  | V | 15 | 10 | 10 | 5 | 5 |\n\nCột áp dụng: **mầm non** cột > 5; **trường phổ thông, cao đẳng, đại học** cột 2–3; **điều trị nội trú** cột 4–5; **khách sạn** cột 3–4. Nhà công cộng khác: tính mật độ cụ thể.\n\n**Bảng G.2b** — từ điểm bất kỳ trong gian không có ghế khán giả (phòng chờ, triển lãm, phòng ăn, thương mại…) theo khối tích gian. Ví dụ gian thương mại có lối đi chính ≥ 25 % diện tích, bậc I, II: 50 / 65 / 80 m (≤ 5 000 / ≤ 10 000 / > 10 000 m³).\n\n**Nhà sản xuất, kho:** Bảng G.3 (chỗ làm việc xa nhất, theo khối tích và hạng), Bảng G.4 (từ cửa gian ≤ 1 000 m²). Gian cao > 6 m: tăng 20 % (≤ 12 m), 30 % (≤ 18 m), 40 % (≤ 24 m), nhưng ≤ 140 m (hạng A, B) và ≤ 240 m (hạng C).\n\n## 3.7 Đường thoát nạn — bao che và hạn chế (3.3)\n\n- Đường thoát nạn **không gồm** thang máy, thang cuốn; hành lang có cửa giếng thang máy không đạt yêu cầu ngăn cháy; lối đi xuyên chiếu tới buồng thang; đường theo mái (trừ mái khai thác); thang loại 2 nối **≥ 3 tầng** hoặc từ tầng hầm (trừ trường hợp cho phép) (3.3.3).\n- Bao che hành lang, sảnh, phòng chung trên đường thoát nạn ✱: nhà **bậc I**: vật liệu không cháy **≥ EI 30**; **bậc II–IV**: không cháy hoặc Ch1 **≥ EI 15**. Cửa mở vào hành lang có GHCL không thấp hơn bộ phận bao che. Nhà hạng D, E được dùng tường kính, vật liệu không cháy. Karaoke, vũ trường **bắt buộc** bao che (3.3.5).\n- Trên hành lang thoát nạn **không** đặt: thiết bị nhô ra dưới **2 m**; ống khí cháy, chất lỏng cháy; tủ tường (trừ tủ thông tin, tủ họng nước).\n- Hành lang **> 60 m**: chia bằng vách ngăn cháy loại 2 hoặc vách/màn ngăn khói (mép dưới cách sàn ≤ 2,5 m) thành các đoạn **≤ 60 m**.\n- Không bố trí thang xoắn ốc, thang cong (trừ 3.4.4); không đổi chiều cao bậc, mặt bậc trong một vế; không đặt **gương** gây nhầm đường thoát nạn (3.3.7).\n\n## 3.8 Cầu thang bộ và buồng thang bộ (2.4, 3.4)\n\n**Loại cầu thang:** loại 1 – trong nhà, trong buồng thang; loại 2 – trong nhà, để hở; loại 3 – ngoài nhà, để hở. Thang chữa cháy: **P1** – thang đứng; **P2** – thang bậc dốc ≤ 6:1 (≤ 80°).\n\n**Loại buồng thang:**\n\n| Loại | Đặc điểm |\n| --- | --- |\n| **L1** | Chiếu sáng tự nhiên qua lỗ cửa trên **tường ngoài ở mỗi tầng** |\n| **L2** | Chiếu sáng tự nhiên qua lỗ trên **mái** |\n| **N1** | Lối vào từ mỗi tầng qua **vùng đệm không khí ngoài trời** (đường đi chuyển tiếp hở). Được thay bằng lối vào qua **khoang đệm**, cả khoang đệm và buồng thang có **áp suất dương** khi cháy, cấp khí độc lập, cấp điện hai nguồn |\n| **N2** | **Áp suất dương** trong buồng thang khi cháy |\n| **N3** | Lối vào từ mỗi tầng qua **khoang đệm ngăn cháy** có áp suất dương (thường xuyên hoặc khi cháy) |\n\n**Chọn loại buồng thang:**\n\n| Trường hợp | Yêu cầu | Điều |\n| --- | --- | --- |\n| Mọi nhóm nhà cao ≤ 28 m | Được dùng **L1** và **thang loại 3** | 3.4.11 |\n| Nhà cao 28 – 50 m | Được dùng **thang loại 3** nếu phần trên 28 m có bảo vệ chống rơi ngã toàn chiều cao | 3.4.11 |\n| L2 | Nhà bậc I–III, S0–S1, nhóm F1–F4, cao **≤ 9 m** (≤ 12 m nếu lỗ lấy sáng tự mở khi cháy, trừ cơ sở y tế nội trú). Tối đa 50 % số buồng thang (trừ F1.3, F1.4). F1.3 đơn nguyên: căn hộ cao > 4 m có lối ra khẩn cấp | 3.4.12 |\n| Nhà cao **> 28 m** (trừ F5 hạng C, E không có người thường xuyên); F5 hạng A, B | **Buồng thang không nhiễm khói, trong đó phải có N1** | 3.4.13 |\n| Từ **2 tầng hầm** trở lên | **N3**, hoặc **N2** với lối vào qua khoang đệm bao che như khoang đệm ngăn cháy loại 1 | 3.4.13 |\n| F5 hạng A, B / C / D, E | N2 hoặc N3 áp suất dương thường xuyên / khi cháy / khi cháy hoặc L1 phân khoang mỗi 20 m | 3.4.13 |\n| F1.3 cao 28 – 50 m, ≤ 500 m²/tầng | Thay N1 bằng N2 theo điều kiện ở mục 3.3 | 3.2.6.2 |\n\n**Kích thước thang (3.4.1 – 3.4.3):**\n\n| Hạng mục | Yêu cầu |\n| --- | --- |\n| Chiều rộng bản thang | ≥ chiều rộng tính toán và ≥ chiều rộng mọi cửa thoát nạn trên nó, và không nhỏ hơn: **1,2 m** – nhà F1.1 > 15 người/tầng; **1,0 m** – F1.1 ≤ 15 người/tầng; **1,2 m** – nhà có tầng (trừ tầng 1) > 200 người; **0,7 m** – nhà cao ≤ 15 m và ≤ 15 người/tầng; **0,9 m** – còn lại |\n| Bệnh viện F1.1 cao > 28 m | Bản thang ≥ **1,35 m** (H.2.9.1) |\n| Độ dốc | ≤ **1:1 (45°)**; thang hở tới chỗ làm việc đơn lẻ ≤ 2:1 (63,5°) |\n| Mặt bậc | ≥ **25 cm** (trừ thang ngoài nhà). Thang cong đón tiếp ở phần hẹp ≥ 22 cm; thang lên tầng kỹ thuật, áp mái, mái không khai thác, gian ≤ 5 người ≥ 12 cm |\n| Chiều cao bậc | **5 – 22 cm** |\n| Chiếu thang | Rộng ≥ bản thang. Chiếu thang trước thang máy cửa bản lề: ≥ bản thang + 1/2 cánh cửa, ≥ **1,6 m** |\n| Chiếu nghỉ giữa của thang thẳng | Dài ≥ **1,0 m** |\n| Khe hở giữa các vế thang / lan can | ≥ **75 mm** (không đạt thì mỗi tầng có họng khô); không yêu cầu với thang loại 3 (6.12) |\n\n**Thang cong, bậc rẻ quạt (3.4.4):** nhà F1.2, F1.3, F2–F5 được dùng thang cong khi: cao ≤ 9 m; bán kính cong ≥ 2 lần chiều rộng vế; cổ bậc 150 – 190 mm; mặt bậc phía trong ≥ 220 mm, giữa ≥ 250 mm, phía ngoài ≤ 450 mm. Nhà cao ≤ 15 m, ≤ 15 người/tầng: mỗi chiếu nghỉ hoặc góc xoay ≤ 90° được tối đa **3 bậc rẻ quạt**. Nhà F1.4 không áp dụng 3.3.7.\n\n**Thang loại 3 (3.4.2):** vật liệu không cháy (trừ bậc V); đặt sát phần tường đặc K1 trở lên, **≥ REI 30 / EI 30** (được thay bằng kính ≥ EI 30); chiếu thang cùng cao trình lối ra; lan can cao **1,2 m**; cách lỗ cửa sổ **≥ 1,0 m**.\n\n**Chiếu sáng buồng thang (3.4.8):**\n\n- Lỗ lấy sáng trên tường ngoài **≥ 1,2 m²** mỗi tầng (trừ L2 và phần thang tầng hầm).\n- L2: lỗ trên mái **≥ 4 m²** với khe giữa các vế ≥ 0,7 m, hoặc giếng lấy sáng suốt chiều cao **≥ 2 m²** mặt cắt.\n- Cho phép **≤ 50 %** buồng thang không có lỗ lấy sáng: F2, F3, F4 với N2, N3; F5 hạng C ≤ 28 m, D, E với N3.\n- Chiếu sáng nhân tạo thay thế: cấp điện liên tục khi cháy. Buồng thang thông thường: lỗ thoát khói trên tum thang **≥ 10 %** diện tích sàn buồng thang (không cần nếu nhà có ≥ 2 thang thoát nạn).\n\n**Yêu cầu khác:**\n\n- Trong buồng thang và khoang đệm **không** bố trí: ống khí, chất lỏng cháy; tủ tường (trừ tủ thông tin, họng nước); dây điện hở (trừ dòng thấp, chiếu sáng hành lang và buồng thang); lối ra thang tải; **lối ra kho, phòng kỹ thuật**; thiết bị nhô ra dưới **2,2 m**. Trong buồng thang và khoang đệm có áp suất dương chỉ được có phòng vệ sinh, phòng kỹ thuật nước (3.4.5).\n- Buồng thang có lối ra ngoài **trực tiếp** hoặc qua tiền sảnh ngăn bằng vách ngăn cháy loại 1, cửa tự đóng. Hai buồng thang trở lên ra chung tiền sảnh: các buồng (trừ một) phải có cửa ra ngoài trực tiếp; được ra chung tiền sảnh khi nhà < 28 m, tầng ≤ 300 m², ≤ 50 người/tầng, có chữa cháy tự động. **N1 phải ra ngoài trực tiếp** (3.4.7).\n- N2: cửa sổ **không mở được**; khi cần chia khoang theo chiều cao bằng vách ngăn cháy loại 1. Khoang đệm N3 **≥ 3,0 m²**, **≥ 6,0 m²** nếu đồng thời là sảnh thang máy chữa cháy (3.4.9).\n\n**Vùng đệm của buồng thang N1 (3.4.10):**\n\n- Lối đi hở ngoài trời ở góc trong của nhà: góc < 135° thì cửa vùng đệm cách đỉnh góc **≥ 4 m** (giảm được bằng phần tường nhô ra; không áp dụng khi phần nhô ≤ 1,2 m); tường giữa cửa vùng đệm và cửa sổ gần nhất **≥ 2 m**; lối đi rộng **≥ 1,2 m**, lan can **1,2 m**, tường giữa các cửa ≥ 1,2 m.\n- Theo hành lang bên thông với bên ngoài, đường phố, hoặc giếng thông gió rộng **≥ 6 m**, mặt thoáng **≥ 93 m²**.\n- Qua **sảnh ngăn khói ≥ 6 m²** (mỗi chiều ≥ 2 m), tường ngăn cháy loại 2, cửa tự đóng; thông gió bằng lỗ **≥ 15 %** diện tích sàn sảnh ra giếng ≥ 6 m / 93 m², hoặc hành lang thông gió ngang (lỗ mỗi bên ≥ 50 % bên đối diện, mọi điểm cách lỗ ≤ 13 m).\n\n**Thang loại 2 nối tầng (3.4.15, 3.4.16, 4.26, 4.27):** nhà bậc I, II, S0 được dùng thang loại 2 từ tiền sảnh lên tầng 2 (sảnh ngăn bằng vách ngăn cháy loại 1; F3.1, F3.2 không cần tiền sảnh). Nhà F1.2, F2, F3, F4 cao ≤ 28 m, bậc I, II, S0: thang loại 2 nối từ hai tầng, khu vực thang ngăn bằng vách ngăn cháy loại 1 — không yêu cầu GHCL vách khi nhà ≤ 9 m và ≤ 300 m²/tầng hoặc có chữa cháy tự động. Thang cuốn theo yêu cầu thang loại 2 (3.4.17).\n\n## 3.9 Lối ra khẩn cấp (3.2.12, 3.2.13)\n\nKhông tính vào thoát nạn. Gồm:\n\n- Ra **ban công, lô gia** có tường đặc **≥ 1,2 m** từ mép ban công tới ô cửa, hoặc **≥ 1,6 m** giữa các ô cửa kính mở ra ban công; ban công rộng **≥ 0,6 m**, thông gió tự nhiên, ngăn với phòng bằng vách từ sàn tới trần. Tường đặc được thay bằng kính **EI 30** hoặc **EI 15** tùy GHCL tường ngoài.\n- Ra cầu nối hở bên ngoài rộng **≥ 0,6 m** sang khoang cháy liền kề.\n- Ra ban công rộng ≥ 0,6 m có thang ngoài nối các tầng hoặc cửa nắp sàn **≥ 0,6 × 0,8 m** xuống tầng dưới.\n- Ra ngoài trực tiếp từ gian có sàn từ **−4,5 m đến +5,0 m** qua cửa sổ, cửa đi **≥ 0,75 × 1,5 m** hoặc cửa nắp ≥ 0,6 × 0,8 m, có thang leo.\n- Ra mái nhà bậc I–III, S0–S1 qua cửa cùng kích thước, có thang leo.\n- Tầng kỹ thuật chỉ đặt đường ống, dây: lối ra khẩn cấp **≥ 0,75 × 1,5 m** hoặc cửa nắp ≥ 0,6 × 0,8 m thay lối ra thoát nạn.\n\n## 3.10 Lối ra ngoài trực tiếp (1.4.35, bổ sung) ✱\n\nCửa hoặc lối đi qua vùng an toàn trong nhà, cùng tầng, ra khu vực thoáng ngoài nhà. Được coi là đi qua vùng an toàn khi:\n\n- Đi qua khu vực không có hoặc có ít tải trọng cháy (quầy lễ tân, bàn ghế số lượng hạn chế), ngăn với hành lang, gian phòng bằng **vách ngăn cháy loại 1**, cửa tự đóng (hoặc giải pháp 4.35b, màn ngăn cháy);\n- Đi qua lối đi hở thông khí ngoài trời (hành lang bên, ram dốc), ngăn với khu liền kề bằng bộ phận ngăn cháy không cháy **≥ EI 30** (bậc I) hoặc không cháy/Ch1 **≥ EI 15** (bậc II–IV).\n", "04-chay-lan.md": "# 4. Ngăn chặn cháy lan\n\nMục 4.32 – 4.35 và Phụ lục E của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023).\n\n## 4.1 Khoảng cách PCCC giữa các nhà — Bảng E.1\n\nKhoảng cách **thông thủy giữa các tường ngoài** hoặc kết cấu bao che; nếu kết cấu bằng vật liệu cháy nhô ra **> 1 m** thì đo từ kết cấu đó.\n\n**Từ nhà ở, nhà công cộng (nhà thứ nhất) đến nhà ở, nhà công cộng thứ hai** (m):\n\n| Nhà thứ nhất | ↔ I, II, III – S0 | ↔ II, III – S1 | ↔ IV – S0, S1 | ↔ IV, V – S2, S3 |\n| --- | --- | --- | --- | --- |\n| I, II, III – S0 | **6** | 8 | 8 | 10 |\n| II, III – S1 | 8 | 10 | 10 | 12 |\n| IV – S0, S1 | 8 | 10 | 10 | 12 |\n| IV, V – S2, S3 | 10 | 12 | 12 | 15 |\n\n**Từ nhà sản xuất, nhà kho (nhà thứ nhất) đến nhà ở, nhà công cộng** (m):\n\n| Nhà sản xuất, kho | ↔ I, II, III – S0 | ↔ II, III – S1 | ↔ IV – S0, S1 | ↔ IV, V – S2, S3 |\n| --- | --- | --- | --- | --- |\n| I, II, III – S0 | 10 | 12 | 12 | 12 |\n| II, III – S1 | 12 | 12 | 12 | 12 |\n| IV – S0, S1 | 12 | 12 | 12 | 15 |\n| IV, V – S2, S3 | 15 | 15 | 15 | 18 |\n\nGara để xe tính như nhà kho; nhà hành chính – phụ trợ trong cơ sở công nghiệp tính như nhà công cộng.\n\n**Các chú thích của Bảng E.1:**\n\n| CT | Nội dung |\n| --- | --- |\n| 2 | Tường **đặc** (không có cửa sổ) của nhà bậc I–IV, S0–S1, hoàn thiện ngoài ≥ Ch1, lớp mặt mái ≥ Ch1 và LT1: được **giảm 20 %** |\n| 3 | Nhà 2 tầng khung – tấm lắp ghép bậc V, nhà lợp vật liệu cháy: **tăng 20 %** |\n| 4 | **Không quy định** khi tường cao và rộng hơn, hoặc cả hai tường đối diện, là **tường ngăn cháy loại 1** |\n| 5, 6 | **Không quy định** giữa các nhà ở, nhà công cộng khi tổng diện tích đất xây dựng (gồm cả đất trống giữa chúng) ≤ diện tích tầng cho phép của một khoang cháy (Phụ lục H). Nhà F1.1, F4.1: không đặt kho, bếp ở khu vực tiếp giáp |\n| 7 ✱ | Nhà **bậc I, II, cấp S0**, mỗi nhà có **chữa cháy tự động toàn nhà**: **giảm 50 %** |\n\n## 4.2 Khoảng cách giữa các nhà sản xuất, kho — Bảng E.2 (m)\n\n| Nhà thứ nhất | ↔ Bậc I, II; bậc III, IV – S0 | ↔ Bậc III – S1 | ↔ Bậc III – S2, S3; bậc IV – S1–S3; bậc V |\n| --- | --- | --- | --- |\n| Bậc I, II; bậc III, IV – S0 | Hạng D, E: không quy định; hạng A, B, C: **9** | 9 | 12 |\n| Bậc III – S1 | 9 | 12 | 15 |\n| Bậc III – S2, S3; bậc IV – S1–S3; bậc V | 12 | 15 | 18 |\n\n- Nhà bậc I, II và bậc III, IV – S0 hạng A, B, C có **chữa cháy tự động toàn nhà**: giảm **9 m → 6 m** (CT3).\n- Không quy định khi: tổng diện tích sàn các nhà bậc III, IV ≤ diện tích tầng cho phép của một khoang cháy; tường đối diện của nhà cao/rộng hơn là **tường ngăn cháy loại 1**; nhà bậc III có tường đối diện là tường ngăn cháy loại 2, lỗ mở chèn bịt loại 2 (CT2).\n- Khoảng cách tới kho chất lỏng cháy, kho hở, bồn LPG, khí cháy: theo quy chuẩn chuyên ngành (4.1).\n\n## 4.3 Khoảng cách theo đường ranh giới — E.3, Bảng E.3, E.4a, E.4b ✱\n\nDùng thay E.1/E.2 khi xác định theo ranh giới khu đất (4.34). **Khoảng cách** đo vuông góc từ mặt tường ngoài (hoặc mép bộ phận cháy được gần nhất, kể cả nội thất) tới **ranh giới khu đất**, **tim đường** giao thông tiếp giáp, hoặc **đường quy ước** giữa hai nhà cùng khu đất.\n\n**Phần tường không được bảo vệ chống cháy**: cửa đi, cửa sổ không phải cửa ngăn cháy; phần tường GHCL thấp hơn yêu cầu; phần tường có bề mặt ngoài bằng vật liệu nguy hiểm cháy từ **Ch1 và LT1 trở lên**.\n\n**Bảng E.3 — GHCL tường ngoài theo khoảng cách tới đường ranh giới**\n\n| Nhóm nhà | 0 – 1,5 m | 1,5 – 3 m | 3 – 9 m | > 9 m | Lỗ mở không bảo vệ |\n| --- | --- | --- | --- | --- | --- |\n| F3.1, F3.2; karaoke, vũ trường (F2.1); F5 hạng C | E 120 | E 60 | 0 | 0 | Bảng E.4a |\n| F5 hạng A, B | E 180 | E 120 | E 60 | 0 | Bảng E.4a |\n| Các nhóm còn lại | E 60 | E 60 | 0 | 0 | Bảng E.4b |\n\n**Tỷ lệ % lỗ mở không được bảo vệ cho phép** (trích, theo tổng diện tích tường ngoài đối diện ranh giới):\n\n| Khoảng cách | E.4a: tường 9 m² | E.4a: 93 m² | E.4a: ≥ 1 860 m² | E.4b: tường 9 m² | E.4b: 93 m² | E.4b: ≥ 1 860 m² |\n| --- | --- | --- | --- | --- | --- | --- |\n| ≤ 0,9 m | 0 | 0 | 0 | 0 | 0 | 0 |\n| 1,2 m | 4 | 4 | 4 | 9 | 7 | 7 |\n| 1,5 m | 6 | 4 | 4 | 12 | 8 | 7 |\n| 2,1 m | 12 | 5 | 4 | 25 | 9 | 7 |\n| 3,0 m | 27 | 7 | 4 | 55 | 13 | 7 |\n| 4,6 m | 69 | 12 | 4 | 100 | 100 | 100 |\n| 6,1 m | 100 | 18 | 5 | 100 | 100 | 100 |\n| 9,0 m | 100 | 38 | 6 | 100 | 100 | 100 |\n| > 9,0 m | 100 | 100 | 100 | 100 | 100 | 100 |\n\nE.4b: khoảng cách > 3,0 m là 100 %. Giá trị trung gian nội suy tuyến tính; đọc đủ bảng gốc với 19 cột diện tích.\n\n- Nhà có **chữa cháy tự động**: được **nhân đôi** diện tích lỗ mở không được bảo vệ (E.3.3).\n- Ô cửa từ E 60 trở xuống được thay bằng giải pháp **kính cường lực + sprinkler** theo 4.35b.\n- Tường ngoài không có yêu cầu GHCL theo Bảng E.3 thì lỗ mở không cần tuân thủ E.4a, E.4b.\n- Luôn phải tuân thủ thêm 4.32, 4.33.\n\n## 4.4 Cháy lan theo phương ngang mặt ngoài (4.32)\n\n- **Tường ngăn cháy loại 1** phải chia cắt tường ngoài cấp **K1, K2, K3** và **vươn ra khỏi mặt tường ngoài ≥ 30 cm**.\n- Không cần chia cắt nếu tường ngoài **K0**, hoặc tường ngăn cháy loại 1 tiếp giáp **dải ngăn cháy đứng** rộng **≥ 1,2 m**, **≥ E 60**, K0.\n- **Tường ngăn cháy loại 2, vách ngăn cháy loại 1 và loại 2** giao với tường ngoài: tiếp giáp dải tường đặc đứng rộng **≥ 1 m**, GHCL theo tường ngoài (Bảng 4 hoặc Bảng A.1).\n- Nhà có **chữa cháy tự động**: không bắt buộc áp dụng 4.32.1.\n\n## 4.5 Cháy lan theo phương đứng mặt ngoài (4.33)\n\nTường ngoài có lỗ mở không phải cửa ngăn cháy phải có **đai ngăn cháy giữa các tầng**, theo một trong ba cách:\n\n| Cách | Yêu cầu |\n| --- | --- |\n| a) Tường đặc | Phần tường giữa cửa sổ tầng dưới và tầng trên: không cháy, cao **≥ 1,0 m** |\n| b) Ô văng | Không cháy, vươn ra **≥ 0,6 m**, GHCL ≥ GHCL tường ngoài |\n| c) Kính + sprinkler | Kính cường lực dày **≥ 6 mm**, đầu phun sprinkler phía trong cách nhau **≤ 2 m**, cách mặt trong tường **≤ 0,5 m** |\n\n- Thành phần đứng đạt **E**; mối nối, chèn khe đạt **E + I**; chi tiết liên kết đạt **R** (CT1).\n- Không áp dụng tại cửa ra lô gia, ban công có sàn đua ra **> 0,6 m**, và tại lối ra thoát nạn (CT2).\n- **Góc tường < 135°**: lỗ mở hai phía cách nhau theo phương ngang **< 4 m** thì phải là cửa **≥ E 30** hoặc có sprinkler như cách c) (4.33.3).\n- **Không áp dụng 4.33** cho: nhà **≤ 3 tầng** hoặc cao PCCC **< 15 m**; gara nổi dạng hở; nhà có **chữa cháy tự động** (4.33.4).\n\n## 4.6 Sảnh thông tầng (atrium) — 4.35 ✱\n\nSảnh thông tầng (1.4.52): không gian trống nối từ **2 tầng trở lên**, có mái che phía trên. Lỗ sàn chỉ để đặt thang bộ, thang cuốn, giếng thang máy, giếng kỹ thuật **không** phải sảnh thông tầng.\n\n- Nằm **trong một khoang cháy**; diện tích tầng của khoang cháy theo Phụ lục H.\n- Kết cấu bao quanh gian phòng, hành lang tiếp giáp sảnh: **≥ EI (EIW) 60**, hoặc kính cường lực **≥ 6 mm** có sprinkler phía phòng cách nhau **≤ 2 m**, cách vách **≤ 0,5 m**.\n- Lỗ mở vào sảnh (kể cả thang cuốn, hành lang bên): **rèm, màn ngăn khói ≥ E 45** hạ tự động khi cháy, hoặc màn ngăn khói cố định; chiều cao làm việc ≥ chiều dày lớp khói tính toán, mép dưới lớp khói ≥ **2,5 m** trên sàn.\n- Cho phép hút khói **tự nhiên** nếu có luận cứ tính toán.\n- Tấm lấy sáng mái sảnh: vật liệu không cháy, kính có cốt, an toàn; được dùng vật liệu ≤ Ch1 không tạo giọt nóng chảy.\n- Sprinkler được lắp dưới phần sàn, ban công nhô ra (không cần lắp lên mái sảnh), cách nhau **1,5 – 2,0 m**, cách mép lỗ thông sàn **≤ 0,5 m**.\n\n## 4.7 Bên trong nhà — các yêu cầu khác\n\n| Vị trí | Yêu cầu | Điều |\n| --- | --- | --- |\n| Tầng hầm, nửa hầm | Không bố trí gian hạng **A, B** | 4.8 |\n| Nhà F5 | Gian A, B đặt gần tường ngoài, ở các tầng trên | 4.7 |\n| Cấu kiện | Không tạo điều kiện **cháy lan ngầm** | 4.9 |\n| Sàn dốc khán phòng | GHCL và cấp K như sàn giữa các tầng | 4.11 |\n| Trần treo | Vách ngăn cháy ngăn cả không gian trên trần | 4.15 |\n| Chỗ giao bộ phận ngăn cháy với kết cấu bao che, chỗ thay đổi hình khối | Giải pháp không để cháy lan qua | 4.16 |\n| Lỗ xuyên tường, sàn | Chèn bịt không làm giảm chỉ tiêu cháy | 4.12 |\n", "05-chua-chay-cuu-nan.md": "# 5. Tiếp cận chữa cháy và cứu nạn\n\nPhần 6 (Chữa cháy và cứu nạn) của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023).\n\n## 5.1 Đường cho xe chữa cháy (6.2)\n\n| Hạng mục | Yêu cầu | Điều |\n| --- | --- | --- |\n| Chiều rộng thông thủy mặt đường | **≥ 3,5 m** | 6.2.1.1 |\n| Chiều cao thông thủy dưới kết cấu chặn phía trên | **≥ 4,5 m** | 6.2.1.3 |\n| Kết cấu chặn phía trên | Dài (dọc đường) **≤ 10 m**; hai kết cấu cách nhau **≥ 20 m**; đoạn cuối không bị chặn **≥ 20 m** | 6.2.1.3 |\n| Độ dốc đường | **≤ 1:8,3** | 6.2.4 |\n| Đường / bãi đỗ dạng cụt | Dài **> 46 m** phải có **bãi quay xe** (thiết kế theo phương tiện chữa cháy địa phương) | 6.2.5, 6.4 |\n| Đường một làn | Cứ **≤ 100 m** có đoạn mở rộng dài **≥ 8 m**, rộng **≥ 7 m** | 6.5 |\n| Tải trọng | Theo xe chữa cháy của Cảnh sát PCCC & CNCH địa phương | 6.2.9 |\n\n**Khoảng cách từ mép đường xe chữa cháy đến tường nhà** (6.2.2.3):\n\n| Chiều cao PCCC | Khoảng cách tối đa |\n| --- | --- |\n| < 12 m | **≤ 5 m** |\n| 12 – 28 m | **≤ 8 m** |\n| > 28 m | **≤ 10 m** |\n\nKhông quy định khi không yêu cầu cứu nạn từ trên cao và lực lượng chữa cháy có phương án khác. Khi cần, được tăng tới **60 m** nếu có đường cụt vào kèm bãi quay xe và trụ nước; bãi quay xe cách nhà **5 – 15 m**, các đường cụt cách nhau **≤ 100 m**.\n\n**Theo nhóm nhà (6.2.2):**\n\n| Trường hợp | Yêu cầu |\n| --- | --- |\n| F1 – F4 cao **≤ 15 m** | Không yêu cầu bãi đỗ; đường xe chữa cháy tiếp cận tới mọi điểm trên hình chiếu bằng của nhà **≤ 60 m**, hoặc có phương án chữa cháy phù hợp |\n| F1.3 cao **> 15 m** | Đường xe chữa cháy cách lối vào các khoang đệm thang máy chữa cháy hoặc buồng thang có họng chờ **DN 65** (ống khô) **≤ 18 m**; bãi đỗ tiếp cận ít nhất **toàn bộ một mặt ngoài** mỗi khối nhà, cách tường **2 – 10 m** |\n| F1.1, F1.2, F2, F3, F4 cao **> 15 m** | Mỗi vị trí **lối vào từ trên cao** có một bãi đỗ; chiều dài bãi đỗ theo **Bảng 15** |\n| F5 | Một bãi đỗ, dài theo **Bảng 16** (theo khối tích). F5 hạng A, B ≤ 300 m²; hạng C, D, E trong giới hạn bậc V: chỉ cần đường tiếp cận như F1–F4 ≤ 15 m |\n| Tầng hầm | Đường xe chữa cháy cách lối vào trên mặt đất của khoang đệm thang máy chữa cháy / buồng thang có họng DN 65 **≤ 18 m** |\n| Nhà hỗn hợp | Phần không để ở chỉ ở phía dưới: chiều cao PCCC xác định theo phần đó; có F1.3 thì tính theo 6.2.2.3 và đáp ứng 6.2.2 |\n\n## 5.2 Bãi đỗ xe chữa cháy\n\n**Bảng 14 — Kích thước bãi đỗ:**\n\n| Nhóm nhà | Chiều cao ≤ 15 m | > 15 m và ≤ 28 m | > 28 m |\n| --- | --- | --- | --- |\n| F1.3 | Không yêu cầu | Rộng **≥ 6 m**, dài **≥ 15 m** | Rộng ≥ 6 m, dài ≥ 15 m |\n| Nhóm khác | Không yêu cầu (rộng) | Rộng ≥ 6 m, dài theo Bảng 15, 16 | Rộng ≥ 6 m, dài theo Bảng 15, 16 |\n\nNhà 15 – 28 m: không yêu cầu bãi đỗ khi số người mỗi tầng (theo Bảng G.9) **≤ 50** và đường xe chữa cháy cách họng tiếp nước vào nhà **≤ 18 m**.\n\n**Bảng 15 — Chiều dài bãi đỗ cho F1.1, F1.2, F2, F3, F4** (theo diện tích sàn cho phép tiếp cận của tầng lớn nhất):\n\n| Diện tích sàn tiếp cận | Không có sprinkler | Có sprinkler |\n| --- | --- | --- |\n| ≤ 2 000 m² | 1/6 chu vi, ≥ 15 m | 1/6 chu vi, ≥ 15 m |\n| 2 000 – 4 000 m² | 1/4 chu vi | 1/6 chu vi, ≥ 15 m |\n| 4 000 – 8 000 m² | 1/2 chu vi | 1/4 chu vi |\n| 8 000 – 16 000 m² | 3/4 chu vi | 1/2 chu vi |\n| 16 000 – 32 000 m² | Bao quanh nhà | 3/4 chu vi |\n| > 32 000 m² | Bao quanh nhà | Bao quanh nhà |\n\nSàn thông tầng (kể cả hầm thông lên): cộng dồn diện tích các sàn thông nhau; lỗ thông tầng có bảo vệ chống cháy lan thì lấy sàn lớn nhất + diện tích lỗ thông.\n\n**Bảng 16 — Chiều dài bãi đỗ cho F5** (theo khối tích, không kể hầm):\n\n| Khối tích | Không có sprinkler | Có sprinkler |\n| --- | --- | --- |\n| ≤ 28 400 m³ | 1/6 chu vi, ≥ 15 m | 1/6 chu vi, ≥ 15 m |\n| 28 400 – 56 800 m³ | 1/4 chu vi | 1/6 chu vi, ≥ 15 m |\n| 56 800 – 85 200 m³ | 1/2 chu vi | 1/4 chu vi |\n| 85 200 – 113 600 m³ | 3/4 chu vi | 1/4 chu vi |\n| 113 600 – 170 400 m³ | Bao quanh nhà | 1/2 chu vi |\n| 170 400 – 227 200 m³ | Bao quanh nhà | 3/4 chu vi |\n| > 227 200 m³ | Bao quanh nhà | Bao quanh nhà |\n\n**Bố trí bãi đỗ:**\n\n- Mép bãi đỗ cách điểm giữa lối vào từ trên cao **2 – 10 m** theo phương ngang (6.2.3).\n- Mặt bãi đỗ ngang bằng; nếu nghiêng thì **≤ 1:15** (6.2.4).\n- Đường công cộng được dùng làm bãi đỗ nếu đạt khoảng cách 6.2.3 (6.2.6).\n- Khoảng không giữa bãi đỗ và lối vào từ trên cao **không có cây xanh**, vật cố định cản trở (6.2.7).\n- Đánh dấu các góc bằng **sơn phản quang** hai bên, cách nhau **≤ 5 m**. Biển báo đầu và cuối: nền trắng chữ đỏ, chữ cao **≥ 50 mm**, mép dưới cao **1,0 – 1,5 m**, cách đường **≤ 3 m**; mọi điểm cách biển gần nhất **≤ 15 m** (6.2.8).\n\n## 5.3 Lối vào từ trên cao (6.3)\n\n| Hạng mục | Yêu cầu |\n| --- | --- |\n| Hình thức | Lỗ thông tường ngoài, cửa sổ, cửa ban công, tấm kính, tấm cửa **mở được từ trong và ngoài** |\n| Kích thước | Rộng **≥ 850 mm**, cao **≥ 1 000 mm**; mép dưới cách sàn **≤ 1 100 mm**; mép trên cách sàn **≥ 1 800 mm** |\n| Vị trí | Đối diện không gian sử dụng; **không** đặt ở kho, phòng máy, buồng thang thoát nạn, sảnh không nhiễm khói, sảnh thang máy chữa cháy, điểm cụt |\n| Khoảng trống bên trong | Không để đồ vật trong phạm vi **1 m** từ lối vào |\n| Đánh dấu | Ngoài: **tam giác đều đỏ hoặc vàng** cạnh ≥ 150 mm. Trong: \"LỐI VÀO TỪ TRÊN CAO – KHÔNG ĐƯỢC GÂY CẢN TRỞ\", chữ ≥ 25 mm |\n| Số lượng | Mỗi đoạn **20 m** chiều dài bãi đỗ có ít nhất 1 lối vào; tâm hai lối vào liên tiếp cách nhau **≤ 20 m** |\n| Theo tầng | F1.1, F1.2, F2, F3, F4 cao **15 – 50 m**: có ở **mọi tầng trừ tầng 1**, đối diện bãi đỗ. F5: trên bãi đỗ tới độ cao **50 m** |\n| Ngoại lệ | **Không áp dụng cho nhà F1.3** (kể cả khu phụ trợ phục vụ riêng cư dân) |\n\n## 5.4 Lối ra mái và thang chữa cháy\n\n| Trường hợp | Yêu cầu | Điều |\n| --- | --- | --- |\n| Nhà từ 2 tầng, mái bằng hoặc dốc < 25 %, cao **≥ 10 m** tới diềm mái/tường chắn mái | Lối ra mái từ buồng thang, qua tầng áp mái, theo thang loại 3 hoặc thang chữa cháy ngoài nhà | 6.6 |\n| Số lối ra mái F1 – F4 | **≥ 1** cho mỗi **9 300 m²** mái (đủ hoặc không đủ); F5 theo A.1.3.1 | 6.6 |\n| Tầng áp mái (trừ F1.4) | Lối ra mái qua thang cố định, cửa **≥ 0,6 × 0,8 m** | 6.7 |\n| Lối ra mái từ buồng thang | Cửa ngăn cháy **loại 2**, **≥ 0,75 × 1,5 m**; bản thang thép được dốc ≤ 2:1, rộng ≥ 0,7 m. F1–F4 cao ≤ 15 m: được qua cửa nắp loại 2, 0,6 × 0,8 m, thang leo thép | 6.7 |\n| Chênh cao mái **> 1,0 m** | Thang chữa cháy (không cần khi chênh > 10 m mà mỗi phần mái > 100 m² có lối ra riêng, hoặc phần thấp ≤ 10 m) | 6.10 |\n| Thang **P1** | Lên độ cao **≤ 20 m** và chênh mái 1 – 20 m. Từ 10 m trở lên có cung bảo hiểm bán kính 0,35 m, tâm cách thang 0,45 m, các cung cách nhau 0,7 m | 6.11 |\n| Thang **P2** | Lên độ cao **> 20 m** và chênh mái > 20 m; có tay vịn, chiếu nghỉ cách nhau **≤ 8 m** | 6.11 |\n| Thang chữa cháy chung | Vật liệu không cháy, dễ thấy, cách cửa sổ **≥ 1,0 m**, rộng **0,7 m**; chiếu tới ở mái có lan can **≥ 0,6 m** | 6.11 |\n| Không bố trí thang ở mặt chính | Khi nhà rộng **≤ 150 m** và phía trước có tuyến ống cấp nước chữa cháy | 6.6 |\n\n**Lối đi trong tầng kỹ thuật (6.8):** cao thông thủy **≥ 1,8 m** (tầng áp mái ≥ 1,6 m), rộng **≥ 1,2 m**; đoạn ≤ 2 m được cao 1,2 m, rộng 0,9 m.\n\n**Lan can mái (6.14):** mái dốc ≤ 12 % cao > 10 m, hoặc dốc > 12 % cao > 7 m, nếu lực lượng chữa cháy tiếp cận qua mái: có lan can theo tiêu chuẩn. Mái phẳng, ban công, lô gia, hành lang ngoài, thang hở ngoài nhà: có lan can không phụ thuộc chiều cao.\n\n## 5.5 Thang máy chữa cháy (6.13)\n\n| Hạng mục | Yêu cầu |\n| --- | --- |\n| Khi nào phải có | Mỗi khoang cháy của nhà cao PCCC **> 28 m** (F1.3: **> 50 m**), hoặc nhà có sàn tầng hầm dưới cùng sâu **> 9 m** (tính tới cao độ lối ra thoát nạn) |\n| Số lượng | Bán kính phục vụ từ cửa thang máy tới mọi điểm của tầng **≤ 60 m**. Có từ 2 thang: lính chữa cháy di chuyển **≤ 2 tầng** để tới tầng cháy |\n| Sử dụng | Bình thường vẫn chở người; **không** dùng thang chở hàng làm thang chữa cháy |\n| Giếng thang | Riêng, không chung với thang máy khác; **≤ 3** thang chữa cháy trong một giếng; bao che **≥ REI 120** (nhà > 50 m theo Bảng A.1: REI 150 / REI 180) |\n| Sảnh thang máy chữa cháy | Khoang đệm **≥ 4 m²**; kết hợp với sảnh buồng thang không nhiễm khói **≥ 6 m²**; bao che **vách ngăn cháy loại 1**; có **họng chờ DN 65** |\n| Sức chở | **≥ 630 kg** (chung cư F1.3); **≥ 1 000 kg** (nhà sản xuất, công cộng khác) |\n| Tốc độ | **≥ H/60 (m/s)**, H là chiều cao nâng (m) — tức lên hết chiều cao trong ≤ 60 giây |\n| Cabin | Vật liệu không cháy hoặc cháy yếu |\n| Tầng lánh nạn | Mỗi tầng lánh nạn có ít nhất 1 thang chữa cháy phục vụ; cửa tại tầng lánh nạn khóa thường xuyên, tự mở khi chuyển chế độ chữa cháy |\n\nBệnh viện F1.1 và phòng khám F3.4 cao > 28 m: tối thiểu **2 thang máy chữa cháy** (hoặc 1 thang chữa cháy + 1 thang thoát nạn) chứa được **giường bệnh** (H.2.9.1, H.2.10.1).\n\n## 5.6 Khu vực lánh nạn\n\n- **Tầng lánh nạn**: dùng cho nhà cao PCCC **> 100 m** (1.4.61). Nhà **> 100 m** (> 120 m nếu có báo cháy và chữa cháy tự động) phải có khu vực lánh nạn tạm thời: tầng/gian lánh nạn hoặc vùng an toàn trên các tầng, hoặc kết hợp (A.2.20, A.3.2).\n- **Bệnh viện F1.1 cao > 28 m** (tối đa 50 m, bậc I, báo cháy + chữa cháy tự động): mỗi tầng có vùng an toàn **2,8 m²/bệnh nhân**, hoặc chia tầng thành ≥ 2 khoang cháy để lánh nạn tạm thời; cửa thoát nạn **≥ 1,2 m**, **≤ 72 người/cửa**; vật liệu hoàn thiện đường thoát nạn ≤ CV1 (H.2.9.1).\n- **Phòng khám F3.4 cao > 28 m**: vùng an toàn **2,65 m²** (xe lăn có người hỗ trợ), **0,75 m²** (tự đi có dụng cụ), **0,5 m²** (tự đi) mỗi bệnh nhân (H.2.10.1).\n\n## 5.7 Phòng trực điều khiển chống cháy, tầng hầm\n\n- Phòng trực điều khiển chống cháy: theo 6.17 (đọc nguyên văn khi thiết kế).\n- Nhà có **2 – 3 tầng hầm**: mọi tầng hầm trang bị hệ thống theo 6.18 (đọc nguyên văn).\n", "06-sua-doi-1-2023.md": "# 6. Sửa đổi 1:2023 ✱\n\n**Văn bản**: QCVN 06:2022/BXD ban hành kèm Thông tư 06/2022/TT-BXD ngày 30/11/2022, thay thế QCVN 06:2021/BXD. **Sửa đổi 1:2023** ban hành kèm Thông tư 09/2023/TT-BXD ngày 16/10/2023. Nội dung không nêu trong Sửa đổi 1 giữ nguyên theo QCVN 06:2022/BXD.\n\n**Nguồn đối chiếu của sổ tay**: bản hợp nhất \"QCVN 06:2022/BXD – Sửa đổi 01-2023\" (214 trang). Trong bản này các đoạn sửa đổi được đặt trong ngoặc kép hoặc ghi \"(Bổ sung)\", \"(bãi bỏ)\".\n\n**Chuyển tiếp (7.1)**: hồ sơ đã được góp ý hoặc thẩm duyệt PCCC trước khi quy chuẩn có hiệu lực thì tiếp tục theo hồ sơ đã duyệt; hồ sơ góp ý, thẩm duyệt từ khi có hiệu lực phải tuân thủ quy chuẩn.\n\n## Các điểm sửa đổi, bổ sung liên quan kiến trúc\n\n| Chủ đề | Điều | Nội dung chính |\n| --- | --- | --- |\n| Phạm vi – nhà ở riêng lẻ | 1.1.2 a) 2) | Áp dụng cho nhà ở riêng lẻ (kể cả kết hợp, chuyển đổi công năng) **từ 7 tầng** hoặc cao PCCC **≥ 25 m**, hoặc khối tích **≥ 5 000 m³**, hoặc **2–3 tầng hầm**. Quy mô nhỏ hơn: theo tiêu chuẩn nhà ở riêng lẻ |\n| Phạm vi – nhà nhỏ đứng độc lập | 1.1.2 | Nhà < 7 tầng, < 25 m, < 5 000 m³ (trừ F5) không tuân thủ được quy chuẩn: được áp dụng tài liệu chuẩn theo công năng |\n| Cải tạo, sửa chữa | 1.1.4 | Chỉ áp dụng cho phần được cải tạo khi thay đổi công năng, giảm số lối thoát nạn, tăng hạng nguy hiểm, tăng quy mô; không đáp ứng được thì áp dụng 1.1.10 |\n| Tài liệu viện dẫn | 1.3 | **Bãi bỏ** mục 1.3 |\n| Chiều cao PCCC | 1.4.9 | Bổ sung chú thích: mái khai thác sử dụng → tính tới mép trên tường bao mái; có ban công, lan can cửa sổ → tính tới mép trên lan can; mặt đường tiếp cận khác cao độ → nhà có thể có nhiều chiều cao PCCC |\n| Thuật ngữ mới | 1.4.33, 1.4.35, 1.4.52 | **Khối đế**; **lối ra ngoài trực tiếp** (qua vùng an toàn trong nhà); **sảnh thông tầng** |\n| Số tầng nhà | 1.4.53 | Nhà F1 – F4: **một tầng lửng** làm khu kỹ thuật, ≤ 10 % diện tích sàn dưới và ≤ 300 m², **không tính** vào số tầng |\n| Luận chứng kỹ thuật, sai số | 1.5.4, 1.5.5 | Mục tiêu khi chủ đầu tư không yêu cầu bảo vệ tài sản: người thoát nạn an toàn, nhà không sập trong thời gian bằng GHCL kết cấu chịu lực, không cháy lan sang công trình lân cận. Sai số thi công kích thước lối ra, hành lang, thang **± 5 %** |\n| Bảng 4 – chú thích | CT2, CT6, CT7, CT8 | Miễn GHCL tấm lợp, **xà gồ cao** (≥ 10 m hạng C, ≥ 6,1 m nhà khác); GHCL tường ngoài chỉ áp dụng cho đai, dải ngăn cháy; cho phép **mô phỏng cháy**; miễn GHCL bản thang trong buồng thang đạt yêu cầu |\n| Kết cấu mái | 2.5.3.3 | Giàn, dầm, xà gồ mái không tham gia ổn định tổng thể lấy theo cột \"giàn, dầm, xà gồ\" của Bảng 4 |\n| Phân nhóm công năng | Bảng 6 | Bảng 6 được sửa đổi, bổ sung. Sổ tay (mục 1.5) trình bày theo bản hợp nhất, ví dụ: karaoke, bar, thư viện → F2.1; hội nghị có ăn uống → F3.2, không ăn uống → F2.1; xoa bóp → F3.4; trung tâm dữ liệu → F5.2 |\n| Lối ra từ tầng hầm | 3.2.2 a) | Nhà F1.2, F1.3, F2, F3, F4 < 28 m: được đi qua sảnh chung với khoang đệm bao che như khoang đệm ngăn cháy loại 1 |\n| Cửa trượt, cửa xếp | 3.2.3 | **Được dùng** trên lối ra thoát nạn (trừ cửa có GHCL, cửa tự đóng, F1.3, mầm non, tiểu học); phải có biển ghi chú |\n| Một lối ra thoát nạn | 3.2.6.2 a) | Thêm điều kiện cho nhà 15 – 21 m (≤ 200 m², ≤ 20 người) và 21 – 25 m (≤ 150 m², ≤ 15 người) kèm chữa cháy tự động, lối thoát khẩn cấp có thiết bị hỗ trợ |\n| Bao che đường thoát nạn | 3.3.5 | Bậc I: **EI 30**, bậc II – IV: **EI 15**; nhà hạng D, E được dùng tường kính; karaoke, vũ trường bắt buộc bao che; không bao che thì tính khoảng cách từ điểm xa nhất |\n| Khoảng cách PCCC | Bảng E.1 CT7 | Nhà bậc I, II, S0 có chữa cháy tự động toàn nhà: **giảm 50 %** |\n| Lỗ mở không bảo vệ | E.3.3 | Nhà có chữa cháy tự động: **nhân đôi** diện tích lỗ mở theo Bảng E.4a, E.4b |\n| Bệnh viện | H.2.9.1 | Cao PCCC thường **≤ 28 m (9 tầng)**; được tới **50 m** khi bậc I, báo cháy + chữa cháy tự động, bản thang ≥ 1,35 m, cửa ≥ 1,2 m, 2 thang máy chở giường, vùng an toàn 2,8 m²/bệnh nhân |\n| Phòng khám đa khoa ngoại trú F3.4 | H.2.10.1 | Cao **≤ 28 m (9 tầng)**, từ 2 tầng: bậc ≥ II, S0. Cao hơn: điều kiện tương tự bệnh viện, vùng an toàn theo loại bệnh nhân |\n| Quy định quản lý | 7.4 | **Bãi bỏ** điểm 7.4 |\n\n## Cách trích dẫn trong hồ sơ\n\n1. Thuyết minh ghi: *\"Thiết kế tuân thủ QCVN 06:2022/BXD và Sửa đổi 1:2023 QCVN 06:2022/BXD (Thông tư 09/2023/TT-BXD)\"*.\n2. Trích số điều, số bảng theo **bản hợp nhất**, ví dụ \"Bảng H.2 – QCVN 06:2022/BXD (SĐ1:2023)\".\n3. Khi dùng một điều khoản được nới (giảm 50 % khoảng cách, nhân đôi lỗ mở, 1 lối ra, thay N1 bằng N2…), ghi rõ **điều kiện đi kèm** và chỉ ra trên bản vẽ cách công trình đáp ứng điều kiện đó.\n4. Bộ Xây dựng có văn bản hướng dẫn cách hiểu Bảng 6, Bảng 8 sau khi Sửa đổi 1 có hiệu lực. Theo dõi văn bản hợp nhất mới nhất và các công văn hướng dẫn.\n\n## Văn bản liên quan\n\n- QCVN 06:2022/BXD – Thông tư 06/2022/TT-BXD\n- Sửa đổi 1:2023 – Thông tư 09/2023/TT-BXD\n- Tiêu chuẩn được viện dẫn trước đây (mục 1.3 đã bãi bỏ, vẫn dùng tham khảo): TCVN 3890, TCVN 5738, TCVN 7336, TCVN 9311-1 đến 9311-8 (thử nghiệm chịu lửa), TCVN 9383 (cửa ngăn cháy), TCVN 12695 (tính không cháy), TCVN 13456 (chiếu sáng sự cố, chỉ dẫn thoát nạn), QCVN 17:2018/BXD (quảng cáo ngoài trời)\n", "07-checklist.md": "# 7. Checklist hồ sơ kiến trúc PCCC\n\nDùng khi tự kiểm tra trước khi nộp thẩm duyệt. Mỗi dòng phải có **bản vẽ hoặc thuyết minh chứng minh**. Số trong ngoặc là điều khoản QCVN 06:2022/BXD (SĐ1:2023).\n\n## A. Thông tin đầu vào\n\n- [ ] Công trình thuộc phạm vi áp dụng (1.1.2); nhà ở riêng lẻ: kiểm tra ngưỡng 7 tầng / 25 m / 5 000 m³ / tầng hầm\n- [ ] Nhóm F của từng phần nhà (Bảng 6) — sơ đồ phân vùng công năng; gian > 50 m² sản xuất, kho và bếp > 10 kW xếp F5 (2.5.5.2)\n- [ ] Chiều cao PCCC (1.4.9) — mặt cắt ghi cao độ mặt đường xe chữa cháy và mép dưới cửa sổ tầng trên cùng (hoặc mép trên lan can, tường mái khai thác)\n- [ ] Số tầng (1.4.53: tầng tum ≤ 30 % mái, tầng lửng kỹ thuật ≤ 10 % và ≤ 300 m² không tính), số tầng hầm\n- [ ] Hạng nguy hiểm cháy nổ (F5) — bảng tính tải trọng cháy riêng (Phụ lục C)\n\n## B. Kết cấu và giới hạn chịu lửa\n\n- [ ] Bậc chịu lửa và cấp S phù hợp Phụ lục H (chiều cao, diện tích khoang cháy)\n- [ ] Bảng GHCL từng cấu kiện ≥ Bảng 4 (nhà > 50 m: Bảng A.1)\n- [ ] Sàn, trần tầng hầm ≥ REI 90 (bậc I – III); F1.3, nhà hỗn hợp 2–3 tầng hầm: kết cấu chịu lực hầm ≥ R 120\n- [ ] Hồ sơ chỉ rõ các bộ phận chịu lực tham gia ổn định tổng thể (2.5.3.3)\n- [ ] Chứng nhận/kết quả thử nghiệm GHCL: sơn, bọc chống cháy kết cấu thép, vách nhẹ, cửa ngăn cháy, vách kính (EI/EIW)\n- [ ] Thép không bọc chỉ khi yêu cầu R 15 và R ≥ 8 hoặc Am/V ≤ 250 m⁻¹\n- [ ] Cấp K của cấu kiện phù hợp cấp S (Bảng 5)\n\n## C. Ngăn cháy\n\n- [ ] Mặt bằng khoang cháy, ghi diện tích 1 tầng/khoang ≤ Phụ lục H (tăng ≤ 2 lần nếu bậc I, II, S0, có sprinkler toàn nhà)\n- [ ] Ký hiệu đúng loại: tường/vách/sàn ngăn cháy, cửa EI/EIW, khoang đệm loại 1/2 — khớp Bảng 1, 2, 3\n- [ ] Tổng lỗ mở trong bộ phận ngăn cháy ≤ 25 % (4.19)\n- [ ] Ngăn cách công năng khác nhóm F (EI 45 / EI 15) (4.5); F1.3: vách giữa căn hộ EI 30 – K0, phần công cộng – phần ở: vách loại 1 + sàn loại 3 (bậc I: sàn loại 2)\n- [ ] Giếng thang máy, hộp kỹ thuật: vách loại 1 + sàn loại 3; cửa giếng E 30 khi có yêu cầu (4.23)\n- [ ] Tầng hầm: khoang đệm ngăn cháy loại 1 áp suất dương trước thang máy (4.28)\n- [ ] Buồng rác, ống rác đạt 4.24\n- [ ] Chi tiết chèn bịt lỗ xuyên kỹ thuật, khe mặt dựng – sàn\n\n## D. Thoát nạn\n\n- [ ] Số lối ra từ mỗi gian phòng (3.2.5) và mỗi tầng (3.2.6); nếu 1 lối ra: chứng minh đủ điều kiện 3.2.6.2\n- [ ] Hai lối ra phân tán ≥ 1/2 đường chéo (1/3 nếu có sprinkler) — vẽ đường đo (3.2.8)\n- [ ] Khoảng cách thoát nạn ≤ Phụ lục G — vẽ đường đo theo tâm đường thoát nạn\n- [ ] Chiều rộng lối ra (0,8 / 1,2 m), hành lang (1,0 / 1,2 m), bản thang (0,7 / 0,9 / 1,0 / 1,2 m) và chiều rộng tính toán theo số người (G.2, G.9)\n- [ ] Cao thông thủy lối ra ≥ 1,9 m, đường thoát nạn ≥ 2,0 m\n- [ ] Không có cửa cuốn, cửa quay trên lối ra thoát nạn; cửa trượt chỉ khi được phép (3.2.3)\n- [ ] Loại buồng thang phù hợp chiều cao (> 28 m: có N1; ≥ 2 tầng hầm: N3 hoặc N2 + khoang đệm)\n- [ ] Lỗ lấy sáng buồng thang ≥ 1,2 m²/tầng; L2: ≥ 4 m² trên mái\n- [ ] Vùng đệm N1 đạt 3.4.10 (≥ 4 m tới đỉnh góc, tường ≥ 2 m, lối đi ≥ 1,2 m)\n- [ ] Khoang đệm N3 ≥ 3 m² (≥ 6 m² nếu là sảnh thang máy chữa cháy)\n- [ ] Buồng thang ra ngoài trực tiếp hoặc qua tiền sảnh vách ngăn cháy loại 1; N1 ra ngoài trực tiếp\n- [ ] Tầng hầm: lối ra riêng hoặc tách bằng vách đặc ngăn cháy loại 1; mỗi sàn hầm có sảnh ngăn khói vào buồng thang\n- [ ] Chiều mở cửa, cửa tự đóng, khóa điện tự mở, biển \"CỬA CÓ THỂ ĐI VÀO TRONG NHÀ\" (3.2.10, 3.2.11)\n- [ ] Bao che hành lang EI 30 / EI 15; hành lang > 60 m được chia đoạn\n- [ ] Vật liệu hoàn thiện đường thoát nạn theo Bảng B.8; phòng chung theo Bảng B.9\n- [ ] Lối ra khẩn cấp (ban công tường đặc 1,2 m / 1,6 m) khi được yêu cầu\n\n## E. Cháy lan\n\n- [ ] Khoảng cách tới nhà lân cận (Bảng E.1, E.2) hoặc tới ranh giới (E.3); tỷ lệ lỗ mở theo Bảng E.4a, E.4b (nhân đôi nếu có sprinkler)\n- [ ] Tường ngăn cháy loại 1 vươn ra ≥ 30 cm khi tường ngoài K1 – K3, hoặc dải đứng 1,2 m – E 60 (4.32)\n- [ ] Đai ngăn cháy giữa các tầng: tường đặc ≥ 1,0 m / ô văng ≥ 0,6 m / kính 6 mm + sprinkler (4.33)\n- [ ] Góc tường < 135°: lỗ mở cách < 4 m dùng cửa E 30 hoặc sprinkler\n- [ ] Sảnh thông tầng: bao che EI 60, màn ngăn khói E 45, sprinkler (4.35)\n\n## F. Tiếp cận chữa cháy\n\n- [ ] Tổng mặt bằng đường xe chữa cháy: rộng ≥ 3,5 m, cao thông thủy ≥ 4,5 m, dốc ≤ 1:8,3, đường cụt > 46 m có bãi quay xe\n- [ ] Khoảng cách mép đường – tường nhà: ≤ 5 / 8 / 10 m theo chiều cao\n- [ ] Bãi đỗ xe chữa cháy: rộng ≥ 6 m, chiều dài theo Bảng 14 – 16, cách lối vào từ trên cao 2 – 10 m, dốc ≤ 1:15, đánh dấu và biển báo\n- [ ] F1.3 > 15 m: đường xe cách khoang đệm thang máy chữa cháy / buồng thang có họng DN 65 ≤ 18 m\n- [ ] Lối vào từ trên cao: ≥ 850 × 1 000 mm, mép dưới ≤ 1 100 mm, mỗi 20 m bãi đỗ, đánh dấu tam giác (không áp dụng F1.3)\n- [ ] Lối ra mái (nhà ≥ 10 m), ≥ 1 lối / 9 300 m² mái; thang P1 (≤ 20 m), P2 (> 20 m); thang tại chênh mái > 1 m\n- [ ] Khe hở giữa các vế thang ≥ 75 mm (hoặc họng khô mỗi tầng)\n- [ ] Thang máy chữa cháy (> 28 m; F1.3 > 50 m; hầm sâu > 9 m): bán kính ≤ 60 m, sảnh ≥ 4 m² / 6 m², giếng REI 120, 630 / 1 000 kg, tốc độ ≥ H/60\n- [ ] Nhà > 100 m (> 120 m có sprinkler + báo cháy): tầng lánh nạn / vùng an toàn\n", "08-thuat-ngu.md": "# 8. Thuật ngữ và cách đo\n\nTóm tắt mục 1.4 QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023).\n\n| Thuật ngữ | Định nghĩa tóm tắt | Điều |\n| --- | --- | --- |\n| **Chiều cao PCCC** | Khoảng cách **lớn nhất** từ mặt đường cho xe chữa cháy tiếp cận tới **mép dưới lỗ cửa (cửa sổ) trên tường ngoài của tầng trên cùng**, không tính tầng kỹ thuật trên cùng. Không có cửa sổ: lấy **1/2 tổng** khoảng cách tới mặt sàn và tới trần tầng trên cùng | 1.4.9 |\n| ↳ Mái khai thác sử dụng ✱ | Tính tới **mép trên tường bao của mái**. Mái không có người thường xuyên thì không coi là khai thác | 1.4.9 CT1, CT2 |\n| ↳ Ban công, lan can ✱ | Tính tới **mép trên lan can** | 1.4.9 CT3 |\n| ↳ Mặt đường khác cao độ ✱ | Nhà có thể có nhiều chiều cao PCCC tùy phương án | 1.4.9 CT4 |\n| **Số tầng nhà** | Gồm mọi tầng trên mặt đất (kể cả tầng kỹ thuật, tầng tum) và tầng nửa hầm; **không** gồm tầng áp mái. Tầng tum chỉ bao che thang, thiết bị và ≤ 30 % diện tích sàn mái: không tính. ✱ F1 – F4: một tầng lửng kỹ thuật ≤ 10 % sàn dưới và ≤ 300 m² không tính | 1.4.53 |\n| **Tầng hầm** | Quá **nửa** chiều cao nằm dưới cao độ mặt đất theo quy hoạch. Nhà có cao độ đất khác nhau: không coi là hầm nếu đường thoát nạn từ tầng đó không đi từ dưới lên | 1.4.60 |\n| **Tầng nửa (bán) hầm** | Một nửa chiều cao nằm trên hoặc ngang cao độ mặt đất | 1.4.62 |\n| **Tầng trên mặt đất** | Cao độ sàn ≥ cao độ mặt đất theo quy hoạch | 1.4.64 |\n| **Tầng áp mái** | Trong không gian mái dốc, tường bao (nếu có) cao không quá **1,5 m** trên sàn | 1.4.58 |\n| **Tầng kỹ thuật** | Tầng hoặc phần tầng đặt gian, thiết bị kỹ thuật; có thể là hầm, áp mái, trên cùng hoặc giữa nhà | 1.4.63 |\n| **Tầng lánh nạn** | Tầng sơ tán tạm thời trong nhà cao PCCC **> 100 m**, có một hoặc nhiều gian lánh nạn | 1.4.61 |\n| **Khối đế** ✱ | Phần dưới của nhà, thường vươn ra so với khối tháp, dùng cho thương mại, dịch vụ | 1.4.33 |\n| **Sảnh thông tầng** ✱ | Không gian trống nối thông **từ 2 tầng**, có mái che phía trên; lỗ sàn chỉ để đặt thang bộ, thang cuốn, giếng thang máy, giếng kỹ thuật thì không phải | 1.4.52 |\n| **Khoang cháy** | Phần nhà ngăn bởi tường ngăn cháy, sàn ngăn cháy hoặc mái ngăn cháy, bảo đảm cháy không lan ra ngoài trong suốt thời gian cháy | 1.4.29 |\n| **Khoang đệm** | Không gian chuyển tiếp giữa **hai cửa đi**, ngăn khói và khí xâm nhập | 1.4.30 |\n| **Khoang đệm ngăn cháy** | Khoang đệm bảo vệ lỗ mở trên bộ phận ngăn cháy, bao bởi sàn và vách ngăn cháy, có 2 lỗ mở kế tiếp (hoặc nhiều hơn khi được cấp không khí cưỡng bức) | 1.4.31 |\n| **Lối ra thoát nạn** | Lối hoặc cửa dẫn vào đường thoát nạn, ra ngoài trực tiếp, hoặc vào vùng an toàn, tầng/gian lánh nạn | 1.4.34 |\n| **Lối ra ngoài trực tiếp** ✱ | Cửa hoặc lối đi qua vùng an toàn trong nhà (cùng tầng) ra khu vực thoáng ngoài nhà | 1.4.35 |\n| **Lối ra thoát nạn độc lập** | Dẫn vào đường thoát nạn, **không qua** phần nhà có công năng khác | 1.4.36 |\n| **Lối ra thoát nạn riêng** | Từ phần nhà dẫn vào đường thoát nạn độc lập, ra ngoài trực tiếp hoặc vào vùng an toàn | 1.4.37 |\n| **Vùng an toàn** | Vùng mà con người được bảo vệ khỏi các yếu tố nguy hiểm của đám cháy, hoặc các yếu tố đó không vượt giá trị cho phép | 1.4.73 |\n| **Giới hạn chịu lửa** | Thời gian (phút) tới khi xuất hiện trạng thái giới hạn R, E, I hoặc W | 1.4.18, 2.2.2 |\n| **Tải trọng cháy** | Tổng năng lượng nhiệt giải phóng khi cháy hết vật liệu cháy trong không gian | 1.4.57 |\n\n## Cách đo nhanh\n\n| Đại lượng | Cách đo | Điều |\n| --- | --- | --- |\n| Khoảng cách thoát nạn | **Dọc theo tâm** đường thoát nạn, từ tâm cửa gian phòng (hoặc chỗ xa nhất trong phòng nếu không có ngăn cháy giữa phòng và hành lang) tới tâm lối ra gần nhất: cửa ra ngoài, cửa buồng thang, cửa ra thang loại 3, **mép bậc đầu** thang loại 2, cửa sang khoang cháy lân cận | 3.3.2 |\n| Đường đi theo thang loại 2 | Bằng **3 lần chiều cao** thang | 3.3.2 |\n| Khoảng cách giữa hai lối ra | Đường thẳng giữa **hai cạnh xa nhất** của hai lối ra (≥ 7 m); nếu < 7 m thì đo giữa hai cạnh gần nhất. Hai buồng thang nối bằng hành lang: đo dọc hành lang | 3.2.8 |\n| Chiều rộng cửa hai cánh | Chỉ tính bên **cánh mở** | 3.2.9 |\n| Chiều rộng hành lang có cửa mở nhô ra | Trừ 1/2 phần nhô (cửa một bên) hoặc cả phần nhô (cửa hai bên) | 3.3.5 |\n| Khoảng cách PCCC giữa nhà | Thông thủy giữa các tường ngoài; kết cấu cháy được nhô **> 1 m** thì đo từ kết cấu đó | Bảng E.1 CT1 |\n| Khoảng cách tới ranh giới | Vuông góc từ mặt tường ngoài tới ranh giới khu đất, tim đường, hoặc đường quy ước | E.3.2 |\n| Chiều rộng nhà (đường xe chữa cháy) | Khoảng cách giữa các **trục định vị** | 6.2.2, CT1 |\n| Số người tính toán | Theo thiết kế; nếu không có: diện tích sàn
