# Dự phòng: nếu Xcode báo lỗi khi mở SoTayPCCC.xcodeproj, tạo lại dự án bằng XcodeGen:
#   brew install xcodegen && cd ios && xcodegen generate
name: SoTayPCCC
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: vi
targets:
  SoTayPCCC:
    type: application
    platform: iOS
    sources:
      - path: SoTayPCCC
        excludes:
          - Web
      - path: SoTayPCCC/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.sotay.pccc.qcvn06
        MARKETING_VERSION: "1.25"
        CURRENT_PROJECT_VERSION: "25"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sổ tay PCCC"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
