const MAP = { a:"aàáảãạăằắẳẵặâầấẩẫậ", e:"eèéẻẽẹêềếểễệ", i:"iìíỉĩị", o:"oòóỏõọôồốổỗộơờớởỡợ", u:"uùúủũụưừứửữự", y:"yỳýỷỹỵ", d:"dđ" };

/* ---------- Tìm kiếm: tách thông số quy mô, sửa lỗi gõ, khớp theo từ, xếp hạng ---------- */

function lev(a, b, cap) {

  else if (t.g1 === "all") g1 = { req: true, why: "nhà ga hành khách hàng không, đường sắt, đường sắt đô thị: không phụ thuộc quy mô", ref: "Bảng G.1 mục 6" };
  if (g1) push(S4, g1.req ? "req" : "no", "**Loa thông báo và hướng dẫn thoát nạn** — " + g1.why + (g1.req ? "; ≥ 75 dBA ở 3 m, vượt ồn ≥ 15 dBA, ≤ 120 dBA" : ""), g1.ref + (g1.req ? "; H.4" : ""));
  if (t.e1) push(S4, "req", "**Dụng cụ phá dỡ thô sơ**: 01 bộ — rìu ≥ 2 kg, xà beng ≥ 100 cm, búa ≥ 5 kg, kìm cộng lực tải cắt ≥ 60 kg; đặt nơi có người trực PCCC", "Bảng E.1; 2.7.1");
  if (t.f1 === "ks") push(S4, v.n >= 3 ? "req" : "no", v.n >= 3 ? "**Mặt nạ lọc độc** tại tất cả các tầng: **01 chiếc/01 người** (khách lưu trú và nhân viên thường xuyên)" : "**Mặt nạ lọc độc** — < 3 tầng: không bắt buộc", "Bảng F.1 mục 1");
  if (t.f1 === "kara") push(S4, "req", `**Mặt nạ lọc độc** tại tất cả các tầng; mỗi tầng = số người trong **phòng lớn nhất** của tầng${v.room ? ` → **${v.room} chiếc/tầng**` : ""}`, "Bảng F.1 mục 2");

  return out;
}

/* Quy tắc 70 % (1.5.8): tổng diện tích sàn không gồm kỹ thuật, PCCC, lánh nạn, đỗ xe */
function mixRule(mix) {
  const rows = (Array.isArray(mix) ? mix : []).filter(r => Array.isArray(r) && TI[r[0]] && +r[1] > 0);
  const tot = rows.reduce((x, r) => x + +r[1], 0);
  if (!tot) return null;
  const top = rows.reduce((m, r) => (+r[1] > +m[1] ? r : m), rows[0]);
  const share = +top[1] / tot;
  return { tot, top: TI[top[0]], share, mixed: share <= 0.7, rows: rows.map(r => [TI[r[0]], +r[1], +r[1] / tot]) };
}

// Loại nhà QCVN 10 → dòng tương ứng trong danh mục QCVN 06 (theo tên)
const MAP06 = { "nha-o-kd": "Nhà ở riêng lẻ", "nha-o-sx": "Nhà ở riêng lẻ", "chung-cu": "Nhà chung cư", "ktx": "Ký túc xá, nhà ở tập thể", "mam-non": "Nhà trẻ",

  "hon-hop": "Nhà chung cư", "ga-hk": "Nhà ga", "ga-ds": "Nhà ga", "ga-hh": "Nhà kho", "ga-cap-treo": "Nhà ga", "ben-xe": "Nhà ga", "dv-cang": "Nhà ga",
  "kslk": "Văn phòng", "dang-kiem": "Gara có sửa chữa", "de-xe": "Gara để xe không sửa chữa", "gara-ck": "Gara để xe không sửa chữa",

function q06Eval(t, v) {
  let key = MAP06[t.id], via = "";
  if (t.id === "hon-hop") { const m = mixRule(v.mix || ctV.mix); if (m && MAP06[m.top.id]) { key = MAP06[m.top.id]; via = m.top.n; } }
  if (!key) return null;

  const sp = ctEvaluate(t, v).flatMap(s => s.items).some(x => /^\*\*Hệ thống chữa cháy tự động/.test(x.txt) && x.lv === "req");
  const n06 = Math.max(1, v.n - (v.banHam ? 1 : 0));   // QCVN 06 dùng số tầng nổi; số tầng QCVN 10 (1.4.24) tính cả bán hầm
  const r = Q06.ctEvaluate({ i, h: v.h, n: n06, nb: v.nb, a: dt1, p: v.ppl || "", v: v.vol || "", sp, deep: !!v.deep, hh: t.id === "hon-hop", hang: hangMain(v.hang || "C"), c1: t.a1 === "sx" && v.hang === "C1" });

    const fixed = r.out.flatMap(s => s.items).filter(x => x.lv === "bad").filter(x => !r2.out.flatMap(s => s.items).some(y => y.lv === "bad" && y.ref === x.ref));

  }

function wordMatch(hay, terms) { const h = " " + norm(hay).replace(/[^a-z0-9.]+/g, " ") + " "; return terms.every(x => h.includes(" " + x)); }
function phraseScore(hay, terms) { return norm(hay).includes(terms.join(" ")) ? 1 : 0; }
/* Điểm khớp loại nhà: cụm nguyên văn trong tên > trong từ khóa; từ đúng > đầu từ. 0 = không khớp */
function typeScore(t, terms) {
  if (!terms.length) return 0;
  const name = " " + norm(t.n).replace(/[^a-z0-9.]+/g, " ") + " ", kw = " " + norm(t.k + " " + t.g).replace(/[^a-z0-9.]+/g, " ") + " ";
  let sc = 0;
  for (const x of terms) {
    if (name.includes(" " + x + " ")) sc += 3; else if (kw.includes(" " + x + " ")) sc += 2;
    else if (name.includes(" " + x) || kw.includes(" " + x)) sc += 1; else return 0;
  }
  const ph = " " + terms.join(" ") + " ";
  if (name.includes(ph)) sc += 6; else if (kw.includes(ph)) sc += 5;
  return sc;
}

  if (el.dataset && el.dataset.w) { const n = parseNum(el.value); wV[el.dataset.w] = n === "" ? 0 : Math.max(0, n); store.set("q10-w", wV); const pos = el.selectionStart; renderWater(); const ne = document.getElementById(el.id); if (ne) { ne.focus(); try { ne.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (el.id === "gp-q") { gpV.q = el.value; const o = gpList(); if (o.length && !o.some(([, i]) => i === gpV.k)) gpV.k = o[0][1]; store.set("q10-gp", gpV); document.getElementById("gp-k").innerHTML = o.map(([r, i]) => `<option value="${i}"${i === gpV.k ? " selected" : ""}>${esc(r[0])} · ${esc(r[2])}</option>`).join(""); document.getElementById("gp-x").nextElementSibling.textContent = GP[gpV.k][5] || "m²"; document.getElementById("gpres").innerHTML = gpResult(); return; }
  if (el.dataset && el.dataset.mk !== undefined && el.tagName === "INPUT" && el.type !== "checkbox") { const x = mkV.parts[+el.dataset.mk]; if (!x) return; if (el.dataset.f === "ten") x.ten = el.value; else { const n = parseNum(el.value); x[el.dataset.f] = n === "" ? 0 : Math.max(0, n); } store.set("q10-mk", mkV); document.getElementById("mkres").innerHTML = mkResult(); return; }
  if (el.id === "mk-pop") { const n = parseNum(el.value); mkV.pop = n === "" ? 0 : Math.max(0, n); store.set("q10-mk", mkV); document.getElementById("mkres").innerHTML = mkResult(); return; }
  if (el.id === "csx-x") { const n = parseNum(el.value); csxV.x = n === "" ? 0 : Math.max(0, n); store.set("q10-csx", csxV); document.getElementById("csxres").innerHTML = itemsHTML([{ t: CS[csxV.i].n, items: csxEval(csxV) }]); return; }
  if (el.id === "gp-x") { const n = parseNum(el.value); gpV.x = n === "" ? 0 : Math.max(0, n); store.set("q10-gp", gpV); document.getElementById("gpres").innerHTML = gpResult(); return; }
  if (el.id === "cs-floors") { csV.floors = el.value; store.set("q10-cs", csV); const r = csCalc(csV); document.getElementById("cs-out").innerHTML = r.fl.map((a, i) => `<dt>Tầng ${i + 1}: ${fmtN(a)} m²</dt><dd>${r.per[i]} bình</dd>`).join("") + `<dt><b>Tổng</b></dt><dd>${r.tot} bình</dd>`; return; }
});
