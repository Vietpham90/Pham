<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ tay PCCC">
<meta name="format-detection" content="telephone=no">
<title>Sổ tay PCCC QCVN 06</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#b42318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột kiểu ứng dụng điện thoại — thanh đầu dính có ô tìm, nội dung là các khối gập mở, thanh điều hướng dưới đáy. */
:root {
  --bg: #fbf8f3; --panel: #ffffff; --tint: #f1ebe1; --line: #ddd3c5;
  --ink: #1f1a17; --muted: #5e554d;
  --fire: #b42318; --fire-bg: #fde4e1; --on-fire: #ffffff;
  --exit: #067647; --exit-bg: #dcf5e7;
  --amber: #f2a516; --amber-ink: #7a5000; --amber-bg: #fff1d1;
  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fire); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fire); color: var(--on-fire); padding-block: 10px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 32px; }
.brand h1 { font-size: 17px; line-height: 1.2; font-weight: 800; margin: 0; flex: 1; min-width: 0; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
.back { border: 0; background: transparent; color: inherit; width: 36px; height: 36px; margin-left: -8px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.back svg { width: 22px; height: 22px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border-radius: 10px; border: 0; padding: 0 40px 0 40px; font: inherit; font-size: 16px; background: var(--panel); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search .ico { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 20px; line-height: 1; }

main { padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* Bottom nav */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .row { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 760px; margin: 0 auto; height: var(--nav-h); }
nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--fire); }

/* Home */
.intro { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.label:first-child { margin-top: 0; }
.toc { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toc li + li { border-top: 1px solid var(--line); }
.toc button { width: 100%; text-align: left; border: 0; background: transparent; display: grid; grid-template-columns: 36px 1fr 16px; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; min-height: 60px; }
.toc .num { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; background: var(--tint); color: var(--ink); }
.toc .num.f { background: var(--fire-bg); color: var(--fire); }
.toc .num.x { background: var(--exit-bg); color: var(--exit); }
.toc .num.a { background: var(--amber-bg); color: var(--amber-ink); }
.toc b { display: block; font-size: 15px; line-height: 1.3; }
.toc span.d { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.toc .chev { color: var(--muted); }

/* Quick lookup */
.quick { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.quick h2 { font-size: 15px; margin: 0 0 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { min-width: 44px; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; font-family: var(--mono); }
.seg button[aria-pressed="true"] { background: var(--fire); border-color: var(--fire); color: var(--on-fire); }
.kv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv dt { color: var(--muted); padding-right: 12px; }
.kv dd { font-family: var(--mono); font-weight: 500; text-align: right; color: var(--fire); }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.quick .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Article */
.doc h1.page { font-size: 24px; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.doc details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; }
.doc summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 14px; position: relative; font-weight: 700; font-size: 16px; line-height: 1.35; }
.doc summary::-webkit-details-marker { display: none; }
.doc summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
.doc details[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
.doc .body { padding: 0 14px 14px; min-width: 0; }
.doc .lead { margin-bottom: 12px; }
.doc h3 { font-size: 15px; margin: 18px 0 6px; }
.doc p { margin: 0 0 10px; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 20px; }
.doc li { margin: 4px 0; }
.doc blockquote { margin: 0 0 12px; padding: 10px 12px; background: var(--tint); border-radius: 8px; font-size: 14px; }
.doc blockquote p:last-child { margin: 0; }
.doc code { font-family: var(--mono); font-size: 12.5px; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.doc a { color: var(--fire); font-weight: 600; text-underline-offset: 2px; }
.tbl { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
.tbl table { border-collapse: collapse; font-size: 13.5px; line-height: 1.4; min-width: 100%; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--tint); font-size: 12.5px; font-weight: 700; white-space: normal; min-width: 88px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child, .tbl th:first-child { position: sticky; left: 0; background: var(--panel); box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--tint); }
.tbl td { font-variant-numeric: tabular-nums; min-width: 80px; }
.tbl.wide td { min-width: 96px; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
.flag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--amber-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
.amend { display: inline-block; font-size: 11px; font-weight: 700; color: var(--fire); background: var(--fire-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
mark { background: var(--amber-bg); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--amber); }

/* Checklist */
.check { list-style: none; padding: 0 !important; }
.check li { margin: 0; border-top: 1px solid var(--line); }
.check li:first-child { border-top: 0; }
.check label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 10px 0; cursor: pointer; align-items: start; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--exit); }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--exit); width: 0; transition: width .2s; }
.reset { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; }

/* Save star */
.star { position: absolute; right: 40px; top: 8px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.star svg { width: 20px; height: 20px; }
.star[aria-pressed="true"] { color: var(--amber); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.doc summary { padding-right: 84px; }

/* Search results */
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.results button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.results .sec { font-size: 12px; color: var(--muted); font-weight: 600; }
.results .ttl { font-weight: 700; display: block; margin: 2px 0 4px; }
.results .snip { font-size: 13.5px; color: var(--ink); display: block; line-height: 1.45; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

.disclaimer { font-size: 12.5px; color: var(--amber-ink); background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin: 16px 0 0; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pager button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; font-size: 13px; min-height: 56px; }
.pager button.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); font-size: 11.5px; }


/* Tra theo công trình */
.ct-cta { width: 100%; text-align: left; border: 0; border-radius: 12px; padding: 14px 16px; margin: 0 0 8px; background: var(--fire); color: var(--on-fire); cursor: pointer; display: grid; gap: 4px; }
.ct-cta b { font-size: 16px; } .ct-cta span { font-size: 13px; opacity: .9; line-height: 1.4; }
.ct-form { display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.fld input, .fld select { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); font-weight: 500; }
.fld .inp { position: relative; display: block; } .fld .inp input { padding-right: 48px; }
.fld .inp i { position: absolute; right: 10px; top: 11px; font-style: normal; color: var(--muted); font-weight: 500; font-size: 13px; }
.fld .sel { font-size: 16px; color: var(--ink); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.fld .sel b, .pick b { font-family: var(--mono); color: var(--fire); font-weight: 500; font-size: 13px; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picks { display: grid; gap: 6px; } .picks:empty { display: none; }
.pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.checks { display: grid; gap: 8px; font-size: 14px; } .checks label { display: flex; gap: 10px; align-items: center; }
.checks input { width: 20px; height: 20px; accent-color: var(--fire); flex: none; }
.ct-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.ct-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
.ct-sec h2 { font-size: 15px; margin: 0 0 6px; }
.ct-sec ul { list-style: none; margin: 0; padding: 0; }
.ct-sec li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; display: grid; gap: 4px; }
.ct-sec li:first-child { border-top: 0; }
.ct-sec code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.lv { justify-self: start; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; line-height: 18px; }
.lv-ok .lv { background: var(--exit-bg); color: var(--exit); }
.lv-warn .lv { background: var(--amber-bg); color: var(--amber-ink); }
.lv-bad .lv { background: var(--fire-bg); color: var(--fire); }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }

/* Mở rộng */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--tint); padding: 4px; border-radius: 10px; margin: 0 0 12px; }
.tabs button { border: 0; background: transparent; height: 36px; border-radius: 7px; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: var(--muted); padding: 0 4px; font-family: var(--sans); min-width: 0; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-family: var(--mono); font-size: 11.5px; line-height: 1; padding: 5px 7px; border-radius: 6px; cursor: pointer; }
.ref:hover { color: var(--fire); border-color: var(--fire); }
.ref.dg { font-family: var(--sans); font-weight: 600; color: var(--exit); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.btn1, .btn2 { height: 40px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: var(--sans); }
.btn1 { border: 0; background: var(--fire); color: var(--on-fire); }
.btn2 { border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.link-btn { border: 0; background: transparent; color: var(--fire); font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px 0; justify-self: start; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.parts { display: grid; gap: 10px; }
.part { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.part .fld input, .part .fld select { background: var(--panel); }
.part-h { font-size: 15px; margin: 18px 0 8px; } .part-h span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; font-family: var(--mono); }
.rp { display: grid; gap: 8px; margin-top: 12px; }
.rp-row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }
.rp-row.st-ok { box-shadow: inset 0 0 0 2px var(--exit-bg); } .rp-row.st-bad { box-shadow: inset 0 0 0 2px var(--fire-bg); } .rp-row.st-na { opacity: .7; }
.rp-ctl { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 8px; }
.rp-ctl select, .rp-ctl input, .fld input[type=date], #rpname, #rpauthor { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font: inherit; font-size: 15px; background: var(--bg); color: var(--ink); width: 100%; }
.proj { display: grid; gap: 4px; } .proj > button:first-child { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.dgbox svg { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
.dg text { fill: var(--ink); font-family: var(--sans); font-size: 11px; } .dg text.s { font-size: 10px; fill: var(--muted); } .dg text.b { font-weight: 700; font-size: 12px; }
.dg .g, .dg .fl line { stroke: var(--line); stroke-width: 1.5; } .dg .w { fill: var(--tint); stroke: var(--ink); stroke-width: 1.5; } .dg path.w { fill: none; }
.dg .road { fill: var(--line); } .dg .win { fill: var(--panel); stroke: var(--muted); } .dg .tech { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 3 2; }
.dg .dim, .dg .diag { stroke: var(--fire); stroke-width: 1.5; } .dg .diag { stroke-dasharray: 5 3; stroke: var(--muted); } .dg .arr { fill: var(--fire); }
.dg .st { fill: var(--exit-bg); stroke: var(--exit); stroke-width: 1.5; } .dg .pos { stroke-dasharray: 4 2; } .dg .air { fill: var(--panel); stroke: var(--exit); stroke-dasharray: 2 2; }
.dg .lob { fill: var(--exit-bg); stroke: var(--exit); } .dg .cor { stroke: var(--muted); stroke-width: 6; opacity: .3; }
.dg .solid { fill: var(--fire-bg); stroke: var(--fire); } .dg .spk { fill: var(--fire); } .dg .exit { fill: var(--exit); } .dg .pt { fill: var(--fire); } .dg .ent rect { fill: var(--amber); }
@media (max-width: 420px) { .grid4 { grid-template-columns: 1fr 1fr; } .rp-ctl { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
html { padding-top: env(safe-area-inset-top, 0px); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { margin: 0; overscroll-behavior-y: none; }
img { max-width: 100%; }
</style>
</head>
<body>


<header class="top gutter">
  <div class="wrap">
    <div class="brand">
      <button class="back" id="backBtn" aria-label="Quay lại" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="hdr">Sổ tay PCCC<small>QCVN 06:2022/BXD · Sửa đổi 1:2023</small></h1>
    </div>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Tìm: buồng thang N1, REI 120, F1.3…" aria-label="Tìm trong sổ tay">
      <button class="clear" id="clearQ" aria-label="Xóa tìm kiếm" hidden>×</button>
    </div>
  </div>
</header>

<main class="gutter"><div class="wrap" id="view"></div></main>

<script>
const DATA = {"README.md": "# Sổ tay QCVN 06:2022\n\nTra cứu nhanh các yêu cầu **kiến trúc – kết cấu** về an toàn cháy theo **QCVN 06:2022/BXD** (Thông tư 06/2022/TT-BXD) và **Sửa đổi 1:2023** (Thông tư 09/2023/TT-BXD ngày 16/10/2023).\n\n> **Nguồn đối chiếu**: bản hợp nhất \"QCVN 06:2022/BXD – Sửa đổi 01-2023\" (214 trang). Mọi giá trị trong sổ tay kèm số điều, số bảng để tra lại nguyên văn. Sổ tay là bản **tóm tắt**, không thay thế quy chuẩn: các chú thích, ngoại lệ dài chỉ được nêu ý chính.\n\n## Cách dùng sổ tay — trình tự 7 bước\n\nMọi hồ sơ thiết kế PCCC phần kiến trúc đi theo cùng một chuỗi quyết định. Bước sau phụ thuộc kết quả bước trước:\n\n| Bước | Câu hỏi cần trả lời | Mục tra cứu |\n| --- | --- | --- |\n| 1 | Công trình có thuộc phạm vi áp dụng? Thuộc **nhóm F** nào (Bảng 6)? Có phần nào khác nhóm không? | [Phân loại](01-phan-loai.md) |\n| 2 | **Chiều cao PCCC**, số tầng, số tầng hầm? | [Thuật ngữ](08-thuat-ngu.md) |\n| 3 | Chọn **bậc chịu lửa** (I – V) và **cấp S** (S0 – S3) → GHCL từng cấu kiện (Bảng 4, 5; > 50 m: Bảng A.1) | [Phân loại](01-phan-loai.md) |\n| 4 | **Diện tích khoang cháy** cho phép (Phụ lục H)? Cần tường, sàn ngăn cháy ở đâu? | [Ngăn cháy](02-ngan-chay.md) |\n| 5 | **Thoát nạn**: số lối ra, khoảng cách (Phụ lục G), chiều rộng, loại buồng thang | [Thoát nạn](03-thoat-nan.md) |\n| 6 | **Ngăn cháy lan** mặt ngoài và giữa các nhà (4.32 – 4.35, Phụ lục E) | [Cháy lan](04-chay-lan.md) |\n| 7 | **Tiếp cận chữa cháy**: đường xe, bãi đỗ, lối vào từ trên cao, lối ra mái, thang máy chữa cháy, phòng trực điều khiển (Phần 6) | [Chữa cháy & cứu nạn](05-chua-chay-cuu-nan.md) |\n| + | Nhà cao **trên 50 m**, chung cư trên 75 m, nhà trên 100 m: yêu cầu bổ sung của Phụ lục A | [Nhà cao tầng](09-nha-cao-tang.md) |\n\nSau đó rà các điểm [Sửa đổi 1:2023](06-sua-doi-1-2023.md) và chạy [Checklist hồ sơ](07-checklist.md).\n\n## Giọng văn của sổ tay\n\n- **Một dòng – một yêu cầu – một con số – một điều khoản.** Ví dụ: *Bản thang ≥ 1,2 m khi nhà có tầng (trừ tầng 1) > 200 người (3.4.1).*\n- Dùng đúng thuật ngữ của quy chuẩn: *lối ra thoát nạn*, *đường thoát nạn*, *chiều cao PCCC*, *khoang cháy*, *buồng thang bộ không nhiễm khói N1/N2/N3*, *lối vào từ trên cao*.\n- Đơn vị viết theo TCVN: dấu phẩy thập phân (1,2 m); GHCL viết \"REI 150\".\n- Không suy diễn: điều gì quy chuẩn không quy định thì ghi \"không quy định\".\n\n## Nền tảng thị giác\n\nMàu trong sổ tay mang nghĩa, không trang trí:\n\n| Token | Nghĩa | Dùng cho |\n| --- | --- | --- |\n| `fire-600` | Ngăn cháy, chịu lửa | Tiêu đề bảng GHCL, nét tường ngăn cháy trên sơ đồ |\n| `exit-600` | Thoát nạn | Lối ra, đường thoát nạn, buồng thang (theo màu xanh của biển EXIT) |\n| `amber-500` / `amber-ink` | Lưu ý, sửa đổi | Nhãn ✱ SĐ1 và ghi chú cần đọc nguyên văn |\n| `ink`, `muted` | Văn bản | Chữ chính / chú thích |\n| `surface-100`, `surface-200`, `line` | Nền giấy | Nền trang, ô bảng xen kẽ, kẻ bảng |\n\nPhân biệt \"ngăn cháy\" (đỏ) và \"thoát nạn\" (xanh) bằng **độ sáng** chứ không chỉ sắc độ, và luôn kèm chữ — người mù màu đỏ – lục không phân biệt được hai màu này.\n\nChữ: **Be Vietnam Pro** (đầy đủ dấu tiếng Việt) cho nội dung; **JetBrains Mono** cho số hiệu điều khoản, ký hiệu GHCL và số liệu.\n\n## Ký hiệu\n\n| Ký hiệu | Nghĩa |\n| --- | --- |\n| **R** | Khả năng chịu lực |\n| **E** | Tính toàn vẹn |\n| **I** | Khả năng cách nhiệt |\n| **W** | Khả năng hạn chế bức xạ nhiệt (phần kính: EW, EIW) |\n| **REI 120** | GHCL 120 phút theo cả R, E và I |\n| **K0 … K3** | Cấp nguy hiểm cháy của cấu kiện |\n| **S0 … S3** | Cấp nguy hiểm cháy kết cấu của nhà |\n| **F1.1 … F5.3** | Nhóm nguy hiểm cháy theo công năng |\n| **A, B, C1 – C4, D, E** | Hạng nguy hiểm cháy và cháy nổ (sản xuất, kho) |\n| **CV0 … CV5** | Cấp nguy hiểm cháy của vật liệu |\n| ✱ | Nội dung được sửa đổi, bổ sung tại Sửa đổi 1:2023 |\n\n## Cấu trúc QCVN 06:2022/BXD\n\n| Phần | Nội dung |\n| --- | --- |\n| 1 | Quy định chung — phạm vi, đối tượng, giải thích từ ngữ, quy định chung |\n| 2 | Phân loại kỹ thuật về cháy — vật liệu, cấu kiện, bộ phận ngăn cháy, cầu thang và buồng thang, nhà |\n| 3 | Bảo đảm an toàn cho người — lối ra, đường thoát nạn, cầu thang, vật liệu |\n| 4 | Ngăn chặn cháy lan |\n| 5 | Cấp nước chữa cháy (ngoài phạm vi sổ tay) |\n| 6 | Chữa cháy và cứu nạn |\n| 7 | Tổ chức thực hiện |\n| PL A | Quy định bổ sung cho một số nhóm nhà cụ thể (nhà sản xuất, kho; nhà 50 – 150 m; chung cư 75 – 150 m) |\n| PL B | Phân loại vật liệu theo đặc tính cháy; vật liệu hoàn thiện (Bảng B.8, B.9) |\n| PL C | Hạng nguy hiểm cháy và cháy nổ |\n| PL D | Bảo vệ chống khói |\n| PL E | Khoảng cách phòng cháy chống cháy |\n| PL F | Giới hạn chịu lửa danh định của một số cấu kiện |\n| PL G | Khoảng cách đến lối ra thoát nạn và chiều rộng lối ra |\n| PL H | Bậc chịu lửa và yêu cầu an toàn cháy cho nhà, khoang cháy |\n| PL I | Hình minh họa (tham khảo) |\n\n## Phạm vi sổ tay\n\nChỉ gồm nội dung **kiến trúc – kết cấu**: phân loại, GHCL, ngăn cháy, thoát nạn, cháy lan, tiếp cận chữa cháy. Không gồm: cấp nước chữa cháy (Phần 5), hệ thống báo cháy, chữa cháy tự động, chi tiết bảo vệ chống khói (Phụ lục D) — chỉ nêu khi ảnh hưởng tới giải pháp kiến trúc.\n", "01-phan-loai.md": "# 1. Phân loại kỹ thuật về cháy\n\nPhần 2 của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023). Đây là đầu vào cho mọi yêu cầu còn lại.\n\n## 1.1 Vật liệu xây dựng (2.1, Phụ lục B)\n\n| Đặc tính | Phân nhóm | Điều |\n| --- | --- | --- |\n| Tính cháy | **Không cháy**; cháy được: **Ch1** cháy yếu, **Ch2** cháy vừa phải, **Ch3** cháy mạnh vừa, **Ch4** cháy mạnh | 2.1.3 |\n| Tính bắt cháy | **BC1** khó bắt cháy, **BC2** bắt cháy vừa phải, **BC3** dễ bắt cháy | 2.1.4 |\n| Lan truyền lửa trên bề mặt (chỉ cho lớp mặt mái và sàn, kể cả thảm) | **LT1** không lan truyền → **LT4** lan truyền mạnh | 2.1.5 |\n| Khả năng sinh khói | **SK1** thấp, **SK2** vừa phải, **SK3** cao | 2.1.6 |\n| Độc tính sản phẩm cháy | **ĐT1** thấp → **ĐT4** đặc biệt cao | 2.1.7 |\n| Cấp nguy hiểm cháy của vật liệu (chỉ tiêu tổng hợp) | **CV0 → CV5** (tăng dần) | 2.1.8, B.1.7 |\n\n**Vật liệu hoàn thiện** (3.3.4, 3.5):\n\n**Bảng B.6 — Cấp nguy hiểm cháy của vật liệu** (vật liệu phải đạt đồng thời các chỉ tiêu của cột):\n\n| Chỉ tiêu | CV0 | CV1 | CV2 | CV3 | CV4 | CV5 |\n| --- | --- | --- | --- | --- | --- | --- |\n| Tính cháy | Không cháy | Ch1 | Ch1 | Ch2 | Ch3 | Ch4 |\n| Tính bắt cháy | — | BC1 | BC2 | BC2 | BC2 | BC3 |\n| Sinh khói | — | SK2 | SK2 | SK3 | SK3 | SK3 |\n| Độc tính | — | ĐT2 | ĐT2 | ĐT2 | ĐT3 | ĐT4 |\n| Lan truyền lửa trên bề mặt | — | LT1 | LT1 | LT2 | LT2 | LT4 |\n\nChỉ tiêu cần xét theo công dụng (Bảng B.7): hoàn thiện tường, trần (kể cả sơn, véc ni) — tính cháy, bắt cháy, sinh khói, độc tính; phủ sàn — thêm lan truyền lửa, không xét tính cháy; vật liệu lợp — cháy, lan truyền, bắt cháy; cách nhiệt — cháy, bắt cháy, sinh khói, độc tính. Lớp phủ **≤ 0,3 mm** trên nền không cháy không cần đánh giá.\n\n**Bảng B.8 — Vật liệu trên đường thoát nạn** (cấp tối đa cho phép):\n\n| Nhóm nhà | Số tầng / chiều cao | Tường, trần: tiền sảnh, buồng thang, sảnh thang máy | Tường, trần: hành lang chung, sảnh chờ | Sàn: tiền sảnh, buồng thang, sảnh thang máy | Sàn: hành lang chung, sảnh chờ |\n| --- | --- | --- | --- | --- | --- |\n| F1.2, F1.3, F2.3, F2.4, F3.1, F3.2, F3.6, F4.2, F4.3, F4.4, F5.1, F5.2, F5.3 | ≤ 9 tầng hoặc ≤ 28 m | CV2 | CV3 | CV3 | CV4 |\n|  | 10 – 17 tầng hoặc 28 – 50 m | CV1 | CV2 | CV2 | CV3 |\n|  | > 17 tầng hoặc > 50 m | CV0 | CV1 | CV1 | CV2 |\n| F1.1, F2.1, F2.2, F3.3, F3.4, F3.5, F4.1 | Mọi chiều cao | CV0 | CV1 | CV1 | CV2 |\n\n**Bảng B.9 — Vật liệu trong gian phòng chung** (trừ sân thi đấu và sàn phòng nhảy):\n\n| Nhóm nhà | Sức chứa gian | Tường, trần | Sàn |\n| --- | --- | --- | --- |\n| F1.2, F2.3, F2.4, F3.1, F3.2, F3.6, F4.2, F4.3, F4.4, F5.1 | > 800 người | CV0 | CV2 |\n|  | 300 – 800 | CV1 | CV2 |\n|  | 50 – 300 | CV2 | CV3 |\n|  | ≤ 50 | CV3 | CV4 |\n| F1.1, F2.1, F2.2, F3.3, F3.4, F3.5, F4.1 | > 300 người | CV0 | CV2 |\n|  | 15 – 300 | CV1 | CV2 |\n|  | ≤ 15 | CV3 | CV4 |\n\n\n- Trên **đường thoát nạn**: theo **Bảng B.8**; trong **phòng sử dụng chung**: theo **Bảng B.9**.\n- Gian phòng chung có **chữa cháy tự động** (trừ phòng > 20 m² điều trị nội trú, dưỡng lão, chăm sóc người khuyết tật): **không yêu cầu** cấp nguy hiểm cháy của vật liệu; các trường hợp khác có chữa cháy tự động được **giảm một cấp** (3.5.10).\n- Không yêu cầu với lớp mặt dày **≤ 1 mm** trên nền không cháy; hoặc lớp trang trí chiếm **≤ 20 %** diện tích tường/trần (cao su, nhựa: ≤ 10 %) và phân bố rời rạc (3.5.10).\n- Kho sách, hồ sơ: chỉ dùng **CV0, CV1** (3.5.6). Gian thương mại F3.1: tường/trần ≤ **CV2**, sàn ≤ **CV3** (3.5.8). Phòng chờ F3.3: **CV0** (3.5.9).\n\n## 1.2 Cấu kiện xây dựng (2.2)\n\n**Giới hạn chịu lửa (GHCL)** — thời gian (phút) đến khi xuất hiện trạng thái giới hạn (2.2.2.2):\n\n- **R** – mất khả năng chịu lực\n- **E** – mất tính toàn vẹn\n- **I** – mất khả năng cách nhiệt\n- **W** – mất khả năng hạn chế bức xạ nhiệt (dùng cho phần kính: EW, EIW)\n\nThang giá trị: không quy định, 15, 30, 45, 60, 90, 120, 150, 180, 240 phút (2.2.2.1).\n\nCấu kiện được coi là đạt GHCL khi thỏa **một** trong ba điều kiện (2.2.2.2, CHÚ THÍCH 3): (a) có mẫu thử nghiệm cùng cấu tạo đạt GHCL; (b) tính toán theo tiêu chuẩn thiết kế chịu lửa; (c) cấu tạo phù hợp **Phụ lục F** (GHCL danh định của tường, dầm, cột, sàn BTCT, kết cấu thép bọc bảo vệ).\n\n**Cấp nguy hiểm cháy của cấu kiện** K0 (không nguy hiểm) → K1 (ít) → K2 (vừa phải) → K3 (nguy hiểm cháy). Xếp cấp không cần thử nghiệm (2.2.3.2):\n\n| Cấp | Điều kiện |\n| --- | --- |\n| K0 | Chỉ làm từ vật liệu **không cháy** |\n| K1 | Bề mặt ngoài từ vật liệu không nguy hiểm hơn **Ch1, BC1, SK1** |\n| K2 | Bề mặt ngoài không nguy hiểm hơn **Ch2, BC2, SK2** |\n| K3 | Bề mặt ngoài có một trong các chỉ tiêu **Ch3, BC3, SK3** |\n\nTường kính bao che (facade) được coi là **K0** nếu mọi bộ phận, kể cả liên kết, bằng vật liệu không cháy (bỏ qua mạch chèn và lớp phủ < 0,3 mm).\n\n## 1.3 Bậc chịu lửa của nhà — Bảng 4 ✱\n\nGHCL **tối thiểu** của cấu kiện theo bậc chịu lửa (nhà có chiều cao PCCC ≤ 50 m; nhà cao hơn xem Bảng A.1 bên dưới):\n\n| Bậc | Tường chịu lực, cột và bộ phận chịu lực khác | Tường ngoài không chịu lực | Sàn tầng (kể cả sàn áp mái, sàn trên tầng hầm) | Mái không có tầng áp mái: tấm lợp | Mái: giàn, dầm, xà gồ | Buồng thang bộ: tường trong | Bản thang, chiếu thang |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| **I** | R 120 | E 30 | REI 60 | RE 30 | R 30 | REI 120 | R 60 |\n| **II** | R 90 | E 15 | REI 45 | RE 15 | R 15 | REI 90 | R 60 |\n| **III** | R 45 | E 15 | REI 45 | RE 15 | R 15 | REI 60 | R 45 |\n| **IV** | R 15 | E 15 | REI 15 | RE 15 | R 15 | REI 45 | R 15 |\n| **V** | không quy định | | | | | | |\n\n**Chú thích quan trọng của Bảng 4:**\n\n- **CT1** – Nhà bậc I, II, III: sàn và trần **tầng hầm, nửa hầm** bằng vật liệu không cháy, **≥ REI 90**. Sàn tầng 1 và tầng trên cùng: vật liệu không thấp hơn Ch1. Nhà bậc IV, V: sàn tầng hầm ≥ REI 45, vật liệu ≥ Ch1.\n- **CT2** ✱ – Không quy định GHCL tấm lợp nếu bằng vật liệu không cháy hoặc Ch1 + LT2 (trừ F5 hạng A, B). Không quy định GHCL **xà gồ** (trừ F3.1, F3.2, F5.1, F5.2 hạng A, B…) khi đồng thời: mặt dưới xà gồ cách sàn **≥ 10 m** (nhà hạng C) hoặc **≥ 6,1 m** (nhà khác); xà gồ không cháy (hạng C) hoặc ≥ Ch1; riêng hạng C phải có chữa cháy tự động và phụ tải treo thêm ≤ 10 kg/m².\n- **CT3** – Nhà F1.3 và nhà hỗn hợp có **2–3 tầng hầm**: kết cấu chịu lực ở tầng hầm **≥ R 120**.\n- **CT5, CT6** ✱ – Một phần tường ngoài không chịu lực được không bảo vệ theo E.3. GHCL tường ngoài không chịu lực trong Bảng 4 **chỉ áp dụng cho mảng tường làm đai/dải ngăn cháy** theo 4.32, 4.33.\n- **CT7** ✱ – Cho phép xác định GHCL theo nhiệt độ từ **mô phỏng cháy** dựa trên tải trọng cháy thực tế.\n- **CT8** ✱ – Không quy định GHCL bản thang, chiếu thang trong buồng thang có tường trong đạt Bảng 4; khi đó chúng và vật liệu hoàn thiện buồng thang phải không cháy hoặc Ch1, BC1.\n\n**Quy định đi kèm (2.5.3.3):**\n\n- Bộ phận chịu lực gồm tường, cột, hệ giằng, vách cứng, giàn, dầm, sàn, tấm lợp **tham gia bảo đảm ổn định tổng thể** khi cháy. Kết cấu mái không tham gia ổn định tổng thể lấy theo cột \"giàn, dầm, xà gồ\". Thiết kế phải chỉ rõ trong hồ sơ.\n- Không quy định GHCL kết cấu mái **có tầng áp mái**; cửa, cửa sổ, cửa trời (trừ chèn bịt trong bộ phận ngăn cháy).\n- Khi yêu cầu **R 15** (RE 15, REI 15): được dùng **thép không bọc bảo vệ** nếu GHCL thử nghiệm/tính toán **≥ R 8** hoặc hệ số tiết diện **Am/V ≤ 250 m⁻¹**.\n- Buồng thang **N1**: bản thang, chiếu thang được dùng **R 15, K0**.\n- Khoang cháy ngăn bằng **tường/sàn ngăn cháy loại 1**; được ngăn theo phương đứng bằng **tầng kỹ thuật** có sàn ngăn cháy loại 2. Nhà bậc IV, V được ngăn bằng tường ngăn cháy loại 2.\n\n**Nhà cao trên 50 m — Bảng A.1 (Phụ lục A):**\n\n| Cấu kiện | 50 – 100 m | 100 – 150 m |\n| --- | --- | --- |\n| Cột, tường chịu lực, giằng, vách cứng, dầm, sàn | R 150 | R 180 |\n| Tường ngoài không chịu lực | E 60 | E 60 |\n| Sàn giữa các tầng | REI 120 | REI 120 |\n| Tường trong buồng thang bộ | REI 150 | REI 180 |\n| Bản thang, chiếu thang | R 60 | R 60 |\n| Tường ngăn cháy, sàn ngăn cháy | REI 150 | REI 180 |\n| Giếng thang máy, giếng kỹ thuật không cắt qua biên khoang cháy | REI 120 | REI 120 |\n| Giếng cắt qua biên khoang cháy; giếng thang máy chữa cháy | REI 150 | REI 180 |\n| Mái dùng cho thoát nạn, cứu nạn: tấm lợp / dầm, giàn | RE 120 / R 150 | RE 120 / R 180 |\n\n## 1.4 Cấp nguy hiểm cháy kết cấu của nhà — Bảng 5\n\n| Cấp | Bộ phận chịu lực dạng thanh (cột, xà, giàn) | Tường ngoài từ phía ngoài | Tường, vách ngăn, sàn, mái không có tầng áp mái | Tường buồng thang bộ; bộ phận ngăn cháy | Bản thang, chiếu thang trong buồng thang |\n| --- | --- | --- | --- | --- | --- |\n| **S0** | K0 | K0 | K0 | K0 | K0 |\n| **S1** | K1 | K2 | K1 | K0 | K0 |\n| **S2** | K3 | K3 | K2 | K1 | K1 |\n| **S3** | không quy định | không quy định | không quy định | K1 | K3 |\n\nBộ phận ngăn cháy loại 1 phải **K0**; loại 2–4 được K1 trong trường hợp riêng (2.3.3.4).\n\n## 1.5 Nhóm nguy hiểm cháy theo công năng — Bảng 6 ✱\n\nTrích **nguyên văn** cột \"Mục đích sử dụng\" của Bảng 6 (bản hợp nhất SĐ1:2023). Mỗi nhóm đều kết thúc bằng \"và các nhà có đặc điểm sử dụng tương tự\". Bảng áp dụng cho **nhà, công trình, khoang cháy, gian phòng hoặc nhóm các phòng có công năng liên quan với nhau** (chú thích 1 của Bảng 6).\n\n**F1 — Nhà để ở thường xuyên hoặc tạm thời (kể cả ở suốt ngày đêm).** Đặc điểm: các gian phòng sử dụng cả ngày và đêm; người ở gồm nhiều lứa tuổi, trạng thái thể chất khác nhau; đặc trưng là **có phòng ngủ**.\n\n| Nhóm | Công trình theo Bảng 6 |\n| --- | --- |\n| **F1.1** | Nhà trẻ, trường mẫu giáo, mầm non; **bệnh viện** (không bao gồm bệnh viện dã chiến), khối nhà điều trị nội trú của cơ sở phòng chống dịch bệnh, phòng khám đa khoa, chuyên khoa, nhà hộ sinh; nhà chuyên dùng cho người cao tuổi và người khuyết tật (không phải nhà căn hộ), nhà dưỡng lão; khối nhà ngủ của các trường nội trú và của các cơ sở cho trẻ em |\n| **F1.2** | Khách sạn, nhà khách, nhà nghỉ, nhà trọ; ký túc xá, nhà ở tập thể; khối nhà ngủ của các cơ sở điều dưỡng, nghỉ dưỡng, phục hồi chức năng, chỉnh hình; các cơ sở lưu trú khác có đặc điểm sử dụng tương tự |\n| **F1.3** | Nhà chung cư |\n| **F1.4** | Nhà ở riêng lẻ |\n\n**F2 — Nhà của các cơ sở văn hóa, thể thao.** Đặc điểm: gian phòng chính có **số lượng lớn khách lưu lại** trong một khoảng thời gian nhất định.\n\n| Nhóm | Công trình theo Bảng 6 |\n| --- | --- |\n| **F2.1** | Nhà hát, rạp chiếu phim, rạp xiếc, phòng hòa nhạc; câu lạc bộ, hộp đêm, vũ trường, quán bar, phòng hát, nhà kinh doanh karaoke và các cơ sở tương tự khác **trong các gian phòng kín**; các công trình thể thao **có khán đài**, nhà thi đấu, cung thể thao trong nhà; **thư viện**; trung tâm hội nghị, tổ chức sự kiện **không bao gồm dịch vụ ăn uống**; các nhà khác có số lượng chỗ ngồi tính toán cho người trong các gian phòng kín |\n| **F2.2** | Nhà bảo tàng, triển lãm; phòng nhảy; khối nhà của các công trình vui chơi giải trí, thủy cung |\n| **F2.3** | Nhà của các cơ sở nêu ở F2.1 nhưng **hở ra ngoài trời**; công viên giải trí |\n| **F2.4** | Nhà của các cơ sở nêu ở F2.2 nhưng **hở ra ngoài trời** |\n\n**F3 — Nhà của các cơ sở thương mại, kinh doanh và dịch vụ dân cư.** Đặc điểm: **số lượng khách lớn hơn** so với nhân viên phục vụ.\n\n| Nhóm | Công trình theo Bảng 6 |\n| --- | --- |\n| **F3.1** | Nhà của cơ sở bán hàng, phòng trưng bày các sản phẩm hàng hóa, nhà hội chợ, trung tâm thương mại, điện máy, siêu thị, cửa hàng bách hóa, cửa hàng tiện ích; nhà sách; cửa hàng kinh doanh mô-tô, xe gắn máy |\n| **F3.2** | Nhà hàng, cửa hàng ăn uống, giải khát, trạm dừng nghỉ; trung tâm hội nghị, tổ chức sự kiện **có bao gồm dịch vụ ăn uống** |\n| **F3.3** | Nhà ga đường sắt, nhà ga hàng không; nhà chờ cáp treo vận chuyển người, bến phà, bến xe khách |\n| **F3.4** | Phòng khám chữa bệnh (**ngoại trú**) đa khoa, chuyên khoa và cấp cứu; khối nhà điều trị ngoại trú của cơ sở y tế khác như trạm y tế, chỉnh hình, thẩm mỹ viện, phục hồi chức năng; nhà có kinh doanh dịch vụ xoa bóp |\n| **F3.5** | Các gian phòng cho khách của doanh nghiệp, cơ sở dịch vụ đời sống và công cộng có số chỗ ngồi cho khách **không được tính toán** (bưu điện, bưu cục, quỹ tiết kiệm, phòng vé, văn phòng tư vấn luật, văn phòng công chứng, cửa hàng giặt là, nhà may, sửa chữa giày và quần áo, cửa hàng cắt tóc); cơ sở phục vụ lễ tang |\n| **F3.6** | Các khu liên hợp thể dục thể thao và các khu tập luyện, thi đấu thể thao **không có khán đài**; các gian phòng dịch vụ; sân vận động, trường đua, trường bắn |\n\n**F4 — Công trình giáo dục, đào tạo, trụ sở làm việc, tổ chức khoa học, nghiên cứu và thiết kế, cơ quan quản lý.** Đặc điểm: gian phòng sử dụng một số thời gian nhất định trong ngày; nhóm người cố định, quen điều kiện tại chỗ, độ tuổi và thể chất xác định.\n\n| Nhóm | Công trình theo Bảng 6 |\n| --- | --- |\n| **F4.1** | Các trường tiểu học, trung học cơ sở, cơ sở đào tạo phổ thông có nhiều cấp học (không bao gồm mầm non, mẫu giáo), trường trung học phổ thông, **trung học chuyên nghiệp, trường dạy nghề**; trường đào tạo người chuyên hoạt động tôn giáo ở lứa tuổi thiếu niên |\n| **F4.2** | Các trường đại học, cao đẳng, học viện, **trung cấp chuyên nghiệp**, trường bồi dưỡng nâng cao nghiệp vụ, trường công nhân kỹ thuật; trường đào tạo người chuyên hoạt động tôn giáo không thuộc nhóm F4.1 |\n| **F4.3** | Trụ sở cơ quan quản lý, cơ quan Nhà nước các cấp; nhà làm việc của nhân viên văn phòng trong doanh nghiệp; trụ sở tổ chức chính trị, chính trị – xã hội; văn phòng của tổ chức xã hội – nghề nghiệp, đơn vị sự nghiệp, doanh nghiệp, tổ chức, cá nhân khác; trụ sở tôn giáo; tổ chức thiết kế, nghiên cứu khoa học, trạm nghiên cứu địa chấn, trạm khí tượng thủy văn, cơ sở nghiên cứu vũ trụ; tổ chức thông tin và nhà xuất bản; cơ sở truyền thanh, truyền hình, viễn thông, nhà lắp đặt thiết bị thông tin; **ngân hàng**, cơ quan, văn phòng |\n| **F4.4** | Các trạm (đội) chữa cháy và cứu nạn, cứu hộ |\n\n**F5 — Nhà, công trình, gian phòng có công năng sản xuất và kho.** Đặc điểm: có nhóm người làm việc cố định, kể cả làm việc suốt ngày đêm.\n\n| Nhóm | Công trình theo Bảng 6 |\n| --- | --- |\n| **F5.1** | Các nhà sản xuất, các gian phòng sản xuất và thí nghiệm, nhà xưởng, cửa hàng **sửa chữa, bảo dưỡng** ô-tô, mô-tô, xe gắn máy |\n| **F5.2** | Các nhà và công trình kho; **ga ra để xe không có dịch vụ kỹ thuật và sửa chữa**; kho chứa sách, kho lưu trữ, trung tâm lưu trữ, trung tâm cơ sở dữ liệu chuyên ngành, các gian phòng kho; khu vực lưu giữ hàng hóa của cảng cạn; kho hàng hóa, vật tư cháy được hoặc hàng hóa vật tư không cháy đựng trong bao bì cháy được |\n| **F5.3** | Các nhà phục vụ nông nghiệp và phát triển nông thôn |\n\n**Các trường hợp dễ xếp nhầm** (đối chiếu từng câu chữ của Bảng 6):\n\n| Công trình | Nhóm | Căn cứ |\n| --- | --- | --- |\n| Khối điều trị **nội trú** của bệnh viện, cơ sở phòng chống dịch | F1.1 | F1.1 |\n| Phòng khám **ngoại trú**, cấp cứu; khối điều trị ngoại trú; thẩm mỹ viện; xoa bóp | F3.4 | F3.4 |\n| Phòng khám đa khoa, chuyên khoa | Được liệt kê ở **F1.1**; phòng khám chữa bệnh **ngoại trú** thuộc **F3.4**. Phân biệt theo việc có lưu bệnh nhân (nội trú) hay không — nên thống nhất với cơ quan thẩm duyệt | F1.1, F3.4 |\n| Bệnh viện dã chiến | Không thuộc F1.1 — xác định theo đặc điểm sử dụng thực tế | F1.1 (loại trừ) |\n| Hội trường, trung tâm hội nghị, sự kiện **không** có ăn uống | F2.1 | F2.1 |\n| Trung tâm hội nghị, sự kiện **có** dịch vụ ăn uống | F3.2 | F3.2 |\n| Karaoke, vũ trường, bar, hộp đêm trong phòng kín | F2.1 | F2.1 |\n| Thư viện | F2.1 (không phải F4) | F2.1 |\n| Nhà sách | F3.1 | F3.1 |\n| Kho sách, kho lưu trữ | F5.2 | F5.2 |\n| Ngân hàng | F4.3 | F4.3 |\n| Quỹ tiết kiệm, phòng giao dịch bưu điện, phòng vé | F3.5 | F3.5 |\n| Nhà thi đấu, công trình thể thao **có** khán đài | F2.1 (ngoài trời: F2.3) | F2.1, F2.3 |\n| Khu tập luyện, thi đấu **không** khán đài; sân vận động, trường đua, trường bắn | F3.6 | F3.6 |\n| Trung học chuyên nghiệp, trường dạy nghề | F4.1 | F4.1 |\n| Trung cấp chuyên nghiệp, cao đẳng, trường công nhân kỹ thuật | F4.2 | F4.2 |\n| Mầm non, mẫu giáo, nhà trẻ | F1.1 (không phải F4.1) | F1.1, F4.1 |\n| Khối nhà ngủ trường nội trú, cơ sở cho trẻ em | F1.1 | F1.1 |\n| Khối nhà ngủ cơ sở điều dưỡng, nghỉ dưỡng, phục hồi chức năng | F1.2 | F1.2 |\n| Nhà dưỡng lão, nhà cho người cao tuổi, khuyết tật (không phải căn hộ) | F1.1 | F1.1 |\n| Gara **không** có dịch vụ kỹ thuật, sửa chữa | F5.2 | F5.2 |\n| Gara, cửa hàng **có** sửa chữa, bảo dưỡng ô-tô, xe máy | F5.1 | F5.1 |\n| Cửa hàng **kinh doanh** mô-tô, xe gắn máy | F3.1 | F3.1 |\n| Trung tâm cơ sở dữ liệu chuyên ngành | F5.2 | F5.2 |\n\n**Quy tắc xếp nhóm đi kèm:**\n\n- Gian sản xuất, kho, phòng thí nghiệm, nhà xưởng **> 50 m²** và gian chuẩn bị đồ ăn có thiết bị đun nấu **> 10 kW** trong nhà F1, F2, F3, F4 được xếp vào **F5** (2.5.5.2).\n- Nhóm F áp dụng cho từng nhà, khoang cháy, gian phòng hoặc nhóm phòng liên quan (chú thích 1 Bảng 6). Các phần khác nhóm ngăn cách theo **4.5**; tầng có công năng chính **≥ 90 %** diện tích, phần còn lại là phụ trợ, được xếp theo công năng chính.\n- Khi các phần đã được ngăn bằng bộ phận ngăn cháy, mỗi phần đáp ứng yêu cầu của nhóm F tương ứng (4.6).\n- Nhà có nhóm F nhất định được bố trí gian phòng nhóm khác thì đáp ứng thêm tiêu chuẩn thiết kế riêng của loại nhà đó (2.5.5.3).\n- Công trình không có trong danh sách: chọn nhóm theo **\"Đặc điểm sử dụng\"** của nhóm lớn (F1 – F5) và cụm \"các nhà có đặc điểm sử dụng tương tự\".\n\n\n**Phạm vi áp dụng (1.1.2) ✱:**\n\n| Loại nhà | Giới hạn áp dụng |\n| --- | --- |\n| Chung cư, nhà ở tập thể | Chiều cao PCCC ≤ 150 m, ≤ 3 tầng hầm |\n| Nhà ở riêng lẻ (kể cả kết hợp, chuyển đổi công năng) | Từ **7 tầng** (hoặc chiều cao PCCC ≥ 25 m), **hoặc** khối tích ≥ 5 000 m³, **hoặc** 2–3 tầng hầm |\n| Nhà công cộng | ≤ 150 m, ≤ 3 tầng hầm |\n| Nhà sản xuất, kho; hạ tầng kỹ thuật | ≤ 50 m, ≤ 1 tầng hầm |\n| Nhà phục vụ giao thông | ≤ 50 m, ≤ 3 tầng hầm |\n\nNhà F1.2, F1.3, F4.2, F4.3, hỗn hợp **> 150 m** hoặc **≥ 4 tầng hầm**: bổ sung yêu cầu theo tài liệu chuẩn (1.1.3). Tầng hầm 4, 5 để xe: áp dụng thêm quy chuẩn gara ngầm.\n\n## 1.6 Hạng nguy hiểm cháy và cháy nổ (Phụ lục C)\n\n| Hạng gian phòng | Đặc trưng (Bảng C.1) |\n| --- | --- |\n| **A** – nguy hiểm cháy nổ cao | Khí cháy; chất lỏng dễ bắt cháy có nhiệt độ bùng cháy **≤ 28 °C**; chất nổ khi gặp nước, ôxy — áp suất nổ dư tính toán **> 5 kPa** |\n| **B** – nguy hiểm cháy nổ | Bụi, sợi cháy; chất lỏng bùng cháy **> 28 °C** — áp suất nổ dư **> 5 kPa** |\n| **C1** | Tải trọng cháy riêng **> 2 200 MJ/m²** |\n| **C2** | 1 401 – 2 200 MJ/m² |\n| **C3** | 181 – 1 400 MJ/m² |\n| **C4** | 1 – 180 MJ/m² |\n| **D** – nguy hiểm cháy vừa phải | Chất không cháy ở trạng thái nóng, nóng chảy; nhiên liệu đốt |\n| **E** – nguy hiểm cháy thấp | Chất không cháy ở trạng thái nguội |\n\n**Hạng của nhà (C.2):**\n\n- **Hạng A**: tổng diện tích gian hạng A **> 5 %** tổng diện tích các gian phòng **hoặc > 200 m²**. Không xếp hạng A nếu ≤ 25 % (≤ 1 000 m²) và các gian đó có chữa cháy tự động.\n- **Hạng B**: không thuộc A; tổng A + B > 5 % hoặc > 200 m² (ngoại lệ tương tự, ≤ 1 000 m²).\n- **Hạng C**: không thuộc A, B; tổng A + B + C1–C3 > 5 % (10 % nếu không có A, B). Ngoại lệ ≤ 25 % (≤ 3 500 m²) có chữa cháy tự động.\n", "02-ngan-chay.md": "# 2. Bộ phận ngăn cháy và khoang cháy\n\nMục 2.3, Phần 4 và Phụ lục H của QCVN 06:2022/BXD (bản hợp nhất SĐ1:2023).\n\n## 2.1 Bộ phận ngăn cháy — Bảng 1\n\n| Bộ phận ngăn cháy | Loại | GHCL | Chèn bịt lỗ mở loại | Khoang đệm loại |\n| --- | --- | --- | --- | --- |\n| Tường ngăn cháy | 1 | REI 150 | 1 | 1 |\n|  | 2 | REI 45 | 2 | 2 |\n| Vách ngăn cháy | 1 | EI 45 | 2 | 1 |\n|  | 2 | EI 15 | 3 | 2 |\n| Vách ngăn cháy có kính > 25 % diện tích | 1 | EIW 45 | 2 | 1 |\n|  | 2 | EIW 15 | 3 | 2 |\n| Sàn ngăn cháy | 1 | REI 150 | 1 | 1 |\n|  | 2 | REI 60 | 2 | 1 |\n|  | 3 | REI 45 | 2 | 1 |\n|  | 4 | REI 15 | 3 | 2 |\n\nVách có kính: phần đặc theo EI, phần kính theo EW. Vách đã thử đạt EI cả phần kính được coi là đạt EW.\n\nNhà cao **> 50 m**: tường và sàn ngăn cháy **REI 150** (50–100 m) hoặc **REI 180** (100–150 m) theo Bảng A.1.\n\n## 2.2 Bộ phận chèn bịt lỗ mở — Bảng 2\n\n| Bộ phận chèn bịt | Loại | GHCL |\n| --- | --- | --- |\n| Cửa đi (kính ≤ 25 %), cửa nắp, van ngăn cháy, màn ngăn cháy | 1 | EI 60 |\n|  | 2 | EI 30 |\n|  | 3 | EI 15 |\n| Cửa đi có kính > 25 % diện tích cửa | 1 | EIW 60 |\n|  | 2 | EIW 30 |\n|  | 3 | EIW 15 |\n| Cửa giếng thang máy (khi có yêu cầu GHCL) | 2 | **E 30** |\n| Cửa sổ | 1 | E 60 |\n|  | 2 | E 30 |\n|  | 3 | E 15 |\n\nVan ngăn cháy được chỉ lấy theo **E** nếu lắp trong kênh, giếng, ống đã bảo đảm cả E và I.\n\n## 2.3 Khoang đệm ngăn cháy — Bảng 3\n\n| Khoang đệm | Vách ngăn cháy | Sàn ngăn cháy | Chèn bịt lỗ mở (cửa) |\n| --- | --- | --- | --- |\n| Loại 1 | Loại 1 (EI 45) | Loại 3 (REI 45) | Loại 2 (EI 30) |\n| Loại 2 | Loại 2 (EI 15) | Loại 4 (REI 15) | Loại 3 (EI 15) |\n\n## 2.4 Yêu cầu cấu tạo bộ phận ngăn cháy (Phần 4)\n\n- **Tường ngăn cháy chia khoang cháy**: xây **suốt chiều cao nhà** hoặc tới sàn ngăn cháy loại 1; không để cháy lan khi kết cấu phía có cháy sụp đổ (4.17).\n- **Lỗ mở**: phải đóng kín khi cháy; cửa sổ trong bộ phận ngăn cháy **không mở được**; cửa đi, cửa nắp, van có **cơ cấu tự đóng**, khe chèn kín; cửa cần để mở khi sử dụng phải tự đóng khi cháy (4.18).\n- **Tổng diện tích lỗ cửa** trong bộ phận ngăn cháy (trừ bao che giếng thang máy) **≤ 25 %** diện tích bộ phận đó. Không giới hạn nếu chèn bịt có GHCL danh định ≥ GHCL bộ phận ngăn cháy (trừ tường ngăn cháy loại 1) (4.19).\n- Cửa ngăn gian hạng **A, B** với không gian khác: khoang đệm **luôn có áp suất dương**; không dùng chung khoang đệm cho hai gian A/B (4.19).\n- Cửa, van ngăn cháy: vật liệu **không cháy**; được dùng vật liệu ≥ Ch3 bọc vật liệu không cháy dày **≥ 4 mm**; hoặc gỗ Ch3 đặc dày **≥ 40 mm** ở phía gian không có chất cháy (4.21).\n- Không cho ống, kênh dẫn khí cháy, chất lỏng cháy **xuyên tường/sàn ngăn cháy loại 1**; các ống khác phải có thiết bị tự động ngăn sản phẩm cháy tại chỗ giao cắt (4.22).\n- Ống thông gió, ống khói trong tường ngăn cháy nhà dân dụng: tường còn lại dày **≥ 25 cm**, vách giữa ống khói và ống thông hơi **≥ 12 cm** (4.22, CT1).\n- Đường ống, cáp xuyên kết cấu: chèn bịt không làm giảm chỉ tiêu cháy của kết cấu (4.12). Chi tiết liên kết có GHCL không thấp hơn cấu kiện (4.10).\n- **Trần treo**: vách ngăn cháy phải ngăn cả không gian trên trần; không bố trí trần treo trong gian hạng A, B (4.15).\n- Không dùng lớp bảo vệ chống cháy ở vị trí không thể kiểm tra, thay thế định kỳ (4.13).\n\n## 2.5 Ngăn cách công năng khác nhau (4.5)\n\n- Các phần nhà khác nhóm F: ngăn bằng bộ phận ngăn cháy **≥ EI 45** (bậc I–III) hoặc **≥ EI 15** (bậc IV), hoặc giải pháp tương đương.\n- Tầng có công năng chính chiếm **≥ 90 %** diện tích, phần còn lại là phụ trợ: không bắt buộc ngăn cháy, toàn tầng theo yêu cầu của công năng chính (trừ khi phụ trợ có hạng nguy hiểm cao hơn).\n- Trong nhà F1–F4 **không yêu cầu** ngăn cháy cho: gian F5 hạng C4, E; phòng kỹ thuật nước; phòng ẩm ướt; **kho ≤ 10 m²** không chứa khí/lỏng dễ cháy; khu chỉ phục vụ ăn uống (không bếp, không kho thực phẩm); phòng họp nội bộ…\n- Không ngăn cách thì lấy yêu cầu **cao nhất** giữa các công năng. Luôn phải ngăn khu vực hạng A, B, C với khu ở/công cộng.\n\n**Riêng nhà F1.3 (4.5, CHÚ THÍCH):**\n\n| Bộ phận | Yêu cầu |\n| --- | --- |\n| Tường, vách giữa các đơn nguyên; giữa hành lang chung và các phòng khác | ≥ **EI 30** |\n| Tường, vách không chịu lực giữa các căn hộ | ≥ **EI 30**, **K0** |\n| Phòng công cộng với phòng ở | **Vách ngăn cháy loại 1** + **sàn ngăn cháy loại 3**; nhà bậc I: **sàn ngăn cháy loại 2** |\n| Lan can lô gia, ban công từ tầng 3 trở lên | Vật liệu **không cháy** (4.9) |\n\n## 2.6 Giếng thang máy, trục kỹ thuật, rác\n\n- **Bao che giếng thang máy**, phòng máy (trừ phòng trên mái), kênh, giếng, hộp kỹ thuật: như **vách ngăn cháy loại 1 + sàn ngăn cháy loại 3** (4.23). Không quy định GHCL giữa giếng và phòng máy; cửa giếng mở ra hành lang bên không yêu cầu GHCL.\n- Không lắp được cửa ngăn cháy cho giếng thang: bố trí khoang đệm/sảnh với vách ngăn cháy loại 1 (hoặc màn ngăn cháy, màn nước drencher) và sàn loại 3, hoặc màn chắn tự đóng **≥ E 30** (4.23).\n- Nhà có buồng thang không nhiễm khói: giếng thang máy không có khoang đệm áp suất dương phải được **bảo vệ chống khói tự động** (4.23).\n- **Tầng hầm, nửa hầm**: trước lối vào thang máy phải có **khoang đệm ngăn cháy loại 1 có áp suất dương khi cháy** (4.28).\n- Trong buồng thang bộ (trừ buồng không nhiễm khói) được đặt **≤ 2 thang máy** chở người chỉ xuống tầng 1, bao che không cháy (3.4.6).\n- **Ống đổ rác, buồng rác** (4.24): ngăn cách bằng bộ phận ngăn cháy; cửa thu rác tự đóng; ống bằng vật liệu không cháy; không đặt trong buồng thang, sảnh, khoang đệm thoát nạn; lối vào qua không gian thoáng hoặc khoang đệm thông gió thường xuyên.\n- Thang bộ riêng nối tầng hầm với tầng 1 (vì công nghệ): bao che vách ngăn cháy loại 1 + khoang đệm áp suất dương; **không tính** vào thoát nạn (4.25).\n\n## 2.7 Khoang cháy — Phụ lục H ✱\n\nDiện tích khoang cháy tính theo **diện tích một tầng nhà trong phạm vi một khoang cháy**. Chọn bảng theo nhóm F → hàng theo bậc chịu lửa và cấp S → đọc chiều cao PCCC tối đa và diện tích tầng tối đa.\n\n**Bảng H.1 — Nhà ở và ký túc xá kiểu căn hộ**\n\n| Bậc | Cấp S | Chiều cao PCCC tối đa | Diện tích 1 tầng / khoang cháy |\n| --- | --- | --- | --- |\n| I | S0 | 75 m | 2 500 m² |\n| II | S0 | 50 m | 2 500 m² |\n| II | S1 | 28 m | 2 200 m² |\n| III | S0 | 28 m | 1 800 m² |\n| III | S1 | 15 m | 1 800 m² |\n| IV | S0 | 5 m / 3 m | 1 000 / 1 400 m² |\n| IV | S1 | 5 m / 3 m | 800 / 1 200 m² |\n| IV | S2 | 5 m / 3 m | 500 / 900 m² |\n| V | — | 5 m / 3 m | 500 / 800 m² |\n\nF1.3 cao 75–150 m: theo **Phụ lục A** (A.3). Nhà hai tầng bậc IV: bộ phận chịu lực ≥ R 30.\n\n**Bảng H.2 — Nhà công cộng** (kể cả khách sạn, căn hộ cho thuê) — diện tích 1 tầng/khoang cháy (m²) theo số tầng trên mặt đất\n\n| Bậc | Cấp S | Cao tối đa | 1 tầng | 2 | 3 | 4–5 | 6–9 | 10–16 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| I | S0 | 50 m | 6 000 | 5 000 | 5 000 | 5 000 | 5 000 | 2 500 |\n| II | S0 | 50 m | 6 000 | 4 000 | 4 000 | 4 000 | 4 000 | 2 200 |\n| II | S1 | 28 m | 5 000 | 3 000 | 3 000 | 2 000 | 1 200 | — |\n| III | S0 | 15 m | 3 000 | 2 000 | 2 000 | 1 200 | — | — |\n| III | S1 | 12 m | 2 000 | 1 400 | 1 200 | 800 | — | — |\n| IV | S0 | 9 m | 2 000 | 1 400 | — | — | — | — |\n| IV | S1 | 6 m | 2 000 | 1 400 | — | — | — | — |\n| IV | S2, S3 | 6 m | 1 200 | 800 | — | — | — | — |\n| V | S1–S3 | 6 m | 1 200 | 800 | — | — | — | — |\n\nNhà công cộng 50–150 m: theo **Phụ lục A** (A.2). Nhà 2 tầng bậc IV: kết cấu chịu lực ≥ R 45.\n\n**Bảng H.4 — Thương mại F3.1**\n\n| Bậc | Cấp S | Cao tối đa | 1 tầng | 2 tầng | 3–5 tầng |\n| --- | --- | --- | --- | --- | --- |\n| I, II | S0 | 28 m | 3 500 | 3 000 | 2 500 |\n| III | S0, S1 | 8 m | 2 000 | 1 000 | — |\n| IV | S0 | 3 m | 1 000 | — | — |\n| IV, V | S1–S3 | 3 m | 500 | — | — |\n\n**Tăng diện tích và quy định chung (H.2.12):**\n\n- Nhà **bậc I, II, cấp S0** có **chữa cháy tự động toàn nhà**: diện tích khoang cháy theo H.2 – H.4 được tăng **không quá 2 lần**.\n- Nhà 1 tầng có phần 2 tầng **≤ 15 %** diện tích xây dựng vẫn coi là nhà 1 tầng.\n- Mái hiên, sân trời, hành lang ngoài được thấp hơn **1 bậc** chịu lửa so với nhà chính (cấp S không thấp hơn).\n- Tiền sảnh, phòng chờ lớn hơn diện tích cho phép: được thay tường ngăn cháy bằng **vách ngăn cháy xuyên sáng loại 2**.\n- Nhà ga, TTTM, sảnh thông tầng không bố trí được tường ngăn cháy: thay bằng **màn nước drencher 2 dải cách 0,5 m**, **≥ 1 L/s** cho mỗi mét dài, duy trì **≥ 1 giờ**, kèm giải pháp ngăn khói.\n- Thư viện không cao quá **28 m**.\n\n**Nhà cao trên 50 m (Phụ lục A):**\n\n- Bậc chịu lửa tối thiểu **I**; chia khoang cháy theo chiều cao **≤ 50 m** mỗi khoang (A.2.2); F1.3 cao 75–150 m: khoang dưới cùng ≤ 75 m, các khoang tiếp theo ≤ 50 m (A.3.1.2). Ngăn bằng sàn ngăn cháy hoặc tầng kỹ thuật có sàn **≥ REI 90**.\n- Diện tích 1 tầng/khoang cháy (A.2.3): khối đế **≤ 3 000 m²**; F1.2 **≤ 1 500 m²**; F1.3 **≤ 2 000 m²**; còn lại **≤ 2 500 m²**.\n- Nhà **> 100 m** (> 120 m nếu có báo cháy và chữa cháy tự động): bố trí **khu vực lánh nạn tạm thời** (tầng/gian lánh nạn hoặc vùng an toàn) theo A.3.2.\n\n## 2.8 Gian phòng đông người — Bảng H.8\n\nChiều cao PCCC tối đa (tính tới cao độ hàng ghế đầu) để bố trí giảng đường, khán phòng, hội nghị, phòng tập thể thao:\n\n| Bậc | Cấp S | Sức chứa | Cao tối đa |\n| --- | --- | --- | --- |\n| I, II | S0 | ≤ 300 chỗ | 50 m |\n| I, II | S0, S1 | ≤ 600 chỗ | 12 m |\n| I, II | S0, S1 | > 600 chỗ | 9 m |\n| III | S0 | ≤ 300 chỗ | 9 m |\n| III | S0, S1 | ≤ 600 chỗ | 3 m |\n| IV | S0–S3 | ≤ 100 chỗ | 3 m |\n\nNhà F1.1: không đặt các gian này cao hơn **tầng 2**; trường F4.1: không cao hơn **tầng 3** — trừ khi có báo cháy/chữa cháy tự động hoặc ≥ 2 cầu thang thoát nạn.\n\n## 2.9 Khoang cháy theo loại công trình khác (Phụ lục H)\n\n**Bảng H.3 — Cơ sở dịch vụ F3.5** (diện tích 1 tầng / khoang cháy, m²)\n\n| Bậc | Cấp S | Cao tối đa | Nhà 1 tầng | Nhiều tầng (≤ 6 tầng) |\n| --- | --- | --- | --- | --- |\n| I, II | S0 | 18 m | 3 000 | 2 500 |\n| II | S1 | 6 m | 2 500 | 1 000 |\n| III | S0 | 6 m | 2 500 | 1 000 |\n| III | S1 | 5 m | 1 000 | — |\n| IV | S0, S1 | 5 m | 1 000 | — |\n| IV, V | S2, S3 / S1–S3 | 5 m | 500 | — |\n\n**Bảng H.5 — Nhà trẻ, mẫu giáo, mầm non (F1.1)**\n\n| Số chỗ | Bậc tối thiểu | Cấp S | Cao tối đa (số tầng) |\n| --- | --- | --- | --- |\n| ≤ 50 | Không quy định | Không quy định | 3 m (1) |\n| ≤ 100 | III | S0, S1 | 3 m (1) |\n| ≤ 150 | II | S0, S1 | 6 m (2) |\n| ≤ 350 | II / I | S0 | 6 m (2) / 9 m (3) |\n\nTrẻ khuyết tật thể chất, trí tuệ: tối đa **2 tầng**; trẻ khiếm thị: **1 tầng**. Nhà 3 tầng: lớp bé ở tầng 1. Tầng 3 chỉ cho lớp lớn, phòng nhạc, thể chất, chơi, phục vụ; phòng > 50 m² có một lối ra trực tiếp vào thang thoát nạn (H.2.4).\n\n**Bảng H.6 — Trường phổ thông F4.1 và nhà ngủ trường nội trú F1.1**\n\n| Đối tượng | Số học sinh / chỗ | Cấp S | Bậc tối thiểu | Cao tối đa (số tầng) |\n| --- | --- | --- | --- | --- |\n| Nhà học | ≤ 100 | — | — | 3 m (1) |\n|  | ≤ 270 | S1 / S0 | III | 3 m (1) / 7 m (2) |\n|  | ≤ 350 | S1 | II | 7 m (2) |\n|  | ≤ 600 | S0 | II | 11 m (3) |\n|  | Không hạn chế | S0 | I | 19 m (5) |\n| Nhà ngủ | ≤ 40 | — | — | 3 m (1) |\n|  | ≤ 80 / ≤ 140 | S1–S3 / S0 | IV | 3 m (1) |\n|  | ≤ 200 / ≤ 280 | S1 / S0 | III | 3 m (1) / 7 m (2) |\n|  | Không hạn chế | S0 | I, II | 15 m (4) |\n\nTHCS, THPT: được tới **25 m (7 tầng)** nếu có ≥ 2 thang thoát nạn đạt quy chuẩn. Nhà học, nội trú cho trẻ khuyết tật: **≤ 9 m**. Diện tích khoang cháy theo Bảng H.2. Với H.5, H.6, H.7: được tính theo **số tầng** (giá trị trong ngoặc) khi có báo cháy hoặc chữa cháy tự động và nhà ≤ 28 m (H.2.12.10).\n\n**Bảng H.7 — Cơ sở văn hóa F2.1, F2.2**\n\n| Nhóm | Bậc | Cấp S | Cao tối đa (số tầng) | Sức chứa |\n| --- | --- | --- | --- | --- |\n| F2.1 |
