  catch (e) { const ta = document.createElement("textarea"); ta.value = t; ta.style.cssText = "width:100%;height:160px;font:12px var(--mono)"; if (msg) { msg.textContent = "Trình duyệt chặn sao chép tự động — chọn toàn bộ nội dung dưới đây và sao chép:"; msg.after(ta); } ta.focus(); ta.select(); }
}
function renderProjects() {
  setHeader("Dự án đã lưu"); setNav("cong-trinh");
  view.innerHTML = ctTabs("du-an") + (projects.length ? `<ul class="results">${projects.map((p, k) => { const done = p.rows.filter(r => r.st).length; return `<li class="proj"><button data-proj="${k}"><span class="sec">${esc(p.date)} · ${esc(p.author || "")}</span><span class="ttl">${esc(p.name || p.title)}</span><span class="snip">${esc(p.title)} — ${done}/${p.rows.length} dòng đã đánh giá, ${p.rows.filter(r => r.st === "Chưa đáp ứng").length} chưa đáp ứng</span></button><button class="link-btn" data-projdel="${k}">Xóa</button></li>`; }).join("")}</ul>` :
    `<div class="empty">Chưa có dự án nào.<br>Ở tab Toàn nhà, Hỗn hợp hoặc Gian phòng, bấm <strong>Tạo phiếu kiểm tra</strong>, đánh giá từng dòng rồi bấm <strong>Lưu dự án</strong>.</div>`) +
    `<p class="note">Dự án được lưu trên thiết bị này. Dùng nút sao chép trong phiếu để chuyển sang Excel, Word hoặc gửi cho đồng nghiệp.</p>`;
}

/* ---- 5. Sơ đồ minh họa ---- */
const DIAGS = {
  "chieu-cao": { t: "Chiều cao PCCC", ref: "1.4.9", svg: `<svg viewBox="0 0 340 260" class="dg"><line class="g" x1="10" y1="230" x2="330" y2="230"/><rect class="road" x="10" y="226" width="90" height="8"/><text x="10" y="250">Mặt đường xe chữa cháy</text><rect class="w" x="140" y="40" width="110" height="190"/><g class="fl"><line x1="140" y1="78" x2="250" y2="78"/><line x1="140" y1="116" x2="250" y2="116"/><line x1="140" y1="154" x2="250" y2="154"/><line x1="140" y1="192" x2="250" y2="192"/></g><rect class="win" x="175" y="52" width="40" height="18"/><rect class="tech" x="140" y="14" width="110" height="26"/><text x="146" y="31" class="s">Tầng kỹ thuật trên cùng</text><line class="dim" x1="120" y1="230" x2="120" y2="70"/><line class="dim" x1="112" y1="70" x2="175" y2="70"/><path class="arr" d="M120 70 l-4 8 h8z M120 230 l-4 -8 h8z"/><text x="14" y="146" class="b">Chiều cao</text><text x="14" y="162" class="b">PCCC</text><text x="256" y="62" class="s">Mép dưới cửa</text><text x="256" y="75" class="s">sổ tầng trên</text><text x="256" y="88" class="s">cùng</text></svg>`, cap: "Đo từ mặt đường thấp nhất cho xe chữa cháy tiếp cận tới mép dưới cửa sổ tầng trên cùng, không tính tầng kỹ thuật trên cùng. Không có cửa sổ: lấy 1/2 tổng khoảng cách tới sàn và trần tầng trên cùng. Mái có khai thác sử dụng: tính tới mép trên tường bao mái; có lan can: tới mép trên lan can." },
  "buong-thang": { t: "Buồng thang không nhiễm khói N1, N2, N3", ref: "2.4.3.3, 3.4.13", svg: `<svg viewBox="0 0 360 180" class="dg"><rect class="st" x="10" y="20" width="62" height="80"/><text x="30" y="64" class="b">N1</text><rect class="air" x="72" y="40" width="34" height="40"/><text x="10" y="122" class="s">Vào qua vùng đệm</text><text x="10" y="135" class="s">hở ngoài trời</text><rect class="st pos" x="140" y="20" width="70" height="80"/><text x="160" y="58" class="b">N2</text><text x="150" y="78" class="s">+ áp suất</text><text x="136" y="122" class="s">Buồng thang</text><text x="136" y="135" class="s">tăng áp</text><rect class="st" x="250" y="20" width="70" height="60"/><text x="272" y="54" class="b">N3</text><rect class="lob pos" x="250" y="80" width="70" height="26"/><text x="258" y="97" class="s">Khoang đệm</text><text x="244" y="122" class="s">Vào qua khoang</text><text x="244" y="135" class="s">đệm tăng áp</text><text x="10" y="168" class="s">Nét đứt: có áp suất không khí dương khi cháy</text></svg>`, cap: "Nhà cao PCCC trên 28 m (và F5 hạng A, B) phải có buồng thang không nhiễm khói, trong đó phải có N1. N1 được thay bằng lối vào qua khoang đệm, cả khoang đệm và buồng thang có áp suất dương khi cháy, cấp khí độc lập. Từ 2 tầng hầm: N3, hoặc N2 có khoang đệm như khoang đệm ngăn cháy loại 1." },
  "vung-dem": { t: "Vùng đệm của buồng thang N1 ở góc nhà", ref: "3.4.10", svg: `<svg viewBox="0 0 340 210" class="dg"><path class="w" d="M20 190 V70 H200 V20 H330"/><rect class="win" x="40" y="66" width="34" height="8"/><text x="40" y="92" class="s">Cửa sổ</text><rect class="air" x="124" y="70" width="76" height="44"/><text x="128" y="96" class="s">Vùng đệm hở</text><rect class="st" x="200" y="70" width="80" height="70"/><text x="214" y="110" class="b">Buồng N1</text><circle class="pt" cx="200" cy="70" r="4"/><line class="dim" x1="74" y1="56" x2="124" y2="56"/><text x="76" y="50" class="s">≥ 2 m</text><line class="dim" x1="124" y1="44" x2="200" y2="44"/><text x="128" y="38" class="s">≥ 4 m tới đỉnh góc</text><text x="20" y="158" class="s">Góc tường &lt; 135°</text><text x="20" y="176" class="s">Lối đi ≥ 1,2 m, lan can 1,2 m</text></svg>`, cap: "Vùng đệm hở thông ngoài trời ở góc trong của nhà: cửa vùng đệm cách đỉnh góc ≥ 4 m khi góc < 135° (giảm được bằng phần tường nhô ra; không áp dụng khi phần nhô ≤ 1,2 m); tường giữa cửa vùng đệm và cửa sổ gần nhất ≥ 2 m; lối đi rộng ≥ 1,2 m, lan can 1,2 m." },
  "dai-ngan-chay": { t: "Đai ngăn cháy giữa các tầng ở mặt ngoài", ref: "4.33.1", svg: `<svg viewBox="0 0 340 230" class="dg"><rect class="w" x="20" y="20" width="90" height="170"/><rect class="win" x="40" y="30" width="50" height="45"/><rect class="solid" x="40" y="75" width="50" height="40"/><rect class="win" x="40" y="115" width="50" height="45"/><line class="dim" x1="100" y1="75" x2="100" y2="115"/><text x="104" y="99" class="s">≥ 1,0 m</text><text x="20" y="208" class="s">a) Tường đặc</text><text x="20" y="222" class="s">không cháy</text><rect class="w" x="150" y="20" width="60" height="170"/><rect class="win" x="160" y="30" width="40" height="55"/><rect class="solid" x="210" y="92" width="44" height="8"/><rect class="win" x="160" y="105" width="40" height="55"/><line class="dim" x1="210" y1="82" x2="254" y2="82"/><text x="212" y="76" class="s">≥ 0,6 m</text><text x="150" y="208" class="s">b) Ô văng</text><rect class="w" x="278" y="20" width="44" height="170"/><rect class="win" x="285" y="30" width="30" height="150"/><circle class="spk" cx="300" cy="100" r="5"/><text x="268" y="208" class="s">c) Kính 6 mm</text><text x="268" y="222" class="s">+ sprinkler</text></svg>`, cap: "Bắt buộc với tường ngoài có lỗ mở không phải cửa ngăn cháy, trừ nhà ≤ 3 tầng hoặc cao PCCC < 15 m, gara nổi dạng hở, nhà có chữa cháy tự động (4.33.4). Sprinkler phía trong cách nhau ≤ 2 m, cách mặt kính ≤ 0,5 m." },
  "loi-ra": { t: "Bố trí phân tán hai lối ra", ref: "3.2.8", svg: `<svg viewBox="0 0 340 210" class="dg"><text x="30" y="20" class="b">≥ D/2 (có sprinkler: ≥ D/3)</text><rect class="w" x="30" y="40" width="280" height="140"/><line class="diag" x1="30" y1="180" x2="310" y2="40"/><text x="200" y="80" class="s">Đường chéo D</text><rect class="exit" x="30" y="70" width="8" height="30"/><rect class="exit" x="200" y="176" width="40" height="8"/><line class="dim" x1="34" y1="70" x2="240" y2="180"/><text x="44" y="64" class="s">Lối ra 1</text><text x="246" y="200" class="s">Lối ra 2</text></svg>`, cap: "Khi cần ≥ 2 lối ra, hai lối ra phải cách nhau ≥ 1/2 đường chéo lớn nhất của mặt bằng gian, phần nhà hoặc tầng (nhà có sprinkler toàn bộ: ≥ 1/3). Đo đường thẳng giữa hai cạnh xa nhất (≥ 7 m); nếu < 7 m thì đo giữa hai cạnh gần nhất. Hai buồng thang nối bằng hành lang: đo dọc hành lang." },
  "bai-do": { t: "Đường xe, bãi đỗ xe chữa cháy, lối vào từ trên cao", ref: "6.2, 6.3", svg: `<svg viewBox="0 0 340 220" class="dg"><rect class="w" x="40" y="20" width="250" height="110"/><text x="140" y="76" class="b">Nhà</text><rect class="road" x="20" y="160" width="300" height="40"/><text x="80" y="185" class="s">Bãi đỗ xe chữa cháy (rộng ≥ 6 m)</text><g class="ent"><rect x="70" y="126" width="24" height="8"/><rect x="160" y="126" width="24" height="8"/><rect x="250" y="126" width="24" height="8"/></g><line class="dim" x1="82" y1="116" x2="172" y2="116"/><text x="106" y="110" class="s">≤ 20 m</text><line class="dim" x1="300" y1="134" x2="300" y2="160"/><text x="304" y="146" class="s">2 –</text><text x="304" y="158" class="s">10 m</text><text x="20" y="214" class="s">Đường xe rộng ≥ 3,5 m, cao thông thủy ≥ 4,5 m</text></svg>`, cap: "Mép đường xe cách tường nhà ≤ 5 m (cao < 12 m), ≤ 8 m (12 – 28 m), ≤ 10 m (> 28 m). Bãi đỗ cách điểm giữa lối vào từ trên cao 2 – 10 m, dốc ≤ 1:15. Lối vào từ trên cao rộng ≥ 850 mm, cao ≥ 1 000 mm, mép dưới ≤ 1 100 mm, mỗi 20 m bãi đỗ có ít nhất một lối (không áp dụng nhà F1.3)." }
};
function renderDiagrams(focus) {
  setHeader("Sơ đồ minh họa"); setNav("tra-nhanh");
  view.innerHTML = `<p class="intro">Sơ đồ minh họa nguyên tắc, không theo tỷ lệ. Bấm số điều để mở nội dung trong sổ tay.</p>` + Object.entries(DIAGS).map(([id, d]) => `<section class="quick dgbox" id="dg-${id}"><h2>${d.t}</h2>${d.svg}<p class="note">${esc(d.cap)}</p><span class="refs">${refHTML(d.ref)}</span></section>`).join("");
  if (focus) { const el = document.getElementById("dg-" + focus); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); } else window.scrollTo(0, 0);
}

curReport = store.get("pccc-report-draft", null);
/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.value.trim()) return renderSearch(q.value.trim());
  if (!h || h === "home") return renderHome();
  if (h === "tra-nhanh") return renderQuick();
  if (h === "cong-trinh") return renderCT();
  if (h === "hon-hop") return renderMX();
  if (h === "gian-phong") return renderGP();
  if (h === "du-an") return renderProjects();
  if (h === "phieu") return renderReport();
  if (h === "so-do") return renderDiagrams();
  if (h === "da-luu") return renderSaved();
  if (SECTIONS[h]) return renderSection(h);
  renderHome();
}
function go(hash, block) {
  q.value = ""; clearQ.hidden = true;
  if (block) { const sid = block.split("--")[0]; if (location.hash.slice(1) !== sid) history.replaceState(null, "", "#" + sid); renderSection(sid, block); return; }
  if (location.hash.slice(1) === hash) route(); else location.hash = hash;
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) { e.preventDefault(); e.stopPropagation(); const id = star.dataset.star;
    saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]; store.set("pccc-saved", saved);
    const on = saved.includes(id); star.setAttribute("aria-pressed", on); star.setAttribute("aria-label", on ? "Bỏ lưu" : "Lưu mục này"); return; }
  const rf = e.target.closest("[data-ref]"); if (rf) { e.preventDefault(); q.value = resolveRef(rf.dataset.ref); clearQ.hidden = false; renderSearch(q.value); window.scrollTo(0, 0); return; }
  const dg = e.target.closest("[data-diag]"); if (dg) { e.preventDefault(); history.replaceState(null, "", "#so-do"); renderDiagrams(dg.dataset.diag); return; }
  const rpb = e.target.closest("[data-report]"); if (rpb) { const k = rpb.dataset.report; if (k === "ct") ctSync(false); if (k === "mx") mxSync(false); if (k === "gp") gpSync(false); curReport = reportFrom(k); store.set("pccc-report-draft", curReport); go("phieu"); return; }
  if (e.target.id === "rpsave") { reportSync(); const i = projects.findIndex(p => p.id === curReport.id); const copy = JSON.parse(JSON.stringify(curReport)); if (i >= 0) projects[i] = copy; else projects.unshift(copy); store.set("pccc-projects", projects); document.getElementById("rpmsg").textContent = "Đã lưu vào Dự án trên thiết bị này."; return; }
  if (e.target.id === "rpcopy") { reportSync(); copyText(reportText(true)); return; }
  if (e.target.id === "rpcopytxt") { reportSync(); copyText(reportText(false)); return; }
  const pj = e.target.closest("[data-proj]"); if (pj) { curReport = JSON.parse(JSON.stringify(projects[+pj.dataset.proj])); store.set("pccc-report-draft", curReport); go("phieu"); return; }
  const pd = e.target.closest("[data-projdel]"); if (pd) { if (pd.dataset.confirm) { projects.splice(+pd.dataset.projdel, 1); store.set("pccc-projects", projects); renderProjects(); } else { pd.dataset.confirm = "1"; pd.textContent = "Bấm lần nữa để xóa"; } return; }
  if (e.target.id === "mxadd") { mxSync(false); mxV.parts.push({ i: 25, from: 1, to: 1, a: 1000, p: "" }); store.set("pccc-mx", mxV); renderMX(); return; }
  const md_ = e.target.closest("[data-mxdel]"); if (md_) { mxSync(false); mxV.parts.splice(+md_.dataset.mxdel, 1); store.set("pccc-mx", mxV); renderMX(); return; }
  const pk = e.target.closest("[data-ct]"); if (pk) { ctSync(false); ctV.i = +pk.dataset.ct; ctQ = ""; store.set("pccc-ct", ctV); renderCT(); window.scrollTo(0, 0); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.preventDefault(); go(null, op.dataset.open); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest("[data-nav]"); if (n) { go(n.dataset.nav === "home" ? "home" : n.dataset.nav); return; }
  const bac = e.target.closest("[data-bac]"); if (bac) { qBac = bac.dataset.bac; store.set("pccc-bac", qBac); renderQuick(); return; }
  const hh = e.target.closest("[data-h]"); if (hh) { qH = +hh.dataset.h; store.set("pccc-h", qH); renderQuick(); return; }
  const chip = e.target.closest("[data-chip]"); if (chip) { q.value = chip.dataset.chip; clearQ.hidden = false; renderSearch(q.value); return; }
  if (e.target.id === "resetCk") { view.querySelectorAll("input[data-ck]").forEach(b => { b.checked = false; delete checks[b.dataset.ck]; }); store.set("pccc-checks", checks); updateProgress(); }
});
document.addEventListener("change", e => {
  const ck = e.target.closest("input[data-ck]"); if (!ck) return;
  if (ck.checked) checks[ck.dataset.ck] = 1; else delete checks[ck.dataset.ck];
  store.set("pccc-checks", checks); updateProgress();
});
backBtn.addEventListener("click", () => go("home"));
let tmr;
document.addEventListener("input", e => {
  if (e.target.id === "ctq") { ctQ = e.target.value; document.getElementById("ctlist").innerHTML = ctList(); return; }
  if (e.target.closest && e.target.closest(".ct-form") && e.target.type === "number" && document.getElementById("cth")) ctSync(false);
});
document.addEventListener("input", e => {
  if (!e.target.closest) return;
  if (e.target.closest(".mx-form") && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { mxSync(false); return; }
  if (document.getElementById("gpg") && e.target.closest(".ct-form") && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { gpSync(false); return; }
  if (e.target.classList && e.target.classList.contains("rpnote") || ["rpname", "rpauthor"].includes(e.target.id)) { reportSync(); return; }
});
document.addEventListener("change", e => {
  if (!e.target.closest) return;
  if (e.target.closest(".mx-form")) { mxSync(e.target.classList.contains("mxi")); return; }
  if (document.getElementById("gpg") && e.target.closest(".ct-form")) { gpSync(["gpg"].includes(e.target.id)); return; }
  if (e.target.classList.contains("rpst") || e.target.id === "rpdate") { reportSync(); return; }
  if (!e.target.closest(".ct-form")) return;
  if (e.target.id === "cthang") { ctSync(true); return; }
  if (e.target.tagName === "SELECT" || e.target.type === "checkbox") ctSync(false);
});
document.addEventListener("input", e => { if (e.target.id === "fq") { qF = e.target.value; document.getElementById("fres").innerHTML = fRows(qF); } });
q.addEventListener("input", () => { clearQ.hidden = !q.value; clearTimeout(tmr); tmr = setTimeout(() => q.value.trim() ? renderSearch(q.value.trim()) : route(), 120); });
clearQ.addEventListener("click", () => { q.value = ""; clearQ.hidden = true; route(); q.focus(); });

route();
</script>
