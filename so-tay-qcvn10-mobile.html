<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QCVN 10">
<meta name="format-detection" content="telephone=no">
<title>Sổ tay QCVN 10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#b42318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột kiểu ứng dụng điện thoại — thanh đầu dính có ô tìm, nội dung là các khối gập mở, thanh điều hướng dưới đáy. */
:root {
  --bg: #f4ecda; --panel: #fffdf8; --tint: #ebe1cb; --line: #d8c9ab;
  --ink: #1f1a17; --muted: #5e554d;
  --fire: #b42318; --fire-bg: #fde4e1; --on-fire: #ffffff;
  --exit: #067647; --exit-bg: #dcf5e7;
  --amber: #f2a516; --amber-ink: #7a5000; --amber-bg: #fff1d1;
  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-h: 60px;
}
/* Mặc định nền be (sáng) trên mọi máy; chỉ tối khi người dùng chọn "Tối" hoặc "Theo máy" (máy đang tối). */
@media (prefers-color-scheme: dark) { :root[data-mau="may"] {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; } }
:root[data-mau="toi"] {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fire); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fire); color: var(--on-fire); padding-block: 10px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 32px; }
.brand h1 { font-size: 17px; line-height: 1.2; font-weight: 800; margin: 0; flex: 1; min-width: 0; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
.back { border: 0; background: transparent; color: inherit; width: 36px; height: 36px; margin-left: -8px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.back svg { width: 22px; height: 22px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border-radius: 10px; border: 0; padding: 0 40px 0 40px; font: inherit; font-size: 16px; background: var(--panel); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search .ico { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 20px; line-height: 1; }

main { padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* Bottom nav */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .row { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 760px; margin: 0 auto; height: var(--nav-h); }
nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--fire); }

/* Home */
.intro { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.label:first-child { margin-top: 0; }
.toc { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toc li + li { border-top: 1px solid var(--line); }
.toc button { width: 100%; text-align: left; border: 0; background: transparent; display: grid; grid-template-columns: 36px 1fr 16px; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; min-height: 60px; }
.toc .num { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; background: var(--tint); color: var(--ink); }
.toc .num.f { background: var(--fire-bg); color: var(--fire); }
.toc .num.x { background: var(--exit-bg); color: var(--exit); }
.toc .num.a { background: var(--amber-bg); color: var(--amber-ink); }
.toc b { display: block; font-size: 15px; line-height: 1.3; }
.toc span.d { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.toc .chev { color: var(--muted); }

/* Quick lookup */
.quick { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.quick h2 { font-size: 15px; margin: 0 0 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { min-width: 44px; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; font-family: var(--mono); }
.seg button[aria-pressed="true"] { background: var(--fire); border-color: var(--fire); color: var(--on-fire); }
.kv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv dt { color: var(--muted); padding-right: 12px; }
.kv dd { font-family: var(--mono); font-weight: 500; text-align: right; color: var(--fire); }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.quick .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Article */
.doc h1.page { font-size: 24px; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.doc details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; }
.doc summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 14px; position: relative; font-weight: 700; font-size: 16px; line-height: 1.35; }
.doc summary::-webkit-details-marker { display: none; }
.doc summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
.doc details[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
.doc .body { padding: 0 14px 14px; min-width: 0; }
.doc .lead { margin-bottom: 12px; }
.doc h3 { font-size: 15px; margin: 18px 0 6px; }
.doc p { margin: 0 0 10px; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 20px; }
.doc li { margin: 4px 0; }
.doc blockquote { margin: 0 0 12px; padding: 10px 12px; background: var(--tint); border-radius: 8px; font-size: 14px; }
.doc blockquote p:last-child { margin: 0; }
.doc code { font-family: var(--mono); font-size: 12.5px; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.doc a { color: var(--fire); font-weight: 600; text-underline-offset: 2px; }
.tbl { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
.tbl table { border-collapse: collapse; font-size: 13.5px; line-height: 1.4; min-width: 100%; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--tint); font-size: 12.5px; font-weight: 700; white-space: normal; min-width: 88px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child, .tbl th:first-child { position: sticky; left: 0; background: var(--panel); box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--tint); }
.tbl td { font-variant-numeric: tabular-nums; min-width: 80px; }
.tbl.wide td { min-width: 96px; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
.flag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--amber-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
.amend { display: inline-block; font-size: 11px; font-weight: 700; color: var(--fire); background: var(--fire-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
mark { background: var(--amber-bg); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--amber); }

/* Checklist */
.check { list-style: none; padding: 0 !important; }
.check li { margin: 0; border-top: 1px solid var(--line); }
.check li:first-child { border-top: 0; }
.check label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 10px 0; cursor: pointer; align-items: start; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--exit); }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--exit); width: 0; transition: width .2s; }
.reset { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; }

/* Save star */
.star { position: absolute; right: 40px; top: 8px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.star svg { width: 20px; height: 20px; }
.star[aria-pressed="true"] { color: var(--amber); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.doc summary { padding-right: 84px; }

/* Search results */
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.results button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.results .sec { font-size: 12px; color: var(--muted); font-weight: 600; }
.results .ttl { font-weight: 700; display: block; margin: 2px 0 4px; }
.results .snip { font-size: 13.5px; color: var(--ink); display: block; line-height: 1.45; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

.mau { display: flex; gap: 6px; justify-content: center; margin: 14px 0 0; flex-wrap: wrap; }
.mau button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.mau button[aria-pressed=true] { background: var(--fire); color: var(--on-fire); border-color: var(--fire); }
.ver { margin: 6px 0 0; font-size: 12px; color: var(--muted); text-align: center; font-family: var(--mono); }
.disclaimer { font-size: 12.5px; color: var(--amber-ink); background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin: 16px 0 0; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pager button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; font-size: 13px; min-height: 56px; }
.pager button.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); font-size: 11.5px; }


/* Tra theo công trình */
.ct-cta { width: 100%; text-align: left; border: 0; border-radius: 12px; padding: 14px 16px; margin: 0 0 8px; background: var(--fire); color: var(--on-fire); cursor: pointer; display: grid; gap: 4px; }
.ct-cta b { font-size: 16px; } .ct-cta span { font-size: 13px; opacity: .9; line-height: 1.4; }
.ct-form { display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.fld input, .fld select { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); font-weight: 500; }
.fld .inp { position: relative; display: block; } .fld .inp input { padding-right: 48px; }
.fld .inp i { position: absolute; right: 10px; top: 11px; font-style: normal; color: var(--muted); font-weight: 500; font-size: 13px; }
.fld .sel { font-size: 16px; color: var(--ink); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.fld .sel b, .pick b { font-family: var(--mono); color: var(--fire); font-weight: 500; font-size: 13px; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picks { display: grid; gap: 6px; } .picks:empty { display: none; }
.pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.checks { display: grid; gap: 8px; font-size: 14px; } .checks label { display: flex; gap: 10px; align-items: center; }
.checks input { width: 20px; height: 20px; accent-color: var(--fire); flex: none; }
.ct-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.ct-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
.ct-sec h2 { font-size: 15px; margin: 0 0 6px; }
.ct-sec ul { list-style: none; margin: 0; padding: 0; }
.ct-sec li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; display: grid; gap: 4px; }
.ct-sec li:first-child { border-top: 0; }
.ct-sec code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.lv { justify-self: start; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; line-height: 18px; }
.lv-ok .lv { background: var(--exit-bg); color: var(--exit); }
.lv-warn .lv { background: var(--amber-bg); color: var(--amber-ink); }
.lv-bad .lv { background: var(--fire-bg); color: var(--fire); }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }

/* Mở rộng */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--tint); padding: 4px; border-radius: 10px; margin: 0 0 12px; }
.tabs button { border: 0; background: transparent; height: 36px; border-radius: 7px; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: var(--muted); padding: 0 4px; font-family: var(--sans); min-width: 0; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-family: var(--mono); font-size: 11.5px; line-height: 1; padding: 5px 7px; border-radius: 6px; cursor: pointer; }
.ref:hover { color: var(--fire); border-color: var(--fire); }
.ref.dg { font-family: var(--sans); font-weight: 600; color: var(--exit); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.btn1, .btn2 { height: 40px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: var(--sans); }
.btn1 { border: 0; background: var(--fire); color: var(--on-fire); }
.btn2 { border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.link-btn { border: 0; background: transparent; color: var(--fire); font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px 0; justify-self: start; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.parts { display: grid; gap: 10px; }
.part { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.part .fld input, .part .fld select { background: var(--panel); }
.part-h { font-size: 15px; margin: 18px 0 8px; } .part-h span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; font-family: var(--mono); }
.rp { display: grid; gap: 8px; margin-top: 12px; }
.rp-row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }
.rp-row.st-ok { box-shadow: inset 0 0 0 2px var(--exit-bg); } .rp-row.st-bad { box-shadow: inset 0 0 0 2px var(--fire-bg); } .rp-row.st-na { opacity: .7; }
.rp-ctl { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 8px; }
.rp-ctl select, .rp-ctl input, .fld input[type=date], #rpname, #rpauthor { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font: inherit; font-size: 15px; background: var(--bg); color: var(--ink); width: 100%; }
.proj { display: grid; gap: 4px; } .proj > button:first-child { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.dgbox svg { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
.dg text { fill: var(--ink); font-family: var(--sans); font-size: 11px; } .dg text.s { font-size: 10px; fill: var(--muted); } .dg text.b { font-weight: 700; font-size: 12px; }
.dg .g, .dg .fl line { stroke: var(--line); stroke-width: 1.5; } .dg .w { fill: var(--tint); stroke: var(--ink); stroke-width: 1.5; } .dg path.w { fill: none; }
.dg .road { fill: var(--line); } .dg .win { fill: var(--panel); stroke: var(--muted); } .dg .tech { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 3 2; }
.dg .dim, .dg .diag { stroke: var(--fire); stroke-width: 1.5; } .dg .diag { stroke-dasharray: 5 3; stroke: var(--muted); } .dg .arr { fill: var(--fire); }
.dg .st { fill: var(--exit-bg); stroke: var(--exit); stroke-width: 1.5; } .dg .pos { stroke-dasharray: 4 2; } .dg .air { fill: var(--panel); stroke: var(--exit); stroke-dasharray: 2 2; }
.dg .lob { fill: var(--exit-bg); stroke: var(--exit); } .dg .cor { stroke: var(--muted); stroke-width: 6; opacity: .3; }
.dg .solid { fill: var(--fire-bg); stroke: var(--fire); } .dg .spk { fill: var(--fire); } .dg .exit { fill: var(--exit); } .dg .pt { fill: var(--fire); } .dg .ent rect { fill: var(--amber); }
@media (max-width: 420px) { .grid4 { grid-template-columns: 1fr 1fr; } .rp-ctl { grid-template-columns: 1fr; } }

/* Sơ đồ kiểu bản vẽ */
.dg .wallthick { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linejoin: miter; }
.dg .fillroom { fill: var(--tint); }
.dg .wallr { fill: var(--panel); stroke: var(--ink); stroke-width: 3.5; }
.dg .wall2 { stroke: var(--ink); stroke-width: 3.5; }
.dg .gap { stroke: var(--panel); stroke-width: 6; }
.dg .leaf { stroke: var(--ink); stroke-width: 1.6; }
.dg .swing { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 2; }
.dg .stair { fill: var(--exit-bg); stroke: var(--exit); stroke-width: 1; }
.dg .tread { stroke: var(--exit); stroke-width: .8; }
.dg .up { fill: none; stroke: var(--exit); stroke-width: 1.4; }

const DATA = {"README.md": "# Sổ tay QCVN 10:2025/BCA\n\nTra cứu nhanh **trang bị, bố trí phương tiện PCCC và CNCH cho nhà và công trình** theo **QCVN 10:2025/BCA**, ban hành kèm **Thông tư 103/2025/TT-BCA** ngày **04/11/2025**, hiệu lực từ **30/12/2025**. Thư mục tài liệu tham khảo của quy chuẩn gồm **TCVN 3890:2023** cùng các tiêu chuẩn Nga, Trung Quốc, Singapore, Hàn Quốc.\n\n> **Nguồn đối chiếu**: bản scan QCVN 10:2025/BCA kèm Thông tư 103/2025/TT-BCA (64 trang). Mọi giá trị kèm số điều, số bảng để tra lại nguyên văn. Sổ tay là bản **tóm tắt**, không thay thế quy chuẩn.\n\n## Hiệu lực và chuyển tiếp (Điều 2 TT 103/2025/TT-BCA)\n\n| Trường hợp | Áp dụng |\n| --- | --- |\n| Hồ sơ thiết kế đã được **thẩm duyệt, thẩm định** về PCCC **trước 30/12/2025** | Tiếp tục theo hồ sơ đã thẩm duyệt |\n| Công trình **không thuộc diện thẩm duyệt**, đã cấp phép xây dựng, tổ chức thi công hoặc nghiệm thu đưa vào sử dụng trước 30/12/2025 | Theo tiêu chuẩn, quy chuẩn **có hiệu lực tại thời điểm** cấp phép, thi công hoặc đưa vào sử dụng |\n| Nhà đã nghiệm thu, nay **cải tạo** làm tăng quy mô, đổi công năng, đổi hạng nguy hiểm cháy nổ, hoặc cải tạo hệ thống PCCC | **Được áp dụng** QCVN 10:2025 cho **bộ phận, khu vực trực tiếp cải tạo** |\n\n## Cách dùng sổ tay — trình tự 6 bước\n\n| Bước | Câu hỏi | Mục tra cứu |\n| --- | --- | --- |\n| 1 | Công trình thuộc **phạm vi**? Nhóm **F**, hạng **A – E** (QCVN 06)? **Số tầng** (1.4.24), **chiều cao PCCC**, **diện tích sàn**, **khối tích**? Có phải **nhà hỗn hợp** (quy tắc 70 %)? | [Quy định chung](01-quy-dinh-chung.md) |\n| 2 | **Báo cháy, chữa cháy tự động**: Bảng **A.1** (nhà) → **A.2** (hạng mục) → **A.3** (gian phòng) → **A.4** (thiết bị); loại trừ theo 1.5.11 | [Phụ lục A](03-phu-luc-a.md) |\n| 3 | **Họng nước trong nhà** (Bảng B.1) và **cấp nước ngoài nhà** (Bảng C.1; miễn khi trong bán kính 400 m) | [Phụ lục B, C](04-phu-luc-b-c.md) |\n| 4 | **Lưu lượng, số tia, áp suất, trụ nước, bể** | [H.1 Ngoài nhà](06-h1-nuoc-ngoai-nha.md) · [H.2 Trong nhà](07-h2-hong-nuoc.md) |\n| 5 | **Bình chữa cháy**, chiếu sáng sự cố, đường ống khô, công trình đang thi công | [Trang bị — Phần 2](02-trang-bi.md) |\n| 6 | **Loa thông báo** (G.1), **phá dỡ** (E.1), **mặt nạ** (F.1), **xe, tàu, bơm** (D.1); trạm bơm | [Phụ lục D – G](05-phu-luc-d-g.md) · [H.3, H.4](08-h3-h4-bom-loa.md) |\n\nChung cư, nhà kho, nhà xưởng: xem ngay [Tra nhanh chung cư, kho, xưởng](09-chung-cu-kho-xuong.md).\n\nDùng thẻ **Tra theo công trình** để chọn loại nhà, nhập số tầng, diện tích, chiều cao PCCC và nhận danh sách trang bị bắt buộc kèm số điều.\n\n## Giọng văn của sổ tay\n\n- **Một dòng – một yêu cầu – một con số – một điều khoản.** Ví dụ: *Khách sạn ≥ 3 tầng hoặc ≥ 700 m² phải có báo cháy tự động (Bảng A.1 mục 18).*\n- \"**≥**\" là \"từ … trở lên\", \"**>**\" là \"lớn hơn\", \"**≤**\" là \"không quá\" — đúng như cách viết của quy chuẩn.\n- \"**Không phụ thuộc diện tích**\" — bắt buộc với mọi quy mô. \"**—**\" trong bảng Phụ lục A — **không bắt buộc**.\n- **TBĐL** — thiết bị báo cháy độc lập.\n- Đơn vị viết theo TCVN: dấu phẩy thập phân (2,5 L/s).\n\n## Cấu trúc QCVN 10:2025/BCA\n\n| Phần | Nội dung |\n| --- | --- |\n| 1 | Quy định chung — phạm vi, đối tượng, viện dẫn, thuật ngữ, yêu cầu chung (Bảng 1, 2) |\n| 2 | Trang bị, bố trí: báo cháy (2.1); chiếu sáng sự cố, loa (2.2); nước ngoài nhà (2.3); họng nước trong nhà (2.4); chữa cháy tự động (2.5); bình chữa cháy (2.6); phá dỡ, mặt nạ (2.7); cơ giới (2.8) |\n| 3 | Quy định về quản lý |\n| 4 | Tổ chức thực hiện |\n| PL A | Báo cháy tự động, TBĐL, chữa cháy tự động, thiết bị tự động kích hoạt (A.1 – A.4) |\n| PL B | Họng nước chữa cháy trong nhà (B.1) |\n| PL C | Cấp nước chữa cháy ngoài nhà (C.1) |\n| PL D | Phương tiện chữa cháy cơ giới (D.1) |\n| PL E | Dụng cụ phá dỡ thô sơ (E.1) |\n| PL F | Mặt nạ lọc độc, mặt nạ phòng độc cách ly (F.1) |\n| PL G | Loa thông báo và hướng dẫn thoát nạn (G.1) |\n| PL H | Thiết kế, lắp đặt: H.1 nước ngoài nhà; H.2 họng nước trong nhà; H.3 trạm bơm; H.4 loa |\n\n## Ký hiệu\n\n| Ký hiệu | Nghĩa |\n| --- | --- |\n| **F1.1 … F5** | Nhóm nguy hiểm cháy theo công năng (QCVN 06) |\n| **A, B, C1 – C4, D, E** | Hạng nguy hiểm cháy và cháy nổ (QCVN 06) |\n| **S0 … S3** | Cấp nguy hiểm cháy kết cấu của nhà |\n| **REI, EI** | Giới hạn chịu lửa (chịu lực, toàn vẹn, cách nhiệt) |\n| **TBĐL** | Thiết bị báo cháy độc lập |\n| **DN** | Đường kính danh nghĩa (mm) |\n| **CT** | Chú thích của bảng |\n", "01-quy-dinh-chung.md": "# 1. Quy định chung\n\nPhần 1 của QCVN 10:2025/BCA — phạm vi, thuật ngữ, phân loại đám cháy, chất chữa cháy và các quy tắc chung để xác định trang bị.\n\n## 1.1 Phạm vi và đối tượng áp dụng (1.1, 1.2)\n\n- Quy định **trang bị, bố trí** phương tiện PCCC và CNCH cho nhà, công trình, hạ tầng kỹ thuật về PCCC của khu đô thị, khu nhà ở, khu dân cư, KCN, CCN, khu du lịch, khu nghiên cứu – đào tạo, khu TDTT (gọi chung là **nhà, công trình**) (1.1.1).\n- Áp dụng khi: **xây dựng mới**; **cải tạo làm tăng quy mô** hoặc **thay đổi công năng** hoặc **thay đổi hạng nguy hiểm cháy nổ** của gian phòng, nhà, công trình; cải tạo làm tăng quy mô của khu đô thị, khu nhà ở, KCN… (1.1.1).\n- Công trình quốc phòng, an ninh (BQP, BCA quản lý): **được lựa chọn** áp dụng (1.1.2).\n- Có QCVN riêng cho loại công trình cụ thể → áp dụng QCVN đó (1.1.3).\n- Quy chuẩn chưa quy định → áp dụng TCVN, tiêu chuẩn quốc tế, khu vực, nước ngoài theo pháp luật về tiêu chuẩn, quy chuẩn (1.1.4).\n- **Công trình đặc thù** (nhà máy điện; cơ sở hạt nhân; vật liệu nổ công nghiệp, tiền chất thuốc nổ; cơ sở khai thác, chế biến, sản xuất, vận chuyển, kinh doanh, bảo quản dầu mỏ, sản phẩm dầu mỏ, khí đốt trên đất liền; kho dầu mỏ, khí đốt; cảng xuất, nhập dầu mỏ, khí đốt; **bãi đỗ xe**): ngoài quy chuẩn này được chọn thêm tiêu chuẩn để áp dụng (1.1.5).\n- **Thay thế yêu cầu** bằng luận chứng kỹ thuật (giải pháp bổ sung, thay thế) → phải được chấp thuận: công trình tại khoản 1 Điều 9 TT 36/2025/TT-BCA → **Cục C07**; công trình khoản 2 Điều 9 (không thuộc diện thẩm duyệt nhưng phải trang bị) → **Phòng PC07 Công an cấp tỉnh** (1.1.6).\n\n**Văn bản ban hành**: Thông tư **103/2025/TT-BCA** ngày **04/11/2025** của Bộ Công an. Cục C07 chủ trì biên soạn, Bộ KH&CN thẩm định.\n\n## 1.2 Tài liệu viện dẫn chính (1.3)\n\n| Lĩnh vực | Tài liệu |\n| --- | --- |\n| Pháp lý | NĐ **105/2025/NĐ-CP**; TT **36/2025/TT-BCA** (cùng ngày 15/5/2025) |\n| Phân loại nhà, chiều cao PCCC | **QCVN 06:/BXD** (phiên bản mới nhất) |\n| Báo cháy | TCVN **7568-14** (thiết kế, lắp đặt); TCVN **7568-25** (vô tuyến) |\n| Chiếu sáng sự cố, chỉ dẫn thoát nạn | TCVN **13456** |\n| Bình chữa cháy | TCVN **7026** (xách tay), **7027** (có bánh xe), **7435-1** (lựa chọn, bố trí), **12314** (tự động kích hoạt) |\n| Chữa cháy nước, bọt | TCVN **7336**; TCVN **14496** (kho giá cao > 5,5 – 25 m); NFPA **15** (phun nước cố định) |\n| Khí, sol-khí, bột, sương | TCVN **6100**, **6101** (CO₂); **7161** (khí); **13333** (sol-khí); **13877-2** (bột); **13657-1** (sương cao áp); **13926** (package) |\n| Trụ nước | TCVN **6379** |\n| Xe, bơm, mặt nạ | TCVN **13316** (xe ô tô CC); **12110** (bơm khiêng tay); **13332** (mặt nạ trùm) |\n| Diện tích, khối tích | TCVN **9255** |\n| Nhà ở riêng lẻ | TCVN **13967** |\n\n## 1.3 Thuật ngữ cần nhớ (1.4)\n\n| Thuật ngữ | Nghĩa tóm tắt | Điều |\n| --- | --- | --- |\n| Hệ thống chữa cháy tự động | Tự kích hoạt xả chất chữa cháy khi yếu tố đám cháy đạt ngưỡng; có giám sát xả và dừng xả/dừng kích hoạt (nước, gốc nước, bọt, khí, sol-khí, bột) | 1.4.4 |\n| Thiết bị chữa cháy tự động kích hoạt | Bình khí, bột, sol-khí tự xả khi bộ phận cảm biến nhiệt đạt ngưỡng | 1.4.5 |\n| Họng nước chữa cháy trong nhà | Vòi, lăng, đầu nối, van lắp sẵn để đưa nước đến đám cháy | 1.4.6 |\n| Hệ thống báo cháy tự động | Trung tâm, đầu báo, nút ấn, chuông đèn, bộ phận liên kết, nguồn; gồm **báo cháy thường** (báo theo khu vực) và **báo cháy địa chỉ** (báo đến từng thiết bị) | 1.4.8 – 1.4.10 |\n| Thiết bị báo cháy độc lập | Tự phát hiện và cảnh báo bằng âm thanh. Lắp nhiều thiết bị trong cùng nhà → **phải liên kết**, cùng phát tín hiệu | 1.4.11 |\n| Mặt nạ lọc độc | Bảo vệ hô hấp trong thời gian và giới hạn nồng độ ô xy nhất định | 1.4.12 |\n| Mặt nạ phòng độc cách ly | Mặt trùm toàn bộ khuôn mặt + bình khí thở | 1.4.13 |\n| Dụng cụ phá dỡ thô sơ | Rìu, xà beng, búa, kìm | 1.4.14 |\n| Nhà hỗn hợp | Nhà dân dụng nhiều công năng; **không** gồm nhà ở riêng lẻ kết hợp SX, KD | 1.4.18 |\n| Kho lạnh | Phòng cách nhiệt, làm lạnh **−30 °C đến +5 °C**; kho ≤ **10 m²** và không cho người vào thì **không** là kho lạnh | 1.4.21 |\n| Chiều cao PCCC | Theo **QCVN 06:/BXD** | 1.4.23 |\n| Khối tích, diện tích | Tổng khối tích tòa nhà; diện tích — theo **TCVN 9255** | 1.4.25, 1.4.26 |\n| Khu vực có quy trình ướt | Độ ẩm > **75 %** ở 12 – 24 °C hoặc > **60 %** ở > 24 °C do chính hoạt động của gian phòng | 1.4.27 |\n| Trạm biến áp không người trực | Giám sát, vận hành từ xa tại trung tâm điều khiển | 1.4.29 |\n| Chất lỏng dễ cháy / chất lỏng cháy | Điểm chớp cháy **< 37,8 °C** / **≥ 37,8 °C** | 1.4.30, 1.4.31 |\n\n### Số tầng nhà (1.4.24)\n\n**Số tầng** = toàn bộ tầng trên mặt đất (**kể cả tầng kỹ thuật, tầng tum**) + tầng bán/nửa hầm; **không** gồm tầng áp mái.\n\n- **Tầng tum không tính** khi chỉ bao che lồng thang bộ/giếng thang máy, thiết bị kỹ thuật và diện tích mái tum **≤ 30 %** diện tích sàn mái.\n- Nhà ở riêng lẻ kết hợp SX, KD: **tầng lửng không tính** khi diện tích ≤ **65 %** sàn tầng ngay dưới; lệch tầng → tham khảo TCVN 13967 (9.1.2).\n- Nhà kho, nhà sản xuất: **sàn giá đỡ, sàn lửng** ở mọi cao độ không tính khi diện tích ≤ **40 %** một tầng.\n- Công trình nhiều tầng có sàn (trừ nhà ở riêng lẻ KD, kho, SX): **tầng lửng kỹ thuật** không tính khi ≤ **10 %** sàn tầng dưới **và** ≤ **300 m²**.\n- Mỗi công trình chỉ được có **một** tầng lửng không tính vào số tầng.\n\nNhà nối với nhau bằng hành lang cầu, đã bảo đảm khoảng cách an toàn PCCC, thoát nạn, ngăn cháy lan → **tính riêng** diện tích, khối tích từng nhà (1.4.26).\n\n## 1.4 Loại và nhóm đám cháy — Bảng 1 (1.5.3)\n\n| Loại | Đặc tính | Nhóm | Ví dụ |\n| --- | --- | --- | --- |\n| **A** | Chất rắn | A1 | Có cháy âm ỉ: gỗ, giấy, cỏ khô, rơm rạ, than, sản phẩm dệt |\n|  |  | A2 | Không cháy âm ỉ: chất dẻo |\n| **B** | Chất lỏng | B1 | Không tan trong nước: xăng, ete, nhiên liệu dầu mỏ; chất rắn hóa lỏng (paraphin) |\n|  |  | B2 | Tan trong nước: rượu, metanol, glycerin |\n| **C** | Chất khí | C | Metan, hydro, propan |\n| **D** | Kim loại | D1 | Kim loại nhẹ: nhôm, magiê và hợp kim (trừ kim loại kiềm) |\n|  |  | D2 | Kim loại kiềm: natri, kali |\n|  |  | D3 | Hợp chất chứa kim loại: hữu cơ kim loại, hydrua kim loại |\n| **E** | Thiết bị mang điện | E | Có thể còn dòng điện trong thiết bị |\n\n## 1.5 Hiệu quả chất chữa cháy — Bảng 2 (1.5.5)\n\n| Chất chữa cháy | A | B | C | D | E |\n| --- | --- | --- | --- | --- | --- |\n| Nước — phun tia | ++ | − | − | − | − |\n| Nước — phun sương | ++ | + | − | − | +⁽¹⁾ |\n| Gốc nước — phun tia | +++ | +++ | − | − | − |\n| Gốc nước — phun sương | +++ | +++ | − | − | ++⁽¹⁾ |\n| Bọt bội số nở thấp | ++ | ++ | − | − | − |\n| Bọt bội số nở trung bình | + | ++ | − | − | − |\n| Bọt bội số nở cao | + | + | − | − | − |\n| Bọt chứa flo | ++ | +++ | − | − | − |\n| Khí CO₂, Nitơ | + | + | + | − | +++ |\n| Khí Freon⁽²⁾ | + | ++ | + | − | ++ |\n| Aerosol (sol-khí) | ++ | ++ | ++ | − | ++ |\n| Bột | ++ | +++ | +++ | +++ | ++ |\n\n**+++** rất hiệu quả · **++** hiệu quả · **+** hiệu quả thấp · **−** không thích hợp. ⁽¹⁾ Tuân thủ yêu cầu an toàn điện. ⁽²⁾ Freon: khí chlorofluorocarbon, hydrofluorocarbon như HFC-227ea, FK-5-1-12.\n\n- Có từ hai chất hiệu quả thấp trở lên → được chọn chất **hạn chế hư hại** thiết bị, máy móc.\n- **Không** dùng chất có thể phản ứng hóa học với chất trong khu vực bảo vệ gây cháy, nổ.\n- Lựa chọn phương tiện, chất chữa cháy phải phù hợp tính chất, mức nguy hiểm cháy, loại đám cháy và vận hành an toàn trong môi trường bình thường (1.5.4).\n\n## 1.6 Yêu cầu chung khi xác định trang bị (1.5)\n\n- Mọi nhà, công trình **không phụ thuộc chủ sở hữu, đơn vị chủ quản** đều phải trang bị theo quy chuẩn (1.5.1).\n- **Nhóm F1 – F5** và **hạng A, B, C1 – C4, D, E**, bậc chịu lửa, giải pháp ngăn cháy: theo **QCVN 06:/BXD** (1.5.2).\n- Gian phòng F5 cao **≤ 10 m** (tính từ sàn đến điểm cao nhất của mái dốc, mái chữ A, trần), trong nhà nhóm F5, **đã có chữa cháy tự động** liên động với trung tâm báo cháy → **được không** lắp đầu báo cháy tự động (thiết bị khác của hệ thống vẫn phải có). Công tắc dòng chảy, công tắc áp suất giám sát bởi trung tâm → mỗi thiết bị là một vùng phát hiện cháy riêng (1.5.6).\n- Nhà, công trình **không có trong Phụ lục A, B, H** → trang bị như nhà có công năng tương tự theo nhóm F của QCVN 06 (1.5.7).\n\n### Nhà hỗn hợp, chung cư mục đích hỗn hợp (1.5.8)\n\n- Mỗi công năng **≤ 70 %** tổng diện tích sàn → áp dụng quy định cho **nhà hỗn hợp**.\n- Có công năng **> 70 %** tổng diện tích sàn → áp dụng quy định cho **công năng đó**.\n- Tổng diện tích sàn **không** gồm sàn kỹ thuật, PCCC, gian lánh nạn và đỗ xe.\n\n### Trình tự xác định báo cháy, chữa cháy tự động (1.5.9)\n\n1. **Bảng A.1** — toàn bộ nhà.\n2. **Bảng A.2** — từng hạng mục, khu vực.\n3. **Bảng A.3** — gian phòng trong nhà.\n4. **Bảng A.4** — thiết bị trong phạm vi công trình.\n\nPhần ngầm và phần trên mặt đất ngăn thành các khoang **độc lập**, lối ra thoát nạn **riêng** → xét trang bị **riêng từng phần**.\n\n### Khi nào xét theo gian phòng (Bảng A.3) (1.5.10)\n\n| Bậc chịu lửa | Không phân chia, hoặc phân chia bằng kết cấu yếu hơn |\n| --- | --- |\n| I, II, III | Tường, sàn ngăn cháy < **REI 45**; vách ngăn cháy < **EI 45** |\n| IV, V | Tường, sàn < **REI 15**; vách < **EI 15** |\n\n→ trang bị báo cháy, chữa cháy tự động **tương ứng với gian phòng theo Bảng A.3**.\n\n### Khu vực được loại trừ (1.5.11)\n\nNhà có quy mô thuộc Phụ lục A phải trang bị cho **toàn bộ**, trừ:\n\n- Khu vực có **quy trình ướt**, hồ bơi, phòng tắm, phòng rửa, phòng vệ sinh;\n- Gian hạng **E**; gian hạng **C4** (trừ gian C4 trong nhà **F1.1, F1.2, F2.1, F4.1, F4.2**);\n- **Hành lang bên**;\n- Cầu thang bộ, **buồng thang bộ**;\n- **Khoang đệm ngăn cháy**;\n- Khu vực **không có nguy hiểm cháy** (không có chất cháy, không có nguồn nhiệt: trục ống nước, bể nước…).\n\n### Sprinkler căn hộ (1.5.12)\n\nCăn hộ nhà **F1.3**, chiều cao PCCC **≤ 100 m** → được chỉ bố trí đầu phun sprinkler **tại cửa căn hộ** (lắp phía trong căn hộ).\n\n## 1.7 Bảo dưỡng (1.5.13)\n\n| Phương tiện | Chu kỳ tối thiểu |\n| --- | --- |\n| Báo cháy tự động, thiết bị báo cháy độc lập; chiếu sáng sự cố, chỉ dẫn thoát nạn; loa thông báo, hướng dẫn thoát nạn; cấp nước chữa cháy ngoài nhà; họng nước trong nhà; hệ thống, thiết bị chữa cháy tự động | **1 năm/lần** |\n| **Bình chữa cháy** | **6 tháng/lần** |\n\nTiêu chuẩn, quy chuẩn quy định thời hạn **ngắn hơn** → theo tiêu chuẩn đó; **dài hơn** → theo quy chuẩn này.\n", "02-trang-bi.md": "# 2. Trang bị, bố trí — Phần 2\n\nPhần 2 của QCVN 10:2025/BCA: mỗi loại phương tiện có một điều chính dẫn sang phụ lục tra cứu. Phần 3 (quản lý) và Phần 4 (tổ chức thực hiện) ở cuối mục.\n\n## 2.1 Bản đồ tra cứu: phương tiện → phụ lục\n\n| Phương tiện | Đối tượng phải trang bị | Thiết kế, lắp đặt | Điều |\n| --- | --- | --- | --- |\n| Báo cháy tự động, thiết bị báo cháy độc lập | **Phụ lục A** | TCVN 7568-14, 7568-25 | 2.1 |\n| Chiếu sáng sự cố, chỉ dẫn thoát nạn | TCVN 13456 | TCVN 13456 | 2.2.1 – 2.2.2 |\n| Loa thông báo, hướng dẫn thoát nạn | **Phụ lục G** | **H.4** | 2.2.4 – 2.2.5 |\n| Cấp nước chữa cháy ngoài nhà | **Phụ lục C** | **H.1, H.3**, TCVN 6379 | 2.3 |\n| Họng nước chữa cháy trong nhà | **Phụ lục B** | **H.2, H.3** | 2.4 |\n| Chữa cháy tự động | **Phụ lục A** | TCVN 7336, 13926, 13333, 13657-1, 6101, 7161-1/-5/-9/-13/-14/-15, 13877-2, 14496, NFPA 15 | 2.5 |\n| Bình chữa cháy | **Mọi khu vực** | TCVN 7435-1 (điểm 5, 6, 7) | 2.6 |\n| Dụng cụ phá dỡ thô sơ | **Phụ lục E** | — | 2.7.1 |\n| Mặt nạ lọc độc, phòng độc cách ly | **Phụ lục F** | — | 2.7.2 |\n| Phương tiện chữa cháy cơ giới | **Phụ lục D** | TCVN 13316, 12110 | 2.8 |\n\n## 2.2 Báo cháy tự động (2.1)\n\n- Danh mục nhà, hạng mục/khu vực, gian phòng phải trang bị báo cháy tự động, thiết bị báo cháy độc lập: **Phụ lục A** (2.1.1).\n- Lựa chọn, bố trí **thiết bị báo cháy độc lập** như thiết bị tương tự của hệ thống báo cháy tự động (2.1.1).\n- Thiết kế, lắp đặt: **TCVN 7568-14**, **TCVN 7568-25** (2.1.2).\n\n## 2.3 Chiếu sáng sự cố, chỉ dẫn thoát nạn, loa thông báo (2.2)\n\n- Trang bị và thiết kế, lắp đặt chiếu sáng sự cố, chỉ dẫn thoát nạn: **TCVN 13456** (2.2.1, 2.2.2).\n- **Công trình đang thi công**: đèn chiếu sáng sự cố nguồn dự phòng **≥ 1 h** tại phòng máy phát điện, phòng máy biến áp, phòng bơm chữa cháy đã bố trí; độ rọi ngang trên mặt sàn **≥ 0,5 lux** (2.2.3).\n- Loa thông báo, hướng dẫn thoát nạn: đối tượng — **Phụ lục G**; thiết kế — **H.4** (2.2.4, 2.2.5).\n\n## 2.4 Cấp nước chữa cháy ngoài nhà (2.3)\n\n- Đối tượng: **Phụ lục C** (2.3.1).\n- **Được miễn** khi mọi điểm của nhà (xét theo phương ngang) nằm trong **bán kính 400 m** từ trụ nước chữa cháy hoặc bến lấy nước của nguồn tự nhiên, nhân tạo (ao, hồ, sông, bể…) **và** lưu lượng/trữ lượng bảo đảm (2.3.2).\n- Không đủ lưu lượng → phải trang bị; được **cộng** lưu lượng của hạ tầng cấp nước ngoài nhà và nguồn tự nhiên, nhân tạo (2.3.2).\n- Bến lấy nước: theo **H.1.5.4**. Nguồn nước phải là nguồn **công cộng** hoặc **trong nội bộ dự án** (2.3.2, chú thích).\n- Thiết kế, lắp đặt: **H.1, H.3**, TCVN 6379 (2.3.3).\n\n## 2.5 Họng nước chữa cháy trong nhà (2.4)\n\n- Đối tượng: **Phụ lục B**; thiết kế: **H.2, H.3** (2.4.1, 2.4.2). Được bố trí độc lập hoặc kết hợp với chữa cháy tự động bằng nước.\n- Bơm cấp nước: điều khiển **bằng tay** hoặc **tự động hoặc từ xa** (2.4.2).\n- **Bắt buộc điều khiển bằng tay tại phòng bơm và tự động** cho: nhà SX, kho hạng **A, B, C1**; nhà cao PCCC **≥ 25 m**; chợ, TTTM, siêu thị, khách sạn; karaoke, vũ trường, nhà ga hàng không, ga đường sắt, đề-pô, ga cáp treo, ga đường sắt đô thị; nhà hát, rạp chiếu phim; nhà dịch vụ thuộc bến cảng biển, cảng thủy nội địa (2.4.2, chú thích).\n\n### Công trình đang thi công (2.4.3)\n\nKhi **≥ 10 tầng** hoặc chiều cao PCCC **≥ 28 m**, giai đoạn hoàn thiện nội thất, lắp cơ điện:\n\n- Tối thiểu **01 hệ thống đường ống khô** có **họng nước đến mỗi tầng**, kết nối được với xe chữa cháy, máy bơm qua đầu nối bố trí **bên ngoài** công trình;\n- Mỗi họng: **≥ 02 cuộn vòi đẩy** và **01 lăng phun**.\n\n### Đường ống khô cho lực lượng chữa cháy (2.4.4)\n\nÁp dụng: chiều cao PCCC **> 28 m** (**> 50 m** với nhà **F1.3**) **hoặc** sàn tầng hầm dưới cùng sâu **> 9 m** (tính đến cao độ lối ra thoát nạn ra ngoài).\n\n- Họng chờ **DN65**, van khóa **thường đóng**, đặt tại **sảnh thang máy chữa cháy** hoặc **khoang đệm** của buồng thang bộ không nhiễm khói;\n- Đường kính ống **≥ DN65**;\n- **Van một chiều** từ ngoài vào tại họng chờ tiếp nước; đầu nối ngoài nhà phù hợp bơm áp lực cao của xe chữa cháy;\n- **Van xả khí** tại điểm cao nhất; **van xả nước** tại điểm thấp nhất;\n- Tại họng chờ tiếp nước có **chỉ thị khu vực phục vụ**.\n\n## 2.6 Chữa cháy tự động (2.5)\n\n- Đối tượng (nhà, hạng mục, gian phòng, thiết bị): **Phụ lục A**. Chất chữa cháy phù hợp loại đám cháy (Bảng 1, Bảng 2) và yêu cầu bảo vệ (2.5.1).\n- Chất chữa cháy **nguy hiểm cho người** → tính thời gian thoát nạn, bảo đảm người cuối cùng ra khỏi phòng **trước khi xả** (2.5.3).\n\n### Bình bột tự động kích hoạt (2.5.4)\n\n- Gắn tường hoặc treo trần; cảm biến nhiệt cách trần **≤ 40 cm**; diện tích bảo vệ theo công bố của nhà sản xuất.\n- Loại **treo** được dùng cho: **bếp nhà hàng**, phòng nồi hơi, giặt là **≤ 100 m²**; phòng kỹ thuật điện **≤ 10 m²**.\n- Khu vực **> 100 m²** → chia thành khu ≤ 100 m² bằng tường ngăn cháy **≥ REI 45** hoặc vách ngăn cháy **≥ EI 45**.\n\n### Bình khí, sol-khí tự động kích hoạt thay hệ thống (2.5.5)\n\n- Được thay hệ thống chữa cháy tự động tại khu vực **không thường xuyên có người**, diện tích **≤ 100 m²**.\n- Phải giám sát trạng thái thường trực và khi chữa cháy, **liên động báo cháy tự động**.\n- > 100 m² → chia khu ≤ 100 m² bằng tường **≥ REI 45** hoặc vách **≥ EI 45**.\n- Bình khí treo: theo **TCVN 12314-2**.\n\n## 2.7 Bình chữa cháy (2.6)\n\n- **Mọi khu vực trong nhà**, kể cả nơi đã có hệ thống chữa cháy → bình xách tay hoặc bình có bánh xe. Lựa chọn, tính toán, bố trí: **điểm 6, 7 TCVN 7435-1** (2.6.1).\n- Khu vực hẹp, dài hoặc nhiều cấp sàn: khoảng cách di chuyển từ bình đến điểm xa nhất **không vượt điểm 7 TCVN 7435-1** (2.6.2).\n- Cùng sàn bị chia bởi tường, vách, rào không có lối qua lại → trang bị **riêng từng khu vực** (2.6.3).\n- Vị trí dễ thấy, dễ lấy, nên **màu đỏ**; khó nhận biết → có chỉ dẫn vị trí (điểm 5 TCVN 7435-1). **Không để tập trung một chỗ** (2.6.4).\n\n**Nên bố trí**: nơi người theo đường thoát nạn dễ nhìn thấy; gần lối ra vào phòng, cầu thang bộ, hành lang, lối đi; vị trí tương tự trên mỗi tầng giống nhau (2.6.4).\n\n**Không đặt**: nơi đám cháy có thể ngăn tiếp cận bình; gần thiết bị sinh nhiệt; khuất sau cửa, trong tủ không quan sát được, hốc sâu; nơi cản trở lối thoát nạn; trong phòng/hành lang xa lối ra (trừ khi cần cho nguy hiểm cháy); nơi dễ hỏng do hoạt động thường ngày (2.6.4).\n\n### Công trình đang thi công (2.6.5)\n\n- **≥ 01 bình bột ABC ≥ 4 kg / 500 m² sàn**, xét **riêng từng tầng**, kể cả nhà tạm phục vụ thi công; chưa đủ 500 m² vẫn **≥ 01 bình**.\n- Không bố trí được đường cho xe chữa cháy tiếp cận → số bình **gấp đôi**.\n- Bán kính bảo vệ tối đa của bình xách tay **25 m**, đặt nơi dễ thấy, dễ lấy.\n\n## 2.8 Phá dỡ thô sơ, mặt nạ (2.7)\n\n- Dụng cụ phá dỡ thô sơ: đối tượng **Phụ lục E**; đặt tại khu vực **có người thường xuyên trực PCCC** (2.7.1).\n- Mặt nạ lọc độc, mặt nạ phòng độc cách ly: đối tượng **Phụ lục F** (2.7.2).\n- **Mặt nạ lọc độc**: trong **tủ phương tiện** trên hành lang, đường thoát nạn từng tầng hoặc trong gian phòng thường xuyên có người.\n- **Mặt nạ phòng độc cách ly**: tại **phòng trực điều khiển chống cháy** hoặc khu thường trực PCCC, dễ thấy, dễ lấy.\n\n## 2.9 Phương tiện chữa cháy cơ giới (2.8)\n\n- Kho, cơ sở SX, **cảng hàng không, bến cảng, KCN, CCN** → ngoài hệ thống chữa cháy còn phải trang bị phương tiện cơ giới theo **Phụ lục D**; đạt TCVN 13316, TCVN 12110 (2.8.1).\n- Xe ô tô, tàu chữa cháy: tính năng phù hợp loại nhà, công trình; có đủ chất chữa cháy, phương tiện, dụng cụ kèm theo (2.8.2).\n\n## 2.10 Quản lý và tổ chức thực hiện (Phần 3, 4)\n\n- Phương tiện thuộc **Phụ lục V NĐ 105/2025/NĐ-CP** phải có **giấy phép lưu thông** trước khi lưu thông trên thị trường (3.1).\n- Kiểm định, tem kiểm định: theo **khoản 1 Điều 46 NĐ 105/2025/NĐ-CP** (3.2).\n- **Cục C07** phổ biến, hướng dẫn áp dụng (4.1).\n", "03-phu-luc-a.md": "# 3. Báo cháy, chữa cháy tự động — Phụ lục A\n\nPhụ lục A (quy định): đối tượng phải trang bị **hệ thống báo cháy tự động**, **thiết bị báo cháy độc lập**, **hệ thống chữa cháy tự động**, **thiết bị chữa cháy tự động kích hoạt**. Tra lần lượt Bảng A.1 → A.2 → A.3 → A.4 (1.5.9).\n\n> Cách đọc ngưỡng: \"**≥ 3 tầng** hoặc **≥ 500 m²**\" nghĩa là chỉ cần đạt **một** điều kiện là phải trang bị. \"**TBĐL**\" — được thay bằng thiết bị báo cháy độc lập khi thỏa điều kiện trong ngoặc. Số tầng tính theo 1.4.24; diện tích, khối tích theo TCVN 9255.\n\n## 3.1 Bảng A.1 — Nhà ở, giáo dục, y tế (mục 1 – 7)\n\n| STT | Loại nhà | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 1 | Nhà ở riêng lẻ kết hợp **kinh doanh dịch vụ** (phần KD < 30 % tổng diện tích sàn)⁽²⁾ | **≥ 7 tầng** (được dùng TBĐL) | Chiều cao PCCC **≥ 30 m** |\n| 2 | Nhà ở riêng lẻ kết hợp **sản xuất, kinh doanh hàng hóa dễ cháy** (phần SX, KD < 30 %)⁽²⁾ | **≥ 3 tầng** hoặc **≥ 500 m²** (TBĐL khi < 5 tầng **và** < 500 m²) | Chiều cao PCCC **≥ 30 m** |\n| 3 | **Chung cư**, nhà ở tập thể, ký túc xá thuộc cơ sở giáo dục | **≥ 5 tầng** hoặc **≥ 700 m²** (TBĐL khi < 5 tầng **và** < 1 500 m²) | Chiều cao PCCC **≥ 30 m** |\n| 4 | Nhà trẻ, mẫu giáo, **mầm non**, cơ sở giáo dục mầm non khác | **≥ 100 cháu** hoặc **≥ 300
