²** | **≥ 3 000 m²** |\n| 30 | Nhà **kho hạng C**, hàng trên **giá đỡ** cao **> 5,5 m** | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 31 | Nhà **kho hạng B, C** cao **≥ 2 tầng** | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n\n> Nhà sản xuất, nhà kho **không có** trong Bảng A.1 (trừ mục 29 – 31) → xét theo **gian phòng** tại Bảng A.3 mục 1 (kho), mục 2 (sản xuất).\n\n## 3.5 Ghi chú Bảng A.1 — đọc kỹ\n\n**⁽¹⁾ Chữa cháy tự động cho nhà hỗn hợp**\n\n- Nhà hỗn hợp **không** thuộc diện, nhưng **một phần công năng** có quy mô thuộc diện theo Bảng A.1 → trang bị chữa cháy tự động **cho phần đó**.\n- **Karaoke, vũ trường** trong nhà hỗn hợp: phần karaoke thuộc diện **hoặc** karaoke bố trí **từ tầng 3 trở lên** → chữa cháy tự động **cho toàn bộ nhà**.\n- Được dùng **hệ thống chữa cháy đóng gói (Package)** thay hệ thống truyền thống cho công trình tại **Phụ lục A TCVN 13926**.\n\n**⁽²⁾ Nhà ở riêng lẻ kết hợp SX, KD**\n\n- Được chỉ trang bị báo cháy tự động hoặc TBĐL **tại khu vực SX, KD**; mỗi tầng ở phải có **thiết bị cảnh báo âm thanh** kết nối liên động.\n- Phần SX, KD hàng hóa dễ cháy **30 – 70 %** tổng diện tích sàn, cao **≥ 2 tầng** → báo cháy tự động, TBĐL, chữa cháy tự động **như nhà hỗn hợp**.\n- Phần SX, KD **> 70 %** → trang bị **theo công năng SX, KD**.\n\n**⁽³⁾ Chợ, TTTM**: được **không** lắp chữa cháy tự động tại khu trưng bày xoong nồi, thiết bị, hàng hóa, vật liệu **không cháy**; khu lưu trữ và chế biến để bán thịt, cá, trái cây, rau quả (kể cả bao bì không cháy).\n\n**⁽⁴⁾ Nhà để xe**\n\n- Nhà để xe **ngầm một tầng** dưới khu đất trống, sức chứa **≤ 25 chỗ** → được **không** bố trí chữa cháy tự động.\n- Nhà để xe ô tô 1 – 2 tầng **dạng ngăn** (ngăn bằng vách ngăn cháy loại 1, có lối ra ngoài trời trực tiếp từng ngăn) mỗi ngăn **≤ 2 xe** → được **không** trang bị báo cháy và chữa cháy tự động.\n- Nhà lưu giữ, trưng bày **xe máy** cao **≤ 2 tầng** và **≤ 1 000 m²** → được **không** trang bị báo cháy, chữa cháy tự động.\n\n**⁽⁵⁾ Dạng hở**: không có tường bao che bên ngoài; cũng coi là hở nếu **hai cạnh đối diện dài nhất** được để hở. Một cạnh coi là để hở khi tổng diện tích phần để hở dọc cạnh **≥ 50 %** diện tích mặt ngoài cạnh đó ở từng tầng.\n\n**⁽⁶⁾** Nhà **dạng hở** chế biến, lưu trữ nông sản dạng hạt → **không** yêu cầu báo cháy, chữa cháy tự động.\n\n**Chú thích 1 — bậc chịu lửa IV, V**: nhà mục **6, 10, 12, 16, 20, 21** bậc **IV – V** → báo cháy tự động khi **≥ 200 m²**; chữa cháy tự động khi **≥ 1 200 m²**.\n\n**Chú thích 2 — báo cháy địa chỉ** (khi xây dựng mới):\n\n- Nhà **điều trị nội trú** **≥ 3 000 m²**;\n- Nhà khám, chữa bệnh của **bệnh viện tâm thần** **≥ 3 000 m²**;\n- Nhà **dưỡng lão** **≥ 3 000 m²**;\n- Nhà dân dụng chiều cao PCCC **≥ 75 m**.\n\n## 3.6 Bảng A.2 — Hạng mục, khu vực\n\n| STT | Hạng mục / khu vực | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 1 | Hạng mục cáp⁽¹⁾ của **nhà máy điện** (trừ cáp đặt ngoài nhà) | Không phụ thuộc quy mô⁽²⁾ | Không phụ thuộc quy mô⁽²⁾ |\n| 2 | Hạng mục cáp trạm biến áp **≥ 500 kV** | Không phụ thuộc quy mô⁽²⁾ | Không phụ thuộc quy mô⁽²⁾ |\n| 3.1 | Hạng mục cáp trạm **110 – 220 kV**, máy biến áp **< 63 MVA** | Không phụ thuộc quy mô⁽²⁾ | — |\n| 3.2 | — máy biến áp **≥ 63 MVA** | Không phụ thuộc quy mô⁽²⁾ | Không phụ thuộc quy mô⁽²⁾ |\n| 4 | Hạng mục cáp **trạm biến áp không người trực** | Không phụ thuộc quy mô⁽²⁾ | Không phụ thuộc quy mô⁽²⁾ |\n| 5.1 | **Hầm cáp** (mương cáp) trong nhà SX, dân dụng, cáp **≥ 220 V**, khối tích **10 – 100 m³** | **≥ 5 sợi**⁽²⁾ | — |\n| 5.2 | — khối tích **> 100 m³** | **≥ 5 sợi**⁽²⁾ | **≥ 12 sợi**⁽²⁾ |\n| 6 | **Băng tải kín** vận chuyển nguyên vật liệu dễ cháy | Dài **≥ 25 m** | Dài **≥ 25 m** |\n| 7.1 | Không gian **trên trần giả / dưới sàn nâng** cao **≥ 0,35 m** của khu vực⁽³⁾ có: đường ống kỹ thuật bọc vật liệu **Ch2 – Ch4** (mọi khối lượng) | Không phụ thuộc quy mô | — |\n| 7.2 | — máng cáp **≥ 220 V**, tổng thể tích chất cháy Ch2 – Ch4 **≥ 0,0015 m³/m** chiều dài | Không phụ thuộc quy mô⁽²⁾ | — |\n| 8 | Hầm cáp của **hầm giao thông đường bộ** dài **≥ 500 m** | Không phụ thuộc quy mô⁽²⁾ | — |\n\n- ⁽¹⁾ **Hạng mục cáp**: tuy nen, giếng, sàn nâng (sàn kép), tầng cáp, hành lang cáp (kể cả kết hợp phương tiện liên lạc khác).\n- ⁽²⁾ Được **không** trang bị khi: cáp luồn trong ống hoặc bọc vật liệu **không cháy / Ch1**; hoặc là cáp **chiếu sáng, thông tin**.\n- ⁽³⁾ Khu vực áp dụng mục 7: **hành lang thoát nạn, hội trường, tiền sảnh**; gian phòng **≥ 50 người**; gian phòng **F1.1, F4.1**, karaoke, vũ trường — trong nhà thuộc diện trang bị. Được chỉ bố trí đầu báo **tại vị trí đường ống, máng cáp**.\n\n## 3.7 Bảng A.3 — Gian phòng kho\n\n| STT | Gian phòng | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 1.1 | Kho hạng **A, B** | Không phụ thuộc diện tích | **≥ 300 m²** |\n| 1.2 | Kho **cao su, hạt nhựa**; diêm, kim loại kiềm, **pháo hoa**; len, lông thú; chất cháy khối lượng riêng **< 3 kg/m³** | Không phụ thuộc diện tích | **≥ 100 m²** |\n| 1.3 | Hàng **không cháy** trong **bao bì dễ cháy** (tải trọng cháy riêng 1 – 180 MJ/m²) | **≥ 300 m²** | — |\n| 1.4.1 | Kho hạng **C1** (trừ 1.2, 1.3 và kho nông sản dạng hạt) — tầng hầm, bán hầm | Không phụ thuộc diện tích | **≥ 100 m²** |\n| 1.4.2 | — C1 trên mặt đất | **≥ 300 m²** | **≥ 300 m²** |\n| 1.5.1 | Kho hạng **C2, C3** (trừ 1.2, 1.3, nông sản dạng hạt) — tầng hầm, bán hầm | **≥ 300 m²** | **≥ 300 m²** |\n| 1.5.2 | — C2, C3 trên mặt đất | **≥ 1 000 m²** | **≥ 1 000 m²** |\n| 1.6 | **Kho lạnh** | **≥ 300 m²** | — |\n\n## 3.8 Bảng A.3 — Gian phòng sản xuất\n\n| STT | Gian phòng | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 2.1 | Sản xuất hạng **A, B** | Không phụ thuộc diện tích | **≥ 300 m²** |\n| 2.2.1 | Hạng **C1** (trừ nhà nông sản dạng hạt) — tầng hầm, bán hầm | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 2.2.2 | — C1 trên mặt đất | Không phụ thuộc diện tích | **≥ 300 m²** |\n| 2.3.1.1 | Hạng **C2, C3** — tầng hầm, bán hầm, **không** có lối ra ngoài trực tiếp | Không phụ thuộc diện tích | **≥ 300 m²** |\n| 2.3.1.2 | — tầng hầm, bán hầm, **có** lối ra ngoài trực tiếp | — | **≥ 700 m²** |\n| 2.3.2 | — C2, C3 trên mặt đất | **≥ 300 m²** | **≥ 1 000 m²** |\n| 2.4 | SX **chất lỏng dễ cháy** (dung môi, sơn, keo, dung dịch ngâm tẩm, cao su tổng hợp); huyền phù bột nhôm, keo cao su; **phòng sơn**; tổng hợp cao su nhân tạo; phòng máy nén dùng tuabin khí; gia nhiệt dầu mỏ, dầu diesel | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n\n> **Chú thích Bảng A.3**: gian phòng **sản xuất, kho**, kể cả **phòng thí nghiệm, nhà xưởng** **> 50 m²** trong nhà nhóm **F1, F2, F3, F4** → áp dụng như **gian phòng F5**.\n\n## 3.9 Bảng A.3 — Thông tin liên lạc\n\n| STT | Gian phòng | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 3.1 | Phòng thiết bị phân tách, phụ trợ (thông gió, máy biến áp) của đài phát sóng **≥ 150 kW**; trạm thu sóng **≥ 20 máy**; trạm thông tin vệ tinh cố định **> 1 kW**; đài truyền hình chuyển tiếp **25 – 50 kW**; nút mạng, tổng đài liên tỉnh, thành phố; trạm điện báo, điểm khuếch đại thiết bị đầu cuối, trung tâm liên lạc khu vực | Không phụ thuộc diện tích | — |\n| 3.2 | Xưởng kỹ thuật trạm khuếch đại đầu cuối, chuyển tiếp vô tuyến trung gian, trung tâm truyền – nhận sóng **không giám sát / không người trực buổi tối** | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 3.3 | **Trạm gốc** thông tin di động, trạm chuyển tiếp **không có giám sát** | Không phụ thuộc diện tích | **≥ 24 m²** |\n| 3.4.1 | Phòng tổng đài số, kiểm soát điện thoại, máy tính, điện báo bưu điện tỉnh, TP — nhà khối tích **< 40 000 m³** | Không phụ thuộc diện tích | — |\n| 3.4.2 | — nhà **≥ 40 000 m³** | Không phụ thuộc diện tích | **≥ 24 m²** |\n| 3.5.1 | Tổng đài chuyển mạch điện tử, bán điện tử (+ máy tính điều khiển); phòng thiết bị đầu vào, đầu ra; chuyển mạch, nút, trung tâm truyền thông tài liệu⁽¹⁾⁽²⁾ — **< 10 000** số/kênh/điểm | Không phụ thuộc diện tích | — |\n| 3.5.2 | — **≥ 10 000** số/kênh/điểm | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 3.6.1 | Phòng thiết bị chia, kết nối điều khiển tổng đài tự động — **< 10 000 kênh** liên tỉnh, TP | Không phụ thuộc diện tích | — |\n| 3.6.2 | — **≥ 10 000 kênh** | Không phụ thuộc diện tích | **≥ 24 m²** |\n| 3.7 | Phòng xử lý, phân loại, lưu trữ, chuyển phát **bưu kiện**, thư từ, điện tín, báo chí | Không phụ thuộc diện tích | **≥ 500 m²** |\n\n## 3.10 Bảng A.3 — Phụ trợ giao thông vận tải\n\n| STT | Gian phòng | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 4.1 | Phòng máy điện, thiết bị, sửa chữa, gia công toa tàu, bánh, động cơ… hạng **≥ C3**, thuộc cơ sở đóng mới, sửa chữa tàu hỏa, tàu điện, tàu thủy | **≥ 300 m²** | **≥ 1 000 m²** |\n| 4.2 | Sửa chữa, bảo dưỡng, lưu giữ phương tiện cơ giới đường bộ (**trừ ô tô**) | **≥ 1 000 m²** | **≥ 1 000 m²** |\n| 4.3 | **Sửa chữa, bảo dưỡng ô tô** | **≥ 300 m²** | **≥ 700 m²** |\n| 4.4 | **Lưu giữ ô tô** trong nhà có công năng khác (trừ nhà ở riêng lẻ kết hợp SX, KD) | Không phụ thuộc diện tích | **≥ 3 xe ô tô** |\n| 4.5 | Tháo lắp động cơ máy bay, thiết bị bay, bánh xe, trực thăng; SX, sửa chữa động cơ máy bay | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 4.6 | Phòng **bơm chữa cháy**, thông gió, kho vật tư, hàng hóa của **hầm giao thông đường bộ** | Không phụ thuộc diện tích | — |\n\n## 3.11 Bảng A.3 — Gian phòng công cộng\n\n| STT | Gian phòng | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 5.1.1 | Phòng lưu trữ **thư viện** **< 250 000** đơn vị | **≥ 300 m²** | — |\n| 5.1.2 | — **≥ 250 000** đơn vị | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 5.2 | Phòng **trưng bày, triển lãm**⁽³⁾ | **≥ 500 m²** | **≥ 1 000 m²** |\n| 5.3 | Phòng bảo quản, trưng bày tác phẩm, vật phẩm giá trị của **viện bảo tàng**⁽³⁾ | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 5.4.1 | Nhà có **sân khấu và khán phòng** (nhà hát, CLB, hòa nhạc, chiếu phim, đa năng, văn hóa, rạp xiếc…) — **≥ 400 chỗ** và sân khấu **≥ 100 m²**⁽⁴⁾ | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 5.4.2 | — **≥ 700 chỗ ngồi**⁽⁴⁾ | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 5.4.3 | — kho đồ trang trí, đồ dùng, **đạo cụ** | **≥ 100 m²** | **≥ 300 m²** |\n| 5.5 | **Trường quay** | **≥ 300 m²** | **≥ 1 000 m²** |\n| 5.6 | **Kho tiền** trong ngân hàng, kho bạc | Không phụ thuộc diện tích | **≥ 30 m²** |\n| 5.7.1 | Phòng bảo quản **hành lý**, kho vật liệu dễ cháy ở **nhà ga** — tầng hầm, bán hầm | Không phụ thuộc diện tích | **Không phụ thuộc diện tích** |\n| 5.7.2 | — trên mặt đất | **≥ 300 m²** | **≥ 300 m²** |\n| 5.8.1 | Phòng bảo quản vật liệu cháy trong công trình thể thao có mái che **≥ 800 chỗ** | **≥ 100 m²** | **≥ 100 m²** |\n| 5.8.2 | — dưới khán đài có mái che hoặc công trình thể thao ngoài trời **> 3 000 chỗ** | **≥ 100 m²** | **≥ 100 m²** |\n| 5.9 | **Phòng máy chủ** chuyên dụng | **≥ 24 m²** | **≥ 24 m²** |\n| 5.10.1 | **Gian thương mại** trong tòa nhà công năng khác — tầng hầm, bán hầm | Không phụ thuộc diện tích | **≥ 200 m²** |\n| 5.10.2 | — trên mặt đất | **≥ 500 m²** | **≥ 500 m²** |\n| 5.11 | Gian kinh doanh **chất lỏng cháy, dễ cháy** (trừ can, bình **≤ 20 lít**) | Không phụ thuộc quy mô | **Không phụ thuộc quy mô** |\n| 6 | Phòng điều khiển, phân phối điện, **ắc quy** của trạm biến áp không người trực | Không phụ thuộc quy mô⁽⁵⁾ | — |\n\n**Ghi chú Bảng A.3**\n\n- ⁽¹⁾ Được **không** lắp chữa cháy tự động cho toàn gian phòng khi có báo cháy tự động **và** mọi thiết bị điện, điện tử (kể cả hệ thống kiểm soát quy trình tự động) được bảo vệ bằng **thiết bị chữa cháy tự động** theo tiêu chuẩn.\n- ⁽²⁾ Chữa cháy tự động chọn loại **không gây hư hỏng** thiết bị khi kích hoạt sai.\n- ⁽³⁾ Không áp dụng cho gian phòng **tạm thời** dùng triển lãm, trưng bày.\n- ⁽⁴⁾ Sân khấu **≥ 100 m²** → ngăn cháy giữa sân khấu và khán giả bằng **màn nước drencher** hoặc màn ngăn cháy **≥ EI 60**.\n- ⁽⁵⁾ Trung tâm báo cháy trạm biến áp không người trực phải **truyền tín hiệu** về trung tâm điều khiển từ xa.\n\n## 3.12 Bảng A.4 — Thiết bị\n\n| STT | Thiết bị | Báo cháy tự động | Chữa cháy tự động |\n| --- | --- | --- | --- |\n| 1 | **Buồng sơn** dùng chất lỏng dễ cháy, chất lỏng cháy⁽¹⁾ | — | Không phụ thuộc quy mô |\n| 2 | **Tháp thu hồi chất thải** (bụi, than, mùn) dễ cháy⁽¹⁾ | — | Không phụ thuộc quy mô |\n| 3.1 | **Máy biến áp làm mát bằng dầu** 110 kV trong gian phòng trạm biến áp | Không phụ thuộc công suất | **≥ 63 MVA** |\n| 3.2 | — 110 kV trong **nhà máy điện** | **≥ 63 MVA** | **≥ 63 MVA** |\n| 3.3 | — **220 kV** | Không phụ thuộc công suất | **≥ 200 MVA** |\n| 3.4 | — **≥ 500 kV** | Không phụ thuộc công suất | **Không phụ thuộc công suất** |\n| 4 | Máy biến áp của **trạm biến áp không người trực** | Không phụ thuộc công suất | **≥ 125 MVA** |\n| 5 | Máy biến áp trong gian phòng của **nhà công năng khác** (trừ mục 3) | Không phụ thuộc công suất | **≥ 63 MVA** hoặc **≥ 110 kV** |\n| 6 | **Trạm điện thử nghiệm** máy phát diesel, xăng trên xe ô tô, rơ moóc | — | Không phụ thuộc diện tích |\n\n- ⁽¹⁾ Được dùng **thiết bị chữa cháy tự động** thay hệ thống.\n- Dấu **\"—\"** trong các bảng Phụ lục A: **không bắt buộc** trang bị.\n", "04-phu-luc-b-c.md": "# 4. Họng nước trong nhà, cấp nước ngoài nhà — Phụ lục B, C\n\nĐối tượng phải có **hệ thống họng nước chữa cháy trong nhà** (Bảng B.1) và **hệ thống cấp nước chữa cháy ngoài nhà** (Bảng C.1). Yêu cầu thiết kế: Phụ lục H (H.1 – H.3).\n\n## 4.1 Bảng B.1 — Nhà ở, công trình công cộng\n\n| STT | Loại nhà, công trình | Quy mô phải trang bị họng nước trong nhà |\n| --- | --- | --- |\n| 1.1 | Nhà ở riêng lẻ kết hợp KD dịch vụ; nhà ở riêng lẻ kết hợp SX, KD hàng hóa dễ cháy có phần SX, KD **≤ 70 %** | **≥ 7 tầng** |\n| 1.2 | **Chung cư**, chung cư mục đích hỗn hợp, nhà ở tập thể, ký túc xá; **khách sạn**, nhà khách, nhà nghỉ, nghỉ dưỡng, lưu trú khác; **nhà hỗn hợp** | **≥ 5 tầng** hoặc **≥ 1 500 m²** |\n| 1.3 | Nhà trẻ, mẫu giáo, **mầm non** | **≥ 100 cháu** hoặc **≥ 3 tầng** hoặc **≥ 1 000 m²** |\n| 1.4 | **Trường học** (tiểu học → đại học, dạy nghề, CNKT; cơ sở giáo dục khác trừ 1.3); **bệnh viện**, nhà hộ sinh, trạm y tế, phòng khám, điều dưỡng, phục hồi chức năng, phòng chống dịch, cơ sở y tế khác | **≥ 3 tầng** hoặc **≥ 600 m²** |\n| 1.5 | Thủy cung, vui chơi giải trí, biểu diễn nghệ thuật, văn hóa; **bảo tàng**, triển lãm, trưng bày; tôn giáo, tín ngưỡng (trừ nhà thờ dòng họ), di tích cấp tỉnh; **sân vận động**, nhà thi đấu, tập luyện; xưởng kiểm định đăng kiểm | **≥ 6 tầng** hoặc **≥ 1 500 m²** |\n| 1.6 | **Nhà hát, rạp chiếu phim**, rạp xiếc | **≥ 300 chỗ ngồi** hoặc **≥ 1 000 m²** |\n| 1.7 | **Thư viện**; nhà văn hóa, trung tâm hội nghị, đa năng; cửa hàng **điện máy, bách hóa, tiện ích**, hàng hóa dễ cháy | **≥ 1 500 m²** |\n| 1.8 | **Trụ sở, văn phòng**; nghiên cứu chuyên ngành; bưu điện, bưu cục, bưu chính viễn thông | **≥ 6 tầng** hoặc **≥ 1 500 m²** |\n| 1.9.1 | **Karaoke, vũ trường** — tầng hầm, bán hầm | **Không phụ thuộc diện tích** |\n| 1.9.2.1 | — trên mặt đất, **1 – 2 tầng** | **≥ 300 m²** |\n| 1.9.2.2 | — trên mặt đất, **≥ 3 tầng** | **Không phụ thuộc diện tích** |\n| 1.10 | **Chợ hạng 1, hạng 2**, TTTM, siêu thị (trừ nhà trưng bày, bán xe ô tô, xe máy) | **Không phụ thuộc diện tích** |\n| 1.11 | **Nhà hàng**, cửa hàng ăn uống, nhà ăn của cơ sở thuộc diện quản lý PCCC | **≥ 6 tầng** hoặc **≥ 1 500 m²** |\n| 1.12 | **Đài kiểm soát không lưu**; nhà ga hàng không, đường sắt, đề-pô, ga cáp treo, đường sắt đô thị; nhà dịch vụ thuộc cảng, bến thủy nội địa, cảng biển; **bến xe khách**, trạm dừng nghỉ, cảng cạn | **≥ 6 tầng** hoặc **≥ 1 500 m²** |\n\n## 4.2 Bảng B.1 — Sản xuất, kho, để xe, hầm\n\n| STT | Loại nhà, công trình | Quy mô |\n| --- | --- | --- |\n| 2 | **Nhà sản xuất, nhà kho** hạng **A, B, C, D** | **≥ 500 m²** |\n| 3.1 | Nhà **để xe** ô tô, xe máy, trưng bày ô tô, xe máy — **dạng kín** | **≥ 150 m²** |\n| 3.2 | — **dạng hở** (trừ gara ô tô cơ khí) | **≥ 1 000 m²** |\n| 4 | **Hầm giao thông đường bộ** | Dài **≥ 500 m** |\n| 5 | Nhà kỹ thuật **máy bay**; đóng mới, sửa chữa, bảo dưỡng phương tiện thủy nội địa, tàu biển; sửa chữa, bảo dưỡng phương tiện cơ giới đường bộ | **≥ 1 000 m²** |\n\n**Chú thích Bảng B.1**\n\n1. Nhà hỗn hợp, nhà ở riêng lẻ kết hợp KD, SX **không thuộc diện** nhưng **một phần công năng** thuộc diện → trang bị họng nước **cho phần đó**. Nhà hỗn hợp có **karaoke, vũ trường từ tầng 3 trở lên** → trang bị **cho toàn bộ nhà**. Nhà ở riêng lẻ có phần SX, KD **> 70 %** → theo công năng SX, KD.\n2. Được dùng **hệ thống họng nước đóng gói (Package)** cho công trình tại **Phụ lục A TCVN 13926**.\n3. **Không** trang bị họng nước cho nhà SX, kho có chất khi **tiếp xúc với nước** sinh ra cháy, nổ, ngọn lửa lan truyền.\n\n## 4.3 Bảng C.1 — Cấp nước chữa cháy ngoài nhà\n\n| TT | Loại nhà, công trình | Quy mô |\n| --- | --- | --- |\n| 1 | Nhà khám, chữa bệnh, lưu trú bệnh nhân của **bệnh viện** | **≥ 5 tầng** hoặc **≥ 3 000 m²** |\n| 2 | **Chợ hạng 1, hạng 2**, TTTM | Không phụ thuộc quy mô |\n| 3 | Nhà ga hàng không; **nhà kỹ thuật máy bay**; cảng, bến thủy nội địa **cấp đặc biệt, cấp I**; bến cảng biển cấp đặc biệt, cấp I; **cảng cá loại I, II**; cảng cạn; ga đường sắt, đề-pô; ga, đề-pô đường sắt đô thị; **trạm dừng nghỉ**⁽¹⁾ | Không phụ thuộc quy mô |\n| 4 | **Hầm giao thông đường bộ** | Dài **≥ 500 m** |\n| 5 | Đóng mới, sửa chữa, bảo dưỡng phương tiện thủy nội địa, tàu biển | **≥ 1 500 m²** |\n| 6 | **Nhà máy nhiệt điện**; trạm biến áp **≥ 220 kV** | Không phụ thuộc quy mô |\n| 7 | Nhà máy lọc dầu, lọc hóa dầu, chế biến khí, nhiên liệu sinh học; **kho dầu mỏ**, sản phẩm dầu mỏ; **kho khí hóa lỏng**⁽²⁾; cảng xuất, nhập dầu mỏ | Không phụ thuộc quy mô |\n| 8 | Cơ sở sản xuất **vật liệu nổ**, tiền chất thuốc nổ công nghiệp | Không phụ thuộc quy mô |\n|  | Kho cố định vật liệu nổ, tiền chất thuốc nổ | **≥ 20 tấn thuốc nổ** |\n| 9 | Khu liên hợp **gang thép**; nhà máy sản xuất, lắp ráp **ô tô**⁽³⁾ | Không phụ thuộc quy mô |\n|  | Sản xuất **săm, lốp ô tô**⁽³⁾ | **> 1 triệu chiếc/năm** |\n|  | Sản xuất, kho trạm chiết nạp **sản phẩm hóa dầu**⁽³⁾ | **> 50 nghìn tấn/năm** |\n| 10 | **Khu dân cư** đô thị, nông thôn; khu đô thị, khu nhà ở, **KCN, CCN**, khu du lịch, nghiên cứu, đào tạo, TDTT | Không phụ thuộc quy mô |\n\n- ⁽¹⁾ Chỉ trạm dừng nghỉ quy hoạch theo tuyến **đường cao tốc**.\n- ⁽²⁾ Chỉ kho **độc lập**; không gồm kho của cơ sở SX, dân dụng.\n- ⁽³⁾ **Không** yêu cầu với nhà, công trình nằm **trong KCN, CCN** (đã có hạ tầng cấp nước của khu).\n- Nhà trong **bán kính 400 m** từ trụ nước hoặc bến lấy nước, đủ lưu lượng → **được miễn** (2.3.2).\n", "05-phu-luc-d-g.md": "# 5. Cơ giới, phá dỡ, mặt nạ, loa — Phụ lục D, E, F, G\n\n## 5.1 Bảng D.1 — Phương tiện chữa cháy cơ giới\n\n| TT | Đối tượng | Quy mô | Xe ô tô CC | Tàu CC | Bơm khiêng tay⁽²⁾ |\n| --- | --- | --- | --- | --- | --- |\n| 1.1 | **Kho dầu mỏ**, sản phẩm dầu mỏ⁽¹⁾ | Tổng dung tích **> 500 000 m³** | **2** |  |  |\n| 1.2 | — | **100 000 – 500 000 m³** | **1** |  |  |\n| 1.3 | — | **< 100 000 m³** |  |  | **1** |\n| 2.1 | **Cảng hàng không** (cấp PCCC theo ICAO Doc 9137-AN/898 Part 1) | Cấp **1 – 5** | **1** |  |  |\n|  |  | Cấp **6, 7** | **2** |  |  |\n|  |  | Cấp **8 – 10** | **3** |  |  |\n| 2.2 | **Bến cảng biển** xuất, nhập chất nổ, khí, lỏng, rắn thuộc danh mục hàng nguy hiểm | Cấp **đặc biệt** | **2** |  |  |\n|  |  | Cấp **I** | **1** |  |  |\n|  |  | Cấp **II, III** |  |  | **1** |\n|  | Bến cảng chuyên dùng **LNG** | Tàu/thiết bị **≥ 8 000 m³** |  | **1** |  |\n| 3.1 | **Nhà máy nhiệt điện** | **600 – < 1 200 MW** | **1** |  |  |\n|  |  | **≥ 1 200 MW** | **2** |  |  |\n| 3.2 | **Nhà máy thủy điện** | **≥ 1 000 MW** | **1** |  |  |\n| 3.3 | Nhiệt điện, thủy điện nhỏ | Thủy điện **< 1 000 MW**, nhiệt điện **< 600 MW** |  |  | **1** |\n| 3.4 | **Nhà máy dệt** | **≥ 25 triệu m²/năm** | **1** |  |  |\n| 3.5 | **Nhà máy lọc dầu**, lọc hóa dầu | Không phụ thuộc công suất | **2** |  |  |\n| 3.6 | Cơ sở **chế biến khí đốt** | **≥ 10 triệu m³ khí/ngày đêm** | **1** |  |  |\n| 4.1 | **Khu công nghiệp** | **> 300 ha** | **2** |  |  |\n| 4.2 | KCN, CCN | **75 – 300 ha** | **1** |  |  |\n| 4.3 | KCN, CCN | **< 75 ha** |  |  | **1** |\n\n- ⁽¹⁾ Áp dụng cho kho **có** chữa cháy tự động, chữa cháy và làm mát cố định cho bồn, trạm bơm. Kho **không có** → **gấp hai lần** định mức.\n- ⁽²⁾ Bơm khiêng tay bảo đảm lưu lượng, áp suất tối thiểu loại **B-1, Bảng 1 TCVN 12110**.\n- **CT1**: Dự án liền kề hoặc trong bán kính phục vụ **≤ 3 km** do cùng một tổ chức quản lý → được trang bị theo dự án có yêu cầu lớn hơn; các dự án còn lại mỗi dự án **01 bơm khiêng tay**.\n- **CT2**: Được thay bơm khiêng tay bằng **xe ô tô chữa cháy**.\n- **CT3**: KCN **phân kỳ đầu tư** → trang bị theo quy mô từng phân kỳ.\n- **CT4**: Được thay tàu chữa cháy bằng **tàu lai dắt có chức năng chữa cháy**.\n\n## 5.2 Bảng E.1 — Dụng cụ phá dỡ thô sơ\n\n**Đối tượng** (không phụ thuộc quy mô):\n\n1. Nhà **sản xuất**;\n2. Nhà **kho** (độc lập);\n3. **Chung cư**, nhà ở tập thể, **khách sạn**, nhà khách, nhà nghỉ, lưu trú khác;\n4. **Trụ sở, văn phòng**, nghiên cứu chuyên ngành; **trường học** (tiểu học → đại học, chuyên nghiệp, dạy nghề, CNKT); **bệnh viện**;\n5. **Nhà ga** hàng không, đường sắt, đề-pô, đường sắt đô thị, cáp treo; nhà dịch vụ thuộc cảng, bến thủy nội địa, cảng biển; **bến xe khách**, trạm dừng nghỉ;\n6. **Karaoke, vũ trường** và công năng tương tự; **nhà hát, rạp chiếu phim**;\n7. **Chợ hạng 1, hạng 2**, TTTM.\n\n**Số lượng**: **01 bộ** gồm:\n\n| Dụng cụ | Yêu cầu |\n| --- | --- |\n| **Rìu** | Nặng **≥ 2 kg**, thép cacbon cao |\n| **Xà beng** | Một đầu nhọn, một đầu dẹt, dài **≥ 100 cm** |\n| **Búa** | Thép cacbon cao, nặng **≥ 5 kg** |\n| **Kìm cộng lực** | Tải cắt **≥ 60 kg** |\n\nĐặt tại khu vực **có người thường xuyên trực** PCCC (2.7.1).\n\n## 5.3 Bảng F.1 — Mặt nạ lọc độc, mặt nạ phòng độc cách ly\n\n| STT | Đối tượng | Quy mô | Số lượng |\n| --- | --- | --- | --- |\n| 1 | **Khách sạn**, nhà khách, nhà nghỉ, lưu trú khác | **≥ 3 tầng** | **Mặt nạ lọc độc** tại **tất cả các tầng**: **01 chiếc/01 người** (kể cả khách và nhân viên có mặt thường xuyên) |\n| 2 | **Karaoke, vũ trường** và công năng tương tự | Không phụ thuộc quy mô | **Mặt nạ lọc độc** tại tất cả các tầng; số trên một tầng = số người có mặt đồng thời trong **phòng lớn nhất** của tầng đó, **01 chiếc/01 người** |\n| 3 | Cơ sở **chế biến khí đốt** | **≥ 10 triệu m³ khí/ngày đêm** | **≥ 03 bộ mặt nạ phòng độc cách ly** |\n| 4 | **Nhà máy lọc dầu**, hóa dầu, lọc hóa dầu | Không phụ thuộc quy mô | **≥ 03 bộ** cách ly |\n| 5 | **Kho dầu mỏ**, sản phẩm dầu mỏ | **≥ 100 000 m³** | **≥ 03 bộ** cách ly |\n| 6 | **Nhà máy thủy điện** | **≥ 1 000 MW** | **≥ 03 bộ** cách ly |\n| 7 | **Nhà máy nhiệt điện** | **≥ 600 MW** | **≥ 03 bộ** cách ly |\n| 8 | **Nhà máy dệt** | **≥ 25 triệu m²/năm** | **≥ 03 bộ** cách ly |\n| 9 | **Khu công nghiệp** | **≥ 75 ha** | **≥ 03 bộ** cách ly |\n| 10 | **Bến cảng biển** | Công trình **cấp I trở lên**, xuất nhập chất nổ, khí, lỏng, rắn dễ cháy thuộc danh mục hàng nguy hiểm | **≥ 03 bộ** cách ly |\n\nVị trí: mặt nạ lọc độc trong **tủ phương tiện** trên hành lang, đường thoát nạn từng tầng hoặc gian phòng thường xuyên có người; mặt nạ cách ly tại **phòng trực điều khiển chống cháy** (2.7.2).\n\n## 5.4 Bảng G.1 — Loa thông báo, hướng dẫn thoát nạn\n\n| STT | Đối tượng | Quy mô |\n| --- | --- | --- |\n| 1 | **Chung cư**, nhà và công trình **công cộng** thuộc diện quản lý PCCC | **> 10 tầng** hoặc **≥ 2 tầng hầm** |\n| 2 | **Karaoke, vũ trường** và công năng tương tự; **nhà hát; rạp chiếu phim; bệnh viện; nhà dưỡng lão** | **≥ 50 người trên 1 tầng** |\n| 3 | Nhà **để xe** ô tô, xe máy **dạng kín** (độc lập hoặc trong nhà công năng khác) | **≥ 18 000 m²** |\n| 4 | **Nhà sản xuất** | **≥ 18 000 m²** **và** **≥ 300 người trên 1 tầng** |\n| 5 | **Hầm giao thông đường bộ** | Dài **≥ 500 m** |\n| 6 | Nhà ga hành khách **cảng hàng không**; ga hành khách, đề-pô **đường sắt**, **đường sắt đô thị** | Không phụ thuộc quy mô |\n\nThiết kế, lắp đặt: **H.4** (2.2.5).\n", "06-h1-nuoc-ngoai-nha.md": "# 6. Thiết kế cấp nước ngoài nhà — H.1\n\nPhụ lục H (quy định), mục H.1: áp suất, lưu lượng, số đám cháy đồng thời, trụ nước và nguồn nước cho chữa cháy ngoài nhà.\n\n## 6.1 Áp suất (H.1.1)\n\n- Đường ống **áp suất cao** hoặc **áp suất thấp**. Áp suất cao: áp suất do **máy bơm cố định**; bơm khởi động **≤ 5 phút** sau tín hiệu báo cháy (H.1.1.1).\n- **Áp suất thấp**: áp suất tự do tối thiểu tại cao độ mặt đất khi chữa cháy **≥ 10 m cột nước** (H.1.1.2).\n- **Áp suất cao**: bảo đảm **tia nước đặc ≥ 10 m** khi lưu lượng lớn nhất, lăng ở **điểm cao nhất** của nhà (H.1.1.2).\n- Mạng **kết hợp** sinh hoạt hoặc sản xuất: áp suất tự do **10 – 60 m cột nước** (H.1.1.2).\n\n## 6.2 Bảng H.1 — Khu dân cư (H.1.2.1)\n\n| Dân số (× 1 000 người) | Số đám cháy đồng thời | Nhà ≤ 2 tầng (L/s) | Nhà ≥ 3 tầng (L/s) |\n| --- | --- | --- | --- |\n| ≤ 1 | 1 | 5 | 10 |\n| > 1 – ≤ 5 | 1 | 10 | 10 |\n| > 5 – ≤ 10 | 1 | 10 | 15 |\n| > 10 – ≤ 25 | 2 | 10 | 15 |\n| > 25 – ≤ 50 | 2 | 20 | 25 |\n| > 50 – ≤ 100 | 2 | 25 | 35 |\n| > 100 – ≤ 200 | 3 | 40 | 40 |\n| > 200 – ≤ 300 | 3 | 55 | 55 |\n| > 300 – ≤ 400 | 3 | 70 | 70 |\n| > 400 – ≤ 500 | 3 | 80 | 80 |\n| > 500 – ≤ 600 | 3 | 85 | 85 |\n| > 600 – ≤ 700 | 3 | 90 | 90 |\n| > 700 – ≤ 800 | 3 | 95 | 95 |\n| > 800 – ≤ 1 000 | 3 | 100 | 100 |\n| > 1 000 | 5 | 110 | 110 |\n\nLưu lượng cho 1 đám cháy, không phụ thuộc bậc chịu lửa.\n\n- Lưu lượng khu dân cư **không nhỏ hơn** lưu lượng cho nhà theo Bảng H.2 (CT1).\n- Cấp nước theo vùng → lưu lượng, số đám cháy theo **dân số từng vùng** (CT2).\n- Cụm đường ống nhóm: số đám cháy theo **tổng dân số** các cụm (CT3).\n- Số đám cháy đồng thời gồm cả đám cháy **nhà SX, kho** trong khu dân cư; lưu lượng không nhỏ hơn Bảng H.1 (CT4).\n\n## 6.3 Bảng H.2 — Nhà nhóm F1 – F4 (H.1.2.2)\n\nLưu lượng (L/s) cho 1 đám cháy, không phụ thuộc bậc chịu lửa, theo **khối tích nhà** (× 1 000 m³):\n\n| Loại nhà / số tầng | ≤ 1 | > 1 – ≤ 5 | > 5 – ≤ 25 | > 25 – ≤ 50 | > 50 |\n| --- | --- | --- | --- | --- | --- |\n| **F1.3, F1.4** — ≤ 3 tầng | 10⁽¹⁾ | 10⁽¹⁾ | 15 | 15 | 20 |\n| F1.3, F1.4 — > 3 – ≤ 12 tầng | 10 | 15 | 15 | 20 | 20 |\n| F1.3, F1.4 — > 12 – ≤ 16 tầng | — | 20 | 20 | 25 | 25 |\n| F1.3, F1.4 — > 16 tầng | — | 20 | 25 | 25 | 30 |\n| **F1.1, F1.2, F2, F3, F4** — ≤ 3 tầng | 10⁽¹⁾ | 10⁽¹⁾ | 15 | 20 | 25 |\n| F1.1, F1.2, F2 – F4 — > 3 – ≤ 12 tầng | 10 | 15 | 20 | 25 | 30 |\n| F1.1, F1.2, F2 – F4 — > 12 – ≤ 16 tầng | — | 20 | 25 | 30 | 35 |\n| F1.1, F1.2, F2 – F4 — > 16 tầng | — | 25 | 30 | 30 | 35 |\n\n- ⁽¹⁾ Nhà thuộc **khu vực nông thôn**: **5 L/s**.\n- Mạng ngoài nhà không đủ hoặc nối vào đường ống cụt → xét lắp **bồn, bể** bảo đảm lưu lượng trong **3 h** (CT1).\n- Khu dân cư **không có** đường ống nước chữa cháy → phải có bồn, bể bảo đảm chữa cháy **3 h** (CT2).\n\n## 6.4 Bảng H.3 — Nhà F5 có lỗ mở trên mái, hoặc không có lỗ mở và rộng ≤ 60 m (H.1.2.3)\n\nLưu lượng (L/s) cho 1 đám cháy theo **khối tích nhà** (× 1 000 m³):\n\n| Bậc chịu lửa | Cấp S | Hạng | ≤ 3 | > 3 – ≤ 5 | > 5 – ≤ 20 | > 20 – ≤ 50 | > 50 – ≤ 200 | > 200 – ≤ 400 | > 400 – ≤ 600 | > 600 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| I, II | S0, S1 | D, E | 10 | 10 | 10 | 10 | 15 | 20 | 25 | 35 |\n| I, II | S0, S1 | A, B, C | 10 | 10 | 15 | 20 | 30 | 35 | 40 | 50 |\n| III | S0, S1 | D, E | 10 | 10 | 15 | 25 | 35 | 40 | 45 | — |\n| III | S0 | A, B, C | 10 | 15 | 20 | 30 | 45 | 60 | 75 | — |\n| IV | S0, S1 | D, E | 10 | 15 | 20 | 30 | 40 | 50 | 60 | — |\n| IV | S0, S1 | A, B, C | 15 | 20 | 25 | 40 | 60 | 80 | 100 | — |\n| IV | S2, S3 | E | 10 | 15 | 20 | 30 | 45 | — | — | — |\n| IV | S2, S3 | A, B, C | 15 | 20 | 25 | 40 | 65 | — | — | — |\n| V | — | E | 10 | 15 | 20 | 30 | 55 | — | — | — |\n| V | — | C | 15 | 20 | 25 | 40 | 70 | — | — | — |\n\n## 6.5 Bảng H.4 — Nhà F5 không có lỗ mở trên mái, rộng > 60 m\n\nLưu lượng (L/s) cho 1 đám cháy theo **khối tích nhà** (× 1 000 m³):\n\n| Bậc chịu lửa | Cấp S | Hạng | ≤ 50 | > 50 – ≤ 100 | > 100 – ≤ 200 | > 200 – ≤ 300 | > 300 – ≤ 400 | > 400 – ≤ 500 | > 500 – ≤ 600 | > 600 – ≤ 700 | > 700 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| I, II | S0, S1 | A, B, C | 20 | 30 | 40 | 50 | 60 | 70 | 80 | 90 | 100 |\n| I, II | S0 | D, E | 10 | 15 | 20 | 25 | 30 | 35 | 40 | 45 | 50 |\n| III | S0, S1 | A, B, C | 40 | 50 | 60 | 60 | 70 | 80 | 90 | 100 | 110 |\n| III | S0, S1 | D, E | 20 | 35 | 40 | 40 | 45 | 45 | 50 | 50 | 60 |\n| IV | S0, S1 | A, B, C | 50 | 60 | 65 | 70 | 80 | 90 | — | — | — |\n| IV | S0, S1 | D, E | 35 | 45 | 55 | 60 | 65 | 70 | 75 | 80 | 90 |\n| IV | S2, S3 | E | 40 | 50 | 60 | — | — | — | — | — | — |\n\n**Lỗ mở trên mái**: lỗ thông gió hoặc lấy sáng trên kết cấu mái (nóc gió, cửa trời; thường xuyên mở hoặc mở khi cháy; ô kính, tấm lợp lấy sáng…) có diện tích **≥ 2,5 %** diện tích xây dựng của nhà.\n\n## 6.6 Chú thích tính lưu lượng (H.1.2)\n\n| Trường hợp | Quy tắc | Chú thích |\n| --- | --- | --- |\n| 2 đám cháy | Lấy bằng **2 nhà có lưu lượng lớn nhất** | CT1 |\n| Nhà phụ trợ độc lập | Theo **Bảng H.2** như F2 – F4; nằm trong nhà SX → theo **khối tích chung** và Bảng H.3 | CT2 |\n| Nhà nông nghiệp bậc I, II, **≤ 5 000 m³**, hạng D, E | **5 L/s** | CT3 |\n| Trạm truyền thanh, truyền hình | **≥ 15 L/s** (kể cả khi Bảng H.3, H.4 thấp hơn) | CT4 |\n| Nhà bậc II **kết cấu gỗ** | **+5 L/s** so với Bảng H.3, H.4 | CT5 |\n| **Kho lạnh** thực phẩm | Như nhà **hạng C** | CT6 |\n| Kho vật liệu nổ, vũ khí, công cụ hỗ trợ; **hầm giao thông đường bộ; trạm biến áp** | **≥ 10 L/s** | CT8 |\n| Nhiệt điện, lọc dầu, hóa dầu, chế biến khí, nhiên liệu sinh học, kho dầu, khí hóa lỏng, cảng dầu | Theo **tiêu chuẩn, quy chuẩn** lựa chọn | CT9 |\n| Nhà ngăn bằng **tường ngăn cháy** | Theo **phần** có lưu lượng lớn nhất | H.1.2.4 |\n| Nhà ngăn bằng **vách ngăn cháy** | Theo **khối tích chung** và **hạng cao nhất** | H.1.2.5 |\n\n**Bãi công-ten-nơ có hàng hóa** (CT7):\n\n| Số công-ten-nơ | 30 – 50 | 51 – 100 | 101 – 300 | 301 – 1 000 | 1 001 – 1 500 | 1 501 – 2 000 | > 2 000 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Lưu lượng (L/s) | 15 | 20 | 25 | 40 | 60 | 80 | 100 |\n\n### Độ tin cậy cấp nước (H.1.2.6, H.1.2.7)\n\n- Lưu lượng chữa cháy phải bảo đảm **cả khi nhu cầu khác lớn nhất**: sinh hoạt, hộ kinh doanh, cơ sở SX, trạm xử lý… Được dùng một phần nước sản xuất khi nối trụ nước mạng sản xuất với mạng chữa cháy.\n- Hệ thống cấp nước ngoài nhà của cơ sở: **không ngừng cấp nước quá 10 min**; **không giảm lưu lượng quá 30 %** trong **3 ngày**.\n\n## 6.7 Số đám cháy đồng thời (H.1.3.1, H.1.3.2)\n\n| Đối tượng | Số đám cháy |\n| --- | --- |\n| Cơ sở công nghiệp, nông nghiệp **≤ 150 ha** | **1** |\n| — **> 150 ha** | **2** |\n| Kho hở hoặc kín chứa **vật liệu từ gỗ** **≤ 50 ha** / **> 50 ha** | **1** / **2** |\n| Kết hợp đường ống khu dân cư + cơ sở CN ngoài khu dân cư: CN **≤ 150 ha** và dân số **≤ 10 000** | **1** (lấy lưu lượng bên lớn hơn) |\n| — CN ≤ 150 ha, dân số **10 000 – 25 000** | **2** (1 cho CN + 1 cho khu dân cư) |\n| — CN **> 150 ha**, dân số **≤ 25 000** | **2** (cùng cho CN hoặc cùng cho khu dân cư, theo bên lớn hơn) |\n| — dân số **> 25 000** | **2**; lưu lượng 1 đám cháy = lưu lượng **lớn hơn** + **50 %** lưu lượng **nhỏ hơn** |\n\nDiện tích cơ sở = diện tích khu đất, **không** gồm đất rừng, công viên cây xanh, đất trồng cây, khu đất không có công trình xây dựng.\n\n## 6.8 Thời gian chữa cháy (H.1.3.3)\n\n| Trường hợp | Thời gian |\n| --- | --- |\n| Mặc định | **3 h** |\n| Nhà bậc **I, II**, kết cấu và cách nhiệt không cháy, khu vực hạng **D, E** | **2 h** |\n| Nhà trẻ, mầm non; nhà **F4.1, F4.3** ở **nông thôn**, bậc I, II, kết cấu không cháy, **≤ 3 tầng**, diện tích xây dựng **≤ 500 m²** | **1 h** — được dùng **họng nước trong nhà thay** hệ thống cấp nước ngoài nhà |\n| Kho hở chứa **vật liệu từ gỗ** | **≥ 5 h** |\n| Nhà có lưu lượng (Bảng H.2 – H.4) **≤ 15 L/s** (F1 – F4) hoặc **≤ 20 L/s** (F5) | **1 h** |\n\n## 6.9 Thời gian phục hồi nước dự trữ (H.1.3.4)\n\n| Đối tượng | Tối đa |\n| --- | --- |\n| Khu dân cư **> 5 000 người**; cơ sở CN có nhà hạng **A, B, C** | **24 h** |\n| Cơ sở CN có nhà hạng **D, E** | **36 h** |\n| Khu dân cư **≤ 5 000 người**; cơ sở **nông nghiệp** | **72 h** |\n| Cơ sở CN có lưu lượng **≤ 20 L/s**: hạng **D, E** / hạng **C** | được tăng lên **48 h** / **36 h** |\n\nKhông bảo đảm thời gian phục hồi → bổ sung dự trữ **ΔW = W (K − 1) / K**; W — lượng nước dự trữ (m³); K — tỷ số thời gian phục hồi thực tế / yêu cầu (CT2).\n\n## 6.10 Mạng đường ống (H.1.4)\n\n- Từ **2 đường ống cấp** trở lên → có **van chuyển đổi**, ngắt một đường vẫn bảo đảm **100 %** nước chữa cháy (H.1.4.1).\n- Mạng **vòng**; được làm **ống cụt** dài **≤ 200 m** (không phụ thuộc lưu lượng). **Không** nối vòng mạng ngoài nhà bằng mạng trong nhà (H.1.4.2).\n- Khu dân cư **≤ 5 000 người** và lưu lượng ngoài nhà **≤ 10 L/s** hoặc **≤ 12 họng** trong nhà mỗi nhà → được ống cụt **> 200 m** nếu có bồn, bể, tháp áp lực chứa toàn bộ nước chữa cháy (H.1.4.2).\n- Chia đoạn bằng van khóa: sửa chữa **không ngắt quá 05 trụ** (H.1.4.3).\n- Van điều khiển từ xa, tự động: **van điện** (được dùng khí nén, thủy lực, điện từ). Không điều khiển từ xa: **≤ 400 mm** được khóa tay; **> 400 mm** khóa điện hoặc thủy lực. Mọi trường hợp **phải đóng mở được bằng tay** (H.1.4.4).\n- Đường kính ống ngoài nhà khu dân cư, cơ sở SX **≥ 100 mm**; **nông thôn ≥ 75 mm** (H.1.4.5).\n\n## 6.11 Trụ nước chữa cháy (H.1.4.6, H.1.4.7)\n\n| Yêu cầu | Giá trị |\n| --- | --- |\n| Khoảng cách trụ đến **mép đường** | **≤ 2,5 m** |\n| Khoảng cách trụ đến **tường nhà** | **≥ 1 m** |\n| Trụ ngầm | Được đặt **trên đường giao thông** |\n| Bán kính phục vụ (nhà mục **1 – 9 Phụ lục C**) | **≤ 400 m** theo phương ngang đến mọi điểm của nhà |\n| Nhà có lưu lượng **≥ 25 L/s** | **≥ 02 trụ** trong bán kính 400 m |\n| **Khu dân cư, KCN… (mục 10 Phụ lục C)** | Dọc đường giao thông, khoảng cách giữa các trụ **≤ 150 m** |\n| Điểm dân cư **≤ 500 người** | Được thay trụ loại 3 cửa bằng **ống đứng DN 80** có họng nước |\n| Hệ thống **áp suất cao** | Được thay trụ bằng **họng nước loại 2 cửa DN65** |\n\n## 6.12 Bồn, bể, bến lấy nước (H.1.5)\n\n- Bồn, bể theo công năng gồm nước **điều tiết, chữa cháy, sự cố và nước mồi** (H.1.5.1).\n- Thể tích chữa cháy trong bể đủ cho: trụ nước ngoài nhà và hệ thống khác; thiết bị chuyên dụng (sprinkler, drencher) không có bể riêng; nước sinh hoạt, sản xuất tối đa trong suốt thời gian chữa cháy (H.1.5.3).\n- Ao, hồ, sông, bể cho xe hút nước: có **lối tiếp cận** và **bến lấy nước** chịu tải xe chữa cháy (H.1.5.4). Được tính cả nước nạp thêm khi đáp ứng H.1.2.7.\n- **Một đường ống cấp** → dự phòng thêm nước chữa cháy; được miễn khi ống cấp **≤ 500 m** với khu dân cư **≤ 5 000 người**, hoặc lưu lượng ngoài nhà **≤ 40 L/s** (H.1.5.5).\n- Mạng ống: **≥ 2 bồn, bể** (trừ công trình độc lập); mực nước như nhau; ngắt một bể, các bể còn lại **≥ 50 %** nước chữa cháy (H.1.5.6).\n- Hồ nhân tạo hở: tính **bốc hơi, đóng băng** (H.1.5.7).\n- Ống cụt **≤ 200 m** từ bể, hồ đến **hố thu** trung gian để tăng phạm vi phục vụ (H.1.5.8).\n- Không hút trực tiếp được → **hố thu ≥ 3 m³**; ống nối **≥ 200 mm**, có **hộp van** mở được từ ngoài, **lưới chắn** ở đầu phía nguồn nước (H.1.5.9).\n- Bể áp lực: **thước đo mức nước**, báo tín hiệu về trạm bơm; áp suất cao → tự ngắt nước lên bể khi bơm chạy; dùng khí ép → **máy ép dự bị** (H.1.5.10).\n\n**Hình H.1 — Bến lấy nước**\n\n| Chi tiết | Yêu cầu |\n| --- | --- |\n| Trụ chống trôi xe | Cao **≥ 0,25 m**, cách mép ngoài bến **≥ 1,5 m** |\n| Mặt bến | Chịu tải xe chữa cháy, phẳng; nghiêng thì dốc **≤ 1:15** |\n| Rào chắn | Cao **0,8 m** |\n| Chiều sâu hút nước của xe (CSHN) | **≤ 7 m** |\n| Mực nước thấp nhất (MNTN) | **≤ 5 m** so với mặt bến |\n| Chênh lệch MNCN – MNTN | **≥ 0,7 m** |\n\n**Hình H.2 — Hố thu nước**: thể tích **≥ 3 m³**, sâu **≥ 1,5 m**; ống dẫn **≥ 200 mm/01 xe hút**, dài **≤ 200 m**; có lưới chắn rác; bến chịu tải xe chữa cháy.\n", "07-h2-hong-nuoc.md": "# 7. Thiết kế họng nước trong nhà — H.2\n\nPhụ lục H mục H.2: số tia phun, lưu lượng, áp suất, bố trí họng nước, đường ống đứng, phương án trang bị.\n\n## 7.1 Phân loại họng nước (H.2.1)\n\n| Loại | Lưu lượng | Đường kính thiết bị |\n| --- | --- | --- |\n| **Lưu lượng thấp** | **0,2 – 1,5 L/s** | DN 5, 10, 15, 20, 25, 40 |\n| **Lưu lượng trung bình** | **> 1,5 L/s** | DN 50, DN 65 |\n\n- Số tia, lưu lượng tối thiểu: nhà ở, công cộng, hành chính – phụ trợ → **Bảng H.5**; nhà SX, kho → **Bảng H.6**; lưu lượng theo chiều cao tia đặc, đường kính lăng → **Bảng H.7** (H.2.1).\n- Dùng họng **lưu lượng thấp** → vẫn phải bảo đảm tổng lưu lượng và chiều cao tia đặc theo Bảng H.5 – H.7.\n- Tia đặc **≤ 4 L/s** → họng **DN 50**; **> 4 L/s** → **DN 65**; có luận chứng kinh tế – kỹ thuật được dùng DN 50 cho **> 4 L/s** (H.2.7, CT2).\n\n## 7.2 Bảng H.5 — Nhà ở, công trình công cộng\n\n| Loại nhà | Điều kiện | Số tia / tầng | L/s mỗi tia |\n| --- | --- | --- | --- |\n| **1. Chung cư, nhà ở tập thể** | **≤ 16 tầng**, hành lang chung **≤ 10 m** | **1** | 2,5 |\n|  | ≤ 16 tầng, hành lang chung **> 10 m** | **2** | 2,5 |\n|  | **> 16 – ≤ 25 tầng**, hành lang ≤ 10 m | **2** | 2,5 |\n|  | > 16 – ≤ 25 tầng, hành lang > 10 m | **3** | 2,5 |\n| **2. Nhà hành chính**⁽¹⁾ | **≤ 10 tầng**, khối tích **≤ 25 000 m³** | **1** | 2,5 |\n|  | ≤ 10 tầng, **> 25 000 m³** | **2** | 2,5 |\n|  | **> 10 tầng**, ≤ 25 000 m³ | **2** | 2,5 |\n|  | > 10 tầng, > 25 000 m³ | **3** | 2,5 |\n| **3. CLB có sân khấu, nhà hát, rạp chiếu phim, phòng nghe nhìn** (sinh hoạt, hội thảo) | **≤ 300 chỗ** | **2** | 2,5 |\n|  | **> 300 chỗ** | **2** | **5,0** |\n| **4. Ký túc xá, nhà công cộng** (trừ 2, 3)⁽²⁾ | ≤ 10 tầng, ≤ 25 000 m³ | **1** | 2,5 |\n|  | ≤ 10 tầng, > 25 000 m³ | **2** | 2,5 |\n|  | > 10 tầng, ≤ 25 000 m³ | **2** | 2,5 |\n|  | > 10 tầng, > 25 000 m³ | **3** | 2,5 |\n| **5. Nhà hành chính – phụ trợ của công trình công nghiệp** | **≤ 25 000 m³** | **1** | 2,5 |\n|  | **> 25 000 m³** | **2** | 2,5 |\n\n- ⁽¹⁾ **Nhà hành chính**: trụ sở, văn phòng, nghiên cứu chuyên ngành.\n- ⁽²⁾ **Nhà công cộng**: nhà ở riêng lẻ kết hợp SX, KD; chung cư hỗn hợp, ký túc xá, khách sạn, nhà nghỉ, lưu trú, nhà hỗn hợp; mầm non; trường học, bệnh viện, phòng khám, cấp cứu, điều dưỡng, **dưỡng lão**, cơ sở y tế; vui chơi giải trí, thủy cung, biểu diễn, bảo tàng, triển lãm, tôn giáo, di tích, sân vận động, nhà thi đấu, đăng kiểm; **nhà hát, rạp**; thư viện, văn hóa, hội nghị, đa năng; cửa hàng điện máy, bách hóa, tiện ích, nội thất, quần áo, chăn nệm, sách báo, vàng mã, hàng dễ cháy; văn phòng, bưu điện; **karaoke, vũ trường**; **chợ, TTTM, siêu thị, nhà hàng**; đài kiểm soát không lưu, nhà ga, bến xe, trạm dừng nghỉ.\n- **Hầm đường bộ**: tối thiểu **01 tia × 5 L/s** cho 01 điểm cháy (CT1).\n- **Nhà để xe ô tô dạng kín** (CT2): khoang cháy **500 – 5 000 m³** → **2 lăng × 2,5 L/s**; **> 5 000 m³** → **2 lăng × 5 L/s**. Nhà để xe ô tô 1 – 2 tầng **dạng ngăn**, lối ra ngoài trời trực tiếp từng ngăn → được **không** đặt đường ống họng nước.\n- Nhà có phần chiều cao PCCC **> 50 m** (công cộng) → **4 tia × 2,5 L/s**; nhà F5 hạng **A, B, C** cao **> 50 m** → **4 tia × 5 L/s** (H.2.2).\n\n## 7.3 Bảng H.6 — Nhà sản xuất, nhà kho (chiều cao PCCC ≤ 50 m)\n\nSố tia × lưu lượng mỗi tia (L/s), theo **khối tích** (× 1 000 m³):\n\n| Bậc chịu lửa | Hạng | Cấp S | ≤ 150 | > 150 |\n| --- | --- | --- | --- | --- |\n| I, II | A, B, C | S0, S1 | 2 × 2,5 | 3 × 2,5 |\n| I, II | D, E | Không quy định | 1 × 2,5 | 1 × 2,5 |\n| III | A, B, C | S0 | 2 × 2,5 | 3 × 2,5 |\n| III | D, E | S0, S1 | 1 × 2,5 | 2 × 2,5 |\n| IV | A, B | S0 | 2 × 2,5 | 3 × 2,5 |\n| IV | C | S0, S1 | 2 × 2,5 | **2 × 5** |\n| IV | C | S2, S3 | 3 × 2,5 | 4 × 2,5 |\n| IV | D, E | S0 – S3 | 1 × 2,5 | 2 × 2,5 |\n| V | C | Không quy định | 2 × 2,5 | **2 × 5** |\n| V | D, E | Không quy định | 1 × 2,5 | 2 × 2,5 |\n\n**Tăng thêm lưu lượng** (H.2.3), với kết cấu dễ hư hỏng khi cháy:\n\n- **Thép không bảo vệ chống cháy** trong nhà bậc III, IV (S2, S3); kết cấu **gỗ tự nhiên, gỗ ép** (kể cả đã xử lý chống cháy) → **+5 L/s**.\n- Vật liệu **cháy được bao quanh** cấu trúc nhà bậc IV (S2, S3): khối tích **≤ 10 000 m³** → **+5 L/s**; **> 10 000 m³** → thêm **5 L/s cho mỗi 100 000 m³** tăng thêm (hoặc phần lẻ).\n\n## 7.4 Quy tắc tính (H.2.4, H.2.5)\n\n- Công trình cần **≥ 2 tia** → mỗi điểm cháy lấy **2 tia** (H.2.4).\n- Nhà có nhiều công năng → tính **riêng từng phần** theo H.2.1, H.2.2:\n  - **Không** ngăn bằng tường ngăn cháy → theo **khối tích chung**;\n  - Ngăn bằng **tường ngăn cháy loại 1 hoặc 2** → theo khối tích **phần có lưu lượng cao hơn**.\n- Nhà bậc **I, II** nối bằng lối đi vật liệu không cháy **có cửa ngăn cháy** → khối tích **riêng** từng nhà; **không có** cửa ngăn cháy → khối tích **tổng**, hạng **cao hơn**.\n\n## 7.5 Áp suất (H.2.6, H.2.7)\n\n| Yêu cầu | Giá trị |\n| --- | --- |\n| Áp suất thủy tĩnh hệ **sinh hoạt – chữa cháy** tại thiết bị vệ sinh thấp nhất | **≤ 0,45 MPa** (vượt → mạng chữa cháy **riêng**) |\n| Áp suất thủy tĩnh hệ **chữa cháy riêng** tại họng thấp nhất | **≤ 0,6 MPa** |\n| Áp suất giữa van và đầu nối họng | **> 0,45 MPa** → có giải pháp **giảm áp dư** |\n\n**Chiều cao tia nước đặc tối thiểu** (= chiều cao khu vực tính từ sàn đến điểm cao nhất của xà, trần, nhưng không nhỏ hơn) (H.2.7):\n\n| Nhà | Tia đặc |\n| --- | --- |\n| Nhà ở, công cộng, SX, phụ trợ công nghiệp — chiều cao PCCC **≤ 50 m** | **≥ 6 m** |\n| **Nhà ở** chiều cao PCCC **> 50 m** | **≥ 8 m** |\n| **Nhà công cộng, SX, phụ trợ** chiều cao PCCC **> 50 m** | **≥ 16 m** |\n| **Hầm đường bộ** | **≥ 6 m** |\n\nÁp suất họng tính cả tổn thất cuộn vòi dài **10, 15, 20 m** (CT1).\n\n## 7.6 Bảng H.7 — Họng DN 50\n\nLưu lượng lăng (L/s) và áp suất họng (MPa) theo chiều dài cuộn vòi 10 / 15 / 20 m:\n\n| Tia đặc (m) | Lăng 13 mm: L/s | MPa (10/15/20 m) | Lăng 16 mm: L/s | MPa (10/15/20 m) | Lăng 19 mm: L/s | MPa (10/15/20 m) |\n| --- | --- | --- | --- | --- | --- | --- |\n| 6 | — | — | 2,6 | 0,092 / 0,096 / 0,100 | 3,4 | 0,088 / 0,096 / 0,104 |\n| 8 | — | — | 2,9 | 0,120 / 0,125 / 0,130 | 4,1 | 0,129 / 0,138 / 0,148 |\n| 10 | — | — | 3,3 | 0,151 / 0,157 / 0,164 | 4,6 | 0,160 / 0,173 / 0,185 |\n| 12 | 2,6 | 0,202 / 0,206 / 0,210 | 3,7 | 0,192 / 0,196 / 0,210 | 5,2 | 0,206 / 0,223 / 0,240 |\n| 14 | 2,8 | 0,236 / 0,241 / 0,245 | 4,2 | 0,248 / 0,255 / 0,263 | — | — |\n| 16 | 3,2 | 0,316 / 0,322 / 0,328 | 4,6 | 0,293 / 0,300 / 0,318 | — | — |\n| 18 | 3,6 | 0,390 / 0,398 / 0,406 | 5,1 | 0,360 / 0,380 / 0,400 | — | — |\n\n## 7.7 Bảng H.7 — Họng DN 65\n\n| Tia đặc (m) | Lăng 13 mm: L/s | MPa (10/15/20 m) | Lăng 16 mm: L/s | MPa (10/15/20 m) | Lăng 19 mm: L/s | MPa (10/15/20 m) |\n| --- | --- | --- | --- | --- | --- | --- |\n| 6 | — | — | 2,6 | 0,088 / 0,089 / 0,090 | 3,4 | 0,078 / 0,080 / 0,083 |\n| 8 | — | — | 2,9 | 0,110 / 0,112 / 0,114 | 4,1 | 0,114 / 0,117 / 0,121 |\n| 10 | — | — | 3,3 | 0,140 / 0,143 / 0,146 | 4,6 | 0,143 / 0,147 / 0,151 |\n| 12 | 2,6 | 0,198 / 0,199 / 0,201 | 3,7 | 0,180 / 0,183 / 0,186 | 5,2 | 0,182 / 0,190 / 0,199 |\n| 14 | 2,8 | 0,230 / 0,231 / 0,233 | 4,2 | 0,230 / 0,233 / 0,235 | 5,7 | 0,218 / 0,224 / 0,230 |\n| 16 | 3,2 | 0,310 / 0,313 / 0,315 | 4,6 | 0,276 / 0,280 / 0,284 | 6,3 | 0,266 / 0,273 / 0,280 |\n| 18 | 3,6 | 0,380 / 0,383 / 0,385 | 5,1 | 0,338 / 0,342 / 0,346 | 7,0 | 0,329 / 0,338 / 0,348 |\n| 20 | 4,0 | 0,464 / 0,467 / 0,470 | 5,6 | 0,412 / 0,424 / 0,418 | 7,5 | 0,372 / 0,385 / 0,397 |\n\nGiá trị in nguyên như văn bản (ô 16 mm – 20 m – vòi 20 m ghi 0,418, nhỏ hơn ô vòi 15 m — đối chiếu bản gốc khi dùng).\n\n## 7.8 Bể áp lực, thời gian làm việc (H.2.8, H.2.9)\n\n- Bơm **không** điều khiển tự động hoặc từ xa → **bể áp lực**: mọi thời điểm cấp tia đặc **> 4 m** tại tầng cao nhất hoặc tầng ngay dưới nơi đặt bể, **≥ 6 m** các tầng còn lại; dung tích: **2 tia × 2,5 L/s trong 10 min** (khi số tia tính toán ≥ 2), **1 tia** các trường hợp khác. Bơm điều khiển tự động → không cần xét bể áp lực (H.2.8).\n- Chỉ có họng nước trong nhà → thời gian làm việc **1 h**. Có chữa cháy tự động bằng nước → **bằng thời gian** của hệ thống tự động (H.2.9).\n\n## 7.9 Ống đứng, họng kép, vị trí họng (H.2.10 – H.2.17)\n\n- Nhà **≥ 6 tầng** liên kết sinh hoạt – chữa cháy → ống đứng **nối vòng ở trên**; nối với ống xả đứng có van để thay nước (H.2.10).\n- Ống khô ở nơi **< 0 °C** → van khóa đặt nơi **không bị đóng băng** (H.2.10).\n- **Họng kép** trên ống đứng: nhà SX, công cộng khi số tia **≥ 3**; nhà ở khi **≥ 2** (H.2.11).\n- Nhà ở hành lang **≤ 10 m**, 2 tia → được **2 tia từ một ống đứng**. Nhà ở hành lang **> 10 m**, nhà SX, công cộng **≥ 2 tia** → 2 tia từ **2 tủ khác nhau** (2 ống đứng khác nhau) (H.2.11).\n- Lắp họng ở tầng kỹ thuật, tầng áp mái, tầng hầm kỹ thuật **có vật liệu, kết cấu cháy được**; mỗi tủ **≤ 2 tia**; được nối vòi tổng chiều dài **≤ 40 m** để tăng bán kính phục vụ (vòi xếp trên giá hoặc cuộn, phun được ngay khi đang cuộn) (H.2.11, CT1 – CT3).\n- Miệng họng cao **1,20 m ± 0,15 m** so với mặt sàn, đặt trong **tủ chữa cháy** có niêm phong; họng kép: họng dưới **≥ 1,0 m** (H.2.12).\n- **Họng chờ tiếp nước** ngoài nhà, đầu nối **≥ DN65**; nhà **≥ 17 tầng** → chia **vùng theo chiều cao ≤ 50 m**, họng chờ có **van một chiều**, thể hiện trạng thái đóng/mở (H.2.13).\n- Vị trí họng: lối vào phía trong hành lang của buồng thang (trừ buồng thang **không nhiễm khói**), sảnh, hành lang, lối đi; **không cản trở thoát nạn** (H.2.14).\n- Khu vực có sprinkler → được đặt họng trên ống **≥ DN 65 sau cụm van điều khiển** sprinkler (H.2.15).\n- Khu vực kín có thể đóng băng → ống sau trạm bơm được là **ống khô** (H.2.16).\n- Van khóa ống nhánh cụt: mỗi đoạn khóa **≤ 5 họng** trên cùng một tầng (H.2.17).\n\n## 7.10 Phương án trang bị (H.2.18)\n\n| Phương án | Cấu hình | Phạm vi |\n| --- | --- | --- |\n| **1** | Họng **lưu lượng trung bình** | **Mọi loại** công trình |\n| **2** | Họng **lưu lượng nhỏ** + **đường ống họng khô** | Nhà ở, công trình công cộng |\n| **3** | Họng **lưu lượng nhỏ** | Công trình có **chữa cháy tự động cho toàn bộ** |\n| **4** | Họng **lưu lượng nhỏ** + họng **lưu lượng trung bình** | Nhà ở, công trình công cộng |\n\nTrong một công trình được **kết hợp** nhiều phương án.\n\n## 7.11 Họng lấy nước hai cửa (H.2.19)\n\nCông trình phải có **họng nước trong nhà và sprinkler tự động** → đường ống nối từ trạm bơm đến **≥ 01 họng lấy nước hai cửa DN65** đặt ở **mặt ngoài tường** công trình, phía có **đường giao thông**.\n", "08-h3-h4-bom-loa.md": "# 8. Trạm bơm, loa thông báo — H.3, H.4\n\n## 8.1 Máy bơm dự phòng (H.3.1)\n\n| Số bơm chính theo tính toán | Bơm dự phòng tối thiểu |\n| --- | --- |\n| **1 – 3** | **1** |\n| **≥ 4** | **2** |\n\n- Bơm dự phòng có lưu lượng, áp lực **không nhỏ hơn bơm chính**; áp dụng cả khi bơm **riêng** hay **kết hợp** sinh hoạt, sản xuất.\n- Trạm **≥ 02 bơm** → **≥ 2 đường ống hút**, mỗi ống hút đủ lưu lượng tính toán lớn nhất; hỏng một ống, bơm vẫn hút từ ống còn lại. Không quy định số ống hút khi dùng **bơm tua bin trục đứng**.\n- Trên mỗi ống hút, ống đẩy: van để thay, sửa bơm; **van một chiều**, van khóa kiểm tra đặc tính bơm.\n- **Không cần bơm dự phòng**: cấp nước cho nhà SX, kho bậc **I, II**, hạng **D, E**, lưu lượng ngoài nhà **< 20 L/s** (H.3.2).\n\n## 8.2 Nguồn điện, điều khiển (H.3.2, H.3.3)\n\n- Bơm động cơ điện: **hai nguồn điện độc lập** (lưới hoặc máy phát dự phòng). Được **một nguồn** khi bơm dự phòng chạy **động cơ đốt trong** (H.3.2).\n- Lưu lượng ngoài nhà **≥ 25 L/s** → điều khiển **tự động hoặc từ xa** (phòng trực, trụ cấp nước) **và** điều khiển **bằng tay tại phòng bơm**; bơm chạy **≤ 3 min** từ khi có thông tin báo cháy (H.3.3).\n- Đường ống áp suất cao ngoài nhà: bơm chạy **≤ 5 phút** sau tín hiệu báo cháy (H.1.1.1).\n\n## 8.3 Loa thông báo và hướng dẫn thoát nạn (H.4)\n\n| Yêu cầu | Giá trị |\n| --- | --- |\n| Mức âm thanh tổng thể (ồn thường xuyên + tín hiệu), cách thiết bị **3 m** | **≥ 75 dBA** |\n| Mức âm thanh tối đa tại mọi vị trí | **≤ 120 dBA** |\n| Vượt tiếng ồn thường xuyên của gian phòng (đo ở **1,5 m** từ sàn) | **≥ 15 dBA** |\n| **Phòng ngủ**: vượt ồn thường xuyên; tổng thể (đo ngang **đầu người ngủ**) | **≥ 15 dBA**; **70 – 120 dBA** |\n| Loa gắn tường: mép trên cách **sàn** / cách **trần** | **≥ 2,3 m** / **≥ 0,15 m** |\n| Phòng ồn **> 95 dBA** hoặc người dùng thiết bị chống ồn | Kết hợp **cảnh báo ánh sáng** (được dùng đèn nháy) |\n| Dải tần loa thoại | **200 – 5 000 Hz** |\n\n- Mọi người trong nhà phải **nghe rõ** thông báo, hướng dẫn khi có sự cố.\n- Số lượng, vị trí, công suất loa phải bảo đảm mức âm thanh ở **mọi khu vực có người**.\n\n## 8.4 Tài liệu tham khảo của quy chuẩn\n\nThư mục tài liệu tham khảo của QCVN 10:2025/BCA gồm: **TCVN 3890:2023**; SP 486.1311500.2020, SP 484.1311500.2020 (Nga); GB 55037-2022, GB 50229-2019, GB 50720-2011, JTS 165-2013, JTJ 165-5-2021 (Trung Quốc); Quy chuẩn PCCC Singapore 2018; NFPC 606 (Hàn Quốc).\n", "09-chung-cu-kho-xuong.md": "# 9. Tra nhanh chung cư, kho, xưởng\n\nMọi ngưỡng trang bị của hai nhóm công trình hay gặp nhất, gom về một trang. Số tầng theo 1.4.24 (gồm tầng kỹ thuật, tầng tum, tầng bán hầm; không gồm tầng áp mái).\n\n## 9.1 Chung cư — trang bị theo quy mô\n\n| Hệ thống | Phải trang bị khi | Điều |\n| --- | --- | --- |\n| Báo cháy tự động | **≥ 5 tầng** hoặc **≥ 700 m²** | Bảng A.1 mục 3 |\n| — được dùng thiết bị báo cháy độc lập | **< 5 tầng** và **< 1 500 m²** | Bảng A.1 mục 3 |\n| Báo cháy **địa chỉ** | Chiều cao PCCC **≥ 75 m** (xây mới) | Bảng A.1 Chú thích 2 |\n| Chữa cháy tự động (sprinkler) | Chiều cao PCCC **≥ 30 m** | Bảng A.1 mục 3 |\n| — chỉ đầu phun **tại cửa căn hộ** | Chiều cao PCCC **≤ 100 m** | 1.5.12 |\n| Họng nước trong nhà | **≥ 5 tầng** hoặc **≥ 1 500 m²** | Bảng B.1 mục 1.2 |\n| Bơm điều khiển tay tại phòng bơm và tự động | Chiều cao PCCC **≥ 25 m** | 2.4.2 |\n| Đường ống khô DN65 | Chiều cao PCCC **> 50 m** hoặc hầm sâu **> 9 m** | 2.4.4 |\n| Họng chờ chia vùng **≤ 50 m** | **≥ 17 tầng** | H.2.13 |\n| Loa thông báo, hướng dẫn thoát nạn | **> 10 tầng** hoặc **≥ 2 tầng hầm** | Bảng G.1 mục 1 |\n| Dụng cụ phá dỡ thô sơ | Mọi quy mô (01 bộ) | Bảng E.1 |\n| Bình chữa cháy | Mọi khu vực; bảo dưỡng 6 tháng/lần | 2.6; 1.5.13 |\n\n## 9.2 Chung cư — số tia, tia đặc, nước ngoài nhà\n\n| Số tầng | Hành lang chung ≤ 10 m | Hành lang chung > 10 m | Điều |\n| --- | --- | --- | --- |\n| ≤ 16 tầng | 1 × 2,5 L/s | 2 × 2,5 L/s | Bảng H.5 mục 1 |\n| 17 – 25 tầng | 2 × 2,5 L/s | 3 × 2,5 L/s | Bảng H.5 mục 1 |\n\n- Số tia ≥ 2: được **họng kép**; hành lang ≤ 10 m được 2 tia từ **một ống đứng**, hành lang > 10 m phải từ **2 ống đứng** (H.2.11).\n- Tia nước đặc **≥ 6 m** (chiều cao PCCC ≤ 50 m); **≥ 8 m** (> 50 m) (H.2.7).\n- Nước ngoài nhà theo **Bảng H.2** dòng F1.3, F1.4; nằm trong bán kính **400 m** từ trụ hoặc bến lấy nước đủ lưu lượng thì được miễn hệ thống riêng (2.3.2).\n\n## 9.3 Chung cư — phần để xe, khối đế thương mại\n\n| Khu vực | Báo cháy tự động | Chữa cháy tự động | Điều |\n| --- | --- | --- | --- |\n| Phòng lưu giữ ô tô trong nhà | Không phụ thuộc diện tích | **≥ 3 xe ô tô** | Bảng A.3 mục 4.4 |\n| Phòng lưu giữ **xe máy** (phương tiện cơ giới đường bộ trừ ô tô) | **≥ 1 000 m²** | **≥ 1 000 m²** | Bảng A.3 mục 4.2 |\n| Gian thương mại tầng hầm | Không phụ thuộc diện tích | **≥ 200 m²** | Bảng A.3 mục 5.10.1 |\n| Gian thương mại trên mặt đất | **≥ 500 m²** | **≥ 500 m²** | Bảng A.3 mục 5.10.2 |\n| Phòng máy chủ | **≥ 24 m²** | **≥ 24 m²** | Bảng A.3 mục 5.9 |\n\n- Nhà để xe ô tô, xe máy kín (kể cả trong nhà khác) **≥ 18 000 m²** → loa thông báo (Bảng G.1 mục 3).\n- Chung cư dưới 30 m chưa phải lắp sprinkler toàn nhà, nhưng gara **xe máy ≥ 1 000 m²** hoặc gara **≥ 3 ô tô** vẫn phải có sprinkler cho khu để xe; khi đó cần thêm họng lấy nước hai cửa DN65 (H.2.19).\n- Họng nước khu để xe kín: khoang 500 – 5 000 m³ → **2 × 2,5 L/s**; > 5 000 m³ → **2 × 5 L/s** (Bảng H.5 CT2).\n- Có công năng khác chiếm > 30 % diện tích sàn → kiểm tra **quy tắc 70 %** (1.5.8).\n\n## 9.4 Kho, xưởng — trình tự xét\n\nPhần kiến trúc theo QCVN 06 (khoang cháy, thoát nạn, khoảng cách) cho kho, xưởng: xem [Kho, xưởng — kiến trúc QCVN 06](10-kho-xuong-qcvn06.md).\n\n\n1. Xác định **hạng** A, B, C1 – C4, D, E của nhà và từng gian (QCVN 06; 1.5.2).\n2. Kho: hạng C trên **giá > 5,5 m** hoặc kho B, C **≥ 2 tầng** → báo cháy và chữa cháy tự động **không phụ thuộc diện tích** (Bảng A.1 mục 30, 31).\n3. Các trường hợp khác xét **từng gian** theo Bảng A.3 (mục 1 kho, mục 2 sản xuất) — ngưỡng tính theo **diện tích gian**.\n4. Gian hạng **C4, E** được loại trừ (1.5.11); gian F5 cao **≤ 10 m** có sprinkler liên động trung tâm báo cháy → được không lắp đầu báo (1.5.6).\n5. Họng nước: hạng A – D **≥ 500 m²**; không trang bị khi có chất **gặp nước sinh cháy, nổ** (Bảng B.1 mục 2, CT3).\n6. Số tia theo **Bảng H.6**; nước ngoài nhà theo **Bảng H.3** (hoặc **H.4** khi không có lỗ mở mái và rộng > 60 m).\n7. Gian SX, kho, phòng thí nghiệm **> 50 m²** nằm trong nhà F1 – F4 → xét như gian F5 (Bảng A.3 chú thích).\n\n## 9.5 Kho — ngưỡng theo gian (Bảng A.3 mục 1)\n\n| Gian kho | Báo cháy | Chữa cháy tự động |\n| --- | --- | --- |\n| Hạng A, B | Không phụ thuộc diện tích | **≥ 300 m²** |\n| Cao su, hạt nhựa, pháo hoa, len, lông thú, chất cháy < 3 kg/m³ | Không phụ thuộc diện tích | **≥ 100 m²** |\n| Hàng không cháy trong bao bì dễ cháy | **≥ 300 m²** | — |\n| C1 — tầng hầm / trên mặt đất | Không phụ thuộc / **≥ 300 m²** | **≥ 100 m²** / **≥ 300 m²** |\n| C2, C3 — tầng hầm / trên mặt đất | **≥ 300 m²** / **≥ 1 000 m²** | **≥ 300 m²** / **≥ 1 000 m²** |\n| Kho lạnh | **≥ 300 m²** | — |\n\n## 9.6 Xưởng — ngưỡng theo gian (Bảng A.3 mục 2)\n\n| Gian sản xuất | Báo cháy | Chữa cháy tự động |\n| --- | --- | --- |\n| Hạng A, B | Không phụ thuộc diện tích | **≥ 300 m²** |\n| C1 — tầng hầm / trên mặt đất | Không phụ thuộc diện tích | Không phụ thuộc / **≥ 300 m²** |\n| C2, C3 — hầm, không có lối ra trực tiếp | Không phụ thuộc diện tích | **≥ 300 m²** |\n| C2, C3 — hầm, có lối ra trực tiếp | — | **≥ 700 m²** |\n| C2, C3 — trên mặt đất | **≥ 300 m²** | **≥ 1 000 m²** |\n| Chất lỏng dễ cháy, phòng sơn, tổng hợp cao su, gia nhiệt dầu | Không phụ thuộc diện tích | Không phụ thuộc diện tích |\n\n## 9.7 Kho, xưởng — bơm, nước, loa\n\n| Yêu cầu | Điều kiện | Điều |\n| --- | --- | --- |\n| Bơm điều khiển tay tại phòng bơm và tự động | Hạng **A, B, C1**; hoặc chiều cao PCCC **≥ 25 m** | 2.4.2 |\n| Được không có bơm dự phòng | Bậc **I, II**, hạng **D, E**, nước ngoài nhà **< 20 L/s** | H.3.2 |\n| Thời gian chữa cháy ngoài nhà | **3 h**; bậc I, II hạng D, E: **2 h**; lưu lượng ≤ 20 L/s: **1 h**; kho vật liệu từ gỗ: **≥ 5 h** | H.1.3.3 |\n| Tăng lưu lượng trong nhà | Thép không bảo vệ (bậc III, IV, S2, S3), kết cấu gỗ: **+5 L/s** | H.2.3 |\n| Nhà F5 hạng A, B, C cao PCCC > 50 m | **4 tia × 5 L/s** | H.2.2 |\n| Sprinkler kho giá cao > 5,5 – 25 m | Thiết kế theo **TCVN 14496** | 2.5.2 |\n| Loa thông báo (nhà sản xuất) | **≥ 18 000 m²** và **≥ 300 người/tầng** | Bảng G.1 mục 4 |\n| Kho lạnh — nước ngoài nhà | Tính như nhà **hạng C** | H.1.2 CT6 |\n| Dụng cụ phá dỡ thô sơ | Nhà sản xuất; nhà kho độc lập (01 bộ) | Bảng E.1 |\n", "10-kho-xuong-qcvn06.md": "# 10. Kho, xưởng — kiến trúc QCVN 06\n\nCác yêu cầu **kiến trúc** của **QCVN 06:2022/BXD + Sửa đổi 1:2023** cho nhà sản xuất (F5.1) và nhà kho (F5.2): khoang cháy, bậc chịu lửa, thoát nạn, khoảng cách. Lấy từ sổ tay QCVN 06 cùng bộ (đã đối chiếu bản hợp nhất). Số điều trong mục này là **điều của QCVN 06**. Phần trang bị phương tiện theo QCVN 10 xem [Tra nhanh chung cư, kho, xưởng](09-chung-cu-kho-xuong.md).\n\n## 10.1 Trình tự xét kho, xưởng theo QCVN 06\n\n1. Xác định **hạng** A, B, C1 – C4, D, E (QCVN 06 Phụ lục C) và **nhóm** F5.1 (sản xuất) hay F5.2 (kho).\n2. Chọn **bậc chịu lửa, cấp S** sao cho chiều cao, số tầng, diện tích tầng nằm trong **Bảng H.9** (sản xuất) hoặc **Bảng H.11** (kho).\n3. Có **chữa cháy tự động toàn nhà** (theo QCVN 10 hoặc tự nguyện) → diện tích tầng được **tăng 2 lần** (trừ bậc IV, V).\n4. Khoảng cách thoát nạn: **Bảng G.3** (từ chỗ làm việc xa nhất), **Bảng G.4** (từ cửa gian ≤ 1 000 m² theo hành lang).\n5. Khoảng cách tới nhà sản xuất, kho khác: **Bảng E.2**.\n\n## 10.2 Khoang cháy nhà sản xuất — QCVN 06 Bảng H.9\n\n**Bảng H.9 — Nhà sản xuất** (diện tích 1 tầng / khoang cháy, m²; chiều cao tính từ sàn tầng 1 tới trần tầng trên cùng)\n\n| Hạng | Cao tối đa | Bậc | Cấp S | 1 tầng | 2 tầng | ≥ 3 tầng |\n| --- | --- | --- | --- | --- | --- | --- |\n| A | 36 m | I, II | S0 | Không hạn chế | 5 200 | 3 500 |\n|  | 24 m | III | S0 | 7 800 | 3 500 | 2 600 |\n|  | — | IV | S0 | 3 500 | — | — |\n| B | 36 m | I, II | S0 | Không hạn chế | 10 400 | 7 800 |\n|  | 24 m | III | S0 | 7 800 | 3 500 | 2 600 |\n|  | — | IV | S0 | 3 500 | — | — |\n| C | 48 m | I, II | S0 | Không hạn chế | 25 000 (gỗ: 7 800) | 10 400 (gỗ: 5 200) |\n|  | 24 m | III | S0, S1 | 25 000 (gỗ: 10 400) | 10 400 (gỗ: 5 200) | 5 200 (gỗ: 3 600) |\n|  | 18 m | IV | S0, S1 | 25 000 (gỗ: 5 200) | 10 400 | 1 400 ⁽⁵⁾ |\n|  | 18 m | IV | S2, S3 | 2 600 | 2 000 | 1 100 ⁽⁵⁾ |\n|  | 12 m | V | — | 1 200 | 600 ⁽⁴⁾ | — |\n| D | 54 m | I, II | S0 | Không hạn chế | Không hạn chế | Không hạn chế |\n|  | 36 m | III | S0 | Không hạn chế | 25 000 | 10 400 |\n|  | 30 m | III | S1 | Không hạn chế | 10 400 | 7 800 |\n|  | 24 m | IV | S0 | Không hạn chế | 10 400 | 5 200 |\n|  | 18 m | IV | S1 | 6 500 | 5 200 | — |\n| E | 54 m | I, II | S0 | Không hạn chế | Không hạn chế | Không hạn chế |\n|  | 36 m | III | S0 | Không hạn chế | 50 000 | 15 000 |\n|  | 30 m | III | S1 | Không hạn chế | 25 000 | 10 400 |\n|  | 24 m | IV | S0, S1 | Không hạn chế | 25 000 | 7 800 |\n|  | 18 m | IV | S2, S3 | 10 400 | 7 800 | — |\n|  | 12 m | V | — | 2 600 | 1 500 | — |\n\n\"Gỗ\": giá trị cho nhà sản xuất chế biến gỗ (chú thích 3). ⁽⁴⁾ Nhà hạng C bậc V, xưởng cưa ≤ 4 khung, chế biến gỗ sơ bộ, trạm nghiền gỗ. ⁽⁵⁾ Tối đa 3 tầng (cao ≤ 22 m), phải có chữa cháy tự động. Ô \"—\": được áp dụng NFPA 5000 hoặc tiêu chuẩn tương đương. Hàng C – bậc I, II: được áp dụng đồng bộ NFPA 5000 khi vẫn không đáp ứng quy mô sản xuất (GHCL không thấp hơn bậc I của Bảng 4). Nhà một tầng S0, S1: không quy định chiều cao.\n\n- **Chữa cháy tự động toàn nhà**: tăng **2 lần** diện tích (trừ bậc IV, V).\n- Nhà hạng C có gian **C1 > 1/2** diện tích tầng: **giảm 25 %** diện tích.\n- Lỗ mở công nghệ trên sàn: tổng diện tích các tầng thông nhau ≤ diện tích tầng của bảng.\n\n## 10.3 Khoang cháy nhà kho — QCVN 06 Bảng H.11\n\n**Bảng H.11 — Nhà kho F5.2** (diện tích 1 tầng / khoang cháy, m²)\n\n| Hạng | Cao tối đa | Bậc | Cấp S | 1 tầng | 2 tầng | ≥ 3 tầng |\n| --- | --- | --- | --- | --- | --- | --- |\n| A | — | I, II | S0 | 5 200 | — | — |\n|  | — | III | S0 | 4 400 | — | — |\n|  | — | IV | S0 | 3 600 | — | — |\n|  | — | IV | S2, S3 | 75 (nhà di động) | — | — |\n| B | 18 m | I, II | S0 | 7 800 | 5 200 | 3 500 |\n|  | — | III | S0 | 6 500 | — | — |\n|  | — | IV | S0 | 5 200 | — | — |\n|  | — | IV | S2, S3 | 75 (nhà di động) | — | — |\n| C | 36 m | I, II | S0 | 10 400 | 7 800 | 5 200 |\n|  | 24 m | III | S0 | 10 400 | 5 200 | 2 600 |\n|  | — | IV | S0, S1 | 7 800 | 1 600 | 1 600 ⁽³⁾ |\n|  | — | IV | S2, S3 | 2 600 | — | — |\n|  | — | V | — | 1 200 | — | — |\n| E | Không giới hạn | I, II | S0 | Không giới hạn | 10 400 | 7 800 |\n|  | 36 m | III | S0, S1 | Không giới hạn | 7 800 | 5 200 |\n|  | — | IV | S0, S1 | Không giới hạn | 2 200 | 2 200 ⁽⁴⁾ |\n|  | — | IV | S2, S3 | 5 200 | — | — |\n|  | 9 m | V | — | 2 200 | 1 200 | — |\n\n⁽³⁾ Tối đa 4 tầng (≤ 22 m); kho 4 tầng phải có chữa cháy tự động. ⁽⁴⁾ Tối đa 4 tầng (≤ 22 m). Nhà kho một tầng bậc IV: cao **≤ 25 m** (S0, S1) hoặc **≤ 18 m** (S2, S3), tính tới mép dưới kết cấu chịu lực mái. Bảng H.11 không có dòng hạng D.\n\n- **Chữa cháy tự động toàn nhà**: tăng tối đa **2 lần** (trừ bậc IV, V) (H.5.3).\n- Kho đặt trong nhà sản xuất: diện tích, số tầng không vượt Bảng H.11.\n- Tầng 1 của kho nhiều tầng được tính như nhà 1 tầng nếu sàn tầng 2 là **sàn ngăn cháy loại 1** (H.5.4).\n- **Nhà lưu trữ không cao quá 28 m** (H.5.5). Kho gỗ thành phẩm: 1 tầng, bậc ≥ IV, S0 – S1, theo Bảng H.12.\n- Gara bậc IV từ 2 tầng: được không bảo vệ chịu lửa sàn khi chủ đầu tư không yêu cầu hạn chế thiệt hại xe và thang thoát nạn bố trí sát biên nhà (CT3 Bảng H.11).\n- Nhà hành chính – phụ trợ của cơ sở sản xuất (F4.3): theo Bảng H.2 (H.3).\n\n## 10.4 Khoảng cách thoát nạn nhà sản xuất — QCVN 06 Bảng G.3, G.4\n\n**Bảng G.3 — Nhà sản xuất: từ chỗ làm việc xa nhất tới lối ra thoát nạn gần nhất** (m; theo mật độ dòng người trên lối đi chung, người/m²)\n\n| Khối tích gian | Hạng | Bậc | Cấp S | ≤ 1 | > 1 – 3 | > 3 – 5 |\n| --- | --- | --- | --- | --- | --- | --- |\n| ≤ 15 000 m³ | A, B | I – IV | S0 | 40 | 25 | 15 |\n|  | C1 – C3 | I – IV | S0 | 100 | 60 | 40 |\n|  | C1 – C3 | III, IV | S1 | 70 | 40 | 30 |\n|  | C1 – C3 | V | S2, S3 | 50 | 30 | 20 |\n| 30 000 m³ | A, B | I – IV | S0 | 60 | 35 | 25 |\n|  | C1 – C3 | I – IV | S0 | 145 | 85 | 60 |\n|  | C1 – C3 | III, IV | S1 | 100 | 60 | 40 |\n| 40 000 m³ | A, B | I – IV | S0 | 80 | 50 | 35 |\n|  | C1 – C3 | I – IV | S0 | 160 | 95 | 65 |\n|  | C1 – C3 | III, IV | S1 | 110 | 65 | 45 |\n| 50 000 m³ | A, B | I – IV | S0 | 120 | 70 | 50 |\n|  | C1 – C3 | I – IV | S0 | 180 | 105 | 75 |\n|  | C1 – C3 | III, IV | S1 | 160 | 95 | 65 |\n| ≥ 60 000 m³ | A, B | I – IV | S0 | 140 | 85 | 60 |\n|  | C1 – C3 | I – IV | S0 | 200 | 110 | 85 |\n|  | C1 – C3 | III, IV | S1 | 180 | 105 | 75 |\n| ≥ 80 000 m³ | C1 – C3 | I – IV | S0 | 240 | 140 | 100 |\n|  | C1 – C3 | III, IV | S1 | 200 | 110 | 85 |\n| Không phụ thuộc | C4, D | I – IV | S0 | Không hạn chế | Không hạn chế | Không hạn chế |\n|  | C4, D | III, IV | S1 | 160 | 95 | 65 |\n|  | C4, D | V | Không quy định | 120 | 70 | 50 |\n| Không phụ thuộc | E | I – IV | S0, S1 | Không hạn chế | Không hạn chế | Không hạn chế |\n|  | E | IV, V | S2, S3 | 160 | 95 | 65 |\n\n- Khối tích trung gian: **nội suy tuyến tính** (G.1.3.2). Gian > 1 000 m²: khoảng cách gồm cả đường đi theo hành lang tới lối ra (G.1.3.1).\n- Bảng áp dụng cho gian cao **đến 6 m**. Gian cao hơn: tăng **20 %** (đến 12 m), **30 %** (đến 18 m), **40 %** (đến 24 m), nhưng **≤ 140 m** (hạng A, B) và **≤ 240 m** (hạng C) (G.1.3.3).\n- Mật độ dòng người = tổng số người thoát nạn theo đường thoát nạn ÷ diện tích đường thoát nạn đó.\n\n**Bảng G.4 — Nhà sản xuất: từ cửa gian ≤ 1 000 m² theo hành lang tới lối ra gần nhất** (m; theo mật độ dòng người trên lối đi chung, người/m²)\n\n| Vị trí cửa gian | Hạng | Bậc | Cấp S | ≤ 2 | > 2 – 3 | > 3 – 4 | > 4 – 5 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Ở giữa hai lối ra thoát nạn | A, B | I – IV | S0 | 60 | 50 | 40 | 35 |\n|  | C1 – C3 | I – IV | S0 | 120 | 95 | 80 | 65 |\n|  | C1 – C3 | III, IV | S1 | 85 | 65 | 55 | 45 |\n|  | C1 – C3 | Không quy định | S2, S3 | 60 | 50 | 40 | 35 |\n|  | C4, D, E | I – IV | S0 | 180 | 140 | 120 | 100 |\n|  | C4, D, E | III, IV | S1 | 125 | 100 | 85 | 70 |\n|  | C4, D, E | Không quy định | S2, S3 | 90 | 70 | 60 | 50 |\n| Đi vào hành lang cụt | Mọi hạng | I – IV | S0 | 30 | 25 | 20 | 15 |\n|  | Mọi hạng | III, IV | S1 | 20 | 15 | 15 | 10 |\n|  | Mọi hạng | Không quy định | S2, S3 | 15 | 10 | 10 | 8 |\n\n## 10.5 Quy định bổ sung nhà sản xuất, kho (QCVN 06 Phụ lục A.1)\n\nÁp dụng cho nhà F5.1, F5.2 có **≤ 1 tầng hầm** (không áp dụng cho kho lạnh, kho ngũ cốc, kho phân bón, hóa chất bảo vệ thực vật… và nhà sản xuất từ 2 tầng hầm).\n\n| Hạng mục | Yêu cầu | Điều |\n| --- | --- | --- |\n| Sàn công tác, sàn đỡ thiết bị, sàn lửng | Diện tích **> 40 %** diện tích một tầng thì **tính là một tầng** | A.1.2.1 |\n| Diện tích tầng / khoang cháy | Theo chu vi trong của tường bao, không tính buồng thang; cộng diện tích sàn công tác, sàn lửng. Không tính thềm xếp dỡ ngoài nhà | A.1.2.1 |\n| Chiều cao thông thủy | Gian phòng **≥ 2,2 m**; lối đi thường xuyên, đường thoát nạn **≥ 2,0 m**; lối đi không thường xuyên ≥ 1,8 m; lối xe chữa cháy vào nhà **≥ 4,5 m** | A.1.2.3 |\n| Khoang đệm trước cửa thang máy | Rộng hơn cửa **≥ 0,5 m**; sâu **≥ 1,2 m** và hơn cánh cửa ≥ 0,2 m. Có xe lăn: sâu ≥ 1,8 m, rộng ≥ 1,4 m | A.1.2.6 |\n| Tấm che dễ bung (gian hạng A, B) | Theo tính toán; không có số liệu: **≥ 0,05 m²/m³** (hạng A), **≥ 0,03 m²/m³** (hạng B). Kính 3 / 4 / 5 mm: tấm ≥ 0,8 / 1,0 / 1,5 m²; không dùng kính gia cường, nhiều lớp, polycarbonate | A.1.2.7 |\n| Lối lên mái | Nhà cao **≥ 10 m**: **1 lối / 40 000 m²** mái (ít nhất 1). Nhà 1 tầng: thang thép hở bên ngoài; nhiều tầng: từ buồng thang | A.1.3.1 |\n| Tầng hầm có gian C1 – C3 | Phân khoang **≤ 3 000 m²** bằng vách ngăn cháy loại 1; sàn trên ≥ loại 3; hành lang rộng **≥ 2 m** ra ngoài hoặc qua buồng thang không nhiễm khói | A.1.3.5 |\n| Thềm xếp dỡ | Không cháy (nhà bậc I – IV, S0, S1); ≥ 2 thang hoặc dốc phân tán | A.1.3.6, A.1.3.7 |\n| Gian C1 – C3 trong nhà ở, nhà công cộng | Bậc I: vách ngăn cháy loại 1 + sàn ≥ loại 2; bậc II – IV: vách loại 1 + sàn ≥ loại 3. **Không** đặt trong nhà khác có **≥ 50 người** đồng thời | A.1.3.9 |\n| Gian C4 trong nhà ở, nhà công cộng | Vách ngăn cháy ≥ loại 2 | A.1.3.9 |\n| Kho C1 – C3 trong nhà sản xuất | Vách ngăn cháy loại 1 + sàn ≥ loại 3; kho giá cao tầng (> 5,5 m): **tường + sàn ngăn cháy loại 1** | A.1.3.9 |\n| Kho hạng C trên giá cao tầng | Nhà 1 tầng bậc I – IV, S0; nhà nhiều tầng phải có chữa cháy tự động cho giá | A.1.3.10 |\n| Kho ngoại quan 1 tầng bậc I, II, S0 | Hành lang bao bằng vách ngăn cháy loại 1, áp suất dương: không tính vào chiều dài đường thoát nạn | A.1.3.2 |\n\n## 10.6 Khoảng cách giữa các nhà sản xuất, kho — QCVN 06 Bảng E.2 (m)\n\n| Nhà thứ nhất | ↔ Bậc I, II; bậc III, IV – S0 | ↔ Bậc III – S1 | ↔ Bậc III – S2, S3; bậc IV – S1–S3; bậc V |\n| --- | --- | --- | --- |\n| Bậc I, II; bậc III, IV – S0 | Hạng D, E: không quy định; hạng A, B, C: **9** | 9 | 12 |\n| Bậc III – S1 | 9 | 12 | 15 |\n| Bậc III – S2, S3; bậc IV – S1–S3; bậc V | 12 | 15 | 18 |\n\n- Nhà bậc I, II và bậc III, IV – S0 hạng A, B, C có **chữa cháy tự động toàn nhà**: giảm **9 m → 6 m** (CT3).\n- Không quy định khi: tổng diện tích sàn các nhà bậc III, IV ≤ diện tích tầng cho phép của một khoang cháy; tường đối diện của nhà cao/rộng hơn là **tường ngăn cháy loại 1**; nhà bậc III có tường đối diện là tường ngăn cháy loại 2, lỗ mở chèn bịt loại 2 (CT2).\n- Khoảng cách tới kho chất lỏng cháy, kho hở, bồn LPG, khí cháy: theo quy chuẩn chuyên ngành (4.1).\n", "11-gara-qcvn13.md": "# 11. Gara ô tô — QCVN 13:2018/BXD\n\n**QCVN 13:2018/BXD — Gara ô-tô**, ban hành kèm Thông tư **12/2018/TT-BXD** ngày 26/12/2018, hiệu lực **15/3/2019**, thay thế QCVN 08:2009/BXD Phần 2. Áp dụng cho nhà, công trình và **gian phòng lưu giữ ô tô** (gọi chung là gara ô tô), không phụ thuộc dạng sở hữu; không áp dụng gara xe chở chất nổ, chất độc, chất lây nhiễm, phóng xạ (1.1). Số điều trong mục này là **điều của QCVN 13**. Trang bị phương tiện PCCC đồng thời xét theo **QCVN 10:2025/BCA** (Bảng A.1 mục 25, 26; A.3 mục 4.4; B.1 mục 3; G.1 mục 3).\n\n## 11.1 Loại gara (1.2, 2.1)\n\n| Loại | Định nghĩa | Điều |\n| --- | --- | --- |\n| Gara trên mặt đất **dạng kín** | Có tường bao che ngoài | 1.2.2 |\n| Gara **dạng hở** | Không có tường bao che ngoài; hoặc hai cạnh đối diện dài nhất để hở. Cạnh để hở khi phần để hở **≥ 50 %** diện tích mặt ngoài cạnh đó ở từng tầng | 1.2.3 |\n| Gara **cơ khí** | Vận chuyển ô tô đến vị trí lưu giữ bằng thiết bị cơ khí, không có người lái | 1.2.5 |\n| Gara **bố trí bên trong** | Mọi gian phòng nằm trong một nhà chức năng khác; phần nhô ra **≤ 1,5 m** (mặt đứng dọc), **≤ 6 m** (đầu hồi) | 1.2.6 |\n| Gara **bố trí liền kề** | Tường chung hoặc tiếp giáp tường nhà chức năng khác | 1.2.7 |\n| Tầng **dưới mặt đất** | Cao độ sàn thấp hơn mặt đất quy hoạch **quá nửa** chiều cao phòng | 2.1.3 |\n\n- Gara trên mặt đất **≤ 9 tầng**; gara ngầm **≤ 5 tầng ngầm** (trừ gara cơ khí) (2.2.1.1).\n- **Không** bố trí liền kề hoặc bên trong nhà **F1.1, F4.1** và nhà sản xuất F5 hạng **A, B** (2.1.5, 2.1.6).\n- Gara bên trong nhà khác: nhà bậc chịu lửa **I, II**; nhà **F1.4** không phụ thuộc bậc chịu lửa; nhà **F1.3** chỉ cho **xe con, chỗ đỗ cố định** (không vách ngăn riêng) (2.1.6).\n- **Không** lưu giữ ô tô chạy **khí nén tự nhiên, khí hóa lỏng** trong gara kín bên trong, liền kề nhà khác hoặc dưới mặt đất (2.1.7; 2.2.1.32).\n- Gian lưu giữ **xe con**: tương đương hạng **C1 – C4**; gara xe con: hạng **C** (2.2.1.4). Nước chữa cháy, thông gió lấy như **nhà kho hạng C** (2.3.1.1).\n\n## 11.2 Ngăn cách với nhà chức năng khác (2.2.1.5, 2.2.1.8)\n\n- Gara **liền kề** nhà khác: **tường ngăn cháy loại 1** (2.2.1.5).\n- Gara **bên trong** nhà khác: bậc chịu lửa **không thấp hơn** nhà đó; ngăn bằng **tường và sàn ngăn cháy loại 1** (2.2.1.5).\n- Nhà **F1.3**: được ngăn bằng **sàn ngăn cháy loại 2**, khi đó tầng ở ngăn với gara bằng **một tầng không có người ở** (ví dụ tầng kỹ thuật) (2.2.1.5).\n- Trên lỗ cửa gara (trừ nhà F1.4): **mái đua không cháy** đua ra **≥ 1 m**, mép mái đua cách mép dưới cửa sổ phía trên **≥ 4 m** (hoặc cửa sổ không cháy) (2.2.1.5).\n- Gara trong nhà khác **không** dùng chung buồng thang bộ, giếng thang máy; lối ra của thang gara vào sảnh chính của nhà; trên các tầng gara có **khoang đệm ngăn cháy loại 1, áp suất dương** khi có cháy (2.2.1.8).\n- **Không** bố trí gian thương mại, quầy, ki-ốt trong gian lưu giữ ô tô (2.2.1.9).\n- Gian dịch vụ (sửa chữa, rửa xe…) trong gara: ngăn bằng **tường ngăn cháy loại 2, sàn ngăn cháy loại 3**, lối ra vào riêng; không đặt trong gara hở và gara trong nhà ở (2.2.1.6).\n\n## 11.3 Khoang cháy gara xe con (Bảng 4, 5, 6)\n\n**Bảng 4 — Gara ngầm** (2.2.2 a)\n\n| Bậc chịu lửa | Cấp S | Số tầng ngầm tối đa | Diện tích 1 tầng / khoang cháy |\n| --- | --- | --- | --- |\n| I | S0 | 5 | **3 000 m²** |\n| II | S0 | 3 | **3 000 m²** |\n\n**Bảng 5 — Gara dạng kín trên mặt đất** (2.2.3.1)\n\n| Bậc chịu lửa | Cấp S | Số tầng tối đa | Nhà 1 tầng (m²) | Nhà nhiều tầng (m²) |\n| --- | --- | --- | --- | --- |\n| I, II | S0 | 9 | 10 400 | 5 200 |\n| I, II | S1 | 2 | 5 200 | 2 000 |\n| III | S0 | 5 | 7 800 | 3 600 |\n| III | S1 | 2 | 3 600 | 1 200 |\n| IV | S0 | 1 | 5 200 | — |\n| IV | S1 | 1 | 3 600 | — |\n| IV | S2 | 1 | 1 200 | — |\n| V | Không quy định | 1 | 1 200 | — |\n\n**Bảng 6 — Gara dạng hở trên mặt đất** (2.2.4.1)\n\n| Bậc chịu lửa | Cấp S | Số tầng tối đa | Nhà 1 tầng (m²) | Nhà nhiều tầng (m²) |\n| --- | --- | --- | --- | --- |\n| I, II | S0 | 9 | 10 400 | 5 200 |\n| I, II | S1 | 2 | 3 500 | 2 000 |\n| III | S0 | 6 | 7 800 | 3 600 |\n| III | S1 | 2 | 2 000 | 1 200 |\n| IV | S0 | 6 | 7 300 | 2 000 |\n| IV | S1 | 2 | 2 600 | 800 |\n\n- Gara dạng hở: khung nhà rộng **≤ 36 m**; không xây tường, vách cản thông gió (trừ buồng thang); tường phân cách cao **≤ 1 m**; **không yêu cầu** thoát khói, thông gió; có nơi đặt **bình chữa cháy xách tay** ở tầng một (2.2.4.2 – 2.2.4.7).\n- Gara cơ khí: mỗi khối **≤ 50 xe**, cao **≤ 28 m**, giữa các khối **vách ngăn cháy loại 1**; liền kề nhà khác chỉ tại tường đặc **≥ REI 150**; xe chữa cháy tiếp cận được **từ hai phía đối diện** (2.2.5.2 – 2.2.5.4).\n- Gara ngầm: **không** chia chỗ đỗ thành ngăn bằng vách (2.2.2 c). Gara kín bậc I, II được chia ngăn: vách **R 45**, K0; cổng có lỗ **≥ 300 × 300 mm** ở cao 1,4 – 1,6 m (2.2.3.2).\n\n## 11.4 Thoát nạn, đường dốc (2.2.1.11 – 2.2.1.15, Bảng 2, Bảng 3)\n\n| Yêu cầu | Giá trị | Điều |\n| --- | --- | --- |\n| Lối thoát nạn mỗi tầng, mỗi khoang cháy (trừ gara cơ khí) | **≥ 2**, phân tán, ra ngoài hoặc vào buồng thang; được 1 lối trên đường dốc cách ly | 2.2.1.14 |\n| Khoảng cách từ chỗ đỗ xa nhất tới lối thoát gần nhất — **gara ngầm** | Giữa hai lối **40 m**; phần cụt **20 m** | Bảng 3 |\n| — **gara trên mặt đất** | Giữa hai lối **60 m**; phần cụt **25 m** | Bảng 3 |\n| Cầu thang thoát nạn | Rộng **≥ 1 m** | 2.2.1.14 |\n| Đường dốc dùng thoát nạn, có người đi bộ | Vỉa hè **≥ 0,8 m** | 2.2.1.14; 2.2.1.28 |\n| Số đường dốc | **≤ 100 xe**: 1 dốc đơn có tín hiệu; **≤ 1 000 xe**: 1 dốc đôi hoặc 2 dốc đơn; **> 1 000 xe**: 2 dốc đôi | 2.2.1.11 |\n| Độ dốc đường dốc | Thẳng có mái **≤ 18 %**; cong **≤ 13 %**; hở **≤ 10 %**; ngang **≤ 6 %**; sàn nghiêng giữa tầng **≤ 6 %** | 2.2.1.28; 2.2.1.29 |\n| Đường dốc chung trong gara kín — **ngầm** | Ngăn bằng tường **EI 90**, cổng **EI 60**, khoang đệm sâu **≥ 1,5 m**, áp suất dương | Bảng 2 |\n| — **trên mặt đất** | Tường **EI 45**, cổng **EI 30**, không cần khoang đệm | Bảng 2 |\n| Cửa, cổng trong vách ngăn cháy | Tự động đóng khi có cháy; cửa ngăn cháy ngưỡng **≥ 15 cm**; nắp **20 × 20 cm** tự đóng để đặt ống chữa cháy | Bảng 2; 2.2.1.15 |\n| Gara ngầm **≥ 2 tầng hầm** | Lối vào buồng thang, giếng thang máy qua **khoang đệm áp suất dương** ở từng tầng | 2.2.2 d) |\n| Gara ngầm **> 2 tầng hầm** | Mỗi khoang cháy **≥ 1 thang máy chở lực lượng chữa cháy** | 2.2.1.20 |\n| Chiều cao thông thủy | Hơn xe cao nhất **≥ 0,2 m**, không nhỏ hơn **2 m** | 2.2.1.22 |\n| Chỗ đỗ xe tối thiểu | **5 × 2,3 m** (xe người khuyết tật: rộng **3,5 m**) | 2.2.1.25 |\n\n- Gara ngầm 1 tầng: không cần khoang đệm trước đường dốc **không** dùng thoát nạn (Bảng 2).\n- Gian trực ban, bơm chữa cháy, trạm biến áp khô… trong gara ngầm: **không dưới tầng hầm trên cùng** (2.2.2 b).\n- Sàn gara ngầm có **thiết bị thoát nước chữa cháy**, ống thoát riêng từng tầng (2.2.2 f).\n\n## 11.5 Chữa cháy, báo cháy tự động (2.3.5)\n\n**Chữa cháy tự động** trong gian lưu giữ ô tô của gara **dạng kín** (2.3.5.2):\n\n| Trường hợp | Điều |\n| --- | --- |\n| Gara **ngầm**, không phụ thuộc số tầng | 2.3.5.2 a) |\n| Gara trên mặt đất **≥ 2 tầng** | 2.3.5.2 b) |\n| Gara 1 tầng: bậc I – III **≥ 7 000 m²**; bậc IV S0 **≥ 3 600 m²**; IV S1 **≥ 2 000 m²**; IV S2, S3 **≥ 1 000 m²**; hoặc chia ngăn **> 5 ngăn** | 2.3.5.2 c) |\n| Gara **trong nhà chức năng khác** | 2.3.5.2 d) |\n| Gian lưu giữ ô tô chở nhiên liệu, chất bôi trơn | 2.3.5.2 e) |\n| Gara **dưới cầu** | 2.3.5.2 f) |\n| Gara **cơ khí** | 2.3.5.2 g) |\n\n- **Miễn**: gara ngầm 1 tầng **≤ 25 chỗ** xây trên khu đất trống (2.3.5.2 g); gara 1 – 2 tầng **dạng ngăn** có lối ra ngoài trời từ từng ngăn — miễn cả phát hiện cháy (2.3.5.4).\n- **Phát hiện cháy tự động**: gara kín 1 tầng nhỏ hơn ngưỡng 2.3.5.2 c) hoặc **≤ 5 ngăn**; các gian phụ trợ (trừ vệ sinh, buồng thông gió); được bỏ ở gian có người trực ngày đêm (2.3.5.3).\n\n**Loại hệ thống báo cháy** (2.3.5.5, Bảng 8):\n\n| Gara | Sức chứa | Loại |\n| --- | --- | --- |\n| Trên mặt đất dạng kín **≥ 2 tầng** (trừ dạng ngăn, cơ khí) | **≤ 100** chỗ | **Loại 1** |\n|  | **> 100** chỗ | **Loại 2** |\n| Ngầm **≥ 2 tầng** | **≤ 50** chỗ | **Loại 2** |\n|  | **51 – 200** chỗ | **Loại 3** |\n|  | **> 200** chỗ | **Loại 4 và 5** |\n\nBảng 8 (cần thiết “+”): loại 1 — tín hiệu âm thanh, báo đồng thời; loại 2 — thêm đèn “lối ra”; loại 3 — **giọng nói**, liên lạc với điều độ (khuyến cáo); loại 4 — giọng nói, đèn dẫn hướng, **liên lạc vùng với bộ phận điều độ**; loại 5 — thêm đèn dẫn hướng từng vùng, **tự động hóa hoàn toàn** điều khiển và phương án thoát nạn từng vùng.\n\n## 11.6 Nước chữa cháy (2.3.2)\n\n| Yêu cầu | Giá trị | Điều |\n| --- | --- | --- |\n| Họng nước trong gara **dạng kín** | Khoang **500 – 5 000 m³**: **2 lăng × 2,5 L/s**; **> 5 000 m³**: **2 lăng × 5 L/s** | 2.3.2.1 |\n| Miễn họng nước | Gara 1 – 2 tầng dạng ngăn có lối ra ngoài trời từ từng ngăn | 2.3.2.1 |\n| Gara **dạng hở**, cơ khí, trên mái | **Ống khô**, ống chờ nhô ra ngoài **Ø 89 (77) mm**, có van, đầu nối | 2.3.2.2 |\n| Gara ngầm **≥ 2 tầng hầm** | Ống nước chữa cháy **riêng biệt**; họng nước và chữa cháy tự động có **ống chờ ra ngoài** với van, **van một chiều** | 2.3.2.3; 2.3.2.4 |\n| Giữa bơm chữa cháy và mạng ống | **Van một chiều** | 2.3.2.6 |\n\n**Nước ngoài nhà** (2.3.2.5): gara ngầm **≥ 2 tầng**: **20 L/s**; gara dạng ngăn (lối ra từng ngăn) **50 – 200 ngăn**: **5 L/s**, **> 200**: **10 L/s**; gara cơ khí: **10 L/s**; bãi đỗ hở **≤ 200 xe**: **5 L/s**, **> 200**: **10 L/s**.\n\n**Bảng 7 — Gara trên mặt đất dạng kín hoặc hở** (L/s cho 1 đám cháy, theo khối tích, nghìn m³):\n\n| Bậc chịu lửa | Cấp S | ≤ 5 | > 5 – 20 | > 20 – 50 | > 50 |\n| --- | --- | --- | --- | --- | --- |\n| I, II, III | S0, S1 | 10 | 15 | 20 | 30 |\n| IV | S0, S1 | 10 | 15 | 20 | — |\n| IV | S2, S3 | 20 | 25 | — | — |\n| V | Không quy định | 20 | — | — | — |\n\n## 11.7 Thông gió, chống khói, điện (2.3.3, 2.3.4)\n\n- **Hút khói** khỏi tầng cháy: từ **gian lưu giữ xe** và **đường dốc cách ly**; qua giếng hút với đầu hút cơ khí (2.3.3.4, 2.3.3.5). Gara ngầm: nối vùng khói **≤ 900 m²** mỗi tầng vào một giếng (2.3.3.5).\n- Thoát khói tự nhiên qua cửa sổ, cửa trời: ô mở từ cao **≥ 2,2 m**, tổng **≥ 0,2 %** diện tích phòng, cửa sổ cách điểm xa nhất **≤ 18 m**; gara **trong nhà khác không** đẩy khói qua lỗ cửa (2.3.3.5). Giếng hút tự nhiên: gara nổi ≤ 2 tầng, gara ngầm 1 tầng (2.3.3.5).\n- **Áp suất dương** buồng thang, giếng thang máy (hoặc khoang đệm loại 1 áp suất dương mọi tầng) khi: gara **≥ 2 tầng hầm**; thang nối phần ngầm và phần nổi; thang nối gara với tầng nổi của nhà khác (2.3.3.6).\n- Gara **dạng kín**: thiết bị đo nồng độ **CO**, tín hiệu về phòng trực ngày đêm (2.3.3.2). Gara ngầm: thông gió **tách riêng từng tầng** (2.3.3.1).\n- Hệ thống chống khói điều khiển **tự động** từ tín hiệu báo cháy và từ xa (nút tại lối vào tầng, chiếu nghỉ thang) (2.3.3.8). Ngắt thông gió chung khi cháy; mở chống khói trước cấp gió (2.3.3.7).\n- Cấp điện **hạng 1**: thiết bị bảo vệ chống cháy, chữa cháy tự động, chống khói, thang máy chữa cháy, báo cháy; cáp cấp nối trực tiếp tủ đầu vào, không dùng chung (2.3.4.2).\n- Gara kín: **ổ cắm** nối điện hạng 1 tại lối vào từng tầng cho thiết bị PCCC (2.3.4.6). Chỉ dẫn lối ra, đường xe, đầu nối, van, bình, họng nước ngoài nhà nối **chiếu sáng thoát nạn** (2.3.4.4); đèn dẫn hướng cao **2 m và 0,5 m** (2.3.4.5).\n- Hệ thống kỹ thuật của gara trong, liền kề nhà khác **độc lập** với nhà đó; xuyên qua gara phải bọc **≥ EI 45** (2.3.1.3). Gara ngầm: cáp **vỏ không lan truyền lửa** (2.3.1.2).\n\n## 11.8 Khai thác (2.4)\n\n- Ký hiệu lối ra, van, bình chữa cháy bằng **sơn phát sáng, phản quang**; biển **cấm hút thuốc** (2.4.1, 2.4.2).\n- Kiểm tra khả năng làm việc của hệ thống PCCC (van, họng nước, trạm bơm, báo cháy, chống khói, thiết bị đóng lối ra) **≥ 1 lần/năm**, lập biên bản có đại diện cơ quan quản lý PCCC (2.4.6).\n- Lớp phủ sàn gara **LT1**, bền dầu; sàn mái làm chỗ đỗ: lớp trên **LT1** (2.2.1.16, 2.2.1.21).\n"};

function parseNum(x) {
  if (x === null || x === undefined) return "";
  let t = String(x).trim().replace(/[\s ]/g, "");
  if (!t) return "";
  if (t.includes(",") && t.includes(".")) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.includes(",")) t = t.replace(",", ".");
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  const n = Number(t);
  return Number.isFinite(n) ? n : "";
}
