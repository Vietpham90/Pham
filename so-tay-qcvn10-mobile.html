/* ---------- markdown → khối ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g, "&quot;");
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\s][^*]*)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => { const id = FILE2ID[h]; return id ? `<a href="#${id}" data-go="${id}">${t}</a>` : t; });
  return s;
}
function mdToHtml(lines) {
  let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^### /.test(l)) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      const wide = head.length > 3;
      out += `<div class="tbl${wide ? " wide" : ""}"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      if (wide) out += `<p class="hint">← Vuốt ngang để xem hết bảng →</p>`;
      continue;
    }
    if (/^> /.test(l)) {
      const b = [];
      while (i < lines.length && /^>/.test(lines[i])) { b.push(lines[i].replace(/^>\s?/, "")); i++; }
      out += `<blockquote><p>${inline(b.join(" "))}</p></blockquote>`; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^(- |  - )/.test(lines[i])) { const sub = /^  - /.test(lines[i]); out += `<li${sub ? ' class="sub"' : ""}>${inline(lines[i].replace(/^\s*- /, ""))}</li>`; i++; }
      out += "</ul>"; continue;
    }
    if (/^\d+\. /.test(l)) {
      out += "<ol>";
      while (i < lines.length && /^\d+\. /.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\d+\. /, ""))}</li>`; i++; }
      out += "</ol>"; continue;
    }
    const p = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||> |- |\d+\. )/.test(lines[i])) { p.push(lines[i]); i++; }
    if (p.length) out += `<p>${inline(p.join(" "))}</p>`; else i++;
  }
  return out;
}
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

const SECTIONS = {};
for (const [file, md] of Object.entries(DATA)) {
  const id = FILE2ID[file]; if (!id) continue;
  const lines = md.split("\n");
  const lead = [], blocks = []; let cur = null;
  for (const l of lines) {
    if (/^# /.test(l)) continue;
    if (/^## /.test(l)) { cur = { title: l.slice(3).trim(), lines: [] }; blocks.push(cur); continue; }
    (cur ? cur.lines : lead).push(l);
  }
  blocks.forEach((b, k) => { b.id = id + "--" + k; b.raw = b.lines.filter(l => !/^\|\s*-/.test(l)).join(" ").replace(/[|*`>#]/g, " ").replace(/\s+/g, " "); b.text = norm(b.title + " " + b.raw); });
  SECTIONS[id] = { id, title: META[id].t, lead, blocks, leadText: norm(lead.join(" ")) };
}

    if (v.parea > 0 && !nhaO) {

  if (g1) push(S4, g1.req ? "req" : "no", "**Loa thông báo và hướng dẫn thoát nạn** — " + g1.why + (g1.req ? "; ≥ 75 dBA ở 3 m, vượt ồn ≥ 15 dBA, ≤ 120 dBA" : ""), g1.ref + (g1.req ? "; H.4" : ""));

  if (t.f1 === "kara") push(S4, "req", `**Mặt nạ lọc độc** tại tất cả các tầng; mỗi tầng = số người trong **phòng lớn nhất** của tầng${v.room ? ` → **${v.room} chiếc/tầng**` : ""}`, "Bảng F.1 mục 2");
  out.push(S4);
  return out;
}

/* Quy tắc 70 % (1.5.8): tổng diện tích sàn không gồm kỹ thuật, PCCC, lánh nạn, đỗ xe */
function mixRule(mix) {
  const rows = (Array.isArray(mix) ? mix : []).filter(r => Array.isArray(r) && TI[r[0]] && +r[1] > 0);
  const tot = rows.reduce((x, r) => x + +r[1], 0);
  if (!tot) return null;
  const top = rows.reduce((m, r) => (+r[1] > +m[1] ? r : m), rows[0]);
  const share = +top[1] / tot;
  return { tot, top: TI[top[0]], share, mixed: share <= 0.7, rows: rows.map(r => [TI[r[0]], +r[1], +r[1] / tot]) };
}

/* Điểm khớp loại nhà: cụm nguyên văn trong tên > trong từ khóa; từ đúng > đầu từ. 0 = không khớp */
function typeScore(t, terms) {
  if (!terms.length) return 0;
  const name = " " + norm(t.n).replace(/[^a-z0-9.]+/g, " ") + " ", kw = " " + norm(t.k + " " + t.g).replace(/[^a-z0-9.]+/g, " ") + " ";
  let sc = 0;
  for (const x of terms) {
    if (name.includes(" " + x + " ")) sc += 3; else if (kw.includes(" " + x + " ")) sc += 2;
    else if (name.includes(" " + x) || kw.includes(" " + x)) sc += 1; else return 0;
  }
  const ph = " " + terms.join(" ") + " ";
  if (name.includes(ph)) sc += 6; else if (kw.includes(ph)) sc += 5;

}

  if (hi < 0) return { err: "Bảng H.7 chỉ đến tia đặc 20 m" };
  const row = H7[V.dn][V.tip][hi];
  if (!row) return { err: `Không có giá trị cho lăng ${V.tip} mm, DN ${V.dn}, tia ${H7H[hi]} m — chọn lăng khác` };
  const ci = { 10: 1, 15: 2, 20: 3 }[V.hose];
  return { jet: H7H[hi], q: row[0], p: row[ci] };
}
function renderH7() {
  setHeader("Áp suất họng nước — Bảng H.7"); setNav("tinh-nuoc");
  const r = h7Calc(h7V);
  const sel = (k, lbl, opts) => `<label class="fld"><span>${lbl}</span><select data-h7="${k}">${opts.map(([v, tx]) => `<option value="${v}"${String(h7V[k]) === String(v) ? " selected" : ""}>${tx}</option>`).join("")}</select></label>`;
  view.innerHTML = `
  <div class="seg tabs" role="tablist" style="grid-template-columns:repeat(3,1fr)"><button role="tab" data-go="tinh-nuoc">Khu dân cư</button><button role="tab" aria-selected="true" data-go="h7">Áp suất họng</button><button role="tab" data-go="cong-truong">Công trường</button></div>
  <section class="quick"><h2>Lưu lượng và áp suất theo tia nước đặc</h2>
    <div class="grid2">
      ${sel("dn", "Họng nước", [["50", "DN 50"], ["65", "DN 65"]])}
      ${sel("tip", "Đầu lăng phun", [["13", "13 mm"], ["16", "16 mm"], ["19", "19 mm"]])}
      ${sel("jet", "Tia nước đặc yêu cầu", H7H.map(x => [x, x + " m"]))}
      ${sel("hose", "Chiều dài cuộn vòi", [[10, "10 m"], [15, "15 m"], [20, "20 m"]])}
    </div>
    ${r.err ? `<p class="note">${esc(r.err)}</p>` : `<dl class="kv"><dt>Lưu lượng lăng phun</dt><dd>${fmtN(r.q)} L/s</dd><dt>Áp suất tại họng</dt><dd>${fmtN(r.p)} MPa</dd><dt>≈ cột nước</dt><dd>${fmtN(r.p * 102)} m</dd></dl>`}
    <p class="note">Tia đặc tối thiểu: 6 m (≤ 50 m), 8 m (nhà ở > 50 m), 16 m (công cộng, SX > 50 m) — H.2.7. Tia ≤ 4 L/s dùng DN 50, > 4 L/s dùng DN 65 (H.2.7 CT2). Áp suất giữa van và đầu nối > 0,45 MPa phải giảm áp dư (H.2.6).</p>
  </section>`;
}
let csV = Object.assign({ floors: "1200, 1200, 800", road: true }, store.get("q10-cs", {}));
function csCalc(V) {
  const fl = String(V.floors).split(/[;\n]|,\s+|\s{2,}/).map(parseNum).filter(x => x !== "" && x > 0);
  const per = fl.map(a => Math.max(1, Math.ceil(a / 500)) * (V.road ? 1 : 2));
  return { fl, per, tot: per.reduce((s, x) => s + x, 0) };
}
function renderCS() {
  setHeader("Công trình đang thi công"); setNav("tinh-nuoc");
  const r = csCalc(csV);
  view.innerHTML = `
  <div class="seg tabs" role="tablist" style="grid-template-columns:repeat(3,1fr)"><button role="tab" data-go="tinh-nuoc">Khu dân cư</button><button role="tab" data-go="h7">Áp suất họng</button><button role="tab" aria-selected="true" data-go="cong-truong">Công trường</button></div>
  <section class="quick"><h2>Bình bột ABC ≥ 4 kg (2.6.5)</h2>
    <label class="fld"><span>Diện tích sàn từng tầng, kể cả nhà tạm (ngăn bằng dấu chấm phẩy hoặc xuống dòng)</span><textarea id="cs-floors" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)">${esc(csV.floors)}</textarea></label>
    <div class="checks" style="margin-top:8px"><label><input type="checkbox" id="cs-road"${csV.road ? " checked" : ""}> Có đường cho xe chữa cháy tiếp cận</label></div>
    <dl class="kv" id="cs-out">${r.fl.map((a, i) => `<dt>Tầng ${i + 1}: ${fmtN(a)} m²</dt><dd>${r.per[i]} bình</dd>`).join("")}<dt><b>Tổng</b></dt><dd>${r.tot} bình</dd></dl>
    <p class="note">≥ 01 bình / 500 m² sàn, xét riêng từng tầng; < 500 m² vẫn ≥ 01 bình. Không có đường cho xe chữa cháy → gấp đôi. Bán kính bảo vệ tối đa 25 m.</p>
  </section>
  <section class="quick" style="margin-top:12px"><h2>Yêu cầu khác trên công trường</h2>
    <ul class="plain">
      <li><b>Chiếu sáng sự cố</b> ≥ 1 h, độ rọi ≥ 0,5 lux tại phòng máy phát, máy biến áp, phòng bơm (2.2.3)</li>
      <li><b>≥ 10 tầng hoặc ≥ 28 m</b>, giai đoạn hoàn thiện, lắp cơ điện: ≥ 01 đường ống khô có họng nước đến mỗi tầng, đầu nối ngoài công trình; mỗi họng ≥ 02 cuộn vòi + 01 lăng (2.4.3)</li>
    </ul>
  </section>`;
}
function renderCompare() {
  setHeader("Điểm mới cần lưu ý"); setNav("");
  const rows = [
    ["Văn bản", "QCVN 10:2025/BCA là quy chuẩn kỹ thuật quốc gia, bắt buộc áp dụng từ 30/12/2025; TCVN 3890:2023 nằm trong thư mục tài liệu tham khảo của quy chuẩn", "Tài liệu tham khảo"],
    ["Thiết bị báo cháy độc lập", "Được thay hệ thống báo cháy tự động cho nhà nhỏ (cột TBĐL Bảng A.1); phải liên kết nhau", "1.4.11; Bảng A.1"],
    ["Nhà ở riêng lẻ kết hợp KD", "Báo cháy từ 7 tầng (KD dịch vụ), từ 3 tầng hoặc 500 m² (SX, KD hàng dễ cháy); sprinkler từ 30 m", "Bảng A.1 mục 1, 2"],
    ["Chung cư", "Báo cháy ≥ 5 tầng hoặc ≥ 700 m²; sprinkler từ 30 m; ≤ 100 m chỉ cần đầu phun tại cửa căn hộ", "Bảng A.1 mục 3; 1.5.12"],
    ["Bình chữa cháy", "Dẫn chiếu TCVN 7435-1 (điểm 5, 6, 7); bảo dưỡng 6 tháng/lần; công trường 1 bình/500 m²/tầng", "2.6; 1.5.13"],
    ["Đường ống khô", "Bắt buộc khi cao PCCC > 28 m (F1.3: > 50 m) hoặc hầm sâu > 9 m; công trường ≥ 10 tầng", "2.4.3; 2.4.4"],
    ["Bình tự kích hoạt", "Thay hệ thống cho khu ≤ 100 m² không thường xuyên có người; bếp, nồi hơi, giặt là ≤ 100 m²", "2.5.4; 2.5.5"],
    ["Cấp nước ngoài nhà", "Miễn khi trong bán kính 400 m có trụ hoặc bến lấy nước đủ lưu lượng", "2.3.2"],
    ["Loa thông báo", "Phụ lục G mới: chung cư, công cộng > 10 tầng hoặc ≥ 2 hầm; karaoke, rạp, bệnh viện ≥ 50 người/tầng…", "Bảng G.1; H.4"],
    ["Mặt nạ", "Khách sạn ≥ 3 tầng: 1 mặt nạ lọc độc/người; karaoke: theo phòng lớn nhất", "Bảng F.1"],
    ["Hệ thống đóng gói", "Được dùng hệ thống chữa cháy, họng nước Package (TCVN 13926)", "Bảng A.1 ⁽¹⁾; Bảng B.1 CT2"]
  ];
  view.innerHTML = `<p class="intro">Các điểm cần lưu ý khi áp dụng QCVN 10:2025/BCA, tóm tắt từ chính văn bản quy chuẩn. Bấm số điều để mở nội dung.</p>
  <section class="ct-sec"><ul>${rows.map(r => `<li><span class="tx"><b>${esc(r[0])}</b> — ${esc(r[1])}</span><span class="refs">${refHTML(r[2])}</span></li>`).join("")}</ul></section>
  <p class="disclaimer">Bảng này chỉ tóm tắt nội dung QCVN 10:2025/BCA, không so sánh từng con số với TCVN 3890:2023.</p>`;

/* ---------- định tuyến ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.value.trim()) return renderSearch(q.value.trim());
  if (!h || h === "home") return renderHome();
  if (h === "cong-trinh") return renderCT();
  if (h === "gian-phong") return renderGP();
  if (h === "nhieu-khoi") return renderMK();
  if (h === "co-so") return renderCSX();
  if (h === "tinh-nuoc") return renderWater();
  if (h === "h7") return renderH7();
  if (h === "cong-truong") return renderCS();
  if (h === "so-sanh") return renderCompare();
  if (h === "da-luu") return renderSaved();
  if (SECTIONS[h]) return renderSection(h);
  renderHome();
}
function go(hash, block) {
  q.value = ""; clearQ.hidden = true;
  if (block) { const sid = block.split("--")[0]; if (location.hash.slice(1) !== sid) history.replaceState(null, "", "#" + sid); renderSection(sid, block); return; }
  if (location.hash.slice(1) === hash) route(); else location.hash = hash;
}
window.addEventListener("hashchange", route);
async function copyText(t, msgId) {
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch (e) {
    try { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e2) {}
  }
  const m = document.getElementById(msgId); if (m) m.textContent = ok ? "Đã sao chép." : "Không sao chép được trên trình duyệt này.";
}
document.addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) { e.preventDefault(); e.stopPropagation(); const id = star.dataset.star;
    saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]; store.set("q10-saved", saved);
    const on = saved.includes(id); star.setAttribute("aria-pressed", on); star.setAttribute("aria-label", on ? "Bỏ lưu" : "Lưu mục này"); return; }
  const rf = e.target.closest("[data-ref]"); if (rf) { e.preventDefault(); q.value = resolveRef(rf.dataset.ref); clearQ.hidden = false; renderSearch(q.value); window.scrollTo(0, 0); return; }
  if (e.target.id === "ctcopy") { copyText(ctText(), "ctmsg"); return; }
  if (e.target.id === "mkcopy") { copyText(mkText(), "mkmsg"); return; }
  if (e.target.id === "mkadd") { mkV.parts.push({ id: "chung-cu", ten: "Khối " + (mkV.parts.length + 1), n: 5, h: 16, dt1: 1000, th: 3.3, hl: false, ham: false, hang: "C2", cho: 0 }); store.set("q10-mk", mkV); renderMK(); return; }
  if (e.target.id === "mkreset") { mkV = JSON.parse(JSON.stringify(MK_DEF)); store.set("q10-mk", mkV); renderMK(); return; }
  const mkd = e.target.closest("[data-mkdel]"); if (mkd) { if (mkV.parts.length > 1) { mkV.parts.splice(+mkd.dataset.mkdel, 1); store.set("q10-mk", mkV); renderMK(); } return; }
  const q13 = e.target.closest("[data-q13]"); if (q13) { e.preventDefault(); const el = document.getElementById("q13"); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  const q6 = e.target.closest("[data-q06]"); if (q6) { e.preventDefault(); const el = document.getElementById("q06"); if (el) el.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  if (e.target.id === "ctjump") { const r = document.getElementById("ctres"); if (r) r.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
  const gk = e.target.closest("[data-gp]"); if (gk) { gpV.k = +gk.dataset.gp; gpV.q = ""; q.value = ""; clearQ.hidden = true; store.set("q10-gp", gpV); if (location.hash !== "#gian-phong") location.hash = "gian-phong"; else renderGP(); window.scrollTo(0, 0); return; }
  const pk = e.target.closest("[data-ct]"); if (pk) { ctV.id = pk.dataset.ct; ctQ = ""; q.value = ""; clearQ.hidden = true; store.set("q10-ct", ctV); if (location.hash !== "#cong-trinh") location.hash = "cong-trinh"; else renderCT(); window.scrollTo(0, 0); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.preventDefault(); go(null, op.dataset.open); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest("[data-nav]"); if (n) { go(n.dataset.nav); return; }
  const chip = e.target.closest("[data-chip]"); if (chip) { q.value = chip.dataset.chip; clearQ.hidden = false; renderSearch(q.value); return; }
});
backBtn.addEventListener("click", () => go("home"));
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "ctq") { ctQ = el.value; document.getElementById("ctlist").innerHTML = ctList(); return; }
  if (el.dataset && el.dataset.mix !== undefined && el.tagName === "INPUT") { const n = parseNum(el.value); ctV.mix[+el.dataset.mix][1] = n === "" ? 0 : Math.max(0, n); store.set("q10-ct", ctV); document.getElementById("mixres").innerHTML = mixHTML(); return; }
  if (el.dataset && el.dataset.k && el.tagName === "INPUT" && el.type !== "checkbox") { ctSync(false); return; }
  if (el.dataset && el.dataset.w) { const n = parseNum(el.value); wV[el.dataset.w] = n === "" ? 0 : Math.max(0, n); store.set("q10-w", wV); const pos = el.selectionStart; renderWater(); const ne = document.getElementById(el.id); if (ne) { ne.focus(); try { ne.setSelectionRange(pos, pos); } catch (x) {} } return; }
  if (el.id === "gp-q") { gpV.q = el.value; const o = gpList(); if (o.length && !o.some(([, i]) => i === gpV.k)) gpV.k = o[0][1]; store.set("q10-gp", gpV); document.getElementById("gp-k").innerHTML = o.map(([r, i]) => `<option value="${i}"${i === gpV.k ? " selected" : ""}>${esc(r[0])} · ${esc(r[2])}</option>`).join(""); document.getElementById("gp-x").nextElementSibling.textContent = GP[gpV.k][5] || "m²"; document.getElementById("gpres").innerHTML = gpResult(); return; }
  if (el.dataset && el.dataset.mk !== undefined && el.tagName === "INPUT" && el.type !== "checkbox") { const x = mkV.parts[+el.dataset.mk]; if (!x) return; if (el.dataset.f === "ten") x.ten = el.value; else { const n = parseNum(el.value); x[el.dataset.f] = n === "" ? 0 : Math.max(0, n); } store.set("q10-mk", mkV); document.getElementById("mkres").innerHTML = mkResult(); return; }
  if (el.id === "mk-pop") { const n = parseNum(el.value); mkV.pop = n === "" ? 0 : Math.max(0, n); store.set("q10-mk", mkV); document.getElementById("mkres").innerHTML = mkResult(); return; }
  if (el.id === "csx-x") { const n = parseNum(el.value); csxV.x = n === "" ? 0 : Math.max(0, n); store.set("q10-csx", csxV); document.getElementById("csxres").innerHTML = itemsHTML([{ t: CS[csxV.i].n, items: csxEval(csxV) }]); return; }
  if (el.id === "gp-x") { const n = parseNum(el.value); gpV.x = n === "" ? 0 : Math.max(0, n); store.set("q10-gp", gpV); document.getElementById("gpres").innerHTML = gpResult(); return; }
  if (el.id === "cs-floors") { csV.floors = el.value; store.set("q10-cs", csV); const r = csCalc(csV); document.getElementById("cs-out").innerHTML = r.fl.map((a, i) => `<dt>Tầng ${i + 1}: ${fmtN(a)} m²</dt><dd>${r.per[i]} bình</dd>`).join("") + `<dt><b>Tổng</b></dt><dd>${r.tot} bình</dd>`; return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.mix !== undefined && el.tagName === "SELECT") { ctV.mix[+el.dataset.mix][0] = el.value; store.set("q10-ct", ctV); document.getElementById("mixres").innerHTML = mixHTML(); return; }
  if (el.dataset && el.dataset.k && (el.tagName === "SELECT" || el.type === "checkbox")) { ctSync(el.dataset.k === "id" || el.dataset.k === "gara" || el.dataset.k === "hang"); return; }
  if (el.dataset && el.dataset.w && el.tagName === "SELECT") { wV[el.dataset.w] = el.value === "1"; store.set("q10-w", wV); renderWater(); return; }
  if (el.dataset && el.dataset.h7) { h7V[el.dataset.h7] = el.value; store.set("q10-h7", h7V); renderH7(); return; }
  if (el.dataset && el.dataset.mk !== undefined && (el.tagName === "SELECT" || el.type === "checkbox")) { const x = mkV.parts[+el.dataset.mk]; if (!x) return; x[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value; store.set("q10-mk", mkV); renderMK(); return; }
  if (el.id === "csx-i") { csxV.i = +el.value; store.set("q10-csx", csxV); renderCSX(); return; }
  if (el.id === "csx-cap") { csxV.cap = el.value; store.set("q10-csx", csxV); renderCSX(); return; }
  if (el.id === "csx-auto") { csxV.auto = el.checked; store.set("q10-csx", csxV); renderCSX(); return; }
  if (el.id === "gp-k") { gpV.k = +el.value; store.set("q10-gp", gpV); renderGP(); return; }
  if (el.id === "cs-road") { csV.road = el.checked; store.set("q10-cs", csV); renderCS(); return; }
});
let tmr;
q.addEventListener("input", () => { clearQ.hidden = !q.value; clearTimeout(tmr); tmr = setTimeout(() => q.value.trim() ? renderSearch(q.value.trim()) : route(), 120); });
clearQ.addEventListener("click", () => { q.value = ""; clearQ.hidden = true; route(); q.focus(); });
saved = (Array.isArray(saved) ? saved : []).filter(x => typeof x === "string");
route();
</script>
