<title>Sổ tay PCCC QCVN 06</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#b42318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột kiểu ứng dụng điện thoại — thanh đầu dính có ô tìm, nội dung là các khối gập mở, thanh điều hướng dưới đáy. */
:root {
  --bg: #fbf8f3; --panel: #ffffff; --tint: #f1ebe1; --line: #ddd3c5;
  --ink: #1f1a17; --muted: #5e554d;
  --fire: #b42318; --fire-bg: #fde4e1; --on-fire: #ffffff;
  --exit: #067647; --exit-bg: #dcf5e7;
  --amber: #f2a516; --amber-ink: #7a5000; --amber-bg: #fff1d1;
  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fire); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fire); color: var(--on-fire); padding-block: 10px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 32px; }
.brand h1 { font-size: 17px; line-height: 1.2; font-weight: 800; margin: 0; flex: 1; min-width: 0; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
.back { border: 0; background: transparent; color: inherit; width: 36px; height: 36px; margin-left: -8px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.back svg { width: 22px; height: 22px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border-radius: 10px; border: 0; padding: 0 40px 0 40px; font: inherit; font-size: 16px; background: var(--panel); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search .ico { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 20px; line-height: 1; }

main { padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* Bottom nav */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .row { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 760px; margin: 0 auto; height: var(--nav-h); }
nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--fire); }

/* Home */
.intro { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.label:first-child { margin-top: 0; }
.toc { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toc li + li { border-top: 1px solid var(--line); }
.toc button { width: 100%; text-align: left; border: 0; background: transparent; display: grid; grid-template-columns: 36px 1fr 16px; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; min-height: 60px; }
.toc .num { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; background: var(--tint); color: var(--ink); }
.toc .num.f { background: var(--fire-bg); color: var(--fire); }
.toc .num.x { background: var(--exit-bg); color: var(--exit); }
.toc .num.a { background: var(--amber-bg); color: var(--amber-ink); }
.toc b { display: block; font-size: 15px; line-height: 1.3; }
.toc span.d { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.toc .chev { color: var(--muted); }

/* Quick lookup */
.quick { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.quick h2 { font-size: 15px; margin: 0 0 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { min-width: 44px; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; font-family: var(--mono); }
.seg button[aria-pressed="true"] { background: var(--fire); border-color: var(--fire); color: var(--on-fire); }
.kv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv dt { color: var(--muted); padding-right: 12px; }
.kv dd { font-family: var(--mono); font-weight: 500; text-align: right; color: var(--fire); }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.quick .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Article */
.doc h1.page { font-size: 24px; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.doc details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; }
.doc summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 14px; position: relative; font-weight: 700; font-size: 16px; line-height: 1.35; }
.doc summary::-webkit-details-marker { display: none; }
.doc summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
.doc details[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
.doc .body { padding: 0 14px 14px; min-width: 0; }
.doc .lead { margin-bottom: 12px; }
.doc h3 { font-size: 15px; margin: 18px 0 6px; }
.doc p { margin: 0 0 10px; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 20px; }
.doc li { margin: 4px 0; }
.doc blockquote { margin: 0 0 12px; padding: 10px 12px; background: var(--tint); border-radius: 8px; font-size: 14px; }
.doc blockquote p:last-child { margin: 0; }
.doc code { font-family: var(--mono); font-size: 12.5px; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.doc a { color: var(--fire); font-weight: 600; text-underline-offset: 2px; }
.tbl { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
.tbl table { border-collapse: collapse; font-size: 13.5px; line-height: 1.4; min-width: 100%; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--tint); font-size: 12.5px; font-weight: 700; white-space: normal; min-width: 88px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child, .tbl th:first-child { position: sticky; left: 0; background: var(--panel); box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--tint); }
.tbl td { font-variant-numeric: tabular-nums; min-width: 80px; }
.tbl.wide td { min-width: 96px; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
.flag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--amber-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
.amend { display: inline-block; font-size: 11px; font-weight: 700; color: var(--fire); background: var(--fire-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
mark { background: var(--amber-bg); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--amber); }

/* Checklist */
.check { list-style: none; padding: 0 !important; }
.check li { margin: 0; border-top: 1px solid var(--line); }
.check li:first-child { border-top: 0; }
.check label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 10px 0; cursor: pointer; align-items: start; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--exit); }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--exit); width: 0; transition: width .2s; }
.reset { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; }

/* Save star */
.star { position: absolute; right: 40px; top: 8px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.star svg { width: 20px; height: 20px; }
.star[aria-pressed="true"] { color: var(--amber); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.doc summary { padding-right: 84px; }

/* Search results */
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.results button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.results .sec { font-size: 12px; color: var(--muted); font-weight: 600; }
.results .ttl { font-weight: 700; display: block; margin: 2px 0 4px; }
.results .snip { font-size: 13.5px; color: var(--ink); display: block; line-height: 1.45; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

.disclaimer { font-size: 12.5px; color: var(--amber-ink); background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin: 16px 0 0; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pager button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; font-size: 13px; min-height: 56px; }
.pager button.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); font-size: 11.5px; }


/* Tra theo công trình */
.ct-cta { width: 100%; text-align: left; border: 0; border-radius: 12px; padding: 14px 16px; margin: 0 0 8px; background: var(--fire); color: var(--on-fire); cursor: pointer; display: grid; gap: 4px; }
.ct-cta b { font-size: 16px; } .ct-cta span { font-size: 13px; opacity: .9; line-height: 1.4; }
.ct-form { display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.fld input, .fld select { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); font-weight: 500; }
.fld .inp { position: relative; display: block; } .fld .inp input { padding-right: 48px; }
.fld .inp i { position: absolute; right: 10px; top: 11px; font-style: normal; color: var(--muted); font-weight: 500; font-size: 13px; }
.fld .sel { font-size: 16px; color: var(--ink); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.fld .sel b, .pick b { font-family: var(--mono); color: var(--fire); font-weight: 500; font-size: 13px; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picks { display: grid; gap: 6px; } .picks:empty { display: none; }
.pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.checks { display: grid; gap: 8px; font-size: 14px; } .checks label { display: flex; gap: 10px; align-items: center; }
.checks input { width: 20px; height: 20px; accent-color: var(--fire); flex: none; }
.ct-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.ct-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
.ct-sec h2 { font-size: 15px; margin: 0 0 6px; }
.ct-sec ul { list-style: none; margin: 0; padding: 0; }
.ct-sec li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; display: grid; gap: 4px; }
.ct-sec li:first-child { border-top: 0; }
.ct-sec code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.lv { justify-self: start; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; line-height: 18px; }
.lv-ok .lv { background: var(--exit-bg); color: var(--exit); }
.lv-warn .lv { background: var(--amber-bg); color: var(--amber-ink); }
.lv-bad .lv { background: var(--fire-bg); color: var(--fire); }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = __DATA__;

const META = {
  "tong-quan":  {n:"0", c:"", t:"Tổng quan & cách tra", d:"Trình tự 7 bước, ký hiệu, cấu trúc QCVN"},
  "phan-loai":  {n:"1", c:"f", t:"Phân loại kỹ thuật về cháy", d:"Vật liệu, GHCL, bậc chịu lửa, cấp S, nhóm F, hạng A–E"},
  "ngan-chay":  {n:"2", c:"f", t:"Ngăn cháy & khoang cháy", d:"Tường, vách, sàn, cửa ngăn cháy, khoang đệm, Phụ lục H"},
  "thoat-nan":  {n:"3", c:"x", t:"Thoát nạn", d:"Lối ra, kích thước, khoảng cách, buồng thang L1–N3"},
  "chay-lan":   {n:"4", c:"f", t:"Ngăn chặn cháy lan", d:"Khoảng cách giữa nhà, mặt ngoài, lỗ thông tầng"},
  "chua-chay":  {n:"5", c:"", t:"Chữa cháy & cứu nạn", d:"Đường xe, bãi đỗ, lỗ cứu nạn, thang máy chữa cháy"},
  "cao-tang":   {n:"6", c:"f", t:"Nhà cao trên 50 m", d:"Phụ lục A: khoang cháy, thoát nạn, tầng lánh nạn, vùng an toàn"},
  "sua-doi":    {n:"✱", c:"a", t:"Sửa đổi 1:2023", d:"Các nội dung sửa đổi, cách trích dẫn"},
  "checklist":  {n:"✓", c:"x", t:"Checklist hồ sơ", d:"Tự kiểm tra trước khi nộp thẩm duyệt"},
  "thuat-ngu":  {n:"Aa", c:"", t:"Thuật ngữ & cách đo", d:"Chiều cao PCCC, tầng hầm, cách đo khoảng cách"}
};
const ORDER = Object.keys(META);
const FILE2ID = {"README.md":"tong-quan","01-phan-loai.md":"phan-loai","02-ngan-chay.md":"ngan-chay","03-thoat-nan.md":"thoat-nan","04-chay-lan.md":"chay-lan","05-chua-chay-cuu-nan.md":"chua-chay","06-sua-doi-1-2023.md":"sua-doi","07-checklist.md":"checklist","08-thuat-ngu.md":"thuat-ngu","09-nha-cao-tang.md":"cao-tang"};

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let saved = store.get("pccc-saved", []);
let checks = store.get("pccc-checks", {});

/* ---------- markdown → blocks ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\s][^*]*)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => { const id = FILE2ID[h]; return id ? `<a href="#${id}" data-go="${id}">${t}</a>` : t; });
  s = s.replace(/⚑/g, '<span class="flag" title="Cần đối chiếu nguyên văn">⚑ đối chiếu</span>');
  s = s.replace(/✱/g, '<span class="amend" title="Liên quan Sửa đổi 1:2023">✱ SĐ1</span>');
  return s;
}
function mdToHtml(lines, secId) {
  let out = "", i = 0, ci = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^### /.test(l)) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      const wide = head.length > 3;
      out += `<div class="tbl${wide ? " wide" : ""}"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      if (wide) out += `<p class="hint">← Vuốt ngang để xem hết bảng →</p>`;
      continue;
    }
    if (/^> /.test(l)) {
      let b = [];
      while (i < lines.length && /^>/.test(lines[i])) { b.push(lines[i].replace(/^>\s?/, "")); i++; }
      out += `<blockquote><p>${inline(b.join(" "))}</p></blockquote>`; continue;
    }
    if (/^- \[[ x]\] /.test(l)) {
      out += `<ul class="check">`;
      while (i < lines.length && /^- \[[ x]\] /.test(lines[i])) {
        const key = secId + ":" + (ci++);
        out += `<li><label><input type="checkbox" data-ck="${key}"${checks[key] ? " checked" : ""}><span>${inline(lines[i].slice(6))}</span></label></li>`; i++;
      }
      out += `</ul>`; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += `<li>${inline(lines[i].slice(2))}</li>`; i++; }
      out += "</ul>"; continue;
    }
    if (/^\d+(–\d+)?\. /.test(l)) {
      out += "<ol>";
      while (i < lines.length && /^\d+(–\d+)?\. /.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\d+(–\d+)?\. /, ""))}</li>`; i++; }
      out += "</ol>"; continue;
    }
    let p = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||> |- |\d+\. )/.test(lines[i])) { p.push(lines[i]); i++; }
    if (p.length) out += `<p>${inline(p.join(" "))}</p>`; else i++;
  }
  return out;
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

const SECTIONS = {};

    if (/^# /.test(l)) { continue; }
    if (/^## /.test(l)) { cur = { title: l.slice(3).trim(), lines: [] }; blocks.push(cur); continue; }
    (cur ? cur.lines : lead).push(l);
  }
  blocks.forEach((b, k) => { b.id = id + "--" + k; b.text = norm(b.title + " " + b.lines.join(" ").replace(/[|*`>#]/g, " ")); b.raw = b.lines.join(" ").replace(/[|*`>#]/g, " ").replace(/\s+/g, " "); });

}

function buildRe(t) {

  if (isF13 && h > 75) add(s4, "F1.3 trên 75 m: phần công năng khác ngăn bằng tường ngăn cháy đặc REI 150 + sàn ngăn cháy loại 1, lối ra riêng; cách nhiệt tường ngoài không cháy (Ch1, Ch2 phải bọc ≥ 50 mm).", "A.3.1.10, A.3.1.11", "warn");
  if (n >= 2) add(s4, "Sảnh thông tầng: trong một khoang cháy; bao che EI 60 hoặc kính 6 mm + sprinkler; màn ngăn khói E 45 tại lỗ mở.", "4.35", "");

  // 5. Tiếp cận chữa cháy
  const s5 = sec("Tiếp cận chữa cháy và cứu nạn");
  add(s5, `Đường xe chữa cháy rộng ≥ 3,5 m, cao thông thủy ≥ 4,5 m, dốc ≤ 1:8,3; đường cụt > 46 m có bãi quay xe. Mép đường cách tường nhà **≤ ${h < 12 ? 5 : h <= 28 ? 8 : 10} m**.`, "6.2.1, 6.2.2.3, 6.2.4, 6.2.5", "");
  if (!isF5 && h <= 15) add(s5, "Nhà ≤ 15 m (F1 – F4): không yêu cầu bãi đỗ; đường xe tiếp cận mọi điểm trên hình chiếu nhà ≤ 60 m.", "6.2.2.1", "ok");
  else if (isF13) add(s5, "F1.3 > 15 m: đường xe cách lối vào khoang đệm thang máy chữa cháy / buồng thang có họng DN 65 ≤ 18 m; bãi đỗ rộng ≥ 6 m, dài ≥ 15 m, tiếp cận toàn bộ một mặt ngoài, cách tường 2 – 10 m.", "6.2.2.2, Bảng 14", "warn");
  else if (isF5) add(s5, "Nhà F5: một bãi đỗ xe chữa cháy rộng ≥ 6 m, chiều dài theo Bảng 16 (theo khối tích, " + (sp ? "có" : "không có") + " sprinkler).", "6.2.2.3 c), Bảng 16", "");
  else add(s5, `Mỗi lối vào từ trên cao có bãi đỗ rộng ≥ 6 m, dài theo Bảng 15 (${A ? (() => { const r = [[2000, "1/6 chu vi", "1/6 chu vi"], [4000, "1/4 chu vi", "1/6 chu vi"], [8000, "1/2 chu vi", "1/4 chu vi"], [16000, "3/4 chu vi", "1/2 chu vi"], [32000, "bao quanh nhà", "3/4 chu vi"], [INF, "bao quanh nhà", "bao quanh nhà"]].find(x => A <= x[0]); return `${A.toLocaleString("vi-VN")} m² → ${sp ? r[2] : r[1]}`; })() : "theo diện tích sàn tiếp cận"}). Bãi đỗ cách điểm giữa lối vào 2 – 10 m, dốc ≤ 1:15.`, "6.2.2.3, Bảng 15, 6.2.3", "warn");
  if (!isF13 && h > 15) add(s5, (isF5 ? "Lối vào từ trên cao phía trên bãi đỗ, tới độ cao 50 m" : h <= 50 ? "Lối vào từ trên cao ở **mọi tầng trừ tầng 1**, đối diện bãi đỗ" : "Lối vào từ trên cao đối diện bãi đỗ (quy định mọi tầng áp dụng cho nhà 15 – 50 m)") + ": rộng ≥ 850 mm, cao ≥ 1 000 mm, mép dưới ≤ 1 100 mm, mép trên ≥ 1 800 mm; mỗi 20 m bãi đỗ ít nhất một lối; đánh dấu tam giác đỏ/vàng ≥ 150 mm.", "6.3", "warn");
  if (!isF13 && !isF5 && h > 15 && h <= 28) add(s5, "Không yêu cầu bãi đỗ khi số người mỗi tầng (Bảng G.9) ≤ 50 và đường xe cách họng tiếp nước vào nhà ≤ 18 m.", "Bảng 14, chú thích 1", "");
  if (isF13) add(s5, "Không áp dụng yêu cầu lối vào từ trên cao cho nhà F1.3.", "6.3.5", "ok");
  if (h >= 10 || n >= 4) add(s5, isF5 ? "Lối lên mái: 1 lối / 40 000 m² mái (ít nhất 1); nhà 1 tầng: thang thép hở bên ngoài." : "Lối ra mái (nhà ≥ 10 m tới diềm mái): ≥ 1 lối / 9 300 m² mái; cửa từ buồng thang loại 2, ≥ 0,75 × 1,5 m. Chênh mái > 1 m: thang P1 (≤ 20 m) / P2 (> 20 m).", isF5 ? "A.1.3.1" : "6.6, 6.7, 6.10, 6.11", "");
  const fl = (isF13 ? h > 50 : h > 28) || v.deep;
  if (fl) add(s5, `**Thang máy chữa cháy** mỗi khoang cháy; bán kính phục vụ ≤ ${h > 50 && !isF5 && !isF13 ? 45 : 60} m; giếng riêng ≥ REI 120 (≤ 3 thang/giếng); sảnh ≥ 4 m² (chung sảnh buồng thang ≥ 6 m²), vách ngăn cháy loại 1, họng DN 65; tải ≥ ${isF13 ? "630" : "1 000"} kg; tốc độ ≥ H/60 m/s.`, h > 50 && !isF5 && !isF13 ? "6.13, A.2.12" : "6.13", "warn");
  else add(s5, `Chưa bắt buộc thang máy chữa cháy (yêu cầu khi cao > ${isF13 ? 50 : 28} m hoặc sàn hầm dưới cùng sâu > 9 m).`, "6.13", "ok");
  add(s5, "Khe hở giữa các vế thang, lan can ≥ 75 mm (hoặc họng khô mỗi tầng).", "6.12", "");
  const ctrl = (n > 10 && !isF5) || nb >= 2 || (it.tag === "karaoke" && P > 50) || (g === "F2.1" && P > 50) || (isF5 && A * n > 18000);
  if (ctrl) add(s5, "**Phòng trực điều khiển chống cháy**: ≥ 6 m², ngăn cách bằng bộ phận ngăn cháy loại 1, lối ra trực tiếp vào hành lang thoát nạn, ra ngoài hoặc cầu thang thoát nạn; có nhân viên trực." + (nb >= 2 ? " Liên lạc hai chiều tới các phòng kỹ thuật PCCC ở mọi tầng hầm." : ""), "6.17" + (nb >= 2 ? ", 6.18" : ""), "warn");
  if (h > 100) {
    const need = !(sp && h <= 120);
    add(s5, need ? "**Khu vực lánh nạn tạm thời**: tầng lánh nạn cách nhau ≤ 20 tầng, đầu tiên ≤ tầng 21, 0,3 m²/người, ngăn REI 150, thông gió tự nhiên ≥ 25 %; hoặc vùng an toàn loại 1 – 4 (loại 4 = buồng thang, chỉ F1.3) trên mọi tầng hoặc cách ≤ 5 tầng." : "Cao 100 – 120 m có báo cháy và chữa cháy tự động: chưa bắt buộc khu vực lánh nạn tạm thời.", "A.3.2", need ? "bad" : "ok");
  }
  if (h > 50 && !isF5 && !isF13) add(s5, "Gian đông người: 300 – 600 chỗ ≤ 15 m; 150 – 300 chỗ ≤ 40 m; 100 – 150 chỗ ≤ 50 m; trên 50 m ≤ 100 chỗ. Không bố trí gian hạng A, B. Kho dễ cháy > 50 m² không cao hơn 50 m.", "A.2.4, A.2.8, A.2.9", "");
  out.forEach(s => s.items = s.items.filter(x => x.txt));
  return { it, out };
}

let ctV = Object.assign({ i: 0, h: 60, n: 20, nb: 2, a: 1200, p: "", sp: true, deep: false, hh: false, hang: "C", c1: false }, store.get("pccc-ct", {}));
let ctQ = "";
function md(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>"); }
function ctList() {
  const t = norm(ctQ).split(/\s+/).filter(Boolean);
  const rows = CT.map((c, i) => ({ c, i })).filter(({ c }) => !t.length || t.every(x => norm(c.n + " " + c.g).includes(x)));
  return rows.slice(0, t.length ? 12 : 0).map(({ c, i }) => `<button class="pick" data-ct="${i}"><span>${esc(c.n)}</span><b>${c.g}</b></button>`).join("") || (t.length ? `<p class="note">Không thấy. Chọn công trình gần nhất theo đặc điểm sử dụng (Bảng 6).</p>` : "");
}
function ctResult() {
  const { it, out } = ctEvaluate(ctV);
  const lab = { ok: "Đạt", warn: "Lưu ý", bad: "Vượt / không đạt" };
  return `<div class="ct-sum"><span class="chip">${it.g}</span><span class="chip">${ctV.h || 0} m</span><span class="chip">${ctV.n || 1} tầng nổi</span><span class="chip">${ctV.nb || 0} tầng hầm</span>${ctV.sp ? '<span class="chip">Có sprinkler</span>' : ""}</div>` +
    out.filter(s => s.items.length).map(s => `<section class="ct-sec"><h2>${s.t}</h2><ul>${s.items.map(x => `<li class="lv-${x.lv || "n"}">${x.lv ? `<span class="lv">${lab[x.lv]}</span>` : ""}<span class="tx">${md(x.txt)}</span><code>${esc(x.ref)}</code></li>`).join("")}</ul></section>`).join("") +
    `<p class="disclaimer">Kết quả là danh sách nội dung cần lưu ý, suy ra từ các điều đã dẫn của QCVN 06:2022/BXD (SĐ1:2023). Kiểm tra lại nguyên văn và các chú thích trước khi dùng trong hồ sơ.</p>`;
}
function renderCT() {
  setHeader("Tra theo công trình"); setNav("cong-trinh");
  const it = CT[ctV.i] || CT[0], f5 = it.g.startsWith("F5");
  const num = (id, label, val, unit, ph) => `<label class="fld"><span>${label}</span><span class="inp"><input id="${id}" type="number" inputmode="decimal" min="0" value="${val}" placeholder="${ph || ""}"><i>${unit}</i></span></label>`;
  view.innerHTML = `
  <section class="quick ct-form">
    <label class="fld wide"><span>Công trình</span>
      <span class="sel">${esc(it.n)} <b>${it.g}</b></span>
      <input id="ctq" type="search" autocomplete="off" placeholder="Đổi công trình: gõ chung cư, karaoke, kho…" value="${esc(ctQ)}">
    </label>
    <div id="ctlist" class="picks">${ctList()}</div>
    <div class="grid2">
      ${num("cth", "Chiều cao PCCC", ctV.h, "m")}
      ${num("ctn", "Số tầng nổi", ctV.n, "tầng")}
      <label class="fld"><span>Số tầng hầm</span><select id="ctnb">${[0, 1, 2, 3, 4].map(k => `<option value="${k}"${+ctV.nb === k ? " selected" : ""}>${k}${k === 4 ? "+" : ""}</option>`).join("")}</select></label>
      ${num("cta", "Diện tích 1 tầng", ctV.a, "m²", "tùy chọn")}
      ${num("ctp", "Số người / tầng", ctV.p, "người", "tùy chọn")}
      ${f5 ? `<label class="fld"><span>Hạng nguy hiểm cháy nổ</span><select id="cthang">${["A", "B", "C", "D", "E"].map(k => `<option${ctV.hang === k ? " selected" : ""}>${k}</option>`).join("")}</select></label>` : ""}
    </div>
    <div class="checks">
      <label><input type="checkbox" id="ctsp"${ctV.sp ? " checked" : ""}> Chữa cháy tự động (sprinkler) toàn nhà</label>
      <label><input type="checkbox" id="ctdeep"${ctV.deep ? " checked" : ""}> Sàn hầm dưới cùng sâu > 9 m</label>
      <label><input type="checkbox" id="cthh"${ctV.hh ? " checked" : ""}> Nhà hỗn hợp</label>
      ${f5 && it.t === "H9" && ctV.hang === "C" ? `<label><input type="checkbox" id="ctc1"${ctV.c1 ? " checked" : ""}> Gian hạng C1 chiếm > 1/2 diện tích tầng</label>` : ""}
    </div>
  </section>
  <div id="ctres">${ctResult()}</div>`;
}
function ctSync(rerenderForm) {
  const gv = id => document.getElementById(id);
  if (gv("cth")) { ctV.h = gv("cth").value; ctV.n = gv("ctn").value; ctV.nb = gv("ctnb").value; ctV.a = gv("cta").value; ctV.p = gv("ctp").value;
    ctV.sp = gv("ctsp").checked; ctV.deep = gv("ctdeep").checked; ctV.hh = gv("cthh").checked;
    if (gv("cthang")) ctV.hang = gv("cthang").value; ctV.c1 = gv("ctc1") ? gv("ctc1").checked : false; }
  store.set("pccc-ct", ctV);
  if (rerenderForm) renderCT(); else document.getElementById("ctres").innerHTML = ctResult();
}

/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.value.trim()) return renderSearch(q.value.trim());
  if (!h || h === "home") return renderHome();
  if (h === "tra-nhanh") return renderQuick();
  if (h === "cong-trinh") return renderCT();
  if (h === "da-luu") return renderSaved();
  if (SECTIONS[h]) return renderSection(h);
  renderHome();
}
function go(hash, block) {
  q.value = ""; clearQ.hidden = true;
  if (block) { const sid = block.split("--")[0]; if (location.hash.slice(1) !== sid) history.replaceState(null, "", "#" + sid); renderSection(sid, block); return; }
  if (location.hash.slice(1) === hash) route(); else location.hash = hash;
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) { e.preventDefault(); e.stopPropagation(); const id = star.dataset.star;
    saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]; store.set("pccc-saved", saved);
    const on = saved.includes(id); star.setAttribute("aria-pressed", on); star.setAttribute("aria-label", on ? "Bỏ lưu" : "Lưu mục này"); return; }
  const pk = e.target.closest("[data-ct]"); if (pk) { ctSync(false); ctV.i = +pk.dataset.ct; ctQ = ""; store.set("pccc-ct", ctV); renderCT(); window.scrollTo(0, 0); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.preventDefault(); go(null, op.dataset.open); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest("[data-nav]"); if (n) { go(n.dataset.nav === "home" ? "home" : n.dataset.nav); return; }
  const bac = e.target.closest("[data-bac]"); if (bac) { qBac = bac.dataset.bac; store.set("pccc-bac", qBac); renderQuick(); return; }
  const hh = e.target.closest("[data-h]"); if (hh) { qH = +hh.dataset.h; store.set("pccc-h", qH); renderQuick(); return; }
  const chip = e.target.closest("[data-chip]"); if (chip) { q.value = chip.dataset.chip; clearQ.hidden = false; renderSearch(q.value); return; }
  if (e.target.id === "resetCk") { view.querySelectorAll("input[data-ck]").forEach(b => { b.checked = false; delete checks[b.dataset.ck]; }); store.set("pccc-checks", checks); updateProgress(); }
});
document.addEventListener("change", e => {
  const ck = e.target.closest("input[data-ck]"); if (!ck) return;
  if (ck.checked) checks[ck.dataset.ck] = 1; else delete checks[ck.dataset.ck];
  store.set("pccc-checks", checks); updateProgress();
});
backBtn.addEventListener("click", () => go("home"));
let tmr;
document.addEventListener("input", e => {
  if (e.target.id === "ctq") { ctQ = e.target.value; document.getElementById("ctlist").innerHTML = ctList(); return; }
  if (e.target.closest && e.target.closest(".ct-form") && e.target.type === "number") ctSync(false);
});
document.addEventListener("change", e => {
  if (!e.target.closest || !e.target.closest(".ct-form")) return;
  if (e.target.id === "cthang") { ctSync(true); return; }
  if (e.target.tagName === "SELECT" || e.target.type === "checkbox") ctSync(false);
});
document.addEventListener("input", e => { if (e.target.id === "fq") { qF = e.target.value; document.getElementById("fres").innerHTML = fRows(qF); } });
q.addEventListener("input", () => { clearQ.hidden = !q.value; clearTimeout(tmr); tmr = setTimeout(() => q.value.trim() ? renderSearch(q.value.trim()) : route(), 120); });
clearQ.addEventListener("click", () => { q.value = ""; clearQ.hidden = true; route(); q.focus(); });

route();
</script>
