<title>Sổ tay PCCC QCVN 06</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#b42318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột kiểu ứng dụng điện thoại — thanh đầu dính có ô tìm, nội dung là các khối gập mở, thanh điều hướng dưới đáy. */
:root {
  --bg: #fbf8f3; --panel: #ffffff; --tint: #f1ebe1; --line: #ddd3c5;
  --ink: #1f1a17; --muted: #5e554d;
  --fire: #b42318; --fire-bg: #fde4e1; --on-fire: #ffffff;
  --exit: #067647; --exit-bg: #dcf5e7;
  --amber: #f2a516; --amber-ink: #7a5000; --amber-bg: #fff1d1;
  --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171310; --panel: #211b17; --tint: #2c2520; --line: #43392f;
  --ink: #f3ece3; --muted: #b8ada1;
  --fire: #f97066; --fire-bg: #4a1712; --on-fire: #1a0705;
  --exit: #47cd89; --exit-bg: #0f3a26;
  --amber: #e09b13; --amber-ink: #f5c46b; --amber-bg: #3a2a08;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fire); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fire); color: var(--on-fire); padding-block: 10px 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 32px; }
.brand h1 { font-size: 17px; line-height: 1.2; font-weight: 800; margin: 0; flex: 1; min-width: 0; letter-spacing: -0.01em; }
.brand small { display: block; font-weight: 500; font-size: 12px; opacity: .85; }
.back { border: 0; background: transparent; color: inherit; width: 36px; height: 36px; margin-left: -8px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.back svg { width: 22px; height: 22px; }
.search { position: relative; }
.search input { width: 100%; height: 44px; border-radius: 10px; border: 0; padding: 0 40px 0 40px; font: inherit; font-size: 16px; background: var(--panel); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search .ico { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search .clear { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 20px; line-height: 1; }

main { padding-block: 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* Bottom nav */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .row { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 760px; margin: 0 auto; height: var(--nav-h); }
nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--fire); }

/* Home */
.intro { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
.label:first-child { margin-top: 0; }
.toc { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toc li + li { border-top: 1px solid var(--line); }
.toc button { width: 100%; text-align: left; border: 0; background: transparent; display: grid; grid-template-columns: 36px 1fr 16px; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; min-height: 60px; }
.toc .num { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; background: var(--tint); color: var(--ink); }
.toc .num.f { background: var(--fire-bg); color: var(--fire); }
.toc .num.x { background: var(--exit-bg); color: var(--exit); }
.toc .num.a { background: var(--amber-bg); color: var(--amber-ink); }
.toc b { display: block; font-size: 15px; line-height: 1.3; }
.toc span.d { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.toc .chev { color: var(--muted); }

/* Quick lookup */
.quick { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.quick h2 { font-size: 15px; margin: 0 0 10px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.seg button { min-width: 44px; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 700; font-family: var(--mono); }
.seg button[aria-pressed="true"] { background: var(--fire); border-color: var(--fire); color: var(--on-fire); }
.kv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv dt { color: var(--muted); padding-right: 12px; }
.kv dd { font-family: var(--mono); font-weight: 500; text-align: right; color: var(--fire); }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.quick .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Article */
.doc h1.page { font-size: 24px; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.doc details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 0 0 10px; }
.doc summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 14px; position: relative; font-weight: 700; font-size: 16px; line-height: 1.35; }
.doc summary::-webkit-details-marker { display: none; }
.doc summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
.doc details[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
.doc .body { padding: 0 14px 14px; min-width: 0; }
.doc .lead { margin-bottom: 12px; }
.doc h3 { font-size: 15px; margin: 18px 0 6px; }
.doc p { margin: 0 0 10px; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 20px; }
.doc li { margin: 4px 0; }
.doc blockquote { margin: 0 0 12px; padding: 10px 12px; background: var(--tint); border-radius: 8px; font-size: 14px; }
.doc blockquote p:last-child { margin: 0; }
.doc code { font-family: var(--mono); font-size: 12.5px; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.doc a { color: var(--fire); font-weight: 600; text-underline-offset: 2px; }
.tbl { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
.tbl table { border-collapse: collapse; font-size: 13.5px; line-height: 1.4; min-width: 100%; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--tint); font-size: 12.5px; font-weight: 700; white-space: normal; min-width: 88px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child, .tbl th:first-child { position: sticky; left: 0; background: var(--panel); box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--tint); }
.tbl td { font-variant-numeric: tabular-nums; min-width: 80px; }
.tbl.wide td { min-width: 96px; }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
.flag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--amber-ink); background: var(--amber-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
.amend { display: inline-block; font-size: 11px; font-weight: 700; color: var(--fire); background: var(--fire-bg); border-radius: 4px; padding: 0 5px; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
mark { background: var(--amber-bg); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--amber); }

/* Checklist */
.check { list-style: none; padding: 0 !important; }
.check li { margin: 0; border-top: 1px solid var(--line); }
.check li:first-child { border-top: 0; }
.check label { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 10px 0; cursor: pointer; align-items: start; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--exit); }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--exit); width: 0; transition: width .2s; }
.reset { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; font-size: 13px; }

/* Save star */
.star { position: absolute; right: 40px; top: 8px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.star svg { width: 20px; height: 20px; }
.star[aria-pressed="true"] { color: var(--amber); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.doc summary { padding-right: 84px; }

/* Search results */
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.results button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.results .sec { font-size: 12px; color: var(--muted); font-weight: 600; }
.results .ttl { font-weight: 700; display: block; margin: 2px 0 4px; }
.results .snip { font-size: 13.5px; color: var(--ink); display: block; line-height: 1.45; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

.disclaimer { font-size: 12.5px; color: var(--amber-ink); background: var(--amber-bg); border-radius: 10px; padding: 10px 12px; margin: 16px 0 0; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.pager button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; font-size: 13px; min-height: 56px; }
.pager button.next { text-align: right; grid-column: 2; }
.pager small { display: block; color: var(--muted); font-size: 11.5px; }


/* Tra theo công trình */
.ct-cta { width: 100%; text-align: left; border: 0; border-radius: 12px; padding: 14px 16px; margin: 0 0 8px; background: var(--fire); color: var(--on-fire); cursor: pointer; display: grid; gap: 4px; }
.ct-cta b { font-size: 16px; } .ct-cta span { font-size: 13px; opacity: .9; line-height: 1.4; }
.ct-form { display: grid; gap: 12px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; min-width: 0; }
.fld input, .fld select { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); font-weight: 500; }
.fld .inp { position: relative; display: block; } .fld .inp input { padding-right: 48px; }
.fld .inp i { position: absolute; right: 10px; top: 11px; font-style: normal; color: var(--muted); font-weight: 500; font-size: 13px; }
.fld .sel { font-size: 16px; color: var(--ink); font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.fld .sel b, .pick b { font-family: var(--mono); color: var(--fire); font-weight: 500; font-size: 13px; white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.picks { display: grid; gap: 6px; } .picks:empty { display: none; }
.pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 14px; }
.checks { display: grid; gap: 8px; font-size: 14px; } .checks label { display: flex; gap: 10px; align-items: center; }
.checks input { width: 20px; height: 20px; accent-color: var(--fire); flex: none; }
.ct-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 10px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--tint); color: var(--ink); }
.ct-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
.ct-sec h2 { font-size: 15px; margin: 0 0 6px; }
.ct-sec ul { list-style: none; margin: 0; padding: 0; }
.ct-sec li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; display: grid; gap: 4px; }
.ct-sec li:first-child { border-top: 0; }
.ct-sec code { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.lv { justify-self: start; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; line-height: 18px; }
.lv-ok .lv { background: var(--exit-bg); color: var(--exit); }
.lv-warn .lv { background: var(--amber-bg); color: var(--amber-ink); }
.lv-bad .lv { background: var(--fire-bg); color: var(--fire); }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }

/* Mở rộng */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--tint); padding: 4px; border-radius: 10px; margin: 0 0 12px; }
.tabs button { border: 0; background: transparent; height: 36px; border-radius: 7px; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: var(--muted); padding: 0 4px; font-family: var(--sans); min-width: 0; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.refs { display: flex; flex-wrap: wrap; gap: 4px; }
.ref { border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-family: var(--mono); font-size: 11.5px; line-height: 1; padding: 5px 7px; border-radius: 6px; cursor: pointer; }
.ref:hover { color: var(--fire); border-color: var(--fire); }
.ref.dg { font-family: var(--sans); font-weight: 600; color: var(--exit); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.btn1, .btn2 { height: 40px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: var(--sans); }
.btn1 { border: 0; background: var(--fire); color: var(--on-fire); }
.btn2 { border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.link-btn { border: 0; background: transparent; color: var(--fire); font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px 0; justify-self: start; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.parts { display: grid; gap: 10px; }
.part { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.part .fld input, .part .fld select { background: var(--panel); }
.part-h { font-size: 15px; margin: 18px 0 8px; } .part-h span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; font-family: var(--mono); }
.rp { display: grid; gap: 8px; margin-top: 12px; }
.rp-row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; }
.rp-row.st-ok { box-shadow: inset 0 0 0 2px var(--exit-bg); } .rp-row.st-bad { box-shadow: inset 0 0 0 2px var(--fire-bg); } .rp-row.st-na { opacity: .7; }
.rp-ctl { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 8px; }
.rp-ctl select, .rp-ctl input, .fld input[type=date], #rpname, #rpauthor { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; font: inherit; font-size: 15px; background: var(--bg); color: var(--ink); width: 100%; }
.proj { display: grid; gap: 4px; } .proj > button:first-child { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.dgbox svg { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
.dg text { fill: var(--ink); font-family: var(--sans); font-size: 11px; } .dg text.s { font-size: 10px; fill: var(--muted); } .dg text.b { font-weight: 700; font-size: 12px; }
.dg .g, .dg .fl line { stroke: var(--line); stroke-width: 1.5; } .dg .w { fill: var(--tint); stroke: var(--ink); stroke-width: 1.5; } .dg path.w { fill: none; }
.dg .road { fill: var(--line); } .dg .win { fill: var(--panel); stroke: var(--muted); } .dg .tech { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 3 2; }
.dg .dim, .dg .diag { stroke: var(--fire); stroke-width: 1.5; } .dg .diag { stroke-dasharray: 5 3; stroke: var(--muted); } .dg .arr { fill: var(--fire); }
.dg .st { fill: var(--exit-bg); stroke: var(--exit); stroke-width: 1.5; } .dg .pos { stroke-dasharray: 4 2; } .dg .air { fill: var(--panel); stroke: var(--exit); stroke-dasharray: 2 2; }
.dg .lob { fill: var(--exit-bg); stroke: var(--exit); } .dg .cor { stroke: var(--muted); stroke-width: 6; opacity: .3; }
.dg .solid { fill: var(--fire-bg); stroke: var(--fire); } .dg .spk { fill: var(--fire); } .dg .exit { fill: var(--exit); } .dg .pt { fill: var(--fire); } .dg .ent rect { fill: var(--amber); }
@media (max-width: 420px) { .grid4 { grid-template-columns: 1fr 1fr; } .rp-ctl { grid-template-columns: 1fr; } }

/* Sơ đồ kiểu bản vẽ */
.dg .wallthick { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linejoin: miter; }
.dg .fillroom { fill: var(--tint); }
.dg .wallr { fill: var(--panel); stroke: var(--ink); stroke-width: 3.5; }
.dg .wall2 { stroke: var(--ink); stroke-width: 3.5; }
.dg .gap { stroke: var(--panel); stroke-width: 6; }
.dg .leaf { stroke: var(--ink); stroke-width: 1.6; }
.dg .swing { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 2; }
.dg .stair { fill: var(--exit-bg); stroke: var(--exit); stroke-width: 1; }
.dg .tread { stroke: var(--exit); stroke-width: .8; }
.dg .up { fill: none; stroke: var(--exit); stroke-width: 1.4; }
.dg .flow { stroke: var(--exit); stroke-width: 2.4; }
.dg .flowhead { fill: var(--exit); }
.dg .dimt { fill: var(--fire); font-weight: 600; }
.dg .truck { fill: var(--fire); } .dg .truckcab { fill: var(--fire); opacity: .75; } .dg .ladder { stroke: var(--panel); stroke-width: 1.6; stroke-dasharray: 2 2; } .dg .wheel { fill: var(--ink); }
.dg .asphalt { fill: #5b5753; } .dg .edge { stroke: #f4f1ea; stroke-width: 1.2; } .dg .lane { stroke: #f4f1ea; stroke-width: 1.6; stroke-dasharray: 10 8; }
.dg .exitbox { fill: var(--exit); } .dg text.exitt { fill: #fff; font-size: 7px; font-weight: 800; font-family: var(--sans); }
.dg .ppl { fill: var(--ink); opacity: .55; }
.dg .hatchl { stroke: var(--muted); stroke-width: 1; opacity: .5; }
.dg .ground { stroke: var(--ink); stroke-width: 1.6; }
.dg .slab { fill: var(--ink); opacity: .8; }
.dg .glass { fill: #9cc7e8; stroke: var(--ink); stroke-width: .6; }
.dg .dim2, .dg .lead { stroke: var(--fire); stroke-width: 1; stroke-dasharray: 3 2; }

};
const ORDER = Object.keys(META);
const FILE2ID = {"README.md":"tong-quan","01-phan-loai.md":"phan-loai","02-ngan-chay.md":"ngan-chay","03-thoat-nan.md":"thoat-nan","04-chay-lan.md":"chay-lan","05-chua-chay-cuu-nan.md":"chua-chay","06-sua-doi-1-2023.md":"sua-doi","08-thuat-ngu.md":"thuat-ngu","09-nha-cao-tang.md":"cao-tang"};

/* ---------- storage (best effort) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let saved = store.get("pccc-saved", []);
let checks = store.get("pccc-checks", {});

/* ---------- markdown → blocks ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*\s][^*]*)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, h) => { const id = FILE2ID[h]; return id ? `<a href="#${id}" data-go="${id}">${t}</a>` : t; });
  s = s.replace(/⚑/g, '<span class="flag" title="Cần đối chiếu nguyên văn">⚑ đối chiếu</span>');
  s = s.replace(/✱/g, '<span class="amend" title="Liên quan Sửa đổi 1:2023">✱ SĐ1</span>');
  return s;
}
function mdToHtml(lines, secId) {
  let out = "", i = 0, ci = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^### /.test(l)) { out += `<h3>${inline(l.slice(4))}</h3>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      const wide = head.length > 3;
      out += `<div class="tbl${wide ? " wide" : ""}"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      if (wide) out += `<p class="hint">← Vuốt ngang để xem hết bảng →</p>`;
      continue;
    }
    if (/^> /.test(l)) {
      let b = [];
      while (i < lines.length && /^>/.test(lines[i])) { b.push(lines[i].replace(/^>\s?/, "")); i++; }
      out += `<blockquote><p>${inline(b.join(" "))}</p></blockquote>`; continue;
    }
    if (/^- \[[ x]\] /.test(l)) {
      out += `<ul class="check">`;
      while (i < lines.length && /^- \[[ x]\] /.test(lines[i])) {
        const key = secId + ":" + (ci++);
        out += `<li><label><input type="checkbox" data-ck="${key}"${checks[key] ? " checked" : ""}><span>${inline(lines[i].slice(6))}</span></label></li>`; i++;
      }
      out += `</ul>`; continue;
    }
    if (/^- /.test(l)) {
      out += "<ul>";
      while (i < lines.length && /^- /.test(lines[i])) { out += `<li>${inline(lines[i].slice(2))}</li>`; i++; }
      out += "</ul>"; continue;
    }
    if (/^\d+(–\d+)?\. /.test(l)) {
      out += "<ol>";
      while (i < lines.length && /^\d+(–\d+)?\. /.test(lines[i])) { out += `<li>${inline(lines[i].replace(/^\d+(–\d+)?\. /, ""))}</li>`; i++; }
      out += "</ol>"; continue;
    }
    let p = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\||> |- |\d+\. )/.test(lines[i])) { p.push(lines[i]); i++; }
    if (p.length) out += `<p>${inline(p.join(" "))}</p>`; else i++;
  }
  return out;
}
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

const SECTIONS = {};
for (const [file, md] of Object.entries(DATA)) {
  const id = FILE2ID[file]; const lines = md.split("\n");
  let title = META[id].t, lead = [], blocks = [], cur = null;
  for (const l of lines) {
    if (/^# /.test(l)) { continue; }
    if (/^## /.test(l)) { cur = { title: l.slice(3).trim(), lines: [] }; blocks.push(cur); continue; }
    (cur ? cur.lines : lead).push(l);
  }
  blocks.forEach((b, k) => { b.id = id + "--" + k; b.text = norm(b.title + " " + b.lines.join(" ").replace(/[|*`>#]/g, " ")); b.raw = b.lines.join(" ").replace(/[|*`>#]/g, " ").replace(/\s+/g, " "); });
  SECTIONS[id] = { id, title, lead, blocks, leadText: norm(lead.join(" ")) };
}

function renderSection(id, openBlock) {
  const s = SECTIONS[id]; if (!s) return renderHome();
  setHeader(META[id].t); setNav("");
  let html = `<article class="doc">`;
  const leadHtml = mdToHtml(s.lead, id);
  if (leadHtml) html += `<div class="lead">${leadHtml}</div>`;
  if (id === "checklist") html += `<div class="progress"><div class="bar"><i id="pbar"></i></div><span id="ptext"></span><button class="reset" id="resetCk">Làm lại</button></div>`;
  s.blocks.forEach((b, k) => {
    const open = openBlock ? b.id === openBlock : (s.blocks.length <= 2 || id === "checklist" || k === 0);
    const isSaved = saved.includes(b.id);
    html += `<details id="${b.id}"${open ? " open" : ""}><summary>${inline(b.title)}<button class="star" data-star="${b.id}" aria-pressed="${isSaved}" aria-label="${isSaved ? "Bỏ lưu" : "Lưu mục này"}">${starSvg}</button></summary><div class="body">${mdToHtml(b.lines, b.id)}</div></details>`;
  });
  const idx = ORDER.indexOf(id), prev = ORDER[idx - 1], next = ORDER[idx + 1];
  html += `<div class="pager">${prev ? `<button data-go="${prev}"><small>← Trước</small>${META[prev].t}</button>` : ""}${next ? `<button class="next" data-go="${next}"><small>Tiếp →</small>${META[next].t}</button>` : ""}</div></article>`;
  view.innerHTML = html;
  if (id === "checklist") updateProgress();
  if (openBlock) { const el = document.getElementById(openBlock); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); }
  else window.scrollTo(0, 0);
}

function updateProgress() {
  const boxes = view.querySelectorAll("input[data-ck]"); const done = [...boxes].filter(b => b.checked).length;
  const bar = document.getElementById("pbar"), t = document.getElementById("ptext");
  if (bar) { bar.style.width = (boxes.length ? done / boxes.length * 100 : 0) + "%"; t.textContent = `${done}/${boxes.length}`; }
}

function renderSaved() {
  setHeader("Đã lưu"); setNav("da-luu");
  const items = saved.map(bid => { const sid = bid.split("--")[0]; const s = SECTIONS[sid]; const b = s && s.blocks.find(x => x.id === bid); return b ? { s, b } : null; }).filter(Boolean);
  if (!items.length) { view.innerHTML = `<div class="empty">Chưa lưu mục nào.<br>Bấm biểu tượng dấu trang trên tiêu đề một mục để lưu lại tra cứu nhanh.</div>`; return; }
  view.innerHTML = `<ul class="results">${items.map(({ s, b }) => `<li><button data-open="${b.id}"><span class="sec">${META[s.id].t}</span><span class="ttl">${inline(b.title)}</span><span class="snip">${esc(b.raw.slice(0, 120))}…</span></button></li>`).join("")}</ul>`;
}

function renderSearch(term) {
  setNav("");
  const terms = norm(term).split(/\s+/).filter(Boolean);
  const res = [];
  for (const id of ORDER) for (const b of SECTIONS[id].blocks) {
    if (terms.every(t => b.text.includes(t))) res.push({ id, b, score: terms.filter(t => norm(b.title).includes(t)).length });
  }
  res.sort((a, b) => b.score - a.score);
  setHeader(null);
  if (!res.length) {
    view.innerHTML = `<div class="empty">Không thấy kết quả cho “${esc(term)}”.<br>Thử từ khóa ngắn hơn hoặc gợi ý:<div class="chips">${["buồng thang","REI","hành lang cụt","khoang cháy","F1.3","xe chữa cháy","khoang đệm"].map(c => `<button data-chip="${c}">${c}</button>`).join("")}</div></div>`;
    return;
  }
  const mk = s => { let h = esc(s); for (const t of terms) { if (t.length < 2) continue; const re = buildRe(t); h = h.replace(re, m => `<mark>${m}</mark>`); } return h; };
  view.innerHTML = `<p class="label">${res.length} kết quả</p><ul class="results">${res.slice(0, 60).map(({ id, b }) => {
    const nraw = norm(b.raw); const pos = Math.max(0, nraw.indexOf(terms[0]) - 40);
    const snip = (pos ? "…" : "") + b.raw.slice(pos, pos + 150) + "…";
    return `<li><button data-open="${b.id}"><span class="sec">${META[id].t}</span><span class="ttl">${mk(b.title.replace(/[⚑✱]/g, ""))}</span><span class="snip">${mk(snip.replace(/[⚑✱]/g, ""))}</span></button></li>`;
  }).join("")}</ul>`;
}
// accent-insensitive regex for highlighting
const MAP = { a:"aàáảãạăằắẳẵặâầấẩẫậ", e:"eèéẻẽẹêềếểễệ", i:"iìíỉĩị", o:"oòóỏõọôồốổỗộơờớởỡợ", u:"uùúủũụưừứửữự", y:"yỳýỷỹỵ", d:"dđ" };
function buildRe(t) {
  const src = [...t].map(ch => { const k = ch.toLowerCase(); if (MAP[k]) return "[" + MAP[k] + MAP[k].toUpperCase() + "]"; return ch.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("");
  return new RegExp(src, "gi");
}

function refTokens(ref) {
  const parts = []; let depth = 0, cur = "";
  for (const ch of String(ref || "")) { if (ch === "(") depth++; if (ch === ")") depth = Math.max(0, depth - 1); if ((ch === "," || ch === ";") && depth === 0) { parts.push(cur); cur = ""; } else cur += ch; }
  parts.push(cur);
  return parts.map(t => t.trim()).filter(Boolean).map(t => {
    if (/^chú thích/i.test(t)) return null;
    let q = t.replace(/\s*\([^)]*\)\s*$/, "").replace(/\s*\((đoạn cuối|kết thúc)\)/, "").replace(/\s+CHÚ THÍCH.*$/, "").replace(/\s+CT\d+.*$/, "").replace(/\s+[a-hđ]\)\s*\d*\)?$/, "").replace(/\s+chú thích.*$/i, "").trim();
    return { label: t, q };
  }).filter(Boolean);
}
function refFound(q) { const t = norm(q).split(/\s+/).filter(Boolean); return t.length && ORDER.some(id => SECTIONS[id].leadText.includes(t.join(" ")) || SECTIONS[id].blocks.some(b => t.every(x => b.text.includes(x)))); }

  let cur = q;
  while (cur) { if (refFound(cur)) return cur; const m = cur.match(/^(.*\d)\.\d+[a-z]?$/); if (!m) break; cur = m[1]; }
  const head = q.match(/^(Bảng\s+[A-Z]?\.?\d+|Phụ lục\s+[A-I])/); if (head && refFound(head[1])) return head[1];
  const ap = q.match(/^([A-H])\./); if (ap) return "Phụ lục " + ap[1];
  return q;
}
function refHTML(ref) {
  return refTokens(ref).map(r => `<button class="ref" data-ref="${esc(r.q)}" title="Tìm ${esc(r.q)} trong sổ tay">${esc(r.label)}</button>`).join("");
}
const DIAG_FOR = [[/^1\.4\.9/, "chieu-cao"], [/^3\.4\.1[1-3]|^2\.4\.3|^3\.4\.9/, "buong-thang"], [/^3\.4\.10/, "vung-dem"], [/^4\.33/, "dai-ngan-chay"], [/^3\.2\.8/, "loi-ra"], [/^Bảng G\.[12]|^3\.3\.2|^A\.2\.19/, "khoang-cach"], [/^4\.32|^4\.17/, "tuong-ngan-chay"], [/^6\.2|^6\.3|Bảng 1[456]/, "bai-do"]];
function diagLink(ref) {
  const ids = new Set();
  refTokens(ref).forEach(r => DIAG_FOR.forEach(([re, id]) => { if (re.test(r.q)) ids.add(id); }));
  return [...ids].map(id => `<button class="ref dg" data-diag="${id}">Sơ đồ</button>`).join("");
}

0" x2="93" y2="144"/><path class="swing" d="M107 130 A14 14 0 0 1 93 144"/><rect class="apt" x="128" y="130" width="44" height="54"/><line class="gap" x1="143" y1="130" x2="157" y2="130"/><line class="leaf" x1="143" y1="130" x2="143" y2="144"/><path class="swing" d="M157 130 A14 14 0 0 1 143 144"/><rect class="apt" x="178" y="130" width="44" height="54"/><line class="gap" x1="193" y1="130" x2="207" y2="130"/><line class="leaf" x1="193" y1="130" x2="193" y2="144"/><path class="swing" d="M207 130 A14 14 0 0 1 193 144"/><rect class="apt" x="288" y="130" width="44" height="54"/><line class="gap" x1="303" y1="130" x2="317" y2="130"/><line class="leaf" x1="303" y1="130" x2="303" y2="144"/><path class="swing" d="M317 130 A14 14 0 0 1 303 144"/><text x="100" y="200" class="s" text-anchor="middle">Căn hộ</text><text x="310" y="200" class="s" text-anchor="middle">Căn hộ</text><line class="flow" x1="150" y1="115" x2="50" y2="115"/><path class="flowhead" d="M50 115 L56.3 112.0 L56.3 118.0 Z"/><line class="flow" x1="150" y1="115" x2="250" y2="115"/><path class="flowhead" d="M250 115 L243.7 118.0 L243.7 112.0 Z"/><line class="flow" x1="310" y1="115" x2="262" y2="115"/><path class="flowhead" d="M262 115 L268.3 112.0 L268.3 118.0 Z"/><line class="dim" x1="64" y1="222" x2="236" y2="222"/><line class="dim" x1="64.0" y1="218.0" x2="64.0" y2="226.0"/><line class="dim" x1="236.0" y1="218.0" x2="236.0" y2="226.0"/><text x="150" y="216" class="s dimt" text-anchor="middle">Giữa hai lối ra: ≤ 40 m (bậc I, II – S0)</text><line class="dim" x1="260" y1="240" x2="340" y2="240"/><line class="dim" x1="260.0" y1="236.0" x2="260.0" y2="244.0"/><line class="dim" x1="340.0" y1="236.0" x2="340.0" y2="244.0"/><text x="0" y="0" class="s dimt" text-anchor="middle"></text><text x="300" y="236" class="s" text-anchor="middle">Cụt ≤ 25 m</text><text x="20" y="24" class="s">Đo dọc tâm hành lang, từ tâm cửa căn hộ tới tâm cửa buồng thang</text><text x="42" y="30" class="s"></text></svg>`, cap: "Đo dọc tâm đường thoát nạn từ tâm cửa căn hộ (gian phòng) tới tâm lối ra thoát nạn gần nhất. Nhà ở F1.3, F1.2 bậc I, II – S0: giữa hai lối ra ≤ 40 m, hành lang cụt ≤ 25 m (Bảng G.1). Nhà trên 50 m theo Phụ lục A: ≤ 20 m và ≤ 15 m." },
  "tuong-ngan-chay": { t: "Tường ngăn cháy cắt mặt ngoài", ref: "4.32.1, 4.17", svg: `<svg viewBox="0 0 360 230" class="dg"><rect class="w" x="20" y="40" width="320" height="140"/><rect class="firewall" x="174" y="40" width="12" height="140"/><rect class="firewall" x="174" y="180" width="12" height="18"/><text x="180" y="30" class="b" text-anchor="middle">Tường ngăn cháy loại 1</text><line class="wallthick" x1="20" y1="180" x2="340" y2="180"/><rect class="glass" x="60" y="177" width="28" height="6"/><rect class="glass" x="110" y="177" width="28" height="6"/><rect class="glass" x="240" y="177" width="28" height="6"/><rect class="glass" x="290" y="177" width="28" height="6"/><line class="dim" x1="186" y1="206" x2="186" y2="180"/><line class="dim" x1="182.0" y1="206.0" x2="190.0" y2="206.0"/><line class="dim" x1="182.0" y1="180.0" x2="190.0" y2="180.0"/><text x="0" y="0" class="s dimt" text-anchor="middle"></text><text x="192" y="200" class="s">≥ 30 cm vươn ra</text><line class="dim" x1="138" y1="216" x2="240" y2="216"/><line class="dim" x1="138.0" y1="212.0" x2="138.0" y2="220.0"/><line class="dim" x1="240.0" y1="212.0" x2="240.0" y2="220.0"/><text x="189" y="228" class="s dimt" text-anchor="middle">≥ 4 m giữa lỗ mở hai bên (góc < 135°)</text><text x="30" y="110" class="s">Khoang cháy 1</text><text x="250" y="110" class="s">Khoang cháy 2</text><text x="30" y="160" class="s">Tường ngoài K1 – K3</text></svg>`, cap: "Tường ngăn cháy loại 1 xây suốt chiều cao nhà, chia cắt tường ngoài cấp K1 – K3 và vươn ra khỏi mặt tường ngoài ≥ 30 cm (hoặc tiếp giáp dải tường đứng rộng ≥ 1,2 m, E 60, K0). Nhà có chữa cháy tự động: không bắt buộc. Lỗ mở hai phía góc tường < 135° cách nhau < 4 m: dùng cửa E 30 (4.33.3)." },
  "bai-do": { t: "Đường xe, bãi đỗ xe chữa cháy, lối vào từ trên cao", ref: "6.2, 6.3", svg: `<svg viewBox="0 0 360 280" class="dg"><defs><pattern id="hc6" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatchl" x1="0" y1="0" x2="0" y2="7"/></pattern></defs><rect class="w" x="30" y="16" width="270" height="104"/><text x="165" y="64" class="b" text-anchor="middle">Nhà</text><rect class="glass" x="60" y="117" width="26" height="6"/><path class="tri" d="M73 104 l7 10 h-14 z"/><rect class="glass" x="150" y="117" width="26" height="6"/><path class="tri" d="M163 104 l7 10 h-14 z"/><rect class="glass" x="240" y="117" width="26" height="6"/><path class="tri" d="M253 104 l7 10 h-14 z"/><text x="165" y="96" class="s" text-anchor="middle">▲ Lối vào từ trên cao (850 × 1 000 mm)</text><line class="dim" x1="73" y1="132" x2="163" y2="132"/><line class="dim" x1="73.0" y1="128.0" x2="73.0" y2="136.0"/><line class="dim" x1="163.0" y1="128.0" x2="163.0" y2="136.0"/><text x="118" y="128" class="s dimt" text-anchor="middle">≤ 20 m</text><rect x="30" y="150" width="300" height="40" fill="url(#hc6)" class="park"/><rect class="parkedge" x="30" y="150" width="300" height="40"/><rect class="truck" x="250" y="162" width="34.0" height="16.0" rx="2"/><rect class="truckcab" x="284.0" y="163.0" width="12.0" height="14.0" rx="2"/><line class="ladder" x1="256.0" y1="170.0" x2="280.0" y2="170.0"/><text x="40" y="184" class="s">Bãi đỗ xe chữa cháy ≥ 6 × 15 m</text><line class="dim" x1="320" y1="123" x2="320" y2="150"/><line class="dim" x1="324.0" y1="123.0" x2="316.0" y2="123.0"/><line class="dim" x1="324.0" y1="150.0" x2="316.0" y2="150.0"/><text x="0" y="0" class="s dimt" text-anchor="middle"></text><text x="326" y="134" class="s">2 –</text><text x="326" y="146" class="s">10 m</text><rect class="asphalt" x="0" y="196" width="360" height="36"/><line class="edge" x1="0" y1="198" x2="360" y2="198"/><line class="edge" x1="0" y1="230" x2="360" y2="230"/><line class="lane" x1="0" y1="214.0" x2="360" y2="214.0"/><rect class="truckcab" x="270" y="202.9" width="10.8" height="12.6" rx="2"/><rect class="truck" x="280.8" y="202" width="30.599999999999998" height="14.4" rx="2"/><line class="ladder" x1="275.4" y1="209.2" x2="296.99999999999994" y2="209.2"/><line class="dim" x1="350" y1="196" x2="350" y2="232"/><line class="dim" x1="354.0" y1="196.0" x2="346.0" y2="196.0"/><line class="dim" x1="354.0" y1="232.0" x2="346.0" y2="232.0"/><text x="0" y="0" class="s dimt" text-anchor="middle"></text><text x="344" y="244" class="s" text-anchor="end">Đường xe ≥ 3,5 m</text><text x="6" y="258" class="s">Cao thông thủy ≥ 4,5 m, dốc ≤ 1:8,3; mép đường cách tường</text><text x="6" y="270" class="s">nhà ≤ 5 / 8 / 10 m theo chiều cao PCCC</text></svg>`, cap: "Mép đường xe cách tường nhà ≤ 5 m (cao < 12 m), ≤ 8 m (12 – 28 m), ≤ 10 m (> 28 m). Bãi đỗ cách điểm giữa lối vào từ trên cao 2 – 10 m, dốc ≤ 1:15. Lối vào từ trên cao rộng ≥ 850 mm, cao ≥ 1 000 mm, mép dưới ≤ 1 100 mm, mỗi 20 m bãi đỗ ít nhất một lối, đánh dấu tam giác đỏ hoặc vàng (không áp dụng nhà F1.3)." }
};
function renderDiagrams(focus) {
  setHeader("Sơ đồ minh họa"); setNav("tra-nhanh");
  view.innerHTML = `<p class="intro">Sơ đồ minh họa nguyên tắc, không theo tỷ lệ. Bấm số điều để mở nội dung trong sổ tay.</p>` + Object.entries(DIAGS).map(([id, d]) => `<section class="quick dgbox" id="dg-${id}"><h2>${d.t}</h2>${d.svg}<p class="note">${esc(d.cap)}</p><span class="refs">${refHTML(d.ref)}</span></section>`).join("");
  if (focus) { const el = document.getElementById("dg-" + focus); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); } else window.scrollTo(0, 0);
}

curReport = store.get("pccc-report-draft", null);
/* ---------- routing ---------- */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (q.value.trim()) return renderSearch(q.value.trim());
  if (!h || h === "home") return renderHome();
  if (h === "tra-nhanh") return renderQuick();
  if (h === "cong-trinh") return renderCT();
  if (h === "hon-hop") return renderMX();
  if (h === "gian-phong") return renderGP();
  if (h === "du-an") return renderProjects();
  if (h === "phieu") return renderReport();
  if (h === "so-do") return renderDiagrams();
  if (h === "da-luu") return renderSaved();
  if (SECTIONS[h]) return renderSection(h);
  renderHome();
}
function go(hash, block) {
  q.value = ""; clearQ.hidden = true;
  if (block) { const sid = block.split("--")[0]; if (location.hash.slice(1) !== sid) history.replaceState(null, "", "#" + sid); renderSection(sid, block); return; }
  if (location.hash.slice(1) === hash) route(); else location.hash = hash;
}
window.addEventListener("hashchange", route);

document.addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) { e.preventDefault(); e.stopPropagation(); const id = star.dataset.star;
    saved = saved.includes(id) ? saved.filter(x => x !== id) : [...saved, id]; store.set("pccc-saved", saved);
    const on = saved.includes(id); star.setAttribute("aria-pressed", on); star.setAttribute("aria-label", on ? "Bỏ lưu" : "Lưu mục này"); return; }
  const rf = e.target.closest("[data-ref]"); if (rf) { e.preventDefault(); q.value = resolveRef(rf.dataset.ref); clearQ.hidden = false; renderSearch(q.value); window.scrollTo(0, 0); return; }
  const dg = e.target.closest("[data-diag]"); if (dg) { e.preventDefault(); history.replaceState(null, "", "#so-do"); renderDiagrams(dg.dataset.diag); return; }
  const rpb = e.target.closest("[data-report]"); if (rpb) { const k = rpb.dataset.report; if (k === "ct") ctSync(false); if (k === "mx") mxSync(false); if (k === "gp") gpSync(false); curReport = reportFrom(k); store.set("pccc-report-draft", curReport); go("phieu"); return; }
  if (e.target.id === "rpsave") { reportSync(); const i = projects.findIndex(p => p.id === curReport.id); const copy = JSON.parse(JSON.stringify(curReport)); if (i >= 0) projects[i] = copy; else projects.unshift(copy); store.set("pccc-projects", projects); document.getElementById("rpmsg").textContent = "Đã lưu vào Dự án trên thiết bị này."; return; }
  if (e.target.id === "rpcopy") { reportSync(); copyText(reportText(true)); return; }
  if (e.target.id === "rpcopytxt") { reportSync(); copyText(reportText(false)); return; }
  const pj = e.target.closest("[data-proj]"); if (pj) { curReport = JSON.parse(JSON.stringify(projects[+pj.dataset.proj])); store.set("pccc-report-draft", curReport); go("phieu"); return; }
  const pd = e.target.closest("[data-projdel]"); if (pd) { if (pd.dataset.confirm) { projects.splice(+pd.dataset.projdel, 1); store.set("pccc-projects", projects); renderProjects(); } else { pd.dataset.confirm = "1"; pd.textContent = "Bấm lần nữa để xóa"; } return; }
  if (e.target.id === "mxadd") { mxSync(false); mxV.parts.push({ i: 25, from: 1, to: 1, a: 1000, p: "" }); store.set("pccc-mx", mxV); renderMX(); return; }
  const md_ = e.target.closest("[data-mxdel]"); if (md_) { mxSync(false); mxV.parts.splice(+md_.dataset.mxdel, 1); store.set("pccc-mx", mxV); renderMX(); return; }
  const pk = e.target.closest("[data-ct]"); if (pk) { ctSync(false); ctV.i = +pk.dataset.ct; ctQ = ""; store.set("pccc-ct", ctV); renderCT(); window.scrollTo(0, 0); return; }
  const op = e.target.closest("[data-open]"); if (op) { e.preventDefault(); go(null, op.dataset.open); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest("[data-nav]"); if (n) { go(n.dataset.nav === "home" ? "home" : n.dataset.nav); return; }
  const bac = e.target.closest("[data-bac]"); if (bac) { qBac = bac.dataset.bac; store.set("pccc-bac", qBac); renderQuick(); return; }
  const hh = e.target.closest("[data-h]"); if (hh) { qH = +hh.dataset.h; store.set("pccc-h", qH); renderQuick(); return; }
  const chip = e.target.closest("[data-chip]"); if (chip) { q.value = chip.dataset.chip; clearQ.hidden = false; renderSearch(q.value); return; }
  if (e.target.id === "resetCk") { view.querySelectorAll("input[data-ck]").forEach(b => { b.checked = false; delete checks[b.dataset.ck]; }); store.set("pccc-checks", checks); updateProgress(); }
});
document.addEventListener("change", e => {
  const ck = e.target.closest("input[data-ck]"); if (!ck) return;
  if (ck.checked) checks[ck.dataset.ck] = 1; else delete checks[ck.dataset.ck];
  store.set("pccc-checks", checks); updateProgress();
});
backBtn.addEventListener("click", () => go("home"));
let tmr;
document.addEventListener("input", e => {
  if (e.target.id === "ctq") { ctQ = e.target.value; document.getElementById("ctlist").innerHTML = ctList(); return; }
  if (e.target.closest && e.target.closest(".ct-form") && e.target.type === "number" && document.getElementById("cth")) ctSync(false);
});
document.addEventListener("input", e => {
  if (!e.target.closest) return;
  if (e.target.closest(".mx-form") && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { mxSync(false); return; }
  if (document.getElementById("gpg") && e.target.closest(".ct-form") && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { gpSync(false); return; }
  if (e.target.classList && e.target.classList.contains("rpnote") || ["rpname", "rpauthor"].includes(e.target.id)) { reportSync(); return; }
});
document.addEventListener("change", e => {
  if (!e.target.closest) return;
  if (e.target.closest(".mx-form")) { mxSync(e.target.classList.contains("mxi")); return; }
  if (document.getElementById("gpg") && e.target.closest(".ct-form")) { gpSync(["gpg"].includes(e.target.id)); return; }
  if (e.target.classList.contains("rpst") || e.target.id === "rpdate") { reportSync(); return; }
  if (!e.target.closest(".ct-form")) return;
  if (e.target.id === "cthang") { ctSync(true); return; }
  if (e.target.tagName === "SELECT" || e.target.type === "checkbox") ctSync(false);
});
document.addEventListener("input", e => { if (e.target.id === "fq") { qF = e.target.value; document.getElementById("fres").innerHTML = fRows(qF); } });
q.addEventListener("input", () => { clearQ.hidden = !q.value; clearTimeout(tmr); tmr = setTimeout(() => q.value.trim() ? renderSearch(q.value.trim()) : route(), 120); });
clearQ.addEventListener("click", () => { q.value = ""; clearQ.hidden = true; route(); q.focus(); });

route();
</script>
